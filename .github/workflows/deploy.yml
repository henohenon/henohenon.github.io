# main へ push されたら静的ビルドして GitHub Pages に配信する。
#
# 前提: リポジトリ設定の Pages > Build and deployment > Source を
#       「GitHub Actions」にしておくこと（ブランチ配信のままだとこのワークフローの
#       成果物は使われない）。
#
# このリポジトリは henohenon.github.io＝ユーザーサイトなのでルート配信。
# svelte.config.js に paths.base は不要（設定しない）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # コミットせずに再デプロイしたいとき用。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断しない（公開物が中途半端な状態で置き換わらないように）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # バージョンは package.json の packageManager から読まれる。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 型エラーがあれば公開前に止める。
      - run: pnpm check

      - run: pnpm build

      # Pages は _app/ のようなアンダースコア始まりを無視することがあるため保険。
      - run: touch build/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
