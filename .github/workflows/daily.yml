name: daily-theme

on:
  schedule:
    # 毎日 00:00 UTC (= JST 09:00) に走る
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-theme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: generate theme.css
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          bun run generate-theme | tee /tmp/gen.log
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "theme generation failed — keeping yesterday's theme." >&2
            exit 0
          fi
          meta=$(grep '^META=' /tmp/gen.log | head -1 | sed 's/^META=//')
          echo "meta=$meta" >> "$GITHUB_OUTPUT"

      - name: commit & push
        if: steps.gen.outputs.meta != ''
        env:
          META: ${{ steps.gen.outputs.meta }}
        run: |
          if git diff --quiet src/styles/theme.css src/data/theme-source.json; then
            echo "theme unchanged — skipping commit."
            exit 0
          fi
          name=$(printf '%s' "$META" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['songName'])")
          date_str=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/theme.css src/data/theme-source.json
          git commit -m "chore(theme): ${date_str} (${name})"
          git push
