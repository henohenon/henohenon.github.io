<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g-warm" gradientUnits="userSpaceOnUse" cx="180" cy="50" r="800">
      <stop offset="0%" stop-color="#fff4e6"/>
      <stop offset="100%" stop-color="#fff4e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-pink" gradientUnits="userSpaceOnUse" cx="1020" cy="580" r="750">
      <stop offset="0%" stop-color="#fce8f0"/>
      <stop offset="100%" stop-color="#fce8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sep-grad" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="980" y2="0">
      <stop offset="0%"   stop-color="#c97b8d" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#c97b8d" stop-opacity="0.65"/>
      <stop offset="50%"  stop-color="#c97b8d" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#c97b8d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#c97b8d" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-ray" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="f-glow" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <!-- ── Base background ── -->
  <rect width="1200" height="630" fill="#fdf6ed"/>
  <rect width="1200" height="630" fill="url(#g-warm)"/>
  <rect width="1200" height="630" fill="url(#g-pink)"/>

  <!-- ── Morning light shafts (病床に差し込む朝の光) ── -->
  <g filter="url(#f-ray)" opacity="0.52">
    <polygon points="0,0 560,0 1200,630 0,630"         fill="#fff4e6"/>
    <polygon points="0,0 320,0 980,630 0,630"           fill="#fffaf5"/>
    <polygon points="130,0 440,0 1160,630 830,630"      fill="#fce8f0" opacity="0.55"/>
  </g>

  <!-- ── Pill / capsule shapes (オクスリクラ = medicine motif) ── -->
  <g fill="none" stroke="#c97b8d" stroke-width="1.4" stroke-linecap="round" opacity="0.22">
    <!-- top-left cluster -->
    <rect x="62"   y="52"  width="40" height="16" rx="8"/>
    <rect x="42"   y="87"  width="32" height="13" rx="6.5" transform="rotate(-22 58 93)"/>
    <rect x="102"  y="70"  width="28" height="12" rx="6"   transform="rotate(14 116 76)"/>
    <!-- top-right cluster -->
    <rect x="1098" y="50"  width="40" height="16" rx="8"/>
    <rect x="1126" y="82"  width="32" height="13" rx="6.5" transform="rotate(20 1142 89)"/>
    <rect x="1070" y="35"  width="28" height="12" rx="6"   transform="rotate(-10 1084 41)"/>
    <!-- bottom-left cluster -->
    <rect x="60"   y="532" width="40" height="16" rx="8"/>
    <rect x="44"   y="560" width="32" height="13" rx="6.5" transform="rotate(16 60 567)"/>
    <!-- bottom-right cluster -->
    <rect x="1098" y="528" width="40" height="16" rx="8"/>
    <rect x="1118" y="556" width="32" height="13" rx="6.5" transform="rotate(-18 1134 563)"/>
    <rect x="1082" y="574" width="28" height="12" rx="6"/>
  </g>

  <!-- ── Floating light motes ── -->
  <g fill="#c97b8d" opacity="0.18">
    <circle cx="28"   cy="175" r="2.5"/>
    <circle cx="46"   cy="382" r="1.8"/>
    <circle cx="24"   cy="490" r="1.5"/>
    <circle cx="1172" cy="140" r="2.5"/>
    <circle cx="1154" cy="355" r="1.8"/>
    <circle cx="1176" cy="472" r="1.5"/>
    <circle cx="195"  cy="20"  r="2"/>
    <circle cx="986"  cy="18"  r="2"/>
    <circle cx="163"  cy="608" r="1.8"/>
    <circle cx="1018" cy="610" r="1.8"/>
    <circle cx="600"  cy="16"  r="1.5"/>
    <circle cx="600"  cy="612" r="1.5"/>
  </g>

  <!-- ── Border lines ── -->
  <line x1="50"   y1="28"  x2="1150" y2="28"  stroke="#c97b8d" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="50"   y1="602" x2="1150" y2="602" stroke="#c97b8d" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- ── Corner ornaments ── -->
  <g stroke="#c97b8d" stroke-width="1.4" fill="none" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M50,28   L50,62   M50,28   L84,28"/>
    <path d="M1150,28  L1150,62  M1150,28  L1116,28"/>
    <path d="M50,602  L50,568  M50,602  L84,602"/>
    <path d="M1150,602 L1150,568 M1150,602 L1116,602"/>
  </g>

  <!-- ── Site title — glow layer ── -->
  <text x="600" y="285"
        font-family="serif"
        font-size="118"
        fill="#e8a0b4"
        text-anchor="middle"
        filter="url(#f-glow)"
        opacity="0.58"
        letter-spacing="4">へのへのんのの</text>

  <!-- ── Site title — main ── -->
  <text x="600" y="285"
        font-family="serif"
        font-size="118"
        fill="#c97b8d"
        text-anchor="middle"
        letter-spacing="4">へのへのんのの</text>

  <!-- ── Separator ── -->
  <line x1="220" y1="320" x2="980" y2="320" stroke="url(#sep-grad)" stroke-width="1.5"/>

  <!-- Diamond accents -->
  <polygon points="204,320 211,327 218,320 211,313" fill="#c97b8d" opacity="0.48"/>
  <polygon points="982,320 989,327 996,320 989,313" fill="#c97b8d" opacity="0.48"/>

  <!-- ── Song subtitle ── -->
  <text x="600" y="384"
        font-family="serif"
        font-size="40"
        fill="#281a15"
        text-anchor="middle"
        opacity="0.65"
        letter-spacing="6">オクスリクラ</text>

  <!-- ── Artist ── -->
  <text x="600" y="436"
        font-family="sans-serif"
        font-size="21"
        fill="#281a15"
        text-anchor="middle"
        opacity="0.42"
        letter-spacing="1">マキシウキョウ feat. 重音テトSV</text>
</svg>
