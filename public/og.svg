  <line x1="0" y1="486" x2="1200" y2="486" stroke="#322e52" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/>

  <path d="M0,560 C150,535 300,585 450,558 C600,532 750,588 900,556 C1050,530 1150,570 1200,552 L1200,630 L0,630 Z" fill="url(#waveGradA)"/>
  <path d="M0,585 C160,565 320,605 480,582 C640,560 800,608 960,580 C1080,562 1150,590 1200,578 L1200,630 L0,630 Z" fill="url(#waveGradB)"/>

