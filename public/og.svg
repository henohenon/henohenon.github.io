<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobPink" cx="12%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#ff8fc7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff8fc7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="90%" cy="94%" r="55%">
      <stop offset="0%" stop-color="#37c9ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#37c9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe3f0"/>
      <stop offset="55%" stop-color="#fff8fb"/>
      <stop offset="100%" stop-color="#e9f9ff"/>
    </linearGradient>
  </defs>

  <!-- base background -->
  <rect x="0" y="0" width="1200" height="630" fill="#fff3f8"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#blobPink)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#blobBlue)"/>

  <!-- top / bottom dashed frame lines, echoing site-header / site-footer -->
  <line x1="40" y1="34" x2="1160" y2="34" stroke="#ff8fc7" stroke-width="3" stroke-dasharray="12 10"/>
  <line x1="40" y1="596" x2="1160" y2="596" stroke="#ff8fc7" stroke-width="3" stroke-dasharray="12 10"/>

  <!-- scattered decorative hearts -->
  <text x="90" y="90" font-family="sans-serif" font-size="30" fill="#ff8fc7" opacity="0.55">♡</text>
  <text x="1090" y="80" font-family="sans-serif" font-size="22" fill="#37c9ff" opacity="0.5">♡</text>
  <text x="70" y="560" font-family="sans-serif" font-size="24" fill="#37c9ff" opacity="0.45">♡</text>
  <text x="1110" y="555" font-family="sans-serif" font-size="34" fill="#ff4fa8" opacity="0.5">♡</text>
  <text x="150" y="470" font-family="sans-serif" font-size="18" fill="#ff8fc7" opacity="0.4">♡</text>
  <text x="1030" y="150" font-family="sans-serif" font-size="18" fill="#ff8fc7" opacity="0.4">♡</text>

  <!-- content panel -->
  <rect x="90" y="108" width="1020" height="392" rx="50" ry="50" fill="url(#panelGrad)" stroke="#ff8fc7" stroke-width="3" stroke-dasharray="9 7"/>

  <!-- pretitle -->
  <text x="600" y="168" font-family="sans-serif" font-size="22" letter-spacing="3" text-anchor="middle" fill="#b8005a" opacity="0.75">♡ yumeshipping since forever ♡</text>

  <!-- site name: double-vision layered text -->
  <text x="597" y="308" font-family="sans-serif" font-weight="bold" font-size="118" text-anchor="middle" fill="#37c9ff" opacity="0.55">へのへのんのの</text>
  <text x="603" y="308" font-family="sans-serif" font-weight="bold" font-size="118" text-anchor="middle" fill="#ff4fa8" opacity="0.55">へのへのんのの</text>
  <text x="600" y="308" font-family="sans-serif" font-weight="bold" font-size="118" text-anchor="middle" fill="#b8005a">へのへのんのの</text>

  <!-- song subtitle -->
  <text x="600" y="392" font-family="sans-serif" font-weight="bold" font-size="40" text-anchor="middle" fill="#ff4fa8">YUMESHIPPER ♡</text>

  <!-- artist -->
  <text x="600" y="434" font-family="sans-serif" font-size="23" text-anchor="middle" fill="#3a1030" opacity="0.6">Sutekina-P feat. Chis-A [tʃíːseɪ]</text>

  <!-- footer tagline -->
  <text x="600" y="565" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#b8005a" opacity="0.85">I LOVE YOU — block the haters, keep the love ♡</text>
</svg>
