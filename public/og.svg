<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgGlow" cx="20%" cy="-5%" r="85%">
    <stop offset="0%" stop-color="#2a0f2e"/>
    <stop offset="55%" stop-color="#1f1023"/>
    <stop offset="100%" stop-color="#150a17"/>
  </radialGradient>

  <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffce3d" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#ff3d78" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ff3d78" stop-opacity="0"/>
  </radialGradient>

  <pattern id="clawStripe" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
    <rect width="30" height="30" fill="#150a17"/>
    <rect x="0" y="0" width="9" height="30" fill="#ff3d78" opacity="0.9"/>
    <rect x="15" y="0" width="3" height="30" fill="#ffce3d" opacity="0.85"/>
  </pattern>

  <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur1"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="blur1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect x="0" y="0" width="1200" height="630" fill="#150a17"/>
<rect x="0" y="0" width="1200" height="630" fill="url(#bgGlow)"/>

<g opacity="0.55">
  <ellipse cx="1010" cy="120" rx="80" ry="110" fill="url(#eyeGlow)" transform="rotate(-18 1010 120)"/>
  <ellipse cx="1140" cy="160" rx="70" ry="95" fill="url(#eyeGlow)" transform="rotate(-14 1140 160)"/>
  <ellipse cx="1010" cy="120" rx="6" ry="46" fill="#150a17" transform="rotate(-18 1010 120)"/>
  <ellipse cx="1140" cy="160" rx="5" ry="40" fill="#150a17" transform="rotate(-14 1140 160)"/>
</g>

<g opacity="0.5" stroke-linecap="round">
  <path d="M40 560 L190 470" stroke="#ff3d78" stroke-width="10" fill="none"/>
  <path d="M60 590 L210 500" stroke="#b26bff" stroke-width="7" fill="none"/>
  <path d="M80 620 L230 530" stroke="#ffce3d" stroke-width="4" fill="none"/>
</g>

<rect x="0" y="0" width="1200" height="10" fill="url(#clawStripe)" opacity="0.9"/>
<rect x="0" y="620" width="1200" height="10" fill="url(#clawStripe)" opacity="0.9"/>

<rect x="28" y="28" width="1144" height="574" fill="none" stroke="#3a1f3f" stroke-width="2" stroke-dasharray="10 8" opacity="0.7" rx="6"/>

<text x="600" y="150" text-anchor="middle" font-family="sans-serif" font-size="24" letter-spacing="6" fill="#b26bff" opacity="0.85">B L O G</text>

<g>
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="126" letter-spacing="4" fill="#ff3d78" filter="url(#glowStrong)" opacity="0.55">へのへのんのの</text>
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="126" letter-spacing="4" fill="#f3e9f4">へのへのんのの</text>
</g>

<rect x="440" y="372" width="320" height="6" fill="url(#clawStripe)" opacity="0.9"/>

<text x="600" y="424" text-anchor="middle" font-family="sans-serif" font-size="22" letter-spacing="6" fill="#b26bff" opacity="0.9">TODAY'S TRACK</text>

<text x="600" y="476" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="42" letter-spacing="2" fill="#ff3d78" filter="url(#glowSoft)">streetcat</text>

<text x="600" y="516" text-anchor="middle" font-family="sans-serif" font-size="26" letter-spacing="2" fill="#cbb7cf">Various artists</text>

</svg>
