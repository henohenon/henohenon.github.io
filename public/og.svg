<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rg" cx="50%" cy="50%" r="62%">
      <stop offset="28%" stop-color="#07090f" stop-opacity="0"/>
      <stop offset="68%" stop-color="#d95570" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0.76"/>
    </radialGradient>
    <linearGradient id="lx" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#07090f" stop-opacity="0.62"/>
      <stop offset="9%"   stop-color="#07090f" stop-opacity="0"/>
      <stop offset="91%"  stop-color="#07090f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="ly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#07090f" stop-opacity="0.46"/>
      <stop offset="16%" stop-color="#07090f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#d95570" stop-opacity="1"/>
      <stop offset="42%" stop-color="#d95570" stop-opacity="0.28"/>
      <stop offset="68%" stop-color="#d95570" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d95570" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#d95570" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#d95570" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#d95570" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d95570" stop-opacity="0"/>
    </linearGradient>
    <filter id="gb" x="-15%" y="-120%" width="130%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#c6cbd6" stroke-width="0.5" stroke-opacity="0.022"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#07090f"/>
  <rect width="1200" height="630" fill="url(#sl)"/>

  <!-- presence + edge darkness -->
  <rect width="1200" height="630" fill="url(#rg)"/>
  <rect width="1200" height="630" fill="url(#lx)"/>
  <rect width="1200" height="630" fill="url(#ly)"/>

  <!-- ambient depth ellipses — something breathing in the dark -->
  <ellipse cx="600" cy="295" rx="500" ry="245" fill="none" stroke="#d95570" stroke-width="0.8" stroke-opacity="0.04"/>
  <ellipse cx="600" cy="295" rx="330" ry="162" fill="none" stroke="#d95570" stroke-width="0.6" stroke-opacity="0.03"/>

  <!-- header scar line -->
  <rect x="0" y="56" width="1200" height="1" fill="url(#sc)" opacity="0.48"/>

  <!-- log stamp -->
  <text x="80" y="36" font-family="monospace" font-size="11"
        fill="#c6cbd6" fill-opacity="0.22" letter-spacing="0.16em">LOG // 2026.06.08</text>
  <text x="1120" y="36" text-anchor="end" font-family="monospace" font-size="11"
        fill="#d95570" fill-opacity="0.32" letter-spacing="0.13em">SLEEPLESS</text>

  <!-- top-left bracket -->
  <rect x="62" y="56" width="26" height="1" fill="#d95570" fill-opacity="0.42"/>
  <rect x="62" y="56" width="1" height="24" fill="#d95570" fill-opacity="0.42"/>
  <!-- top-right bracket -->
  <rect x="1112" y="56" width="26" height="1" fill="#d95570" fill-opacity="0.42"/>
  <rect x="1137" y="56" width="1" height="24" fill="#d95570" fill-opacity="0.42"/>

  <!-- ambient content rules -->
  <rect x="80" y="130" width="1040" height="1" fill="#c6cbd6" fill-opacity="0.022"/>
  <rect x="80" y="500" width="1040" height="1" fill="#c6cbd6" fill-opacity="0.022"/>

  <!-- site name: rose glow layer -->
  <text x="600" y="296" text-anchor="middle"
        font-family="monospace" font-size="104"
        fill="#d95570" fill-opacity="0.11"
        filter="url(#gb)">へのへのんのの</text>
  <!-- site name: main -->
  <text x="600" y="296" text-anchor="middle"
        font-family="monospace" font-size="104"
        fill="#c6cbd6" letter-spacing="0.04em">へのへのんのの</text>

  <!-- scar separator -->
  <rect x="220" y="326" width="760" height="1" fill="url(#scc)" opacity="0.62"/>

  <!-- song subtitle -->
  <text x="600" y="374" text-anchor="middle"
        font-family="monospace" font-size="32"
        fill="#d95570" fill-opacity="0.84" letter-spacing="0.08em">INSOMNIA / ROMA feat. 奕夕</text>

  <!-- bottom-left bracket -->
  <rect x="62" y="574" width="26" height="1" fill="#d95570" fill-opacity="0.2"/>
  <rect x="62" y="551" width="1" height="24" fill="#d95570" fill-opacity="0.2"/>
  <!-- bottom-right bracket -->
  <rect x="1112" y="574" width="26" height="1" fill="#d95570" fill-opacity="0.2"/>
  <rect x="1137" y="551" width="1" height="24" fill="#d95570" fill-opacity="0.2"/>

  <!-- footer scar line -->
  <rect x="0" y="574" width="1200" height="1" fill="url(#sc)" opacity="0.14"/>

  <!-- footer echo -->
  <text x="600" y="604" text-anchor="middle"
        font-family="monospace" font-size="10"
        fill="#c6cbd6" fill-opacity="0.14" letter-spacing="0.22em">へのへのんのの</text>
</svg>
