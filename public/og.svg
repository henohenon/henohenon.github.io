<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#b30033" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b30033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0410"/>
      <stop offset="50%" stop-color="#240618"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffd1e8"/>
      <stop offset="45%" stop-color="#ff2d87"/>
      <stop offset="100%" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff2d87"/>
      <stop offset="55%" stop-color="#ffe27a"/>
      <stop offset="70%" stop-color="#ff2d87"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </linearGradient>
    <pattern id="diagonals" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="34" height="34" fill="none"/>
      <rect x="0" y="0" width="12" height="34" fill="#ff2d87" fill-opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tiaraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a0410"/>
  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#diagonals)"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>

  <!-- Inner frame (article.post corners feel) -->
  <g opacity="0.6">
    <path d="M 50 50 L 50 140 M 50 50 L 140 50" stroke="#ffe27a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 1150 50 L 1150 140 M 1150 50 L 1060 50" stroke="#ffe27a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 50 580 L 50 490 M 50 580 L 140 580" stroke="#ff2d87" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 1150 580 L 1150 490 M 1150 580 L 1060 580" stroke="#ff2d87" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dashed inner border -->
  <rect x="70" y="70" width="1060" height="490" rx="20" ry="20"
        fill="none" stroke="#ff2d87" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Top ribbon -->
  <rect x="0" y="118" width="1200" height="2" fill="url(#ribbon)"/>

  <!-- Tiara above title -->
  <g transform="translate(600 158)" filter="url(#tiaraGlow)">
    <path d="M -60 10 L -45 -28 L -20 0 L 0 -38 L 20 0 L 45 -28 L 60 10 Z"
          fill="#ffe27a" stroke="#ffd1e8" stroke-width="1.2"/>
    <circle cx="-45" cy="-28" r="4" fill="#ff2d87"/>
    <circle cx="0" cy="-38" r="5" fill="#ff2d87"/>
    <circle cx="45" cy="-28" r="4" fill="#ff2d87"/>
    <rect x="-60" y="10" width="120" height="5" fill="#ffe27a"/>
    <circle cx="-40" cy="13" r="2" fill="#1a0410"/>
    <circle cx="0" cy="13" r="2" fill="#1a0410"/>
    <circle cx="40" cy="13" r="2" fill="#1a0410"/>
  </g>

  <!-- SITE TITLE — main hero -->
  <g filter="url(#softGlow)">
    <text x="600" y="330"
          font-family="serif"
          font-size="118"
          font-weight="700"
          font-style="italic"
          text-anchor="middle"
          fill="url(#titleGrad)"
          letter-spacing="4">へのへのんのの</text>
  </g>

  <!-- Subtle underline flourish -->
  <g transform="translate(600 370)">
    <line x1="-220" y1="0" x2="-30" y2="0" stroke="#ff2d87" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="30" y1="0" x2="220" y2="0" stroke="#ff2d87" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M -22 -8 C -14 -8, -8 -2, 0 -2 C 8 -2, 14 -8, 22 -8 C 14 4, 0 12, 0 12 C 0 12, -14 4, -22 -8 Z"
          fill="#ff2d87" opacity="0.85"/>
  </g>

  <!-- Subtitle label -->
  <text x="600" y="425"
        font-family="sans-serif"
        font-size="14"
        text-anchor="middle"
        fill="#f7b8d4"
        letter-spacing="8"
        font-weight="700">♛  T O D A Y ' S   T H E M E  ♛</text>

  <!-- Song title -->
  <text x="600" y="475"
        font-family="serif"
        font-size="38"
        font-style="italic"
        font-weight="700"
        text-anchor="middle"
        fill="#ff2d87"
        letter-spacing="3">ミクだし</text>

  <!-- Artist -->
  <text x="600" y="510"
        font-family="sans-serif"
        font-size="18"
        text-anchor="middle"
        fill="#ffd1e8"
        letter-spacing="4">hya  feat.  初音ミク</text>

  <!-- Bottom blood drips -->
  <g opacity="0.85">
    <path d="M 180 70 Q 180 110, 184 130 Q 188 150, 184 175 Q 180 195, 182 215 Q 184 230, 180 240"
          stroke="#7a0018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="180" cy="245" r="5" fill="#7a0018"/>
    <path d="M 1020 70 Q 1020 100, 1018 125 Q 1016 145, 1020 170 Q 1022 185, 1018 205"
          stroke="#7a0018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="1018" cy="210" r="4" fill="#7a0018"/>
  </g>

  <!-- Hearts scattered -->
  <g fill="#ff2d87">
    <g transform="translate(160 480) scale(0.9)" opacity="0.7">
      <path d="M 0 6 C -4 -2, -16 -2, -16 8 C -16 18, 0 28, 0 28 C 0 28, 16 18, 16 8 C 16 -2, 4 -2, 0 6 Z"/>
    </g>
    <g transform="translate(1040 470) scale(0.7) rotate(15)" opacity="0.6">
      <path d="M 0 6 C -4 -2, -16 -2, -16 8 C -16 18, 0 28, 0 28 C 0 28, 16 18, 16 8 C 16 -2, 4 -2, 0 6 Z"/>
    </g>
    <g transform="translate(220 540) scale(0.5) rotate(-20)" opacity="0.5">
      <path d="M 0 6 C -4 -2, -16 -2, -16 8 C -16 18, 0 28, 0 28 C 0 28, 16 18, 16 8 C 16 -2, 4 -2, 0 6 Z"/>
    </g>
    <g transform="translate(980 540) scale(0.55) rotate(10)" opacity="0.55">
      <path d="M 0 6 C -4 -2, -16 -2, -16 8 C -16 18, 0 28, 0 28 C 0 28, 16 18, 16 8 C 16 -2, 4 -2, 0 6 Z"/>
    </g>
  </g>

  <!-- Rose silhouette left -->
  <g transform="translate(120 320)" opacity="0.55">
    <circle cx="0" cy="0" r="22" fill="#b30033"/>
    <circle cx="-8" cy="-4" r="14" fill="#7a0018"/>
    <circle cx="6" cy="-6" r="10" fill="#ff2d87" opacity="0.7"/>
    <path d="M -4 18 Q -8 50, -20 80" stroke="#7a0018" stroke-width="2" fill="none"/>
    <path d="M -14 50 Q -28 48, -32 60 Q -22 58, -14 56 Z" fill="#7a0018"/>
  </g>

  <!-- Rose silhouette right -->
  <g transform="translate(1080 320)" opacity="0.55">
    <circle cx="0" cy="0" r="22" fill="#b30033"/>
    <circle cx="8" cy="-4" r="14" fill="#7a0018"/>
    <circle cx="-6" cy="-6" r="10" fill="#ff2d87" opacity="0.7"/>
    <path d="M 4 18 Q 8 50, 20 80" stroke="#7a0018" stroke-width="2" fill="none"/>
    <path d="M 14 50 Q 28 48, 32 60 Q 22 58, 14 56 Z" fill="#7a0018"/>
  </g>

  <!-- Bottom ribbon line -->
  <rect x="0" y="555" width="1200" height="1" fill="url(#ribbon)" opacity="0.7"/>

  <!-- Bottom tagline -->
  <text x="600" y="590"
        font-family="serif"
        font-size="16"
        font-style="italic"
        text-anchor="middle"
        fill="#ff2d87"
        letter-spacing="12">♛  w w w   あ げ る  ♛</text>
</svg>
