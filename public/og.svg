<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="topGlow" cx="50%" cy="-8%" r="65%">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ff8c5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sandGlow" cx="82%" cy="102%" r="65%">
      <stop offset="0%" stop-color="#c9a876" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#c9a876" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ff8c5a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff8c5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c5a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff8c5a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf9e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a876" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- base background -->
  <rect x="0" y="0" width="1200" height="630" fill="#14201f"/>

  <!-- ambient glows, echoing body background of theme.css -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#topGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#sandGlow)"/>

  <!-- distant sun behind the glasshouse -->
  <circle cx="600" cy="150" r="300" fill="url(#sunGlow)"/>
  <circle cx="600" cy="150" r="46" fill="#ffcf9e" opacity="0.20" filter="url(#softblur)"/>

  <!-- scattered petals, drifting in the greenhouse light -->
  <g fill="#ff8c5a">
    <text x="96" y="112" font-size="34" opacity="0.35" transform="rotate(-12 96 112)">✿</text>
    <text x="1096" y="150" font-size="26" opacity="0.28" transform="rotate(18 1096 150)">✿</text>
    <text x="150" y="540" font-size="22" opacity="0.22" transform="rotate(8 150 540)">✿</text>
    <text x="1060" y="520" font-size="40" opacity="0.30" transform="rotate(-10 1060 520)">✿</text>
    <text x="70" y="330" font-size="18" opacity="0.18" transform="rotate(20 70 330)">✿</text>
    <text x="1130" y="360" font-size="20" opacity="0.20" transform="rotate(-16 1130 360)">✿</text>
  </g>

  <!-- glasshouse pane holding the title -->
  <rect x="130" y="176" width="940" height="300" rx="26"
        fill="rgba(242,234,217,0.05)" stroke="url(#panelStroke)" stroke-width="1.4"/>

  <!-- top border accent, echoing .site-header::after -->
  <rect x="130" y="176" width="940" height="1" fill="url(#lineGrad)"/>

  <!-- site name: the star of the card -->
  <text x="600" y="330" text-anchor="middle" font-family="serif" font-size="124"
        fill="#ffcf9e" filter="url(#glow)" letter-spacing="4">へのへのんのの</text>

  <!-- dashed divider, echoing article.post h1/h2/h3 border-bottom -->
  <line x1="330" y1="368" x2="870" y2="368" stroke="#ff8c5a" stroke-opacity="0.35"
        stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- subtitle label -->
  <text x="600" y="404" text-anchor="middle" font-family="sans-serif" font-size="24"
        fill="#c9a876" letter-spacing="2">本日の一曲</text>

  <!-- today's song: subordinate to the site name -->
  <text x="600" y="446" text-anchor="middle" font-family="serif" font-size="40"
        fill="#ff8c5a" font-style="italic">Flower Man</text>

  <!-- artist credit, smallest tier -->
  <text x="600" y="480" text-anchor="middle" font-family="sans-serif" font-size="22"
        fill="#c9a876" opacity="0.9">Toby Fox, かめりあ</text>

  <!-- footer band, echoing .site-footer -->
  <rect x="0" y="576" width="1200" height="54" fill="#1c2b29"/>
  <rect x="0" y="576" width="1200" height="1" fill="#c9a876" opacity="0.28"/>
  <text x="600" y="610" text-anchor="middle" font-family="sans-serif" font-size="18"
        fill="#f2ead9" opacity="0.55" letter-spacing="3">曇りガラスの温室に射す夕陽</text>
</svg>
