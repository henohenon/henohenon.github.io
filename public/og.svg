<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1530"/>
      <stop offset="55%" stop-color="#150f22"/>
      <stop offset="100%" stop-color="#0c0913"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6fae" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff6fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8d6fd1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8d6fd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9e2f2"/>
      <stop offset="65%" stop-color="#f4c9e0"/>
      <stop offset="100%" stop-color="#ff6fae"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6fae" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6fae" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6fae" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dripFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6fae" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6fae" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dripFadePurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8d6fd1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8d6fd1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

