<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1" height="3" fill="none"/>
    <rect x="0" y="3" width="1" height="1" fill="#000000" fill-opacity="0.2"/>
  </pattern>
  <radialGradient id="vig" cx="600" cy="315" r="640" gradientUnits="userSpaceOnUse">
    <stop offset="42%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
  </radialGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#110020"/>
    <stop offset="52%" stop-color="#0b000f"/>
    <stop offset="100%" stop-color="#07070e"/>
  </linearGradient>
  <linearGradient id="hr" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ff1f6e" stop-opacity="0"/>
    <stop offset="28%" stop-color="#ff1f6e" stop-opacity="1"/>
    <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
    <stop offset="72%" stop-color="#ff1f6e" stop-opacity="1"/>
    <stop offset="100%" stop-color="#ff1f6e" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="titleGlow" cx="600" cy="248" r="460" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#ff1f6e" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#ff1f6e" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Base background -->
<rect width="1200" height="630" fill="#07070e"/>
<!-- Purple-to-dark gradient overlay -->
<rect width="1200" height="630" fill="url(#bgGrad)"/>
<!-- Scanline overlay -->
<rect width="1200" height="630" fill="url(#scan)" opacity="0.32"/>
<!-- Vignette -->
<rect width="1200" height="630" fill="url(#vig)"/>
<!-- Subtle glow behind title area -->
<rect width="1200" height="630" fill="url(#titleGlow)"/>

<!-- Glitch data artifact strips -->
<rect x="0" y="71" width="370" height="2" fill="#ff1f6e" fill-opacity="0.10"/>
<rect x="830" y="71" width="370" height="2" fill="#ff1f6e" fill-opacity="0.10"/>
<rect x="0" y="74" width="190" height="1" fill="#00e5ff" fill-opacity="0.13"/>
<rect x="1010" y="74" width="190" height="1" fill="#00e5ff" fill-opacity="0.13"/>
<rect x="440" y="143" width="55" height="1" fill="#00e5ff" fill-opacity="0.09"/>
<rect x="705" y="143" width="55" height="1" fill="#ff1f6e" fill-opacity="0.09"/>
<rect x="100" y="548" width="240" height="1" fill="#ff1f6e" fill-opacity="0.09"/>
<rect x="860" y="548" width="240" height="1" fill="#ff1f6e" fill-opacity="0.09"/>

<!-- Outer border frame -->
<rect x="20" y="20" width="1160" height="590" fill="none" stroke="#ff1f6e" stroke-width="1" stroke-opacity="0.52"/>
<!-- Inner hairline -->
<rect x="27" y="27" width="1146" height="576" fill="none" stroke="#ff1f6e" stroke-width="0.5" stroke-opacity="0.14"/>

<!-- Corner brackets — top-left -->
<polyline points="40,70 40,40 80,40" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.68"/>
<rect x="40" y="40" width="3" height="3" fill="#00e5ff" fill-opacity="0.7"/>
<!-- top-right -->
<polyline points="1160,70 1160,40 1120,40" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.68"/>
<rect x="1157" y="40" width="3" height="3" fill="#00e5ff" fill-opacity="0.7"/>
<!-- bottom-left -->
<polyline points="40,560 40,590 80,590" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.68"/>
<rect x="40" y="587" width="3" height="3" fill="#00e5ff" fill-opacity="0.7"/>
<!-- bottom-right -->
<polyline points="1160,560 1160,590 1120,590" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.68"/>
<rect x="1157" y="587" width="3" height="3" fill="#00e5ff" fill-opacity="0.7"/>

<!-- Scattered pixel noise accents -->
<rect x="56" y="152" width="2" height="2" fill="#ff1f6e" fill-opacity="0.38"/>
<rect x="1142" y="152" width="2" height="2" fill="#ff1f6e" fill-opacity="0.38"/>
<rect x="56" y="490" width="2" height="2" fill="#00e5ff" fill-opacity="0.38"/>
<rect x="1142" y="490" width="2" height="2" fill="#00e5ff" fill-opacity="0.38"/>
<rect x="60" y="156" width="1" height="1" fill="#00e5ff" fill-opacity="0.25"/>
<rect x="1139" y="156" width="1" height="1" fill="#00e5ff" fill-opacity="0.25"/>

<!-- ============================================
     SITE NAME — main hero
     ============================================ -->

<!-- Chromatic aberration: cyan ghost (left) -->
<text x="593" y="278"
      text-anchor="middle"
      font-family="monospace"
      font-size="118"
      fill="#00e5ff"
      fill-opacity="0.46">へのへのんのの</text>
<!-- Chromatic aberration: magenta ghost (right) -->
<text x="608" y="281"
      text-anchor="middle"
      font-family="monospace"
      font-size="118"
      fill="#ff1f6e"
      fill-opacity="0.46">へのへのんのの</text>
<!-- Main site title -->
<text x="600" y="279"
      text-anchor="middle"
      font-family="monospace"
      font-size="118"
      fill="#e0daff">へのへのんのの</text>

<!-- ============================================
     SEPARATOR
     ============================================ -->
<rect x="100" y="326" width="1000" height="1.5" fill="url(#hr)"/>

<!-- ============================================
     SONG INFO — secondary
     ============================================ -->

<!-- "today's song" label -->
<text x="600" y="370"
      text-anchor="middle"
      font-family="monospace"
      font-size="11"
      fill="#ff1f6e"
      fill-opacity="0.50"
      letter-spacing="5">— T O D A Y ' S   S O N G —</text>

<!-- Song title: ぽい — glitch echo layer -->
<text x="596" y="438"
      text-anchor="middle"
      font-family="monospace"
      font-size="44"
      fill="#00e5ff"
      fill-opacity="0.38"
      letter-spacing="16">ぽい</text>
<!-- Song title: ぽい — main -->
<text x="600" y="438"
      text-anchor="middle"
      font-family="monospace"
      font-size="44"
      fill="#ff1f6e"
      letter-spacing="16">ぽい</text>

<!-- Artist name -->
<text x="600" y="484"
      text-anchor="middle"
      font-family="sans-serif"
      font-size="20"
      fill="#e0daff"
      fill-opacity="0.40"
      letter-spacing="2">雨良 feat. 初音ミク</text>

<!-- ============================================
     FOOTER DECORATIONS
     ============================================ -->

<!-- ぽい watermark strip -->
<text x="600" y="577"
      text-anchor="middle"
      font-family="monospace"
      font-size="9"
      fill="#ff1f6e"
      fill-opacity="0.14"
      letter-spacing="8">ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい</text>

<!-- System comment -->
<text x="46" y="572"
      font-family="monospace"
      font-size="9"
      fill="#00e5ff"
      fill-opacity="0.18"
      letter-spacing="1.5">// 残念w — 悪魔の仕業 — GAMEBOY_HACK</text>

</svg>
