<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <pattern id="scan" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="3" width="2" height="1" fill="#000000" opacity="0.13"/>
  </pattern>

  <radialGradient id="bg-mid" cx="50%" cy="47%" r="52%">
    <stop offset="0%"   stop-color="#280035" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#08000d" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="title-bloom" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#3d0050" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#08000d" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="line-h" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#ff1a4e" stop-opacity="0"/>
    <stop offset="12%"  stop-color="#ff1a4e" stop-opacity="1"/>
    <stop offset="88%"  stop-color="#ff1a4e" stop-opacity="1"/>
    <stop offset="100%" stop-color="#ff1a4e" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="line-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="28%"  stop-color="#00e5ff" stop-opacity="0.2"/>
    <stop offset="72%"  stop-color="#00e5ff" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>

  <filter id="f-glow-fg" x="-8%" y="-55%" width="116%" height="210%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="f-glow-red" x="-12%" y="-90%" width="124%" height="280%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ░░ BACKGROUND ░░ -->
<rect width="1200" height="630" fill="#08000d"/>
<rect width="1200" height="630" fill="url(#bg-mid)"/>
<ellipse cx="600" cy="268" rx="560" ry="215" fill="url(#title-bloom)"/>
<rect width="1200" height="630" fill="url(#scan)"/>

<!-- ░░ BORDERS ░░ -->
<rect x="0" y="0"   width="1200" height="3" fill="url(#line-h)"/>
<rect x="0" y="4"   width="1200" height="1" fill="url(#line-cyan)"/>
<rect x="0" y="625" width="1200" height="3" fill="url(#line-h)"/>
<rect x="0" y="623" width="1200" height="1" fill="url(#line-cyan)"/>
<rect x="0"    y="0" width="3" height="630" fill="#ff1a4e" opacity="0.55"/>
<rect x="1197" y="0" width="3" height="630" fill="#ff1a4e" opacity="0.55"/>

<!-- ░░ CORNER BRACKETS ░░ -->
<polyline points="60,17 22,17 22,82"          fill="none" stroke="#ff1a4e" stroke-width="2" opacity="0.82"/>
<polyline points="1140,17 1178,17 1178,82"    fill="none" stroke="#ff1a4e" stroke-width="2" opacity="0.82"/>
<polyline points="60,613 22,613 22,548"       fill="none" stroke="#ff1a4e" stroke-width="2" opacity="0.82"/>
<polyline points="1140,613 1178,613 1178,548" fill="none" stroke="#ff1a4e" stroke-width="2" opacity="0.82"/>

<!-- ░░ DIAGONAL SLASH ACCENTS ░░ -->
<line x1="998"  y1="0"   x2="1110" y2="630" stroke="#ff1a4e" stroke-width="2.5" opacity="0.17"/>
<line x1="1032" y1="0"   x2="1144" y2="630" stroke="#ff1a4e" stroke-width="1"   opacity="0.09"/>
<line x1="202"  y1="0"   x2="90"   y2="630" stroke="#ff1a4e" stroke-width="2.5" opacity="0.17"/>
<line x1="168"  y1="0"   x2="56"   y2="630" stroke="#ff1a4e" stroke-width="1"   opacity="0.09"/>

<!-- ░░ TOP LABEL AREA ░░ -->
<text x="50"   y="50" font-family="monospace" font-size="14"
      fill="#9e7aaa" letter-spacing="0.15em" opacity="0.8">2026.06.07</text>
<text x="1150" y="50" text-anchor="end" font-family="monospace" font-size="13"
      fill="#9e7aaa" letter-spacing="0.14em" opacity="0.7">// BLOG</text>
<rect x="50"  y="63" width="430" height="1" fill="#3a0045" opacity="0.85"/>
<rect x="720" y="63" width="430" height="1" fill="#3a0045" opacity="0.85"/>

<!-- ░░ SITE NAME — main hero ░░ -->
<!-- RGB aberration: red fringe left -->
<text x="593" y="312" text-anchor="middle"
      font-family="sans-serif" font-size="122" font-weight="900"
      fill="#ff1a4e" opacity="0.48">へのへのんのの</text>
<!-- RGB aberration: cyan fringe right -->
<text x="609" y="312" text-anchor="middle"
      font-family="sans-serif" font-size="122" font-weight="900"
      fill="#00e5ff" opacity="0.28">へのへのんのの</text>
<!-- Main white text -->
<text x="601" y="312" text-anchor="middle"
      font-family="sans-serif" font-size="122" font-weight="900"
      fill="#f4ecf7" filter="url(#f-glow-fg)">へのへのんのの</text>

<!-- ░░ DIVIDER ░░ -->
<rect x="80" y="347" width="1040" height="1" fill="url(#line-h)" opacity="0.62"/>
<rect x="80" y="351" width="1040" height="1" fill="url(#line-cyan)"/>
<polygon points="601,340 609,347 601,354 593,347" fill="#ff1a4e" opacity="0.92"/>

<!-- ░░ SONG TITLE — subtitle ░░ -->
<text x="601" y="415" text-anchor="middle"
      font-family="sans-serif" font-size="42" font-weight="700"
      fill="#ff1a4e" filter="url(#f-glow-red)">マシンガンクイーン</text>

<!-- ░░ ARTIST + BULLET DOTS ░░ -->
<g fill="#ff1a4e" opacity="0.52">
  <circle cx="293" cy="455" r="2.5"/>
  <circle cx="310" cy="455" r="2.5"/>
  <circle cx="327" cy="455" r="2.5"/>
  <circle cx="344" cy="455" r="2.5"/>
  <circle cx="361" cy="455" r="2.5"/>
  <circle cx="378" cy="455" r="2.5"/>
  <circle cx="395" cy="455" r="2.5"/>
  <circle cx="412" cy="455" r="2.5"/>
  <circle cx="429" cy="455" r="2.5"/>
</g>
<text x="601" y="462" text-anchor="middle"
      font-family="sans-serif" font-size="22"
      fill="#9e7aaa" letter-spacing="0.07em">マイキP feat. 重音テトSV</text>
<g fill="#ff1a4e" opacity="0.52">
  <circle cx="771" cy="455" r="2.5"/>
  <circle cx="788" cy="455" r="2.5"/>
  <circle cx="805" cy="455" r="2.5"/>
  <circle cx="822" cy="455" r="2.5"/>
  <circle cx="839" cy="455" r="2.5"/>
  <circle cx="856" cy="455" r="2.5"/>
  <circle cx="873" cy="455" r="2.5"/>
  <circle cx="890" cy="455" r="2.5"/>
  <circle cx="907" cy="455" r="2.5"/>
</g>

<!-- ░░ GHOST LYRIC ░░ -->
<text x="601" y="558" text-anchor="middle"
      font-family="sans-serif" font-size="15" font-style="italic"
      fill="#ff1a4e" opacity="0.2" letter-spacing="0.22em">君だけはよそ見をしないで</text>

<!-- ░░ FOOTER MARK ░░ -->
<text x="601" y="596" text-anchor="middle"
      font-family="monospace" font-size="12"
      fill="#9e7aaa" opacity="0.36" letter-spacing="0.28em">◆  へのへのんのの  ◆</text>

</svg>
