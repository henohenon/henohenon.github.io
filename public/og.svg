<circle cx="536"  cy="160" r="1.5" fill="#f5a800" opacity="0.26"/>
<circle cx="663"  cy="186" r="1.5" fill="#ff6018" opacity="0.20"/>
<circle cx="362"  cy="308" r="1.5" fill="#f5a800" opacity="0.16"/>
<circle cx="838"  cy="328" r="1.5" fill="#ff6018" opacity="0.16"/>
<circle cx="194"  cy="440" r="2"   fill="#f5a800" opacity="0.12"/>
<circle cx="1005" cy="400" r="1.5" fill="#ff6018" opacity="0.16"/>

<!-- frame -->
<rect x="18" y="18" width="1164" height="594" rx="5" ry="5" fill="none" stroke="#ff6018" stroke-width="1.5" stroke-opacity="0.28"/>
<rect x="18" y="18"    width="1164" height="2.5" fill="url(#g-div)" opacity="0.55"/>
<rect x="18" y="609.5" width="1164" height="2.5" fill="url(#g-div)" opacity="0.55"/>

<!-- ── SITE NAME ── -->
<text
  x="600" y="278"
  text-anchor="middle"
  font-family="sans-serif"
  font-weight="900"
  font-size="128"
  fill="#f0e5cc"
  letter-spacing="8"
  filter="url(#f-hero)">へのへのんのの</text>

<!-- divider -->
<rect x="155" y="325" width="890" height="2"   fill="url(#g-div)"/>
<rect x="255" y="329" width="690" height="0.5" fill="url(#g-gold)"/>

<!-- ── SONG NAME ── -->
<text
  x="600" y="392"
  text-anchor="middle"
  font-family="sans-serif"
  font-size="40"
  fill="#ff6018"
  letter-spacing="3"
  filter="url(#f-accent)">Burn Me Again</text>

<!-- ── ARTIST ── -->
