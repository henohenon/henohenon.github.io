<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gradPink" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradPurple" cx="88%" cy="5%" r="55%">
      <stop offset="0%" stop-color="#b98cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradGold" cx="50%" cy="105%" r="60%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="75%">
      <stop offset="55%" stop-color="#150c1f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08050d" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#150c1f"/>
  <rect width="1200" height="630" fill="url(#gradPink)"/>
  <rect width="1200" height="630" fill="url(#gradPurple)"/>
