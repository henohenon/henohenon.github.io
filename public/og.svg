<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowPink1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fd8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fa0"/>
      <stop offset="50%" stop-color="#2fd8ff"/>
      <stop offset="100%" stop-color="#ff2fa0"/>
    </linearGradient>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="scan" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(100)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#2fd8ff" stroke-width="2" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#fff3fa"/>

  <!-- soft ambient glow blobs (matching theme radial gradients) -->
  <circle cx="140" cy="110" r="220" fill="#ff2fa0" opacity="0.22" filter="url(#blurGlow)"/>
  <circle cx="1040" cy="90" r="200" fill="#2fd8ff" opacity="0.22" filter="url(#blurGlow)"/>
  <circle cx="860" cy="570" r="260" fill="#ff2fa0" opacity="0.16" filter="url(#blurGlow)"/>
  <circle cx="120" cy="540" r="180" fill="#2fd8ff" opacity="0.14" filter="url(#blurGlow)"/>

  <!-- diagonal scanline overlay -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>

  <!-- outer rounded frame -->
  <rect x="20" y="20" width="1160" height="590" rx="30" fill="none" stroke="#ff2fa0" stroke-width="4" opacity="0.85"/>
  <rect x="36" y="36" width="1128" height="558" rx="22" fill="none" stroke="#2fd8ff" stroke-width="2" stroke-dasharray="14 10" opacity="0.5"/>

  <!-- decorative music notes -->
  <g opacity="0.5">
    <g transform="translate(120,110) rotate(-12)">
      <rect x="6" y="-30" width="4" height="34" fill="#2fd8ff"/>
      <ellipse cx="4" cy="6" rx="9" ry="6" fill="#2fd8ff"/>
    </g>
    <g transform="translate(1080,120) rotate(14)">
      <rect x="6" y="-28" width="4" height="32" fill="#ff2fa0"/>
      <ellipse cx="4" cy="6" rx="8" ry="5.5" fill="#ff2fa0"/>
    </g>
    <g transform="translate(110,540) rotate(10)">
      <rect x="6" y="-26" width="4" height="30" fill="#ff2fa0"/>
      <ellipse cx="4" cy="5" rx="8" ry="5.5" fill="#ff2fa0"/>
    </g>
    <g transform="translate(1090,530) rotate(-14)">
      <rect x="6" y="-30" width="4" height="34" fill="#2fd8ff"/>
      <ellipse cx="4" cy="6" rx="9" ry="6" fill="#2fd8ff"/>
    </g>
  </g>

  <!-- small heartbeat heart above title -->
  <path d="M600,128 C592,113 570,113 570,133 C570,151 600,168 600,168 C600,168 630,151 630,133 C630,113 608,113 600,128 Z"
        fill="#ff2fa0" opacity="0.85"/>
  <circle cx="600" cy="140" r="46" fill="url(#glowPink1)"/>

  <!-- main site title (glow copy + solid) -->
  <text x="600" y="305" text-anchor="middle"
        font-family="sans-serif" font-weight="700" font-size="112"
        letter-spacing="4" fill="#ffd6ef" opacity="0.9" filter="url(#softGlow)">へのへのんのの</text>
  <text x="600" y="305" text-anchor="middle"
        font-family="sans-serif" font-weight="700" font-size="112"
        letter-spacing="4" fill="#2a1b3d">へのへのんのの</text>

  <!-- divider -->
  <line x1="450" y1="345" x2="750" y2="345" stroke="url(#dividerGrad)" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- subtitle: today's song -->
  <text x="600" y="405" text-anchor="middle"
        font-family="sans-serif" font-weight="600" font-size="40"
        letter-spacing="1" fill="#ff2fa0">Restart Refine</text>

  <!-- artist / credit -->
  <text x="600" y="448" text-anchor="middle"
        font-family="sans-serif" font-weight="400" font-size="23"
        fill="#2a1b3d" opacity="0.6">d0tc0mmie feat. Synthesizer V AI Megpoid</text>
</svg>
