<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cyanGlow" cx="85%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#7fe8ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="8%" cy="96%" r="60%">
