<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-5%" r="75%">
      <stop offset="0%" stop-color="#8f1f2e" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#8f1f2e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#120f10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="edgeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f1f2e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8f1f2e" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8f1f2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8f1f2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0576a"/>
      <stop offset="45%" stop-color="#ece5dc"/>
      <stop offset="100%" stop-color="#8fa3c9"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#120f10"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- faint echo arcs, two voices reflecting -->
  <circle cx="600" cy="300" r="260" fill="none" stroke="#8fa3c9" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="600" cy="300" r="320" fill="none" stroke="#e0576a" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="600" cy="300" r="380" fill="none" stroke="#2a2422" stroke-opacity="0.6" stroke-width="1"/>

  <!-- top / bottom border lines -->
  <rect x="60" y="52" width="1080" height="2" fill="url(#edgeLine)"/>
  <rect x="60" y="576" width="1080" height="2" fill="url(#edgeLine)"/>

  <!-- procession motif: quiet row of grave-marker lines -->
  <g stroke="#8f1f2e" stroke-opacity="0.5">
    <line x1="150" y1="600" x2="150" y2="560" stroke-width="3"/>
    <line x1="220" y1="600" x2="220" y2="575" stroke-width="3"/>
    <line x1="290" y1="600" x2="290" y2="555" stroke-width="3"/>
    <line x1="910" y1="600" x2="910" y2="555" stroke-width="3"/>
    <line x1="980" y1="600" x2="980" y2="575" stroke-width="3"/>
    <line x1="1050" y1="600" x2="1050" y2="560" stroke-width="3"/>
  </g>

  <!-- small kicker -->
  <text x="600" y="150" text-anchor="middle" font-family="sans-serif" font-size="18"
        letter-spacing="8" fill="#8fa3c9" fill-opacity="0.75">TODAY'S SOUND SHAPES THIS PAGE</text>

  <!-- title glow -->
  <text x="600" y="322" text-anchor="middle" font-family="sans-serif" font-weight="700"
        font-size="132" letter-spacing="6" fill="#e0576a" fill-opacity="0.45" filter="url(#softBlur)">へのへのんのの</text>

  <!-- site title: the star -->
  <text x="600" y="322" text-anchor="middle" font-family="sans-serif" font-weight="700"
        font-size="132" letter-spacing="6" fill="url(#titleGrad)">へのへのんのの</text>

  <!-- divider -->
  <line x1="430" y1="368" x2="770" y2="368" stroke="#8f1f2e" stroke-width="1.5"
        stroke-dasharray="7 8" stroke-opacity="0.7"/>

  <!-- subtitle: today's track -->
  <text x="600" y="424" text-anchor="middle" font-family="sans-serif" font-weight="600"
        font-size="38" letter-spacing="7" fill="#e0576a">NO EULOGIES</text>

  <!-- artist, smaller still -->
  <text x="600" y="464" text-anchor="middle" font-family="sans-serif" font-size="21"
        letter-spacing="2" fill="#8fa3c9" fill-opacity="0.85">Various artists</text>

  <!-- vignette on top -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#vignette)"/>
</svg>
