<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="65%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#1c1f2b"/>
    </linearGradient>
    <radialGradient id="lampL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb199" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d3d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff4d3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- base background: exact --color-bg fill -->
  <rect x="0" y="0" width="1200" height="630" fill="#12141c"/>
  <!-- subtle depth wash on top of the exact bg fill -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- station platform lamp glows -->
  <circle cx="150" cy="90" r="260" fill="url(#lampL)"/>
  <circle cx="1080" cy="520" r="300" fill="url(#lampR)"/>

  <!-- punk speed-line scratches, corners -->
  <g stroke="#ffb199" stroke-width="2" opacity="0.16">
    <line x1="-40" y1="560" x2="360" y2="200"/>
    <line x1="-40" y1="610" x2="420" y2="220"/>
    <line x1="-20" y1="660" x2="480" y2="250"/>
    <line x1="30" y1="690" x2="540" y2="290"/>
  </g>
  <g stroke="#ff4d3d" stroke-width="2" opacity="0.14">
    <line x1="1240" y1="60" x2="820" y2="420"/>
    <line x1="1260" y1="10" x2="880" y2="400"/>
    <line x1="1220" y1="120" x2="760" y2="460"/>
  </g>

  <!-- top accent stripe, echoing .site-header border -->
  <rect x="0" y="0" width="1200" height="8" fill="#ff4d3d"/>

  <!-- station number badge (Odakyu-style), subordinate info -->
  <rect x="972" y="38" width="168" height="74" rx="12" fill="#1c1f2b" stroke="#ff4d3d" stroke-width="3"/>
  <text x="1056" y="64" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffb199" text-anchor="middle" letter-spacing="3">ODAKYU LINE</text>
  <text x="1056" y="99" font-family="sans-serif" font-size="30" font-weight="800" fill="#f3efe7" text-anchor="middle" letter-spacing="2">OH-49</text>

  <!-- main card, echoing article.post styling -->
  <rect x="90" y="132" width="1020" height="372" rx="18" fill="#1c1f2b" opacity="0.92" stroke="#333750" stroke-width="2"/>
  <rect x="90" y="132" width="9" height="372" rx="4" fill="#ff4d3d"/>

  <!-- eyebrow label -->
  <text x="600" y="196" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffb199" text-anchor="middle" letter-spacing="8" opacity="0.9">NOW PLAYING</text>

  <!-- site name: primary focal element, with soft accent glow -->
  <text x="600" y="336" font-family="sans-serif" font-size="122" font-weight="800" fill="#ff4d3d" text-anchor="middle" letter-spacing="4" filter="url(#blurGlow)" opacity="0.55">へのへのんのの</text>
  <text x="600" y="336" font-family="sans-serif" font-size="122" font-weight="800" fill="#f3efe7" text-anchor="middle" letter-spacing="4">へのへのんのの</text>

  <!-- divider -->
  <line x1="470" y1="368" x2="730" y2="368" stroke="#333750" stroke-width="2"/>

  <!-- subtitle: today's song, clearly secondary -->
  <text x="600" y="412" font-family="sans-serif" font-size="38" font-weight="700" fill="#ffb199" text-anchor="middle" letter-spacing="1">Odakyu 49</text>

  <!-- artist credit: smallest tier -->
  <text x="600" y="452" font-family="sans-serif" font-size="19" fill="#f3efe7" text-anchor="middle" opacity="0.6">isidore., HWAAStyle feat. Synthesizer V 2 AI Megpoid</text>

  <!-- bottom running rail line, echoing odakyu-run keyframe -->
  <line x1="0" y1="606" x2="1200" y2="606" stroke="#ff4d3d" stroke-width="6" stroke-dasharray="24 16" opacity="0.85"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#333750" stroke-width="2" stroke-dasharray="8 10" opacity="0.6"/>
</svg>
