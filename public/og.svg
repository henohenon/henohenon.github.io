<line x1="752" y1="481" x2="1105" y2="481" stroke="#00e8ff" stroke-width="0.6" opacity="0.22"/>
<text x="600" y="485" text-anchor="middle" font-family="serif" font-size="9" fill="#00e8ff" opacity="0.35">✦</text>

