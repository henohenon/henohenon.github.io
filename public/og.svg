<!-- MAIN TITLE: へのへのんのの -->
<!-- Layer 1: wide pink glow halo -->
<text x="600" y="288" text-anchor="middle"
  font-family="monospace" font-size="110" letter-spacing="0.03em"
  fill="#ff2d82" opacity="0.30" filter="url(#blur-xl)">へのへのんのの</text>
<!-- Layer 2: medium pink glow -->
<text x="600" y="288" text-anchor="middle"
  font-family="monospace" font-size="110" letter-spacing="0.03em"
  fill="#ff2d82" opacity="0.40" filter="url(#blur-lg)">へのへのんのの</text>
<!-- Layer 3: tight purple-pink bloom -->
<text x="600" y="288" text-anchor="middle"
  font-family="monospace" font-size="110" letter-spacing="0.03em"
  fill="#cc88ff" opacity="0.52" filter="url(#blur-sm)">へのへのんのの</text>
<!-- Layer 4: actual bright lavender text -->
<text x="600" y="288" text-anchor="middle"
  font-family="monospace" font-size="110" letter-spacing="0.03em"
  fill="#eedeff">へのへのんのの</text>

