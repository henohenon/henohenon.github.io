<text x="640" y="64" font-family="serif" font-size="10" fill="#00e8ff" opacity="0.38">★</text>
<text x="180" y="306" font-family="serif" font-size="9" fill="#ff2d82" opacity="0.32">◆</text>
<text x="1010" y="302" font-family="serif" font-size="9" fill="#00e8ff" opacity="0.32">◆</text>
