  <!-- title halo -->
  <ellipse cx="600" cy="262" rx="530" ry="118" fill="url(#halo)"/>

  <!-- site name — hero -->
  <text
    x="600" y="280"
    text-anchor="middle"
    font-family="serif"
    font-size="118"
    fill="#8b96ff"
    filter="url(#gl)"
    letter-spacing="8"
  >へのへのんのの</text>

  <!-- separator -->
  <line x1="340" y1="335" x2="860" y2="335" stroke="url(#sep)" stroke-width="1"/>
  <polygon points="600,329 607,335 600,341 593,335" fill="#8b96ff" fill-opacity="0.40"/>

  <!-- song title — subtitle -->
  <text
    x="600" y="390"
    text-anchor="middle"
    font-family="serif"
    font-size="36"
    fill="#cdd1e5"
    filter="url(#gs)"
    letter-spacing="6"
  >サミシガリスト</text>

  <!-- artist -->
  <text
    x="600" y="443"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="19"
    fill="#69728f"
    letter-spacing="1"
  >YM feat. Synthesizer V 2 AI Megpoid</text>

  <!-- train light — passing moment -->
  <rect x="0" y="544" width="1200" height="1" fill="url(#sweep)" opacity="0.50"/>
</svg>
