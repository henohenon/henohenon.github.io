  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="132" letter-spacing="4" fill="url(#titleGrad)" filter="url(#titleGlow)">へのへのんのの</text>

  <line x1="470" y1="392" x2="730" y2="392" stroke="#ff6fae" stroke-opacity="0.5" stroke-width="1.5"/>
