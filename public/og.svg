<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowPink" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ff3d8f" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ff3d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="92%" cy="108%" r="70%">
      <stop offset="0%" stop-color="#ffcc4d" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffcc4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f0f29" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1f0f29" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#ffcc4d" stroke-width="2" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="630" fill="#150a1c"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowPink)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowGold)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#stripes)"/>

  <!-- stage light beams -->
  <polygon points="120,-60 300,-60 560,630 220,630" fill="#f4ecf3" opacity="0.035"/>
  <polygon points="640,-60 830,-60 1040,630 700,630" fill="#f4ecf3" opacity="0.03"/>
  <polygon points="920,-60 1060,-60 1180,500 980,630" fill="#ff3d8f" opacity="0.04"/>

  <!-- floor gradient / stage bottom -->
  <rect x="0" y="470" width="1200" height="160" fill="url(#floorFade)"/>
  <line x1="0" y1="470" x2="1200" y2="470" stroke="#ffcc4d" stroke-width="1" stroke-dasharray="2 10" opacity="0.35"/>

  <!-- outer frame -->
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="none" stroke="#ff3d8f" stroke-width="2" opacity="0.45"/>
  <rect x="52" y="52" width="1096" height="526" rx="12" fill="none" stroke="#ffcc4d" stroke-width="1" stroke-dasharray="1 9" opacity="0.4"/>

  <!-- rec indicator -->
  <circle cx="90" cy="90" r="7" fill="#ff3d8f">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="96" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="0.15em" fill="#f4ecf3" opacity="0.6">ON AIR</text>

  <!-- decorative rings behind title -->
  <circle cx="600" cy="288" r="266" fill="none" stroke="#ff3d8f" stroke-width="1.5" stroke-dasharray="3 14" opacity="0.3"/>
  <circle cx="600" cy="288" r="300" fill="none" stroke="#ffcc4d" stroke-width="1" stroke-dasharray="1 10" opacity="0.22"/>

  <!-- sparkles -->
  <g fill="#ffcc4d" opacity="0.7">
    <circle cx="150" cy="200" r="2.5"/>
    <circle cx="1080" cy="170" r="3"/>
    <circle cx="1020" cy="420" r="2"/>
    <circle cx="180" cy="440" r="2.5"/>
    <circle cx="960" cy="90" r="2"/>
    <circle cx="240" cy="120" r="2"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="140" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="0.35em" text-anchor="middle" fill="#ff3d8f" opacity="0.65">FINAL AUDITION BROADCAST</text>

  <!-- glitch title -->
  <text x="592" y="308" font-family="sans-serif" font-size="128" font-weight="900" text-anchor="middle" fill="#4ddcff" opacity="0.5">へのへのんのの</text>
  <text x="608" y="308" font-family="sans-serif" font-size="128" font-weight="900" text-anchor="middle" fill="#ff3d8f" opacity="0.5">へのへのんのの</text>
  <text x="600" y="308" font-family="sans-serif" font-size="128" font-weight="900" text-anchor="middle" fill="#f4ecf3">へのへのんのの</text>

  <!-- divider -->
  <line x1="440" y1="358" x2="760" y2="358" stroke="#ffcc4d" stroke-width="2" opacity="0.5"/>

  <!-- subtitle: today's song -->
  <text x="600" y="418" font-family="sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#ffcc4d" letter-spacing="0.02em">アポカリゴットタレント</text>
  <text x="600" y="458" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#f4ecf3" opacity="0.72">ど～ぱみん feat. 初音ミク</text>

  <!-- footer marquee -->
  <text x="600" y="590" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="0.2em" text-anchor="middle" fill="#ff3d8f" opacity="0.55">RIDE OR DIE ── SHOW MUST GO ON</text>
</svg>
