<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="azalea" cx="18%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ff7aa2" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff7aa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doom" cx="82%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#5a1326" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a1326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a14"/>
      <stop offset="100%" stop-color="#0c0408"/>
    </linearGradient>
    <radialGradient id="bloom" cx="78%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ff3d6e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3d6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3d6e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3d6e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3d6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a1326" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5a1326"/>
      <stop offset="50%" stop-color="#ff3d6e"/>
      <stop offset="75%" stop-color="#5a1326"/>
      <stop offset="100%" stop-color="#5a1326" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#14080f"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#doom)"/>
  <rect width="1200" height="630" fill="url(#azalea)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- 受話器コード (装飾) -->
  <g stroke="#f0c674" stroke-opacity="0.18" fill="none" stroke-width="1.2">
    <path d="M -20 540 Q 60 510 80 540 T 180 540 T 280 540 T 380 540 T 480 540 T 580 540 T 680 540 T 780 540 T 880 540 T 980 540 T 1080 540 T 1220 540"/>
    <path d="M -20 560 Q 60 530 80 560 T 180 560 T 280 560 T 380 560 T 480 560 T 580 560 T 680 560 T 780 560 T 880 560 T 980 560 T 1080 560 T 1220 560"/>
  </g>

  <!-- 上ボーダー -->
  <rect x="60" y="60" width="1080" height="1" fill="#ff7aa2" fill-opacity="0.22"/>
  <!-- 下ボーダー -->
  <rect x="60" y="569" width="1080" height="1" fill="#ff7aa2" fill-opacity="0.22"/>

  <!-- 上部メタ: 公衆電話風 -->
  <g font-family="monospace" font-size="16" fill="#f0c674" fill-opacity="0.75" letter-spacing="6">
    <text x="80" y="100">☎  10¥ LEFT</text>
    <text x="1120" y="100" text-anchor="end">都窪郡早島</text>
  </g>

  <!-- リングトーン線 -->
  <rect x="200" y="135" width="800" height="1.5" fill="url(#ringline)"/>

  <!-- 主役: サイト名 -->
  <g font-family="serif" text-anchor="middle">
    <text x="600" y="305" font-size="124" font-style="italic" fill="#ff7aa2" letter-spacing="6" font-weight="500">へのへのんのの</text>
    <!-- グロウ重ね -->
    <text x="600" y="305" font-size="124" font-style="italic" fill="#fdeef0" fill-opacity="0.95" letter-spacing="6" font-weight="500">へのへのんのの</text>
  </g>

  <!-- 区切り -->
  <rect x="380" y="355" width="440" height="1" fill="url(#hr)"/>

  <!-- 副題ラベル -->
  <g font-family="monospace" text-anchor="middle">
    <text x="600" y="395" font-size="14" fill="#c9a9b3" letter-spacing="8">— TODAY'S CALL —</text>
  </g>

  <!-- 副題: 曲名 -->
  <g font-family="serif" text-anchor="middle">
    <text x="600" y="450" font-size="34" fill="#ff3d6e" font-style="italic" letter-spacing="2">電話して!!!!!!!!!!</text>
    <text x="600" y="485" font-size="20" fill="#c9a9b3" letter-spacing="3">（だって今から世界が終わるので）</text>
  </g>

  <!-- アーティスト -->
  <g font-family="sans-serif" text-anchor="middle">
    <text x="600" y="525" font-size="15" fill="#c9a9b3" fill-opacity="0.8" letter-spacing="4">SLAVE.V-V-R  feat.  初音ミク V4X (Sweet)</text>
  </g>

  <!-- 黒猫 (隅に小さく) -->
  <g transform="translate(1060, 500)" fill="#0a0508" stroke="#ff3d6e" stroke-opacity="0.55" stroke-width="1">
    <path d="M 0 30 Q -8 18 -6 8 L -10 -6 L -4 -2 Q 0 -8 6 -2 L 12 -6 L 8 8 Q 10 18 0 30 Z"/>
    <circle cx="-2" cy="6" r="1" fill="#ff7aa2" stroke="none"/>
    <circle cx="4" cy="6" r="1" fill="#ff7aa2" stroke="none"/>
  </g>

  <!-- ツツジの花びら散らし -->
  <g fill="#ff3d6e" fill-opacity="0.6">
    <circle cx="140" cy="220" r="3"/>
    <circle cx="180" cy="280" r="2"/>
    <circle cx="100" cy="340" r="2.5"/>
    <circle cx="220" cy="180" r="1.5"/>
    <circle cx="1070" cy="240" r="2.5"/>
    <circle cx="1020" cy="300" r="2"/>
    <circle cx="1100" cy="350" r="3"/>
    <circle cx="980" cy="200" r="1.5"/>
  </g>

  <!-- 左下サインタグ -->
  <g font-family="monospace" font-size="13" fill="#f0c674" fill-opacity="0.55" letter-spacing="3">
    <text x="80" y="555">henohenonnono.log</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#f0c674" fill-opacity="0.55" letter-spacing="3" text-anchor="end">
    <text x="1120" y="555">2026.05.29</text>
  </g>
</svg>
