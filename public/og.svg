      fill="none" stroke="#d4738a" stroke-width="1" stroke-opacity="0.22"/>
<line x1="80"  y1="48"  x2="1120" y2="48"  stroke="#e8896e" stroke-width="0.5" stroke-opacity="0.13"/>
