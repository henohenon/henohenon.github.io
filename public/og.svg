      <stop offset="100%" stop-color="#45e0c4" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="stripes" width="10" height="10" patternTransform="rotate(90)" patternUnits="userSpaceOnUse">
      <rect width="10" height="2" fill="#45e0c4" opacity="0.06"/>
