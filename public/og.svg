    </linearGradient>
    <linearGradient id="waveGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45e0c4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff4fa0" stop-opacity="0.10"/>
