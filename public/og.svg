<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ff4d6a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#7a8cff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#7a8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringfade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0a0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c0a0d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="630" fill="#0c0a0d"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#g1)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#g2)"/>

  <!-- 二声のデュエット：左右の境界線 -->
  <rect x="0" y="0" width="6" height="630" fill="#ff4d6a"/>
  <rect x="1194" y="0" width="6" height="630" fill="#7a8cff"/>

  <!-- 上下の細い罫線 -->
  <line x1="70" y1="88" x2="1130" y2="88" stroke="#2a2226" stroke-width="1"/>
  <line x1="70" y1="560" x2="1130" y2="560" stroke="#2a2226" stroke-width="1"/>

  <!-- 指切りの輪：交差する二つの円（テト / 千冬） -->
  <circle cx="562" cy="150" r="34" fill="none" stroke="#ff4d6a" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.55"/>
  <circle cx="612" cy="150" r="34" fill="none" stroke="#7a8cff" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.55"/>

  <!-- 背後の大きな輪（円環のモチーフ） -->
  <circle cx="600" cy="300" r="255" fill="none" stroke="#ff4d6a" stroke-width="1" stroke-dasharray="2 8" opacity="0.18"/>
  <circle cx="600" cy="300" r="285" fill="none" stroke="#7a8cff" stroke-width="1" stroke-dasharray="2 8" opacity="0.12"/>

  <!-- サイト名：主役 -->
  <text x="600" y="330" text-anchor="middle" font-family="serif" font-size="128" font-weight="700"
        fill="#ece4e1" style="letter-spacing:0.04em">へのへのんのの</text>

  <!-- サイト名の脈打つ点（鼓動） -->
  <circle cx="330" cy="300" r="4.5" fill="#ff4d6a" opacity="0.85"/>
  <circle cx="870" cy="300" r="4.5" fill="#7a8cff" opacity="0.85"/>

  <!-- 区切り -->
  <line x1="530" y1="368" x2="670" y2="368" stroke="#2a2226" stroke-width="1"/>

  <!-- 副題：今日の曲 -->
  <text x="600" y="424" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="600"
        fill="#ff4d6a" style="letter-spacing:0.02em">このゆびとまれ</text>

  <!-- アーティスト -->
  <text x="600" y="466" text-anchor="middle" font-family="sans-serif" font-size="22"
        fill="#7a8cff" opacity="0.9">LonePi feat. 重音テトSV, 花隈千冬</text>

  <!-- フッター的な一言 -->
  <text x="70" y="606" font-family="sans-serif" font-size="18" fill="#ece4e1" opacity="0.45">へのへのんのの</text>
  <text x="1130" y="606" text-anchor="end" font-family="sans-serif" font-size="18" fill="#ece4e1" opacity="0.45">今日の曲でできた場所</text>
</svg>
