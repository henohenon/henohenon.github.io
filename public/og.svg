<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#2c1f3d"/>
      <stop offset="60%" stop-color="#221830"/>
      <stop offset="100%" stop-color="#221830"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2e9f5"/>
      <stop offset="100%" stop-color="#e4d3ea"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#221830"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- crescent moon, dreamy corner -->
  <g opacity="0.35">
    <circle cx="110" cy="110" r="52" fill="#ffd39a"/>
    <circle cx="132" cy="98" r="52" fill="#221830"/>
  </g>

  <!-- faint large loop rings behind everything -->
  <circle cx="600" cy="330" r="270" fill="none" stroke="#4a3760" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.5"/>
  <circle cx="600" cy="330" r="320" fill="none" stroke="#4a3760" stroke-width="1" stroke-dasharray="2 14" opacity="0.35"/>

  <!-- small stars for night mood -->
  <g fill="#f2e9f5" opacity="0.5">
    <circle cx="1060" cy="90" r="3"/>
    <circle cx="1010" cy="150" r="2"/>
    <circle cx="1120" cy="200" r="2.5"/>
    <circle cx="90" cy="480" r="2.5"/>
    <circle cx="150" cy="540" r="2"/>
  </g>

  <!-- spinner ring motif (broken circle like alarm-loop icon) -->
  <circle cx="600" cy="150" r="34" fill="none" stroke="#ffd39a" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 214"/>

  <!-- decorative clock ticks around spinner -->
  <g stroke="#ffd39a" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="600" y1="104" x2="600" y2="94"/>
    <line x1="646" y1="150" x2="656" y2="150"/>
    <line x1="600" y1="196" x2="600" y2="206"/>
    <line x1="554" y1="150" x2="544" y2="150"/>
  </g>

  <!-- site title: the main subject -->
  <text x="600" y="340" text-anchor="middle"
        font-family="serif" font-size="126" font-weight="700"
        fill="url(#titleFade)" letter-spacing="6">
    へのへのんのの
  </text>

  <!-- divider -->
  <line x1="420" y1="392" x2="780" y2="392" stroke="#4a3760" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- today's song: subtitle -->
  <text x="600" y="450" text-anchor="middle"
        font-family="serif" font-size="38" font-style="italic"
        fill="#ff8fa3" letter-spacing="1">
    unlucky loop
  </text>

  <!-- artist: smallest info -->
  <text x="600" y="492" text-anchor="middle"
        font-family="sans-serif" font-size="24"
        fill="#b8a9c9" letter-spacing="0.5">
    Mage-P feat. 悩音Blue
  </text>

  <!-- bottom hairline, echoing site-footer border -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#4a3760" stroke-width="1" opacity="0.6"/>
  <text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#b8a9c9" opacity="0.8">
    目覚まし越しに繰り返される、優しく甘い悪夢のループ
  </text>
</svg>
