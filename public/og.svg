  <rect x="0" y="0" width="1200" height="5" fill="url(#lineGrad)"/>
  <rect x="30" y="28" width="1140" height="574" fill="none" stroke="rgba(233,226,242,0.14)" stroke-width="1.5" rx="14"/>

