  <circle cx="1082" cy="132" r="0.8" fill="#cdd1e5" fill-opacity="0.18"/>
  <circle cx="72"   cy="188" r="1.0" fill="#8b96ff" fill-opacity="0.22"/>
  <circle cx="235"  cy="196" r="1.4" fill="#b0b9ff" fill-opacity="0.30"/>
  <circle cx="908"  cy="182" r="0.8" fill="#8b96ff" fill-opacity="0.20"/>
  <circle cx="1052" cy="192" r="1.0" fill="#cdd1e5" fill-opacity="0.18"/>

