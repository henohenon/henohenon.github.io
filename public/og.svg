<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g-bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="50%" stop-color="#ff5599"/>
    <stop offset="100%" stop-color="#00f0ff"/>
  </linearGradient>
  <linearGradient id="g-sep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.55"/>
    <stop offset="50%" stop-color="#ff5599" stop-opacity="0.8"/>
    <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="g-cx" cx="50%" cy="42%" r="52%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.055"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-pk" cx="50%" cy="47%" r="38%">
    <stop offset="0%" stop-color="#ff5599" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#ff5599" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-vig" cx="50%" cy="50%" r="72%">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
  <pattern id="p-scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect y="3" width="1200" height="1" fill="#00f0ff" fill-opacity="0.022"/>
  </pattern>
  <pattern id="p-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#00f0ff" stroke-width="0.4" stroke-opacity="0.055"/>
  </pattern>
  <filter id="f-title" x="-15%" y="-28%" width="130%" height="156%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b2"/>
    <feMerge>
      <feMergeNode in="b1"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="f-song" x="-25%" y="-45%" width="150%" height="190%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="f-dot" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

