    <line x1="430" y1="570" x2="424" y2="522" stroke="url(#dripFadePurple)"/>
    <line x1="585" y1="560" x2="592" y2="512" stroke="url(#dripFade)"/>
    <line x1="740" y1="575" x2="734" y2="530" stroke="url(#dripFadePurple)"/>
    <line x1="810" y1="555" x2="818" y2="505" stroke="url(#dripFade)"/>
    <line x1="975" y1="570" x2="968" y2="524" stroke="url(#dripFadePurple)"/>
