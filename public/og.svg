<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pinkGlow" cx="15%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="85%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#45f5d0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#45f5d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffe14d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect x="0" y="0" width="8" height="8" fill="none"/>
      <rect x="0" y="0" width="2" height="8" fill="#ff4fd8" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="630" fill="#14101f"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#pinkGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#tealGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#yellowGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>

  <!-- frame -->
  <rect x="0" y="0" width="1200" height="7" fill="#ff4fd8"/>
  <rect x="0" y="623" width="1200" height="7" fill="#45f5d0"/>
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#3a2f57" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- corner glitch bits -->
  <rect x="60" y="70" width="70" height="6" fill="#ff4fd8" opacity="0.55"/>
  <rect x="60" y="82" width="40" height="4" fill="#45f5d0" opacity="0.5"/>
  <rect x="1070" y="540" width="70" height="6" fill="#45f5d0" opacity="0.55"/>
  <rect x="1100" y="552" width="40" height="4" fill="#ffe14d" opacity="0.5"/>

  <!-- eyebrow -->
  <text x="600" y="118" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffe14d" text-anchor="middle" letter-spacing="6" opacity="0.9">本日のBGM再生中</text>

  <!-- glitch title layers -->
  <text x="596" y="298" font-family="sans-serif" font-size="128" font-weight="900" fill="#ff4fd8" text-anchor="middle" opacity="0.55">へのへのんのの</text>
  <text x="604" y="302" font-family="sans-serif" font-size="128" font-weight="900" fill="#45f5d0" text-anchor="middle" opacity="0.5">へのへのんのの</text>
  <text x="600" y="300" font-family="sans-serif" font-size="128" font-weight="900" fill="#f4eefc" text-anchor="middle">へのへのんのの</text>

  <!-- divider -->
  <line x1="470" y1="336" x2="730" y2="336" stroke="#3a2f57" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- track label -->
  <text x="600" y="378" font-family="sans-serif" font-size="19" fill="#cfc3e8" text-anchor="middle" letter-spacing="4">TODAY'S TRACK</text>

  <!-- song title -->
  <text x="600" y="428" font-family="sans-serif" font-size="42" font-weight="700" fill="#ff4fd8" text-anchor="middle">AutoCorrection</text>

  <!-- artist -->
  <text x="600" y="468" font-family="sans-serif" font-size="25" fill="#45f5d0" text-anchor="middle">NonsenseNH feat. 重音テト</text>

  <!-- tags -->
  <text x="600" y="502" font-family="sans-serif" font-size="19" fill="#cfc3e8" text-anchor="middle" opacity="0.85">英語 ・ 重音テトSV2</text>

  <!-- footer mark -->
  <text x="600" y="580" font-family="sans-serif" font-size="16" fill="#3a2f57" text-anchor="middle" letter-spacing="3">henohenononono.blog</text>
</svg>
