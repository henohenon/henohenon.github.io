<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="f-glow-xl" x="-25%" y="-100%" width="150%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="f-glow-md" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="f-glow-sm" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="p-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ff1aaa" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="p-scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="1200" height="1" fill="#000000" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="g-bottom" cx="600" cy="800" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1aaa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff1aaa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-vignette" cx="600" cy="252" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b0012" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#0b0012" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0012" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0012"/>

  <!-- Grid overlay (echoes site-header::before) -->
  <rect width="1200" height="630" fill="url(#p-grid)"/>

  <!-- Bottom atmospheric pink glow (echoes body::after) -->
  <rect width="1200" height="630" fill="url(#g-bottom)"/>

  <!-- Vignette — focus center -->
  <rect width="1200" height="630" fill="url(#g-vignette)"/>

  <!-- Scanlines (echoes body::before) -->
  <rect width="1200" height="630" fill="url(#p-scan)" opacity="0.75"/>

  <!-- Top border (echoes site-header border-bottom) -->
  <rect x="0" y="0" width="1200" height="3" fill="#ff1aaa"/>

  <!-- Bottom border (echoes site-footer border-top) -->
  <rect x="0" y="627" width="1200" height="3" fill="#ff1aaa" fill-opacity="0.35"/>

  <!-- Inner frame (echoes article.post border) -->
  <rect x="30" y="24" width="1140" height="582" fill="none" stroke="#ff1aaa" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- Corner brackets (echoes article.post::before / ::after) -->
  <path d="M 46,44 L 46,108 M 46,44 L 110,44"     stroke="#ff1aaa" stroke-width="2.5" fill="none" stroke-linecap="square"/>
  <path d="M 1154,44 L 1154,108 M 1154,44 L 1090,44" stroke="#ff1aaa" stroke-width="2.5" fill="none" stroke-linecap="square"/>
  <path d="M 46,586 L 46,522 M 46,586 L 110,586"   stroke="#ff1aaa" stroke-width="2.5" fill="none" stroke-linecap="square"/>
  <path d="M 1154,586 L 1154,522 M 1154,586 L 1090,586" stroke="#ff1aaa" stroke-width="2.5" fill="none" stroke-linecap="square"/>

  <!-- Flanking accent lines — left (echoes post-list border-left aesthetic) -->
  <line x1="55" y1="206" x2="178" y2="206" stroke="#ff1aaa" stroke-width="0.6" stroke-opacity="0.30"/>
  <line x1="55" y1="252" x2="148" y2="252" stroke="#ff1aaa" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="55" y1="298" x2="178" y2="298" stroke="#ff1aaa" stroke-width="0.6" stroke-opacity="0.30"/>

  <!-- Flanking accent lines — right -->
  <line x1="1022" y1="206" x2="1145" y2="206" stroke="#ff1aaa" stroke-width="0.6" stroke-opacity="0.30"/>
  <line x1="1052" y1="252" x2="1145" y2="252" stroke="#ff1aaa" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="1022" y1="298" x2="1145" y2="298" stroke="#ff1aaa" stroke-width="0.6" stroke-opacity="0.30"/>

  <!-- ===== SITE NAME ===== -->
  <!-- Chromatic aberration — red shift (CRT glitch) -->
  <text x="597" y="252"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="120" font-weight="900"
    letter-spacing="7"
    fill="#ff2060" fill-opacity="0.20">へのへのんのの</text>
  <!-- Chromatic aberration — cyan shift -->
  <text x="603" y="252"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="120" font-weight="900"
    letter-spacing="7"
    fill="#00ffe4" fill-opacity="0.14">へのへのんのの</text>
  <!-- Outer pink glow -->
  <text x="600" y="252"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="120" font-weight="900"
    letter-spacing="7"
    fill="#ff1aaa" fill-opacity="0.42"
    filter="url(#f-glow-xl)">へのへのんのの</text>
  <!-- Inner pink glow -->
  <text x="600" y="252"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="120" font-weight="900"
    letter-spacing="7"
    fill="#ff1aaa" fill-opacity="0.36"
    filter="url(#f-glow-md)">へのへのんのの</text>
  <!-- Main text -->
  <text x="600" y="252"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="120" font-weight="900"
    letter-spacing="7"
    fill="#f8eeff">へのへのんのの</text>

  <!-- Divider with center diamond (echoes article.post hr::after ◆) -->
  <line x1="200" y1="346" x2="589" y2="346" stroke="#ff1aaa" stroke-width="1" stroke-opacity="0.45"/>
  <polygon points="600,338 609,346 600,354 591,346" fill="#ff1aaa" fill-opacity="0.72"/>
  <line x1="611" y1="346" x2="1000" y2="346" stroke="#ff1aaa" stroke-width="1" stroke-opacity="0.45"/>

  <!-- NOW PLAYING label -->
  <text x="600" y="374"
    text-anchor="middle"
    font-family="monospace" font-size="11"
    letter-spacing="6"
    fill="#ff1aaa" fill-opacity="0.44">NOW PLAYING</text>

  <!-- ===== SONG TITLE (subtitle) ===== -->
  <!-- Glow -->
  <text x="600" y="413"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="38" font-weight="700"
    letter-spacing="4"
    fill="#ff1aaa" fill-opacity="0.52"
    filter="url(#f-glow-sm)">ADDIKT ADDIKT</text>
  <!-- Main -->
  <text x="600" y="413"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="38" font-weight="700"
    letter-spacing="4"
    fill="#ff1aaa">ADDIKT ADDIKT</text>

  <!-- Artist info -->
  <text x="600" y="458"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif" font-size="22"
    letter-spacing="2"
    fill="#f8eeff" fill-opacity="0.50">TONE feat. 鏡音リン</text>

  <!-- Bottom watermark (echoes site-header repeating identity) -->
  <text x="600" y="558"
    text-anchor="middle"
    font-family="monospace" font-size="12"
    letter-spacing="9"
    fill="#f8eeff" fill-opacity="0.14">へのへのんのの</text>

  <!-- Footer accent line (echoes site-footer::before) -->
  <line x1="552" y1="571" x2="648" y2="571" stroke="#ff1aaa" stroke-width="1.5" stroke-opacity="0.38"/>
</svg>
