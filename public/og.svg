<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="-10%" r="85%">
      <stop offset="0%" stop-color="#1f0c0c"/>
      <stop offset="45%" stop-color="#150a0a"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </radialGradient>
    <linearGradient id="dripGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#7a1524"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9e2df"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ff3355" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0a0505"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>

  <!-- glitch diagonal stripes -->
  <g opacity="0.10">
    <rect x="-100" y="120" width="1500" height="18" fill="#ff3355" transform="rotate(-3 600 129)"/>
    <rect x="-100" y="470" width="1500" height="10" fill="#33ffb0" transform="rotate(2 600 475)"/>
    <rect x="-100" y="330" width="1500" height="6" fill="#ff3355" transform="rotate(-1.5 600 333)"/>
  </g>

  <!-- top blood bar -->
  <rect x="0" y="0" width="1200" height="7" fill="#ff3355"/>
  <g>
    <path d="M 70 7 L 70 46 Q 70 60 78 60 Q 86 60 86 46 L 86 7 Z" fill="url(#dripGrad)"/>
    <path d="M 220 7 L 220 30 Q 220 40 227 40 Q 234 40 234 30 L 234 7 Z" fill="url(#dripGrad)" opacity="0.85"/>
    <path d="M 980 7 L 980 34 Q 980 46 988 46 Q 996 46 996 34 L 996 7 Z" fill="url(#dripGrad)" opacity="0.85"/>
    <path d="M 1120 7 L 1120 52 Q 1120 66 1128 66 Q 1136 66 1136 52 L 1136 7 Z" fill="url(#dripGrad)"/>
    <path d="M 500 7 L 500 22 Q 500 30 506 30 Q 512 30 512 22 L 512 7 Z" fill="url(#dripGrad)" opacity="0.7"/>
    <path d="M 830 7 L 830 26 Q 830 36 837 36 Q 844 36 844 26 L 844 7 Z" fill="url(#dripGrad)" opacity="0.7"/>
  </g>

  <!-- frame corners -->
  <g stroke="#7a1524" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 50 90 L 50 60 L 90 60"/>
    <path d="M 1110 90 L 1110 60 L 1070 60"/>
    <path d="M 50 560 L 50 590 L 90 590"/>
    <path d="M 1110 560 L 1110 590 L 1070 590"/>
  </g>

  <!-- fake chat log, left -->
  <g font-family="monospace" font-size="16" fill="#33ffb0" opacity="0.35">
    <text x="60" y="180">&gt; user_92: 見て…画面が…</text>
    <text x="60" y="205">&gt; kanata: これ配信事故?</text>
    <text x="60" y="230">&gt; teto_fan: にげてぇぇ</text>
  </g>
  <g font-family="monospace" font-size="16" fill="#33ffb0" opacity="0.30">
    <text x="720" y="420">&gt; anon: BPM上がってる</text>
    <text x="720" y="445">&gt; 名無し: 心拍と同期してる…</text>
    <text x="720" y="470">&gt; guest01: 今日も生きて帰れ</text>
  </g>

  <!-- eyebrow tag -->
  <text x="600" y="205" text-anchor="middle" font-family="monospace" font-size="24"
        letter-spacing="6" fill="#33ffb0" opacity="0.9">&gt;_ NOW STREAMING</text>

  <!-- glitch title shadows -->
  <text x="606" y="345" text-anchor="middle" font-family="sans-serif" font-weight="900"
        font-size="130" fill="#33ffb0" opacity="0.55">へのへのんのの</text>
  <text x="594" y="335" text-anchor="middle" font-family="sans-serif" font-weight="900"
        font-size="130" fill="#ff3355" opacity="0.55">へのへのんのの</text>

  <!-- main title -->
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-weight="900"
        font-size="130" fill="url(#titleGlow)" letter-spacing="2">へのへのんのの</text>

  <!-- divider -->
  <rect x="500" y="392" width="200" height="4" fill="#ff3355"/>

  <!-- subtitle: song -->
  <text x="600" y="460" text-anchor="middle" font-family="sans-serif" font-weight="700"
        font-size="42" fill="#ff3355">Hey Chat!</text>

  <!-- artist -->
  <text x="600" y="502" text-anchor="middle" font-family="sans-serif" font-size="24"
        fill="#e9e2df" opacity="0.72">Levia, bitbreaker feat. 重音テトSV</text>

  <!-- blinking cursor accent -->
  <rect x="815" y="308" width="16" height="70" fill="#33ffb0" opacity="0.85"/>

  <!-- bottom accent line -->
  <rect x="0" y="623" width="1200" height="7" fill="#7a1524"/>
</svg>
