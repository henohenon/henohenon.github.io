<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rg-ember" cx="0" cy="0" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5a0f14" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-void" cx="1200" cy="630" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0c37" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-moon" cx="920" cy="108" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8b8a8" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#c8b8a8" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf5050" stop-opacity="0"/>
      <stop offset="18%" stop-color="#cf5050" stop-opacity="0.62"/>
      <stop offset="82%" stop-color="#cf5050" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#cf5050" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lg-accent-mid" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf5050" stop-opacity="0"/>
      <stop offset="28%" stop-color="#cf5050" stop-opacity="0.28"/>
      <stop offset="72%" stop-color="#cf5050" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#cf5050" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-title" x="-6%" y="-25%" width="112%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feFlood flood-color="#cf5050" flood-opacity="0.3" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="f-song" x="-12%" y="-50%" width="124%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#cf5050" flood-opacity="0.42" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0d0c14"/>
  <rect width="1200" height="630" fill="url(#rg-ember)"/>
  <rect width="1200" height="630" fill="url(#rg-void)"/>
  <rect width="1200" height="630" fill="url(#rg-moon)"/>

  <!-- shadow streaks — diagonal parallelograms, very faint -->
  <g fill="#070610" opacity="0.55">
    <polygon points="80,0 195,0 430,630 315,630"/>
    <polygon points="530,0 590,0 790,630 730,630"/>
    <polygon points="910,0 958,0 1110,630 1062,630"/>
  </g>

  <!-- faint moon circle suggestion -->
  <circle cx="920" cy="108" r="52" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.07"/>
  <circle cx="920" cy="108" r="44" fill="none" stroke="#ddd5c8" stroke-width="0.5" opacity="0.04"/>

  <!-- frame: top accent line -->
  <rect x="0" y="90" width="1200" height="1" fill="url(#lg-accent)"/>
  <!-- frame: bottom accent line -->
  <rect x="0" y="540" width="1200" height="1" fill="url(#lg-accent)"/>

  <!-- corner brackets -->
  <rect x="54" y="54" width="52" height="1.5" fill="#cf5050" opacity="0.48"/>
  <rect x="54" y="54" width="1.5" height="38" fill="#cf5050" opacity="0.48"/>
  <rect x="1094" y="54" width="52" height="1.5" fill="#cf5050" opacity="0.48"/>
  <rect x="1144.5" y="54" width="1.5" height="38" fill="#cf5050" opacity="0.48"/>
  <rect x="54" y="576" width="52" height="1.5" fill="#cf5050" opacity="0.48"/>
  <rect x="54" y="539" width="1.5" height="38" fill="#cf5050" opacity="0.48"/>
  <rect x="1094" y="576" width="52" height="1.5" fill="#cf5050" opacity="0.48"/>
  <rect x="1144.5" y="539" width="1.5" height="38" fill="#cf5050" opacity="0.48"/>

  <!-- site title — main hero -->
  <text
    x="600" y="275"
    font-family="serif"
    font-size="116"
    font-weight="normal"
    fill="#ddd5c8"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="7"
    filter="url(#f-title)"
  >へのへのんのの</text>

  <!-- divider under title -->
  <rect x="180" y="358" width="840" height="1" fill="url(#lg-accent-mid)"/>

  <!-- "TODAY'S SONG" caption -->
  <text
    x="600" y="388"
    font-family="sans-serif"
    font-size="11"
    fill="#524a44"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="5"
  >TODAY'S SONG</text>

  <!-- song title -->
  <text
    x="600" y="432"
    font-family="serif"
    font-size="38"
    font-style="italic"
    fill="#cf5050"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="2"
    filter="url(#f-song)"
  >Chasing Shadows</text>

  <!-- artist name -->
  <text
    x="600" y="480"
    font-family="sans-serif"
    font-size="18"
    fill="#7a7068"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="0.5"
  >bitbreaker feat. Synthesizer V 2 AI Megpoid</text>
</svg>
