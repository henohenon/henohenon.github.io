<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowMagenta" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ff3df0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3df0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#36e3ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#36e3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffd84d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="40%" stop-color="#c8b8ff"/>
      <stop offset="100%" stop-color="#1a0f3d"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3df0"/>
      <stop offset="50%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#36e3ff"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0726" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff3df0" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="diag" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0726"/>
  <rect width="1200" height="630" fill="url(#diag)"/>
  <rect width="1200" height="630" fill="url(#glowMagenta)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Dance floor checker (bottom) -->
  <g opacity="0.35">
    <polygon points="0,630 1200,630 900,470 300,470" fill="url(#floorGrad)"/>
    <g stroke="#ff3df0" stroke-opacity="0.45" stroke-width="1">
      <line x1="300" y1="470" x2="0" y2="630"/>
      <line x1="400" y1="470" x2="200" y2="630"/>
      <line x1="500" y1="470" x2="400" y2="630"/>
      <line x1="600" y1="470" x2="600" y2="630"/>
      <line x1="700" y1="470" x2="800" y2="630"/>
      <line x1="800" y1="470" x2="1000" y2="630"/>
      <line x1="900" y1="470" x2="1200" y2="630"/>
    </g>
    <g stroke="#36e3ff" stroke-opacity="0.45" stroke-width="1">
      <line x1="300" y1="470" x2="900" y2="470"/>
      <line x1="270" y1="490" x2="930" y2="490"/>
      <line x1="230" y1="515" x2="970" y2="515"/>
      <line x1="180" y1="545" x2="1020" y2="545"/>
      <line x1="120" y1="580" x2="1080" y2="580"/>
      <line x1="40" y1="618" x2="1160" y2="618"/>
    </g>
  </g>

  <!-- Light beams from mirror ball -->
  <g opacity="0.35" stroke-linecap="round">
    <line x1="980" y1="160" x2="120" y2="540" stroke="#ff3df0" stroke-width="3"/>
    <line x1="980" y1="160" x2="40" y2="380" stroke="#36e3ff" stroke-width="2"/>
    <line x1="980" y1="160" x2="1180" y2="560" stroke="#ffd84d" stroke-width="2"/>
    <line x1="980" y1="160" x2="700" y2="620" stroke="#ff3df0" stroke-width="2"/>
    <line x1="980" y1="160" x2="320" y2="620" stroke="#36e3ff" stroke-width="3"/>
  </g>

  <!-- Mirror ball -->
  <g>
    <line x1="980" y1="40" x2="980" y2="105" stroke="#c8b8ff" stroke-width="2"/>
    <circle cx="980" cy="160" r="56" fill="url(#ball)" stroke="#ff3df0" stroke-opacity="0.6" stroke-width="1.5"/>
    <g stroke="#fdf4ff" stroke-opacity="0.25" stroke-width="1" fill="none">
      <ellipse cx="980" cy="160" rx="56" ry="18"/>
      <ellipse cx="980" cy="160" rx="56" ry="36"/>
      <line x1="924" y1="160" x2="1036" y2="160"/>
      <line x1="980" y1="104" x2="980" y2="216"/>
    </g>
    <g fill="#fdf4ff" opacity="0.85">
      <circle cx="958" cy="138" r="3"/>
      <circle cx="996" cy="148" r="2.5"/>
      <circle cx="972" cy="170" r="2"/>
      <circle cx="1004" cy="178" r="3"/>
      <circle cx="965" cy="190" r="2.5"/>
    </g>
  </g>

  <!-- Stars / sparkles -->
  <g fill="#ffd84d">
    <polygon points="120,100 126,114 140,116 130,126 132,140 120,134 108,140 110,126 100,116 114,114"/>
    <polygon points="1100,420 1104,430 1114,432 1106,438 1108,448 1100,444 1092,448 1094,438 1086,432 1096,430"/>
  </g>
  <g fill="#36e3ff" opacity="0.8">
    <circle cx="200" cy="220" r="2.5"/>
    <circle cx="340" cy="80" r="2"/>
    <circle cx="540" cy="120" r="3"/>
    <circle cx="780" cy="80" r="2"/>
    <circle cx="1130" cy="220" r="2.5"/>
    <circle cx="80" cy="380" r="2"/>
  </g>

  <!-- Site name top-left -->
  <g font-family="sans-serif">
    <rect x="60" y="58" width="14" height="14" fill="#ff3df0"/>
    <rect x="78" y="58" width="14" height="14" fill="#36e3ff"/>
    <rect x="96" y="58" width="14" height="14" fill="#ffd84d"/>
    <text x="60" y="105" fill="#fdf4ff" font-size="26" font-weight="700" letter-spacing="3">へのへのんのの</text>
  </g>

  <!-- Badge: tonight's track -->
  <g font-family="sans-serif">
    <rect x="60" y="245" width="180" height="32" rx="16" fill="#1a0f3d" stroke="#ffd84d" stroke-opacity="0.6"/>
    <text x="150" y="266" fill="#ffd84d" font-size="14" letter-spacing="4" text-anchor="middle" font-weight="700">★ TONIGHT&apos;S TRACK ★</text>
  </g>

  <!-- Main title -->
  <g font-family="sans-serif" font-weight="900">
    <text x="60" y="360" fill="url(#titleGrad)" font-size="92" letter-spacing="2">FANTASY</text>
    <text x="60" y="455" fill="url(#titleGrad)" font-size="92" letter-spacing="2">★DiSCO NIGHT</text>
    <!-- subtle outline glow -->
    <text x="60" y="360" fill="none" stroke="#ff3df0" stroke-opacity="0.25" stroke-width="1" font-size="92" letter-spacing="2">FANTASY</text>
    <text x="60" y="455" fill="none" stroke="#36e3ff" stroke-opacity="0.25" stroke-width="1" font-size="92" letter-spacing="2">★DiSCO NIGHT</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="495" x2="700" y2="495" stroke="#ff3df0" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- Artist -->
  <g font-family="sans-serif">
    <text x="60" y="535" fill="#c8b8ff" font-size="22" letter-spacing="2">by</text>
    <text x="100" y="535" fill="#36e3ff" font-size="24" letter-spacing="2" font-weight="700">SAWTOWNE</text>
    <text x="290" y="535" fill="#c8b8ff" font-size="22" letter-spacing="2">feat.</text>
    <text x="358" y="535" fill="#ff3df0" font-size="24" letter-spacing="2" font-weight="700">初音ミク</text>
  </g>

  <!-- Bottom tag -->
  <g font-family="monospace">
    <text x="60" y="585" fill="#fdf4ff" opacity="0.5" font-size="14" letter-spacing="4">// midnight.disco — neon &amp; mirror ball</text>
  </g>

  <!-- corner accent -->
  <g opacity="0.7">
    <rect x="1100" y="560" width="40" height="4" fill="#ff3df0"/>
    <rect x="1100" y="570" width="60" height="4" fill="#36e3ff"/>
    <rect x="1100" y="580" width="80" height="4" fill="#ffd84d"/>
  </g>
</svg>
