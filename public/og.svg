  </defs>

  <!-- base background -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffe3ec"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowA)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowB)"/>

  <!-- top bitten-ribbon band -->
  <path d="M0,0 L1200,0 L1200,86 L1125,74 L1050,86 L975,74 L900,86 L825,74 L750,86 L675,74 L600,86 L525,74 L450,86 L375,74 L300,86 L225,74 L150,86 L75,74 L0,86 Z"
        fill="url(#bandGrad)" stroke="#e0114a" stroke-width="3" stroke-linejoin="round"/>

  <!-- small blood drips from the ribbon teeth -->
  <path d="M146,74 L154,74 Q155,89 150,100 Q145,89 146,74 Z" fill="#e0114a" opacity="0.85"/>
  <path d="M446,74 L454,74 Q455,92 450,105 Q445,92 446,74 Z" fill="#e0114a" opacity="0.85"/>
  <path d="M746,74 L754,74 Q755,88 750,98 Q745,88 746,74 Z" fill="#e0114a" opacity="0.85"/>
  <path d="M1046,74 L1054,74 Q1055,91 1050,103 Q1045,91 1046,74 Z" fill="#e0114a" opacity="0.85"/>

  <!-- bottom bitten band (footer echo) -->
  <path d="M0,630 L1200,630 L1200,544 L1125,556 L1050,544 L975,556 L900,544 L825,556 L750,544 L675,556 L600,544 L525,556 L450,544 L375,556 L300,544 L225,556 L150,544 L75,556 L0,544 Z"
        fill="#7a0f1f" stroke="#ff8fab" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- watching eyes -->
  <circle cx="108" cy="150" r="6" fill="#e0114a"/>
  <circle cx="110" cy="148" r="1.6" fill="#ffe3ec"/>
  <circle cx="1092" cy="150" r="6" fill="#e0114a"/>
  <circle cx="1094" cy="148" r="1.6" fill="#ffe3ec"/>
  <circle cx="108" cy="500" r="6" fill="#e0114a"/>
  <circle cx="110" cy="498" r="1.6" fill="#ffe3ec"/>
  <circle cx="1092" cy="500" r="6" fill="#e0114a"/>
  <circle cx="1094" cy="498" r="1.6" fill="#ffe3ec"/>

  <!-- heart backdrop, bitten -->
  <path d="M 600,200 C 600,145 545,90 475,90 C 395,90 350,145 350,200 C 350,270 440,340 600,430 C 760,340 850,270 850,200 C 850,145 805,90 725,90 C 655,90 600,145 600,200 Z"
        fill="#ff8fab" opacity="0.55"/>

  <!-- fang notch at heart's crown -->
  <path d="M585,92 L600,140 L596,92 Z" fill="#3a0d16" opacity="0.8"/>
  <path d="M615,92 L600,140 L604,92 Z" fill="#3a0d16" opacity="0.8"/>

  <!-- bite taken out of the heart -->
  <circle cx="790" cy="150" r="55" fill="#ffe3ec"/>
  <path d="M742,168 L742,188 L724,178 Z" fill="#ffe3ec"/>
  <path d="M735,140 L735,160 L715,150 Z" fill="#ffe3ec"/>
  <path d="M742,112 L742,132 L724,122 Z" fill="#ffe3ec"/>

  <!-- drips from the bite -->
  <path d="M766,204 L774,204 Q775,218 770,230 Q765,218 766,204 Z" fill="#e0114a" opacity="0.85"/>
  <path d="M796,200 L804,200 Q805,212 800,222 Q795,212 796,200 Z" fill="#e0114a" opacity="0.85"/>

  <!-- kicker -->
  <text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700"
        letter-spacing="5" fill="#ff8fab">TODAY&#8217;S OBSESSION</text>

  <!-- site name (hero), shadow + main -->
  <text x="604" y="292" text-anchor="middle" font-family="sans-serif" font-size="128" font-weight="900"
        fill="#7a0f1f" opacity="0.35">へのへのんのの</text>
  <text x="600" y="286" text-anchor="middle" font-family="sans-serif" font-size="128" font-weight="900"
        fill="#3a0d16" letter-spacing="4">へのへのんのの</text>

  <!-- song title subtitle -->
  <text x="600" y="486" text-anchor="middle" font-family="sans-serif" font-size="38" font-style="italic" font-weight="700"
        fill="#e0114a" letter-spacing="1">Teeth Mark Love</text>

  <!-- artist -->
  <text x="600" y="524" text-anchor="middle" font-family="sans-serif" font-size="21"
        fill="#7a0f1f" opacity="0.8">Mayonazy feat. Synthesizer V AI Megpoid</text>
</svg>
