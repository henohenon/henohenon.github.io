<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <linearGradient id="g-title" gradientUnits="userSpaceOnUse"
                  x1="155" y1="265" x2="1045" y2="265">
    <stop offset="25%" stop-color="#c8dde8"/>
    <stop offset="90%" stop-color="#00c0d8"/>
  </linearGradient>

  <radialGradient id="g-sea" gradientUnits="userSpaceOnUse"
                  cx="600" cy="693" r="780">
    <stop offset="0%"   stop-color="#006e9b" stop-opacity="0.22"/>
    <stop offset="65%"  stop-color="#006e9b" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="g-tl" gradientUnits="userSpaceOnUse"
                  cx="180" cy="95" r="370">
    <stop offset="0%"   stop-color="#003755" stop-opacity="0.14"/>
    <stop offset="55%"  stop-color="#003755" stop-opacity="0"/>
    <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="g-mid" gradientUnits="userSpaceOnUse"
                  cx="600" cy="265" r="360">
    <stop offset="0%"   stop-color="#00c0d8" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="g-hline" gradientUnits="userSpaceOnUse"
                  x1="0" y1="0" x2="1200" y2="0">
    <stop offset="0%"   stop-color="#00c0d8" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#00c0d8" stop-opacity="0.55"/>
    <stop offset="50%"  stop-color="#00c0d8" stop-opacity="1"/>
    <stop offset="80%"  stop-color="#00c0d8" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#00c0d8" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="g-sep" gradientUnits="userSpaceOnUse"
                  x1="200" y1="0" x2="1000" y2="0">
    <stop offset="0%"   stop-color="#00c0d8" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#00c0d8" stop-opacity="0.45"/>
    <stop offset="50%"  stop-color="#00c0d8" stop-opacity="0.80"/>
    <stop offset="80%"  stop-color="#00c0d8" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#00c0d8" stop-opacity="0"/>
  </linearGradient>

  <pattern id="p-rain" x="0" y="0" width="73" height="630" patternUnits="userSpaceOnUse">
    <rect x="72" y="0" width="1" height="630" fill="#00c0d8" fill-opacity="0.025"/>
  </pattern>

  <filter id="f-title" x="-6%" y="-28%" width="112%" height="156%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="f-accent" x="-4%" y="-32%" width="108%" height="164%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#090d1a"/>
<rect width="1200" height="630" fill="url(#g-sea)"/>
<rect width="1200" height="630" fill="url(#g-tl)"/>
<rect width="1200" height="630" fill="url(#g-mid)"/>
<rect width="1200" height="630" fill="url(#p-rain)"/>

<!-- ── Frame ── -->
<rect x="24" y="24" width="1152" height="582" rx="2"
      fill="none" stroke="#00c0d8" stroke-opacity="0.09" stroke-width="1"/>

<!-- Corner brackets -->
<polyline points="24,72 24,24 72,24"
          fill="none" stroke="#00c0d8" stroke-opacity="0.45" stroke-width="1.5"/>
<polyline points="1128,24 1176,24 1176,72"
          fill="none" stroke="#00c0d8" stroke-opacity="0.45" stroke-width="1.5"/>
<polyline points="24,558 24,606 72,606"
          fill="none" stroke="#00c0d8" stroke-opacity="0.30" stroke-width="1.5"/>
<polyline points="1128,606 1176,606 1176,558"
          fill="none" stroke="#00c0d8" stroke-opacity="0.30" stroke-width="1.5"/>

<!-- ── Tide sweep line ── -->
<rect x="0" y="574" width="1200" height="1.5" fill="url(#g-hline)"/>

<!-- ── Wave / flood bottom ── -->
<path d="M-60 596 Q80 582 240 596 Q400 610 560 596
         Q720 582 880 596 Q1040 610 1200 596 L1260 598 L1260 630 L-60 630Z"
      fill="#0d1220" opacity="0.75"/>
<path d="M-60 610 Q180 596 400 610 Q620 624 840 610
         Q1060 596 1260 610 L1260 630 L-60 630Z"
      fill="#090d1a"/>

<!-- ── Ripple rings (Kreislauf) ── -->
<ellipse cx="600" cy="638" rx="260" ry="30"
         fill="none" stroke="#00c0d8" stroke-opacity="0.14" stroke-width="1"/>
<ellipse cx="600" cy="650" rx="460" ry="54"
         fill="none" stroke="#00c0d8" stroke-opacity="0.08" stroke-width="1"/>
<ellipse cx="600" cy="665" rx="700" ry="82"
         fill="none" stroke="#00c0d8" stroke-opacity="0.04" stroke-width="1"/>

<!-- ── Rain / seafoam particles (bottom) ── -->
<circle cx="115"  cy="490" r="1.5" fill="#00c0d8" fill-opacity="0.18"/>
<circle cx="190"  cy="528" r="1"   fill="#00c0d8" fill-opacity="0.14"/>
<circle cx="262"  cy="505" r="2"   fill="#00c0d8" fill-opacity="0.10"/>
<circle cx="356"  cy="518" r="1"   fill="#00c0d8" fill-opacity="0.12"/>
<circle cx="850"  cy="492" r="1.5" fill="#00c0d8" fill-opacity="0.18"/>
<circle cx="960"  cy="522" r="1"   fill="#00c0d8" fill-opacity="0.14"/>
<circle cx="1042" cy="504" r="2"   fill="#00c0d8" fill-opacity="0.10"/>
<circle cx="1092" cy="516" r="1"   fill="#00c0d8" fill-opacity="0.12"/>

<!-- ── Distant rain drops (upper) ── -->
<circle cx="90"   cy="120" r="1"   fill="#00c0d8" fill-opacity="0.08"/>
<circle cx="158"  cy="78"  r="1.5" fill="#00c0d8" fill-opacity="0.06"/>
<circle cx="420"  cy="90"  r="1"   fill="#00c0d8" fill-opacity="0.05"/>
<circle cx="780"  cy="72"  r="1"   fill="#00c0d8" fill-opacity="0.05"/>
<circle cx="1110" cy="98"  r="1"   fill="#00c0d8" fill-opacity="0.08"/>
<circle cx="1050" cy="144" r="1.5" fill="#00c0d8" fill-opacity="0.06"/>

<!-- ══════════ MAIN TITLE — hero ══════════ -->
<text x="600" y="265"
      text-anchor="middle" dominant-baseline="middle"
      font-family="sans-serif"
      font-size="124" font-weight="bold"
      fill="url(#g-title)"
      filter="url(#f-title)"
      letter-spacing="7">へのへのんのの</text>

<!-- Lichtblick separator -->
<rect x="200" y="328" width="800" height="1" fill="url(#g-sep)" opacity="0.45"/>

<!-- ══════════ SUBTITLE — today's song ══════════ -->
<text x="600" y="372"
      text-anchor="middle" dominant-baseline="middle"
      font-family="sans-serif"
      font-size="33" fill="#00c0d8" fill-opacity="0.90"
      filter="url(#f-accent)"
      letter-spacing="1.5">selfish you / suzie feat. 鏡音リン</text>

<!-- ══════════ DATE label ══════════ -->
<text x="600" y="428"
      text-anchor="middle" dominant-baseline="middle"
      font-family="sans-serif"
      font-size="14" fill="#7faab8" fill-opacity="0.60"
      letter-spacing="4">today's theme  ◇  2026.07.08</text>

</svg>
