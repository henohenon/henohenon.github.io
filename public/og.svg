  <circle cx="698"  cy="578" r="0.7" fill="#b0b9ff" fill-opacity="0.20"/>
  <circle cx="852"  cy="598" r="1.0" fill="#8b96ff" fill-opacity="0.25"/>
  <circle cx="1002" cy="568" r="1.2" fill="#cdd1e5" fill-opacity="0.18"/>

  <!-- outer frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#8b96ff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- corner brackets -->
  <path d="M40 62 L40 40 L82 40"        fill="none" stroke="#8b96ff" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1160 62 L1160 40 L1118 40"   fill="none" stroke="#8b96ff" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 568 L40 590 L82 590"      fill="none" stroke="#8b96ff" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
