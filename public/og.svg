<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scan" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="2" height="1" fill="rgba(0,0,0,0.20)"/>
    </pattern>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a0f28"/>
      <stop offset="35%"  stop-color="#e05275"/>
      <stop offset="60%"  stop-color="#f07090"/>
      <stop offset="100%" stop-color="#7a0f28"/>
    </linearGradient>
    <linearGradient id="sep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0c0a0d"/>
      <stop offset="20%"  stop-color="#7a0f28"/>
      <stop offset="50%"  stop-color="#e05275"/>
      <stop offset="80%"  stop-color="#7a0f28"/>
      <stop offset="100%" stop-color="#0c0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="46%">
      <stop offset="0%"   stop-color="#1e1822" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#0c0a0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e05275"/>
      <stop offset="50%"  stop-color="#7a0f28"/>
      <stop offset="100%" stop-color="#e05275"/>
    </linearGradient>
  </defs>

  <!-- BG base -->
  <rect width="1200" height="630" fill="#0c0a0d"/>
  <!-- Center glow lift -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Concentric circles — cult eye motif -->
  <circle cx="600" cy="278" r="352" fill="none" stroke="#2c2830" stroke-width="1"   opacity="0.22"/>
  <circle cx="600" cy="278" r="276" fill="none" stroke="#2c2830" stroke-width="0.7" opacity="0.18"/>
  <circle cx="600" cy="278" r="200" fill="none" stroke="#7a0f28" stroke-width="0.5" opacity="0.14"/>
  <circle cx="600" cy="278" r="124" fill="none" stroke="#7a0f28" stroke-width="0.4" opacity="0.10"/>

  <!-- Inverted triangle — occult symbol -->
  <polygon points="600,66 1014,530 186,530"
           fill="none" stroke="#7a0f28" stroke-width="0.8" opacity="0.10"/>

  <!-- Crosshairs -->
  <line x1="0"   y1="278" x2="1200" y2="278" stroke="#2c2830" stroke-width="0.5" opacity="0.28"/>
  <line x1="600" y1="0"   x2="600"  y2="630" stroke="#2c2830" stroke-width="0.5" opacity="0.20"/>

  <!-- Scanlines -->
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Surface panel behind site name -->
  <rect x="0" y="192" width="1200" height="130" fill="#141118" opacity="0.42"/>

  <!-- Top / bottom burn lines -->
  <rect x="0" y="0"   width="1200" height="3" fill="url(#ember)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#ember)"/>

  <!-- Side bars -->
  <rect x="0"    y="0" width="4" height="630" fill="url(#sidebar)"/>
  <rect x="1196" y="0" width="4" height="630" fill="#7a0f28" opacity="0.45"/>

  <!-- Corner cross markers -->
  <line x1="34"   y1="20"  x2="34"   y2="55"  stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="20"   y1="37"  x2="55"   y2="37"  stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="1166" y1="20"  x2="1166" y2="55"  stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="1148" y1="37"  x2="1180" y2="37"  stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="34"   y1="575" x2="34"   y2="610" stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="20"   y1="593" x2="55"   y2="593" stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="1166" y1="575" x2="1166" y2="610" stroke="#e05275" stroke-width="1" opacity="0.55"/>
  <line x1="1148" y1="593" x2="1180" y2="593" stroke="#e05275" stroke-width="1" opacity="0.55"/>

  <!-- Site name — glitch ghost: cyan -->
  <text x="604" y="282" text-anchor="middle"
        font-family="sans-serif" font-size="112" font-weight="bold"
        fill="rgba(80,200,220,0.22)" letter-spacing="6">へのへのんのの</text>
  <!-- Site name — glitch ghost: crimson -->
  <text x="596" y="284" text-anchor="middle"
        font-family="sans-serif" font-size="112" font-weight="bold"
        fill="rgba(224,82,117,0.26)" letter-spacing="6">へのへのんのの</text>

  <!-- Site name — main -->
  <text x="600" y="280" text-anchor="middle"
        font-family="sans-serif" font-size="112" font-weight="bold"
        fill="#dcd8da" letter-spacing="6">へのへのんのの</text>

  <!-- Ember separator -->
  <rect x="252" y="328" width="696" height="1.5" fill="url(#sep)"/>
  <circle cx="252" cy="328.75" r="2.2" fill="#7a0f28"/>
  <circle cx="948" cy="328.75" r="2.2" fill="#7a0f28"/>

  <!-- TODAY'S SONG label -->
  <text x="600" y="364" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#7a7278" letter-spacing="8">TODAY'S SONG</text>

  <!-- Flanking rule lines for song title -->
  <line x1="444" y1="400" x2="494" y2="400" stroke="#7a0f28" stroke-width="1.5" opacity="0.80"/>
  <line x1="706" y1="400" x2="756" y2="400" stroke="#7a0f28" stroke-width="1.5" opacity="0.80"/>

  <!-- Song title -->
  <text x="600" y="414" text-anchor="middle"
        font-family="sans-serif" font-size="44" font-weight="bold"
        fill="#e05275" letter-spacing="14">カルト</text>

  <!-- Artist name -->
  <text x="600" y="457" text-anchor="middle"
        font-family="sans-serif" font-size="17" fill="#7a7278" letter-spacing="3">ぴーなた feat. 重音テト</text>

  <!-- Date watermark -->
  <text x="600" y="576" text-anchor="middle"
        font-family="monospace" font-size="11" fill="#7a7278" letter-spacing="6" opacity="0.44">2026.06.24</text>
</svg>
