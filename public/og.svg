<path d="M1052,630 C1062,610 1070,592 1064,574 C1060,560 1053,568 1051,556 C1049,568 1042,560 1038,574 C1032,592 1040,610 1052,630Z" fill="#f5a800" opacity="0.14"/>

<!-- ember sparks -->
<circle cx="471"  cy="120" r="2.5" fill="#f5a800" opacity="0.55"/>
<circle cx="716"  cy="84"  r="2"   fill="#ff6018" opacity="0.42"/>
<circle cx="305"  cy="196" r="3"   fill="#f5a800" opacity="0.30"/>
<circle cx="887"  cy="162" r="2"   fill="#f5a800" opacity="0.36"/>
<circle cx="140"  cy="272" r="2"   fill="#ff6018" opacity="0.26"/>
<circle cx="1063" cy="291" r="2.5" fill="#f5a800" opacity="0.30"/>
<circle cx="924"  cy="416" r="2"   fill="#ff6018" opacity="0.18"/>
<circle cx="270"  cy="390" r="1.5" fill="#f5a800" opacity="0.24"/>
<circle cx="600"  cy="72"  r="2"   fill="#ff6018" opacity="0.35"/>
<circle cx="88"   cy="145" r="1.5" fill="#f5a800" opacity="0.18"/>
