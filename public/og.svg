  x="600" y="446"
  text-anchor="middle"
  font-family="sans-serif"
  font-size="24"
  fill="#d94070"
  letter-spacing="2"
  filter="url(#f-pink)">Mwk feat. 巡音ルカ</text>

<!-- tagline -->
<text
  x="600" y="496"
  text-anchor="middle"
  font-family="sans-serif"
