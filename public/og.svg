<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#f2c230" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#f2c230" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="55%" r="75%">
      <stop offset="60%" stop-color="#0a0d1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="stripes" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect x="0" y="0" width="18" height="36" fill="#f2c230" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0a0d1a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#stripes)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- outer double frame -->
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#a68a2a" stroke-width="2" opacity="0.6"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#a68a2a" stroke-width="1" opacity="0.4"/>

  <!-- top / bottom double rules echoing site-header -->
  <line x1="90" y1="58" x2="1110" y2="58" stroke="#a68a2a" stroke-width="3" opacity="0.7"/>
  <line x1="90" y1="66" x2="1110" y2="66" stroke="#a68a2a" stroke-width="1" opacity="0.45"/>
  <line x1="90" y1="572" x2="1110" y2="572" stroke="#a68a2a" stroke-width="1" opacity="0.45"/>
  <line x1="90" y1="580" x2="1110" y2="580" stroke="#a68a2a" stroke-width="3" opacity="0.7"/>

  <!-- small scales-of-justice motif, top right, subdued -->
  <g stroke="#a68a2a" stroke-width="2" fill="none" opacity="0.5">
    <line x1="1082" y1="72" x2="1082" y2="128"/>
    <line x1="1040" y1="82" x2="1124" y2="82"/>
    <line x1="1040" y1="82" x2="1030" y2="112"/>
    <line x1="1124" y1="82" x2="1134" y2="112"/>
    <ellipse cx="1030" cy="114" rx="14" ry="5"/>
    <ellipse cx="1134" cy="114" rx="14" ry="5"/>
    <path d="M 1062 128 L 1102 128 L 1092 140 L 1072 140 Z"/>
  </g>

  <!-- verdict kicker -->
  <text x="600" y="112" text-anchor="middle" font-family="serif" font-size="22"
        letter-spacing="14" fill="#c23a3a" opacity="0.8">V E R D I C T</text>

  <!-- gavel-drop accent dot -->
  <circle cx="430" cy="188" r="8" fill="#c23a3a" opacity="0.85"/>

  <!-- site name : the star of the card -->
  <text x="600" y="300" text-anchor="middle" font-family="serif" font-size="128"
        letter-spacing="2" fill="#e9e6da">へのへのんのの</text>

  <!-- divider -->
  <line x1="430" y1="352" x2="770" y2="352" stroke="#a68a2a" stroke-width="1" opacity="0.6"/>

  <!-- subtitle label -->
  <text x="600" y="420" text-anchor="middle" font-family="sans-serif" font-size="20"
        letter-spacing="6" fill="#b9b6a8" opacity="0.85">TODAY&#8217;S SONG</text>

  <!-- song title, subordinate to site name -->
  <g>
    <rect x="380" y="440" width="2" height="56" fill="#c23a3a" opacity="0.8"/>
    <text x="600" y="484" text-anchor="middle" font-family="serif" font-size="40"
          fill="#f2c230" font-style="italic">GUILTY</text>
  </g>

  <!-- artist, smallest tier -->
  <text x="600" y="524" text-anchor="middle" font-family="sans-serif" font-size="24"
        fill="#d8d4c4" opacity="0.85">Mage-P feat. 奕夕</text>
</svg>
