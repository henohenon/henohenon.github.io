<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowA" cx="12%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#e0114a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e0114a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#e0114a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#e0114a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1dd"/>
      <stop offset="100%" stop-color="#ffe3ec"/>
