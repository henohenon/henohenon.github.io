  <text x="597" y="308" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="118" letter-spacing="4" fill="#ff7fb0" opacity="0.4">へのへのんのの</text>
  <text x="600" y="310" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="118" letter-spacing="4" fill="#ece6f7">へのへのんのの</text>
  <rect x="905" y="268" width="16" height="58" fill="#ff7fb0" opacity="0.85"/>

  <line x1="510" y1="352" x2="690" y2="352" stroke="#ff7fb0" stroke-width="2" opacity="0.7"/>

