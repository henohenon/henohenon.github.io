<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8be9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#ffb6e6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb6e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#5a4fcf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a4fcf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef0ff"/>
      <stop offset="40%" stop-color="#8be9ff"/>
      <stop offset="70%" stop-color="#ffb6e6"/>
      <stop offset="100%" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="hr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb6e6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8be9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 夜空ベース -->
  <rect width="1200" height="630" fill="#0e1430"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 星の点描 -->
  <g fill="#ffffff">
    <circle cx="156" cy="138" r="1.4" opacity="0.9"/>
    <circle cx="804" cy="258" r="1.2" opacity="0.75"/>
    <circle cx="396" cy="491" r="1.6" opacity="0.85"/>
    <circle cx="1056" cy="94" r="1.2" opacity="0.7"/>
    <circle cx="600" cy="560" r="1.3" opacity="0.85"/>
    <circle cx="96" cy="378" r="1.4" opacity="0.7"/>
    <circle cx="900" cy="410" r="1.2" opacity="0.65"/>
    <circle cx="248" cy="72" r="1" opacity="0.6"/>
    <circle cx="720" cy="120" r="1.1" opacity="0.7"/>
    <circle cx="1140" cy="320" r="1.3" opacity="0.75"/>
    <circle cx="520" cy="60" r="1" opacity="0.6"/>
    <circle cx="68" cy="540" r="1.1" opacity="0.7"/>
    <circle cx="1100" cy="540" r="1.2" opacity="0.75"/>
    <circle cx="340" cy="240" r="1" opacity="0.55"/>
    <circle cx="980" cy="180" r="1.1" opacity="0.7"/>
  </g>
  <g fill="#8be9ff">
    <circle cx="180" cy="430" r="1.5" opacity="0.85"/>
    <circle cx="1010" cy="495" r="1.4" opacity="0.8"/>
    <circle cx="780" cy="80" r="1.3" opacity="0.75"/>
    <circle cx="60" cy="220" r="1.3" opacity="0.7"/>
    <circle cx="460" cy="540" r="1.2" opacity="0.75"/>
  </g>
  <g fill="#ffb6e6">
    <circle cx="930" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="260" cy="320" r="1.2" opacity="0.7"/>
    <circle cx="640" cy="430" r="1.3" opacity="0.75"/>
  </g>

  <!-- 散らばる断片 (フラグメ) -->
  <g opacity="0.55" stroke="#8be9ff" stroke-width="1" fill="none">
    <polygon points="100,180 142,166 158,210 118,224"/>
    <polygon points="1040,160 1090,148 1112,196 1058,210"/>
    <polygon points="160,500 200,485 218,520 178,538"/>
    <polygon points="1000,470 1054,458 1078,500 1024,512"/>
  </g>
  <g opacity="0.4" stroke="#ffb6e6" stroke-width="1" fill="none">
    <polygon points="90,340 138,328 148,366 102,378"/>
    <polygon points="1080,360 1124,348 1138,392 1090,402"/>
    <polygon points="240,90 282,80 294,118 250,128"/>
  </g>

  <!-- 中心ぼんやり光 -->
  <ellipse cx="600" cy="295" rx="380" ry="80" fill="#5a4fcf" opacity="0.18" filter="url(#soft)"/>

  <!-- 上部の薄い罫線 -->
  <rect x="180" y="118" width="840" height="1" fill="url(#hr)" opacity="0.7"/>

  <!-- メタ: サイトラベル -->
  <text x="600" y="158" font-family="serif" font-size="20" fill="#b8bfe2" text-anchor="middle" letter-spacing="8" font-style="italic">— a small night journal —</text>

  <!-- 主役: サイト名 -->
  <text x="600" y="320" font-family="serif" font-size="124" fill="url(#shimmer)" text-anchor="middle" font-style="italic" font-weight="500" letter-spacing="6">へのへのんのの</text>

  <!-- 下部の薄い罫線 -->
  <rect x="240" y="372" width="720" height="1" fill="url(#hr)" opacity="0.8"/>

  <!-- 副題: 今日の曲 ラベル -->
  <text x="600" y="428" font-family="sans-serif" font-size="16" fill="#b8bfe2" text-anchor="middle" letter-spacing="10">TODAY'S FRAGMENT</text>

  <!-- 副題: 曲名 -->
  <text x="600" y="478" font-family="serif" font-size="40" fill="#8be9ff" text-anchor="middle" font-style="italic" letter-spacing="2">フラグメ</text>

  <!-- アーティスト -->
  <text x="600" y="516" font-family="sans-serif" font-size="18" fill="#b8bfe2" text-anchor="middle" letter-spacing="2">daniwell  feat.  重音テトSV  ·  小春六花 AI  ·  宮舞モカ</text>

  <!-- 装飾: 三つのきらめき -->
  <g fill="#ffb6e6" opacity="0.9">
    <polygon points="560,495 564,505 574,509 564,513 560,523 556,513 546,509 556,505"/>
  </g>
  <g fill="#8be9ff" opacity="0.9">
    <polygon points="640,495 644,505 654,509 644,513 640,523 636,513 626,509 636,505"/>
  </g>

  <!-- フッターメタ -->
  <text x="60" y="595" font-family="monospace" font-size="13" fill="#b8bfe2" opacity="0.75" letter-spacing="3">henohenonnono.log</text>
  <text x="1140" y="595" font-family="monospace" font-size="13" fill="#b8bfe2" opacity="0.75" letter-spacing="3" text-anchor="end">2026 · 06 · 06</text>

  <!-- コーナー装飾 -->
  <g stroke="#8be9ff" stroke-width="1" fill="none" opacity="0.55">
    <path d="M 40 40 L 40 80 M 40 40 L 80 40"/>
    <path d="M 1160 40 L 1160 80 M 1160 40 L 1120 40"/>
    <path d="M 40 590 L 40 550 M 40 590 L 80 590"/>
    <path d="M 1160 590 L 1160 550 M 1160 590 L 1120 590"/>
  </g>
</svg>
