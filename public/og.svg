<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="none"/>
      <rect y="3" width="4" height="1" fill="#000000" fill-opacity="0.045"/>
    </pattern>
    <radialGradient id="gl-top" cx="600" cy="0" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#e0456a" stop-opacity="0.13"/>
      <stop offset="62%" stop-color="#e0456a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl-br" cx="1100" cy="650" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#e0456a" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#e0456a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl-halo" cx="600" cy="250" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e0456a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e0456a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade-tb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0810" stop-opacity="0.35"/>
      <stop offset="14%"  stop-color="#0d0810" stop-opacity="0"/>
      <stop offset="86%"  stop-color="#0d0810" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0810" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="#0d0810"/>
  <rect width="1200" height="630" fill="url(#gl-top)"/>
  <rect width="1200" height="630" fill="url(#gl-br)"/>
  <rect width="1200" height="630" fill="url(#gl-halo)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect width="1200" height="630" fill="url(#fade-tb)"/>

  <!-- ── 空になる／いただきます — empty plate / void rings ── -->
  <ellipse cx="602" cy="316" rx="278" ry="274" fill="none"
           stroke="#e0456a" stroke-width="1.2" stroke-opacity="0.09"
           transform="rotate(-0.3 602 316)"/>
  <ellipse cx="602" cy="316" rx="253" ry="249" fill="none"
           stroke="#e0456a" stroke-width="0.6" stroke-opacity="0.055"
           transform="rotate(-0.3 602 316)"/>

  <!-- ── Frame — TV broadcast guide marks ── -->
  <line x1="56"  y1="34"  x2="1144" y2="34"  stroke="#e0456a" stroke-width="1" stroke-opacity="0.30"/>
  <line x1="56"  y1="596" x2="1144" y2="596" stroke="#e0456a" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="56"  y1="34"  x2="56"   y2="78"  stroke="#e0456a" stroke-width="1" stroke-opacity="0.30"/>
  <line x1="1144" y1="34" x2="1144" y2="78"  stroke="#e0456a" stroke-width="1" stroke-opacity="0.30"/>
  <line x1="56"  y1="596" x2="56"   y2="552" stroke="#e0456a" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="1144" y1="596" x2="1144" y2="552" stroke="#e0456a" stroke-width="1" stroke-opacity="0.18"/>

  <!-- ── Site name ─ 主役 ── -->
  <text
    x="600" y="248"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="serif"
    font-size="112"
    fill="#ece0e8"
    letter-spacing="9"
  >へのへのんのの</text>

  <!-- Accent rule (微かに傾く — 錆び付いた蝶番) -->
  <rect x="430" y="312" width="342" height="2" fill="#e0456a" rx="1"
        transform="rotate(-0.18 601 313)"/>

  <!-- 今日の一曲 label -->
  <text
    x="600" y="348"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="sans-serif"
    font-size="13"
    fill="#e0456a"
    fill-opacity="0.52"
    letter-spacing="5"
  >今日の一曲</text>

  <!-- ── Song title ─ 副題 ── -->
  <text
    x="600" y="388"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="serif"
    font-size="40"
    fill="#e0456a"
    letter-spacing="3"
  >いただきます</text>

  <!-- ── Artist ─ 補足 ── -->
  <text
    x="600" y="434"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="sans-serif"
    font-size="19"
    fill="#ece0e8"
    fill-opacity="0.40"
    letter-spacing="1"
  >ぴーなた feat. ゲキヤク</text>
</svg>
