<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect y="3" width="1200" height="1" fill="rgba(255,43,126,0.028)"/>
  </pattern>

  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#160828"/>
    <stop offset="48%" stop-color="#0a0614"/>
    <stop offset="100%" stop-color="#07050d"/>
  </linearGradient>

  <linearGradient id="hL" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#07050d"/>
    <stop offset="18%"  stop-color="#ff2b7e"/>
    <stop offset="62%"  stop-color="#00ffd0"/>
    <stop offset="100%" stop-color="#07050d"/>
  </linearGradient>

  <linearGradient id="hL2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#07050d"/>
    <stop offset="28%"  stop-color="#ff2b7e" stop-opacity="0.45"/>
    <stop offset="72%"  stop-color="#ff2b7e" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#07050d"/>
  </linearGradient>

  <filter id="glow" x="-8%" y="-35%" width="116%" height="170%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="sglow" x="-15%" y="-55%" width="130%" height="210%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="gc1"><rect x="0" y="164" width="1200" height="46"/></clipPath>
  <clipPath id="gc2"><rect x="0" y="234" width="1200" height="36"/></clipPath>

</defs>

<!-- ── BACKGROUND ── -->
<rect width="1200" height="630" fill="#07050d"/>
<rect width="1200" height="630" fill="url(#bgG)"/>
<rect width="1200" height="630" fill="url(#sl)"/>

<!-- ── FRAME ── -->
<rect x="0" y="0"   width="1200" height="2" fill="url(#hL)"/>
<rect x="0" y="628" width="1200" height="2" fill="url(#hL)" opacity="0.28"/>
<rect x="0"    y="0" width="1" height="630" fill="#ff2b7e" opacity="0.22"/>
<rect x="1199" y="0" width="1" height="630" fill="#ff2b7e" opacity="0.22"/>

<!-- Corner TL -->
<rect x="28" y="28" width="26" height="2" fill="#ff2b7e" opacity="0.72"/>
<rect x="28" y="28" width="2" height="26" fill="#ff2b7e" opacity="0.72"/>
<!-- Corner TR -->
<rect x="1146" y="28" width="26" height="2" fill="#ff2b7e" opacity="0.72"/>
<rect x="1170" y="28" width="2"  height="26" fill="#ff2b7e" opacity="0.72"/>
<!-- Corner BL -->
<rect x="28" y="600" width="26" height="2" fill="#ff2b7e" opacity="0.32"/>
<rect x="28" y="576" width="2"  height="26" fill="#ff2b7e" opacity="0.32"/>
<!-- Corner BR -->
<rect x="1146" y="600" width="26" height="2" fill="#ff2b7e" opacity="0.32"/>
<rect x="1170" y="576" width="2"  height="26" fill="#ff2b7e" opacity="0.32"/>

<!-- ── GLITCH LAYERS ── -->
<g clip-path="url(#gc1)">
  <text x="594" y="292" text-anchor="middle" font-family="monospace" font-size="110"
        fill="#00ffd0" opacity="0.45" letter-spacing="6">へのへのんのの</text>
</g>
<g clip-path="url(#gc2)">
  <text x="606" y="291" text-anchor="middle" font-family="monospace" font-size="110"
        fill="#ff2b7e" opacity="0.45" letter-spacing="6">へのへのんのの</text>
</g>

<!-- ── MAIN TITLE ── -->
<text x="600" y="292" text-anchor="middle" font-family="monospace" font-size="110"
      fill="#e8e1f6" letter-spacing="6" filter="url(#glow)">へのへのんのの</text>

<!-- ── SEPARATOR ── -->
<rect x="80" y="336" width="1040" height="1" fill="url(#hL2)"/>

<!-- ── SUBTITLE ── -->
<text x="600" y="372" text-anchor="middle" font-family="monospace" font-size="13"
      fill="rgba(232,225,246,0.3)" letter-spacing="10">TODAY'S SONG</text>

<text x="600" y="424" text-anchor="middle" font-family="monospace" font-size="42"
      fill="#ff2b7e" letter-spacing="4" filter="url(#sglow)">シーリグラブ</text>

<text x="600" y="468" text-anchor="middle" font-family="monospace" font-size="22"
      fill="rgba(232,225,246,0.42)" letter-spacing="4">mnmnmnmn feat. 知声</text>

