<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9f2dc"/>
      <stop offset="38%"  stop-color="#edf2d5"/>
      <stop offset="65%"  stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#f9f0d8"/>
    </linearGradient>
    <linearGradient id="ray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fffcd2" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fffcd2" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#fffcd2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Window light ray — diagonal warmth, matching window-light CSS animation -->
  <polygon points="195,0 775,0 638,630 58,630" fill="url(#ray)" opacity="0.58"/>

  <!-- Outer frame -->
  <rect x="26" y="26" width="1148" height="578" rx="4" fill="none" stroke="#d9c9b0" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="36" y="36" width="1128" height="558" rx="2" fill="none" stroke="#d9c9b0" stroke-width="0.5" opacity="0.6"/>

  <!-- ── Leaf sprig — top-left ── -->
  <g transform="translate(58,58)" opacity="0.66">
    <path d="M 0,52 C 18,32 34,9 58,0 C 42,24 24,42 0,52 Z" fill="#4a7a38" opacity="0.62"/>
    <path d="M 0,52 C 9,36 20,20 40,13 C 30,30 15,44 0,52 Z" fill="#4a7a38" opacity="0.34"/>
    <line x1="0" y1="52" x2="38" y2="10" stroke="#4a7a38" stroke-width="1.2" stroke-linecap="round" opacity="0.48"/>
    <path d="M 20,30 C 32,18 46,15 50,24 C 39,28 27,30 20,30 Z" fill="#4a7a38" opacity="0.52" transform="rotate(-14,20,30)"/>
  </g>

  <!-- ── Leaf sprig — top-right (mirror) ── -->
  <g transform="translate(1142,58) scale(-1,1)" opacity="0.66">
    <path d="M 0,52 C 18,32 34,9 58,0 C 42,24 24,42 0,52 Z" fill="#4a7a38" opacity="0.62"/>
    <path d="M 0,52 C 9,36 20,20 40,13 C 30,30 15,44 0,52 Z" fill="#4a7a38" opacity="0.34"/>
    <line x1="0" y1="52" x2="38" y2="10" stroke="#4a7a38" stroke-width="1.2" stroke-linecap="round" opacity="0.48"/>
    <path d="M 20,30 C 32,18 46,15 50,24 C 39,28 27,30 20,30 Z" fill="#4a7a38" opacity="0.52" transform="rotate(-14,20,30)"/>
  </g>

  <!-- ── Leaf sprig — bottom-left (flip) ── -->
  <g transform="translate(58,572) scale(1,-1)" opacity="0.44">
    <path d="M 0,52 C 18,32 34,9 58,0 C 42,24 24,42 0,52 Z" fill="#4a7a38" opacity="0.62"/>
    <path d="M 0,52 C 9,36 20,20 40,13 C 30,30 15,44 0,52 Z" fill="#4a7a38" opacity="0.34"/>
    <line x1="0" y1="52" x2="38" y2="10" stroke="#4a7a38" stroke-width="1.2" stroke-linecap="round" opacity="0.48"/>
    <path d="M 20,30 C 32,18 46,15 50,24 C 39,28 27,30 20,30 Z" fill="#4a7a38" opacity="0.52" transform="rotate(-14,20,30)"/>
  </g>

  <!-- ── Leaf sprig — bottom-right (mirror + flip) ── -->
  <g transform="translate(1142,572) scale(-1,-1)" opacity="0.44">
    <path d="M 0,52 C 18,32 34,9 58,0 C 42,24 24,42 0,52 Z" fill="#4a7a38" opacity="0.62"/>
    <path d="M 0,52 C 9,36 20,20 40,13 C 30,30 15,44 0,52 Z" fill="#4a7a38" opacity="0.34"/>
    <line x1="0" y1="52" x2="38" y2="10" stroke="#4a7a38" stroke-width="1.2" stroke-linecap="round" opacity="0.48"/>
    <path d="M 20,30 C 32,18 46,15 50,24 C 39,28 27,30 20,30 Z" fill="#4a7a38" opacity="0.52" transform="rotate(-14,20,30)"/>
  </g>

  <!-- Horizontal rules -->
  <line x1="155" y1="166" x2="1045" y2="166" stroke="#d9c9b0" stroke-width="0.8"/>

  <!-- Divider below site name -->
  <line x1="220" y1="388" x2="980" y2="388" stroke="#d9c9b0" stroke-width="1"/>
  <line x1="340" y1="394" x2="860" y2="394" stroke="#4a7a38" stroke-width="0.7" opacity="0.42"/>
  <!-- Diamond accent at centre -->
  <polygon points="600,388 607,394 600,400 593,394" fill="#4a7a38" opacity="0.32"/>

  <!-- Bottom rule -->
  <line x1="155" y1="518" x2="1045" y2="518" stroke="#d9c9b0" stroke-width="0.8"/>

  <!-- Rose dots flanking song title -->
  <circle cx="455" cy="441" r="3"   fill="#a84d5c" opacity="0.26"/>
  <circle cx="745" cy="441" r="3"   fill="#a84d5c" opacity="0.26"/>
  <circle cx="442" cy="441" r="1.8" fill="#a84d5c" opacity="0.16"/>
  <circle cx="758" cy="441" r="1.8" fill="#a84d5c" opacity="0.16"/>

  <!-- Tiny dew-drop dots scattered -->
  <circle cx="205" cy="148" r="2"   fill="#4a7a38" opacity="0.18"/>
  <circle cx="222" cy="162" r="1.4" fill="#4a7a38" opacity="0.13"/>
  <circle cx="990" cy="148" r="2"   fill="#4a7a38" opacity="0.18"/>
  <circle cx="973" cy="162" r="1.4" fill="#4a7a38" opacity="0.13"/>

  <!-- ════════════ SITE NAME — 主役 ════════════ -->
  <text
    x="600" y="290"
    font-family="serif"
    font-size="116"
    font-weight="normal"
    fill="#2c2416"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="10">へのへのんのの</text>

  <!-- ════════════ Song title — 副題 ════════════ -->
  <text
    x="600" y="441"
    font-family="serif"
    font-size="32"
    fill="#4a7a38"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="3">LOVER'S RESPONSE</text>

  <!-- ════════════ Artist info ════════════ -->
  <text
    x="600" y="481"
    font-family="sans-serif"
    font-size="18"
    fill="#5c4e3a"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.80">TONE feat. SF-A2 開発コード miki</text>

  <!-- Bottom label -->
  <text
    x="600" y="551"
    font-family="sans-serif"
    font-size="12"
    fill="#5c4e3a"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="5"
    opacity="0.48">今 日 の 一 曲</text>

</svg>
