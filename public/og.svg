<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="1" height="1" fill="#000000" fill-opacity="0.11"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="topBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0c842" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#f0c842" stop-opacity="0.80"/>
      <stop offset="50%"  stop-color="#aed068" stop-opacity="0.90"/>
      <stop offset="80%"  stop-color="#f0c842" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#f0c842" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="600" cy="240" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#152a10"/>
      <stop offset="100%" stop-color="#0c1a0a"/>
    </radialGradient>
    <filter id="glowFx" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="#0c1a0a"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Outer frame -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#1d3818" stroke-width="2"/>

  <!-- Inner panel -->
  <rect x="32" y="32" width="1136" height="566" fill="#101f0d"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#1d3818" stroke-width="1"/>

  <!-- Top scan beam -->
  <rect x="32" y="32" width="1136" height="2" fill="url(#topBeam)" opacity="0.65"/>

  <!-- Corner L-brackets -->
  <polyline points="52,72 52,50 74,50"     fill="none" stroke="#f0c842" stroke-width="2.5" opacity="0.65"/>
  <polyline points="1148,72 1148,50 1126,50" fill="none" stroke="#f0c842" stroke-width="2.5" opacity="0.65"/>
  <polyline points="52,560 52,582 74,582"   fill="none" stroke="#f0c842" stroke-width="2.5" opacity="0.65"/>
  <polyline points="1148,560 1148,582 1126,582" fill="none" stroke="#f0c842" stroke-width="2.5" opacity="0.65"/>

  <!-- Date / metadata -->
  <text x="600" y="82" text-anchor="middle" font-family="monospace" font-size="11"
        fill="#6e9648" letter-spacing="0.36em" opacity="0.6">2026-07-01  ·  blog</text>
  <line x1="90" y1="98" x2="1110" y2="98" stroke="#1d3818" stroke-width="1.5" stroke-dasharray="4,5"/>

  <!-- SITE TITLE: phosphor glow layer -->
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="112"
        fill="#aed068" fill-opacity="0.22" letter-spacing="0.04em"
        filter="url(#glowFx)">へのへのんのの</text>
  <!-- chromatic aberration: cyan left -->
  <text x="595" y="273" text-anchor="middle" font-family="monospace" font-size="112"
        fill="#38e87a" fill-opacity="0.28" letter-spacing="0.04em">へのへのんのの</text>
  <!-- chromatic aberration: accent right-up -->
  <text x="605" y="267" text-anchor="middle" font-family="monospace" font-size="112"
        fill="#f0c842" fill-opacity="0.16" letter-spacing="0.04em">へのへのんのの</text>
  <!-- main title -->
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="112"
        fill="#aed068" letter-spacing="0.04em">へのへのんのの</text>

  <!-- Divider -->
  <circle cx="136" cy="315" r="3"   fill="#f0c842" opacity="0.50"/>
  <circle cx="600" cy="315" r="2"   fill="#6e9648" opacity="0.45"/>
  <circle cx="1064" cy="315" r="3"  fill="#f0c842" opacity="0.50"/>
  <line x1="136" y1="315" x2="1064" y2="315" stroke="#1d3818" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- TODAY'S TRACK label -->
  <text x="600" y="353" text-anchor="middle" font-family="monospace" font-size="11"
        fill="#6e9648" letter-spacing="0.44em" opacity="0.65">&#x25B8;  TODAY'S TRACK  &#x25B8;</text>

  <!-- Song title -->
  <text x="600" y="408" text-anchor="middle" font-family="monospace" font-size="40"
        fill="#f0c842" letter-spacing="0.07em">Do That Again</text>

  <!-- Artist -->
  <text x="600" y="446" text-anchor="middle" font-family="monospace" font-size="17"
        fill="#6e9648" letter-spacing="0.04em">Teirrel feat. Synthesizer V 2 AI Megpoid</text>

  <!-- Bottom separator -->
  <line x1="90" y1="474" x2="1110" y2="474" stroke="#1d3818" stroke-width="1.5" stroke-dasharray="4,5"/>

  <!-- Ticker — loop motif -->
  <text x="600" y="518" text-anchor="middle" font-family="monospace" font-size="9"
        fill="#6e9648" letter-spacing="0.34em" opacity="0.38">&#x25B8; DO THAT AGAIN  &#x25B8; DO THAT AGAIN  &#x25B8; DO THAT AGAIN  &#x25B8; DO THAT AGAIN  &#x25B8; DO THAT AGAIN</text>

  <!-- Footer echo -->
  <text x="600" y="550" text-anchor="middle" font-family="monospace" font-size="10"
        fill="#6e9648" letter-spacing="0.22em" opacity="0.32">へのへのんのの</text>

  <!-- Scanlines overlay -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
