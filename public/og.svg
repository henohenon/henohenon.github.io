<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="12%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2e88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="88%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="110%" r="65%">
      <stop offset="0%" stop-color="#ffd84d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140225"/>
      <stop offset="40%" stop-color="#1a043a"/>
      <stop offset="100%" stop-color="#08001a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e88"/>
      <stop offset="45%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff2e88"/>
      <stop offset="50%" stop-color="#ffd84d"/>
      <stop offset="75%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221039" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#08001a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ff2e88" stroke-opacity="0.12" stroke-width="1"/>
      <path d="M 0 0 L 48 0" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="#140225"/>
  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>
  <rect width="1200" height="630" fill="url(#bgGlow3)"/>

  <!-- Grid (clipped by horizontal band feel) -->
  <rect x="0" y="120" width="1200" height="410" fill="url(#grid)" opacity="0.85"/>

  <!-- Scanlines -->
  <g opacity="0.18">
    <line x1="0" y1="60"  x2="1200" y2="60"  stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- decorative neon hearts -->
  <g filter="url(#softGlow)" opacity="0.85">
    <text x="80" y="110" font-family="serif" font-size="38" fill="#ff2e88" transform="rotate(-14 80 110)">♡</text>
    <text x="1100" y="540" font-family="serif" font-size="46" fill="#00e5ff" transform="rotate(12 1100 540)">♡</text>
    <text x="1050" y="130" font-family="serif" font-size="28" fill="#ffd84d" transform="rotate(20 1050 130)">★</text>
    <text x="140" y="540" font-family="serif" font-size="26" fill="#ffd84d" transform="rotate(-18 140 540)">★</text>
    <text x="60"  y="320" font-family="serif" font-size="22" fill="#00e5ff">+</text>
    <text x="1140" y="320" font-family="serif" font-size="22" fill="#ff2e88">+</text>
  </g>

  <!-- Top tag -->
  <g filter="url(#softGlow)">
    <text x="600" y="92" font-family="sans-serif" font-size="22" font-weight="bold"
          letter-spacing="14" fill="#ffd84d" text-anchor="middle">
      ★ PARA PARA PARA ★
    </text>
  </g>

  <!-- Divider -->
  <rect x="120" y="118" width="960" height="2" fill="url(#hr)"/>

  <!-- Site name -->
  <text x="600" y="200" font-family="sans-serif" font-size="44" font-weight="bold"
        letter-spacing="8" fill="#fff1fb" text-anchor="middle" filter="url(#softGlow)">
    へのへのんのの
  </text>

  <!-- Card with song -->
  <g>
    <rect x="120" y="240" width="960" height="270" rx="18" ry="18"
          fill="url(#cardBg)" stroke="#ff2e88" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="120" y="240" width="960" height="270" rx="18" ry="18"
          fill="url(#sweep)"/>
    <!-- inner accent border -->
    <rect x="128" y="248" width="944" height="254" rx="14" ry="14"
          fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>

    <!-- TRACK label -->
    <text x="160" y="295" font-family="sans-serif" font-size="20" font-weight="bold"
          letter-spacing="10" fill="#ffd84d" filter="url(#softGlow)">
      ♡ NOW PLAYING
    </text>

    <!-- Song title -->
    <text x="160" y="395" font-family="sans-serif" font-size="120" font-weight="bold"
          letter-spacing="6" fill="url(#titleGrad)" filter="url(#pinkGlow)">
      ラブパラ
    </text>

    <!-- Artists -->
    <text x="160" y="450" font-family="sans-serif" font-size="22"
          letter-spacing="2" fill="#fff1fb">
      DECO*27 × Hayato Yamamoto × OTOIRO
    </text>
    <text x="160" y="482" font-family="sans-serif" font-size="20"
          letter-spacing="3" fill="#f6c8e6" font-style="italic">
      feat. 初音ミク
    </text>

    <!-- right neon stripe -->
    <g opacity="0.9">
      <rect x="1000" y="270" width="6"  height="210" fill="#ff2e88"/>
      <rect x="1015" y="270" width="3"  height="210" fill="#00e5ff"/>
      <rect x="1025" y="270" width="2"  height="210" fill="#ffd84d"/>
    </g>
  </g>

  <!-- Bottom divider -->
  <rect x="120" y="540" width="960" height="2" fill="url(#hr)"/>

  <!-- Footer caption -->
  <g filter="url(#softGlow)">
    <text x="120" y="580" font-family="monospace" font-size="18"
          letter-spacing="3" fill="#00e5ff">
      &gt;&gt; LOVE.PARA // NEON NIGHT MIX
    </text>
    <text x="1080" y="580" font-family="monospace" font-size="18"
          letter-spacing="3" fill="#ff2e88" text-anchor="end">
      2026.05.26 ♡
    </text>
  </g>
</svg>
