<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <radialGradient id="topHaze" cx="50%" cy="-5%" rx="55%" ry="48%">
      <stop offset="0%" stop-color="#c89030" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wingBloom" cx="600" cy="155" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f0d870" stop-opacity="0.30"/>
      <stop offset="38%"  stop-color="#c89030" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wingFill" cx="600" cy="155" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c89030" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#c89030" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
    </radialGradient>

    <filter id="titleGlow" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wingGlow" x="-15%" y="-35%" width="130%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ─── background ─── -->
  <rect width="1200" height="630" fill="#0c0f1e"/>
  <rect width="1200" height="630" fill="url(#topHaze)"/>

  <!-- ─── wing bloom ─── -->
  <ellipse cx="600" cy="155" rx="640" ry="215"
           fill="url(#wingBloom)" filter="url(#wingGlow)"/>

  <!-- ─── wing filled shapes ─── -->
  <path d="M 600 155 C 728 84, 960 50, 1164 117 C 1052 182, 824 197, 600 155 Z"
        fill="url(#wingFill)" filter="url(#wingGlow)"/>
  <path d="M 600 155 C 472 84, 240 50, 36 117 C 148 182, 376 197, 600 155 Z"
        fill="url(#wingFill)" filter="url(#wingGlow)"/>

  <!-- ─── right wing feather arcs ─── -->
  <path d="M 600 155 C 726 86, 950 60, 1152 110"  stroke="#c89030" stroke-width="1.6" fill="none" opacity="0.52"/>
  <path d="M 600 155 C 750 103, 980 80, 1160 136"  stroke="#c89030" stroke-width="1.0" fill="none" opacity="0.38"/>
  <path d="M 600 155 C 754 122, 978 120, 1138 176" stroke="#c89030" stroke-width="0.8" fill="none" opacity="0.27"/>
  <path d="M 600 155 C 735 146, 946 163, 1098 220" stroke="#c89030" stroke-width="0.7" fill="none" opacity="0.19"/>
  <path d="M 600 155 C 708 54, 894 26, 1096 70"   stroke="#c89030" stroke-width="1.0" fill="none" opacity="0.30"/>
  <path d="M 600 155 C 666 36, 793 10, 978 38"    stroke="#c89030" stroke-width="0.6" fill="none" opacity="0.17"/>

  <!-- ─── left wing feather arcs (mirror) ─── -->
  <path d="M 600 155 C 474 86, 250 60, 48 110"   stroke="#c89030" stroke-width="1.6" fill="none" opacity="0.52"/>
  <path d="M 600 155 C 450 103, 220 80, 40 136"  stroke="#c89030" stroke-width="1.0" fill="none" opacity="0.38"/>
  <path d="M 600 155 C 446 122, 222 120, 62 176"  stroke="#c89030" stroke-width="0.8" fill="none" opacity="0.27"/>
  <path d="M 600 155 C 465 146, 254 163, 102 220" stroke="#c89030" stroke-width="0.7" fill="none" opacity="0.19"/>
  <path d="M 600 155 C 492 54, 306 26, 104 70"   stroke="#c89030" stroke-width="1.0" fill="none" opacity="0.30"/>
  <path d="M 600 155 C 534 36, 407 10, 222 38"   stroke="#c89030" stroke-width="0.6" fill="none" opacity="0.17"/>

  <!-- ─── wing origin point ─── -->
  <circle cx="600" cy="155" r="22" fill="#f0d870" opacity="0.18" filter="url(#dotGlow)"/>
  <circle cx="600" cy="155" r="6"  fill="#ffeea0" opacity="0.58" filter="url(#dotGlow)"/>
  <circle cx="600" cy="155" r="2"  fill="#ffffff"  opacity="0.90"/>

  <!-- ─── sparks near right wing ─── -->
  <circle cx="800" cy="86"  r="2.6" fill="#c89030" opacity="0.70" filter="url(#dotGlow)"/>
  <circle cx="880" cy="60"  r="1.8" fill="#ddb848" opacity="0.54"/>
  <circle cx="958" cy="80"  r="1.4" fill="#c89030" opacity="0.44"/>
  <circle cx="1033" cy="110" r="2.0" fill="#c89030" opacity="0.50" filter="url(#dotGlow)"/>
  <circle cx="1110" cy="134" r="1.2" fill="#c89030" opacity="0.34"/>
  <circle cx="1160" cy="93"  r="1.5" fill="#ddb848" opacity="0.30"/>
  <circle cx="702"  cy="46"  r="1.8" fill="#c89030" opacity="0.38"/>
  <circle cx="822"  cy="36"  r="1.0" fill="#c89030" opacity="0.28"/>

  <!-- ─── sparks near left wing (mirror) ─── -->
  <circle cx="400" cy="86"  r="2.6" fill="#c89030" opacity="0.70" filter="url(#dotGlow)"/>
  <circle cx="320" cy="60"  r="1.8" fill="#ddb848" opacity="0.54"/>
  <circle cx="242" cy="80"  r="1.4" fill="#c89030" opacity="0.44"/>
  <circle cx="167" cy="110" r="2.0" fill="#c89030" opacity="0.50" filter="url(#dotGlow)"/>
  <circle cx="90"  cy="134" r="1.2" fill="#c89030" opacity="0.34"/>
  <circle cx="40"  cy="93"  r="1.5" fill="#ddb848" opacity="0.30"/>
  <circle cx="498" cy="46"  r="1.8" fill="#c89030" opacity="0.38"/>
  <circle cx="378" cy="36"  r="1.0" fill="#c89030" opacity="0.28"/>

  <!-- ─── distant stars (cream) ─── -->
  <circle cx="146" cy="50"  r="1.1" fill="#e0d9cc" opacity="0.34"/>
  <circle cx="294" cy="33"  r="0.8" fill="#e0d9cc" opacity="0.28"/>
  <circle cx="450" cy="44"  r="1.0" fill="#e0d9cc" opacity="0.26"/>
  <circle cx="600" cy="26"  r="0.9" fill="#e0d9cc" opacity="0.36"/>
  <circle cx="750" cy="38"  r="1.2" fill="#e0d9cc" opacity="0.27"/>
  <circle cx="906" cy="34"  r="0.8" fill="#e0d9cc" opacity="0.31"/>
  <circle cx="1068" cy="46" r="0.9" fill="#e0d9cc" opacity="0.25"/>
  <circle cx="1174" cy="60" r="1.1" fill="#e0d9cc" opacity="0.29"/>
  <circle cx="216"  cy="18" r="0.7" fill="#e0d9cc" opacity="0.22"/>
  <circle cx="990"  cy="20" r="0.8" fill="#e0d9cc" opacity="0.24"/>
  <circle cx="70"   cy="28" r="0.6" fill="#e0d9cc" opacity="0.20"/>

  <!-- ─── lower ambient sparks ─── -->
  <circle cx="68"   cy="408" r="0.9" fill="#c89030" opacity="0.15"/>
  <circle cx="152"  cy="478" r="1.0" fill="#c89030" opacity="0.12"/>
  <circle cx="1118" cy="435" r="0.9" fill="#c89030" opacity="0.15"/>
  <circle cx="1070" cy="520" r="1.1" fill="#c89030" opacity="0.10"/>
  <circle cx="86"   cy="560" r="0.8" fill="#e0d9cc" opacity="0.10"/>
  <circle cx="1130" cy="580" r="0.8" fill="#e0d9cc" opacity="0.08"/>

  <!-- ─── border frame ─── -->
  <rect x="1" y="1" width="1198" height="628"
        fill="none" stroke="#c89030" stroke-width="1.5" opacity="0.36"/>
  <rect x="14" y="14" width="1172" height="602"
        fill="none" stroke="#c89030" stroke-width="0.5" opacity="0.13"/>

  <!-- ─── site title (主役) ─── -->
  <text x="600" y="375"
        text-anchor="middle"
        font-family="serif"
        font-size="108"
        letter-spacing="6"
        fill="#c89030"
        filter="url(#titleGlow)">へのへのんのの</text>

  <!-- ─── divider ─── -->
  <line x1="455" y1="406" x2="592" y2="406" stroke="#c89030" stroke-width="1" opacity="0.46"/>
  <rect x="596" y="402" width="8" height="8" fill="#c89030" opacity="0.55"
        transform="rotate(45 600 406)"/>
  <line x1="608" y1="406" x2="745" y2="406" stroke="#c89030" stroke-width="1" opacity="0.46"/>

  <!-- ─── song name (副題) ─── -->
  <text x="600" y="452"
        text-anchor="middle"
        font-family="serif"
        font-size="38"
        letter-spacing="3"
        fill="#c89030"
        opacity="0.74">Shining Wings</text>

  <!-- ─── artist ─── -->
  <text x="600" y="494"
        text-anchor="middle"
        font-family="serif"
        font-size="22"
        letter-spacing="1"
        fill="#e0d9cc"
        opacity="0.40">wintermute feat. 宮舞モカ</text>

  <!-- ─── bottom date ─── -->
  <text x="600" y="582"
        text-anchor="middle"
        font-family="serif"
        font-size="16"
        letter-spacing="4"
        fill="#e0d9cc"
        opacity="0.18">2026 · 06 · 17</text>

</svg>
