  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(185,140,255,0.35)" stroke-width="1" stroke-dasharray="2 7"/>
  <path d="M30 60 L30 30 L60 30" fill="none" stroke="#ffd166" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M1170 60 L1170 30 L1140 30" fill="none" stroke="#ffd166" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M30 570 L30 600 L60 600" fill="none" stroke="#ffd166" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M1170 570 L1170 600 L1140 600" fill="none" stroke="#ffd166" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="600" y="88" text-anchor="middle" font-family="serif" font-size="20" letter-spacing="8" fill="#b98cff" opacity="0.75">✦ Vade retro satana ✦</text>

  <text x="600" y="360" text-anchor="middle" font-family="serif" font-size="126" letter-spacing="6" fill="#ff2fa0" opacity="0.35" filter="url(#glowPink)">へのへのんのの</text>
  <text x="600" y="360" text-anchor="middle" font-family="serif" font-size="126" letter-spacing="6" fill="#f1e6ff">へのへのんのの</text>

  <text x="600" y="440" text-anchor="middle" font-family="serif" font-size="40" letter-spacing="3" fill="#ff2fa0" filter="url(#glowSoft)">アクマバライ</text>

  <text x="600" y="480" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#b98cff" opacity="0.9">うちのボカロは様子がおかしい feat. 初音ミク, 雨衣, Google Text to Speech</text>

