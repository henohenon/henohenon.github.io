  letter-spacing="0.1em"
  text-anchor="middle"
  fill="#f2ddd0"
  filter="url(#fTitleGlow)"
>へのへのんのの</text>

<!-- ── DECORATIVE DIVIDER ── -->
<rect x="260" y="317" width="680" height="1.5" fill="url(#gUnderline)"/>

<!-- ── SONG SUBTITLE ── -->
