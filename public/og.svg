  <circle cx="28"   cy="315" r="0.9" fill="#8b96ff" fill-opacity="0.14"/>
  <circle cx="1172" cy="298" r="1.1" fill="#8b96ff" fill-opacity="0.17"/>
  <circle cx="22"   cy="452" r="0.7" fill="#cdd1e5" fill-opacity="0.11"/>
  <circle cx="1178" cy="430" r="0.9" fill="#8b96ff" fill-opacity="0.14"/>

  <!-- stars — bottom zone -->
  <circle cx="98"   cy="508" r="1.2" fill="#8b96ff" fill-opacity="0.28"/>
  <circle cx="252"  cy="528" r="0.8" fill="#cdd1e5" fill-opacity="0.18"/>
  <circle cx="418"  cy="502" r="1.1" fill="#b0b9ff" fill-opacity="0.25"/>
