    <rect x="705" y="575" width="70" height="55" fill="#241a3d"/>
    <rect x="785" y="555" width="50" height="75" fill="#1c1530"/>
    <rect x="845" y="595" width="90" height="35" fill="#241a3d"/>
    <rect x="945" y="570" width="60" height="60" fill="#1c1530"/>
    <rect x="1015" y="585" width="70" height="45" fill="#241a3d"/>
