<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowA" cx="18%" cy="-5%" r="65%">
      <stop offset="0%" stop-color="#c93656" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#c93656" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx="110%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#6b1430" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6b1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowC" cx="50%" cy="118%" r="70%">
      <stop offset="0%" stop-color="#d97a8c" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#d97a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="20%" stop-color="#ede1d6"/>
      <stop offset="65%" stop-color="#d97a8c"/>
      <stop offset="100%" stop-color="#c93656"/>
    </linearGradient>
    <linearGradient id="hr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c93656" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6b1430"/>
      <stop offset="50%" stop-color="#c93656"/>
      <stop offset="60%" stop-color="#6b1430"/>
      <stop offset="100%" stop-color="#c93656" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <symbol id="rose" viewBox="-50 -50 100 100">
      <g fill="none" stroke="#c93656" stroke-width="1.1" stroke-opacity="0.55">
        <circle r="4"/>
        <path d="M0,-4 C6,-8 10,-4 8,2 C14,0 16,8 8,10 C10,16 2,18 -2,12 C-8,16 -14,10 -10,4 C-16,2 -14,-6 -8,-6 C-8,-12 -2,-12 0,-8 Z"/>
        <path d="M-2,8 C-10,14 -18,22 -22,32" stroke="#6b1430"/>
        <path d="M-18,22 l-6,-2 l4,6 Z" fill="#2a1a24" stroke="#6b1430"/>
      </g>
    </symbol>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#0d0710"/>
  <rect width="1200" height="630" fill="url(#bgGlowB)"/>
  <rect width="1200" height="630" fill="url(#bgGlowA)"/>
  <rect width="1200" height="630" fill="url(#bgGlowC)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Thorn vines (decorative corners) -->
  <g stroke="#2a1a24" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M0,60 C140,40 260,90 360,130 C460,170 540,150 620,120"/>
    <path d="M1200,520 C1060,540 940,500 840,470 C740,440 660,460 580,490"/>
    <path d="M-10,580 C80,560 140,540 200,500"/>
    <path d="M1210,80 C1120,100 1060,120 1000,160"/>
  </g>
  <g fill="#6b1430" opacity="0.55">
    <path d="M180,55 l-4,-8 l8,2 Z"/>
    <path d="M320,108 l-3,-9 l9,3 Z"/>
    <path d="M520,150 l-4,-8 l8,2 Z"/>
    <path d="M900,488 l4,8 l-9,-1 Z"/>
    <path d="M740,452 l4,8 l-9,-1 Z"/>
  </g>

  <!-- Decorative roses -->
  <use href="#rose" x="100" y="170" width="80" height="80"/>
  <use href="#rose" x="1040" y="430" width="100" height="100" transform="rotate(15 1090 480)"/>
  <use href="#rose" x="980" y="120" width="55" height="55" opacity="0.5"/>
  <use href="#rose" x="140" y="470" width="60" height="60" opacity="0.6"/>

  <!-- Top ornament: dead-rose petals scattering -->
  <g fill="#d97a8c" opacity="0.35">
    <ellipse cx="600" cy="92" rx="3.5" ry="2"/>
    <ellipse cx="640" cy="76" rx="3" ry="1.7" transform="rotate(20 640 76)"/>
    <ellipse cx="560" cy="80" rx="3" ry="1.7" transform="rotate(-15 560 80)"/>
    <ellipse cx="690" cy="108" rx="2.6" ry="1.4"/>
    <ellipse cx="510" cy="105" rx="2.6" ry="1.4"/>
    <ellipse cx="450" cy="135" rx="2.2" ry="1.2"/>
    <ellipse cx="750" cy="142" rx="2.2" ry="1.2"/>
  </g>

  <!-- Top tagline -->
  <g font-family="serif" fill="#a89baa">
    <text x="600" y="118" text-anchor="middle" font-size="20" font-style="italic" letter-spacing="8">— we're already dead —</text>
  </g>

  <!-- Main title: site name -->
  <text x="600" y="320" text-anchor="middle"
        font-family="serif" font-style="italic" font-weight="600"
        font-size="132" letter-spacing="4"
        fill="url(#titleGrad)">へのへのんのの</text>

  <!-- Subtle title shadow/echo -->
  <text x="600" y="320" text-anchor="middle"
        font-family="serif" font-style="italic" font-weight="600"
        font-size="132" letter-spacing="4"
        fill="#c93656" opacity="0.08" transform="translate(3,3)">へのへのんのの</text>

  <!-- Divider -->
  <rect x="380" y="368" width="440" height="1.4" fill="url(#hr)"/>
  <g fill="#c93656" opacity="0.85">
    <circle cx="600" cy="369" r="3"/>
  </g>

  <!-- Subtitle: today's song -->
  <text x="600" y="430" text-anchor="middle"
        font-family="serif" font-style="italic"
        font-size="34" letter-spacing="2"
        fill="#d97a8c">✦ We're Already Dead ✦</text>

  <text x="600" y="472" text-anchor="middle"
        font-family="sans-serif"
        font-size="20" letter-spacing="4"
        fill="#a89baa">heartcy-P  feat.  初音ミク V6</text>

  <!-- Bottom meta -->
  <g font-family="serif" fill="#a89baa" opacity="0.75">
    <text x="600" y="558" text-anchor="middle" font-size="15" font-style="italic" letter-spacing="6">today's theme · a withered rose, dancing in the dark</text>
  </g>

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#2a1a24" stroke-width="1"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#6b1430" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- Corner accents -->
  <g stroke="#c93656" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M24,80 L24,24 L80,24"/>
    <path d="M1176,80 L1176,24 L1120,24"/>
    <path d="M24,550 L24,606 L80,606"/>
    <path d="M1176,550 L1176,606 L1120,606"/>
  </g>
</svg>
