<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="a1" cx="216" cy="50" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4632af" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4632af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="1020" cy="580" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e145a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e145a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="600" cy="262" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b96ff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8b96ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8b96ff" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#8b96ff" stop-opacity="0.52"/>
      <stop offset="72%"  stop-color="#8b96ff" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#8b96ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sep" x1="340" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8b96ff" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#8b96ff" stop-opacity="0.24"/>
      <stop offset="75%"  stop-color="#8b96ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8b96ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-16%" y="-72%" width="132%" height="244%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs" x="-14%" y="-90%" width="128%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

