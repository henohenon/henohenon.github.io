<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tealGlow" cx="20%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#45e0c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#45e0c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="82%" cy="112%" r="70%">
      <stop offset="0%" stop-color="#ff4fa0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff4fa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45e0c4"/>
