<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

<defs>
  <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="3" width="1200" height="1" fill="#9a648c" opacity="0.045"/>
  </pattern>
  <radialGradient id="centerGlow" cx="50%" cy="46%" r="40%">
    <stop offset="0%" stop-color="#e0d4ee"/>
    <stop offset="100%" stop-color="#f0ecf8" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ── Background ────────────────────────────────────────── -->
<rect width="1200" height="630" fill="#f0ecf8"/>
<rect width="1200" height="630" fill="url(#centerGlow)"/>
<rect width="1200" height="630" fill="url(#scan)"/>

<!-- ── Top accent bar (site-header border 再現) ──────────── -->
<rect x="0" y="0" width="1200" height="3" fill="#7b4060"/>

<!-- ── Bottom dark strip (footer 再現) ───────────────────── -->
<rect x="0" y="572" width="1200" height="58" fill="#140f1e"/>
<rect x="0" y="571" width="1200" height="1.5" fill="#2e2040"/>

<!-- ── Corner brackets ───────────────────────────────────── -->
<path d="M68 14 V34"   stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M68 14 H92"   stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M1132 14 V34" stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M1108 14 H1132" stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M68 558 V538"   stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M68 558 H92"    stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M1132 558 V538" stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>
<path d="M1108 558 H1132" stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.42"/>

<!-- ── Side dashed guide lines ────────────────────────────── -->
<line x1="80" y1="26" x2="80" y2="544" stroke="#7b4060" stroke-width="0.75" stroke-dasharray="2,13" opacity="0.15"/>
<line x1="1120" y1="26" x2="1120" y2="544" stroke="#7b4060" stroke-width="0.75" stroke-dasharray="2,13" opacity="0.15"/>

<!-- ── Ambient dots (scattered pixels / 深夜の静電気) ──────── -->
<circle cx="148"  cy="198" r="1.5" fill="#7b4060" opacity="0.24"/>
<circle cx="165"  cy="338" r="1"   fill="#9a7aaa"  opacity="0.2"/>
<circle cx="130"  cy="460" r="2"   fill="#7b4060"  opacity="0.13"/>
<circle cx="198"  cy="112" r="1"   fill="#c4a0c0"  opacity="0.18"/>
<circle cx="1055" cy="178" r="1.5" fill="#7b4060"  opacity="0.24"/>
<circle cx="1072" cy="408" r="1"   fill="#9a7aaa"  opacity="0.2"/>
<circle cx="1040" cy="488" r="2"   fill="#7b4060"  opacity="0.13"/>
<circle cx="1008" cy="108" r="1"   fill="#c4a0c0"  opacity="0.18"/>
<!-- top-center trio -->
<circle cx="600" cy="48" r="2"   fill="#7b4060" opacity="0.28"/>
<circle cx="575" cy="48" r="1.5" fill="#7b4060" opacity="0.15"/>
<circle cx="625" cy="48" r="1.5" fill="#7b4060" opacity="0.15"/>

<!-- ── SITE NAME — glitch ghost: accent ──────────────────── -->
<text x="600" y="288"
  text-anchor="middle"
  font-family="serif"
  font-size="118"
  fill="#7b4060"
  opacity="0.38"
  transform="translate(-3,0)">へのへのんのの</text>

<!-- ── SITE NAME — glitch ghost: cyan ───────────────────── -->
<text x="600" y="288"
  text-anchor="middle"
  font-family="serif"
  font-size="118"
  fill="#50b4dc"
  opacity="0.16"
  transform="translate(3,1)">へのへのんのの</text>

<!-- ── SITE NAME — main (主役) ───────────────────────────── -->
<text x="600" y="288"
  text-anchor="middle"
  font-family="serif"
  font-size="118"
  fill="#1e1528"
  letter-spacing="2">へのへのんのの</text>

<!-- ── Dashed separator ────────────────────────────────────── -->
<line x1="188" y1="338" x2="1012" y2="338"
  stroke="#7b4060" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

<!-- ── 今日の曲 tiny label ────────────────────────────────── -->
<text x="600" y="375"
