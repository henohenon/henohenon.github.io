<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ccd6eb"/>
      <stop offset="22%"  stop-color="#d8e2f2"/>
      <stop offset="48%"  stop-color="#e5e8f5"/>
      <stop offset="72%"  stop-color="#eeecf7"/>
      <stop offset="100%" stop-color="#f2f1f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="108%" r="75%">
      <stop offset="0%"  stop-color="#d2e1ff" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#d2e1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d5f8f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3d5f8f" stop-opacity="0"/>
    </linearGradient>
    <filter id="cf" x="-65%" y="-65%" width="230%" height="230%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="cf2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Sky gradient background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Radial glow from below (site-header::before motif) -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Soft cloud masses — upper left -->
  <ellipse cx="115"  cy="98"  rx="270" ry="85"  fill="#dde8f7" fill-opacity="0.62" filter="url(#cf)"/>
  <ellipse cx="240"  cy="55"  rx="160" ry="48"  fill="#e4edf9" fill-opacity="0.45" filter="url(#cf2)"/>
  <!-- Soft cloud masses — upper right -->
  <ellipse cx="1000" cy="78"  rx="290" ry="98"  fill="#d5e3f3" fill-opacity="0.55" filter="url(#cf)"/>
  <ellipse cx="870"  cy="42"  rx="180" ry="50"  fill="#dce8f4" fill-opacity="0.38" filter="url(#cf2)"/>
  <!-- Faint center-upper veil -->
  <ellipse cx="575"  cy="162" rx="210" ry="54"  fill="#eaeff9" fill-opacity="0.36" filter="url(#cf)"/>
  <!-- Subtle lower tone -->
  <ellipse cx="660"  cy="558" rx="310" ry="82"  fill="#dae3f0" fill-opacity="0.35" filter="url(#cf)"/>

  <!-- Card border (article.post border: 1px solid #cdd3e5 motif) -->
  <rect x="22" y="22" width="1156" height="586" rx="6"
        fill="none" stroke="#c3cad8" stroke-width="1" stroke-opacity="0.48"/>

  <!-- ① 主役：サイト名 -->
  <text x="600" y="300"
        font-family="serif"
        font-size="112"
        fill="#1a2338"
        text-anchor="middle"
        letter-spacing="7">へのへのんのの</text>

  <!-- Gradient beam under site name (article.post h1::after motif) -->
  <rect x="444" y="328" width="200" height="2.5" rx="1.25" fill="url(#beam)"/>

  <!-- Dashed separator (post-list li border-bottom: 1px dashed #bcc3d9 motif) -->
  <line x1="418" y1="362" x2="782" y2="362"
        stroke="#bcc3d9" stroke-width="1"
        stroke-dasharray="4 6" stroke-opacity="0.72"/>

  <!-- ② 副題：今日の曲名 -->
  <text x="600" y="418"
        font-family="serif"
        font-size="40"
        fill="#3d5f8f"
        text-anchor="middle"
        letter-spacing="6">空に免じて</text>

  <!-- ③ アーティスト名 -->
  <text x="600" y="466"
        font-family="sans-serif"
        font-size="20"
        fill="#3a506e"
        fill-opacity="0.78"
        text-anchor="middle"
        letter-spacing="1">傘村トータ, 島田昌典　feat. 初音ミク</text>
</svg>
