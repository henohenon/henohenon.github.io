<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g-bg" x1="0.45" y1="0" x2="0.55" y2="1">
  <stop offset="0%"   stop-color="#0e0c24"/>
  <stop offset="38%"  stop-color="#1c1035"/>
  <stop offset="72%"  stop-color="#2c1400"/>
  <stop offset="100%" stop-color="#3e1800"/>
</linearGradient>
<radialGradient id="g-fire" cx="50%" cy="120%" r="65%">
  <stop offset="0%"  stop-color="#ff6018" stop-opacity="0.44"/>
  <stop offset="38%" stop-color="#e03820" stop-opacity="0.22"/>
  <stop offset="65%" stop-color="#e03820" stop-opacity="0"/>
</radialGradient>
<radialGradient id="g-sky" cx="50%" cy="-5%" r="62%">
  <stop offset="0%"  stop-color="#1e3a6e" stop-opacity="0.32"/>
  <stop offset="62%" stop-color="#1e3a6e" stop-opacity="0"/>
</radialGradient>
<radialGradient id="g-warm" cx="50%" cy="44%" r="28%">
  <stop offset="0%"   stop-color="#ff6018" stop-opacity="0.11"/>
  <stop offset="100%" stop-color="#ff6018" stop-opacity="0"/>
</radialGradient>
<linearGradient id="g-div" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#ff6018" stop-opacity="0"/>
  <stop offset="20%"  stop-color="#ff6018"/>
  <stop offset="80%"  stop-color="#ff6018"/>
  <stop offset="100%" stop-color="#ff6018" stop-opacity="0"/>
</linearGradient>
<linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#f5a800" stop-opacity="0"/>
  <stop offset="50%"  stop-color="#f5a800" stop-opacity="0.44"/>
  <stop offset="100%" stop-color="#f5a800" stop-opacity="0"/>
</linearGradient>
<filter id="f-hero" x="-28%" y="-28%" width="156%" height="156%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="5"  result="b1"/>
  <feFlood flood-color="#f5a800" flood-opacity="0.92" result="c1"/>
  <feComposite in="c1" in2="b1" operator="in" result="s1"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b2"/>
  <feFlood flood-color="#ff6018" flood-opacity="0.72" result="c2"/>
  <feComposite in="c2" in2="b2" operator="in" result="s2"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="50" result="b3"/>
  <feFlood flood-color="#e03820" flood-opacity="0.40" result="c3"/>
  <feComposite in="c3" in2="b3" operator="in" result="s3"/>
  <feMerge>
    <feMergeNode in="s3"/>
    <feMergeNode in="s2"/>
    <feMergeNode in="s1"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<filter id="f-accent" x="-18%" y="-28%" width="136%" height="156%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="9"  result="b"/>
  <feFlood flood-color="#ff6018" flood-opacity="0.58" result="c"/>
  <feComposite in="c" in2="b" operator="in" result="s"/>
  <feMerge>
    <feMergeNode in="s"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<filter id="f-pink" x="-18%" y="-28%" width="136%" height="156%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="7"  result="b"/>
  <feFlood flood-color="#d94070" flood-opacity="0.50" result="c"/>
  <feComposite in="c" in2="b" operator="in" result="s"/>
  <feMerge>
    <feMergeNode in="s"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
</defs>

<!-- background layers -->
<rect width="1200" height="630" fill="#0b091a"/>
<rect width="1200" height="630" fill="url(#g-bg)"/>
<rect width="1200" height="630" fill="url(#g-fire)"/>
<rect width="1200" height="630" fill="url(#g-sky)"/>
<rect width="1200" height="630" fill="url(#g-warm)"/>

<!-- flame silhouettes at bottom -->
<path d="M148,630 C138,610 130,592 136,574 C140,560 147,568 149,556 C151,568 158,560 162,574 C168,592 160,610 148,630Z" fill="#f5a800" opacity="0.14"/>
