<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6fb"/>
      <stop offset="35%" stop-color="#ffe9f5"/>
      <stop offset="70%" stop-color="#e8f9ff"/>
      <stop offset="100%" stop-color="#fff6fb"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2007a"/>
      <stop offset="100%" stop-color="#00b6c9"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2007a"/>
      <stop offset="45%" stop-color="#ff6fc0"/>
      <stop offset="100%" stop-color="#00b6c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd6ec" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd6ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#fff6fb"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- top ribbon -->
  <rect x="0" y="0" width="1200" height="16" fill="url(#ribbonGrad)"/>
  <rect x="0" y="16" width="1200" height="6" fill="#ffd6ec"/>

  <!-- bottom ribbon -->
  <rect x="0" y="614" width="1200" height="16" fill="url(#ribbonGrad)"/>
  <line x1="0" y1="609" x2="1200" y2="609" stroke="#00b6c9" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- decorative bubbles -->
  <circle cx="110" cy="140" r="46" fill="#ffffff" opacity="0.5"/>
  <circle cx="175" cy="88" r="20" fill="#00b6c9" opacity="0.35"/>
  <circle cx="90" cy="500" r="30" fill="#ffd6ec" opacity="0.7"/>
  <circle cx="1080" cy="120" r="38" fill="#ffd6ec" opacity="0.6"/>
  <circle cx="1132" cy="200" r="18" fill="#c2007a" opacity="0.3"/>
  <circle cx="1100" cy="500" r="50" fill="#00b6c9" opacity="0.22"/>
  <circle cx="1000" cy="560" r="22" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="560" r="16" fill="#c2007a" opacity="0.25"/>
  <circle cx="60" cy="320" r="10" fill="#00b6c9" opacity="0.4"/>
  <circle cx="1150" cy="330" r="12" fill="#c2007a" opacity="0.3"/>

  <!-- sparkle stars -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 250 190 l 6 16 l 16 2 l -12 12 l 4 16 l -14 -9 l -14 9 l 4 -16 l -12 -12 l 16 -2 z"/>
    <path d="M 955 470 l 5 13 l 13 2 l -10 10 l 3 13 l -11 -7 l -11 7 l 3 -13 l -10 -10 l 13 -2 z"/>
  </g>
  <g fill="#ffd6ec" opacity="0.9">
    <path d="M 200 470 l 4 10 l 10 1 l -7 8 l 2 10 l -9 -5 l -9 5 l 2 -10 l -7 -8 l 10 -1 z"/>
    <path d="M 1000 180 l 4 10 l 10 1 l -7 8 l 2 10 l -9 -5 l -9 5 l 2 -10 l -7 -8 l 10 -1 z"/>
  </g>

  <!-- glow behind title -->
  <ellipse cx="600" cy="268" rx="500" ry="230" fill="url(#glow)"/>

  <!-- site name shadow -->
  <text x="605" y="302" font-family="sans-serif" font-size="128" font-weight="700" text-anchor="middle" fill="#ffd6ec" letter-spacing="4">へのへのんのの</text>
  <!-- site name (main hero) -->
  <text x="600" y="296" font-family="sans-serif" font-size="128" font-weight="700" text-anchor="middle" fill="url(#titleGrad)" letter-spacing="4">へのへのんのの</text>

  <!-- badge -->
  <rect x="465" y="350" width="270" height="36" rx="18" fill="#2b1638" opacity="0.06"/>
  <text x="600" y="374" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#00b6c9" letter-spacing="6">TODAY'S SONG</text>

  <!-- song title (subtitle) -->
  <text x="330" y="440" font-family="sans-serif" font-size="32" fill="#00b6c9" opacity="0.85">♪</text>
  <text x="600" y="434" font-family="sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#c2007a">Gimme more!</text>
  <text x="870" y="440" font-family="sans-serif" font-size="32" fill="#c2007a" opacity="0.85">♫</text>

  <!-- artist -->
  <text x="600" y="472" font-family="sans-serif" font-size="23" text-anchor="middle" fill="#2b1638" opacity="0.65">めろくる feat. various</text>
</svg>
