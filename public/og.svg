<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

<radialGradient id="rg-purple" cx="25%" cy="15%" r="55%">
  <stop offset="0%" stop-color="#5a0078" stop-opacity="0.38"/>
  <stop offset="100%" stop-color="#06071e" stop-opacity="0"/>
</radialGradient>
<radialGradient id="rg-blue" cx="75%" cy="85%" r="55%">
  <stop offset="0%" stop-color="#001450" stop-opacity="0.52"/>
  <stop offset="100%" stop-color="#06071e" stop-opacity="0"/>
</radialGradient>
<radialGradient id="rg-spot" cx="50%" cy="44%" r="30%">
  <stop offset="0%" stop-color="#3a0055" stop-opacity="0.38"/>
  <stop offset="100%" stop-color="#06071e" stop-opacity="0"/>
</radialGradient>

<pattern id="scanlines" width="2" height="4" patternUnits="userSpaceOnUse">
  <rect y="3" width="2" height="1" fill="#000" fill-opacity="0.09"/>
</pattern>

<linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff2d82"/>
  <stop offset="32%" stop-color="#cc44ff"/>
  <stop offset="62%" stop-color="#00e8ff"/>
  <stop offset="100%" stop-color="#ff2d82"/>
</linearGradient>

<filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="18"/>
</filter>
<filter id="blur-lg" x="-35%" y="-35%" width="170%" height="170%">
  <feGaussianBlur stdDeviation="8"/>
</filter>
<filter id="blur-sm" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="3.5"/>
</filter>
<filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- BACKGROUND -->
<rect width="1200" height="630" fill="#06071e"/>
<rect width="1200" height="630" fill="url(#rg-purple)"/>
<rect width="1200" height="630" fill="url(#rg-blue)"/>
<rect width="1200" height="630" fill="url(#rg-spot)"/>
<rect width="1200" height="630" fill="url(#scanlines)"/>

<!-- DEEP SEA BUBBLE RINGS -->
<circle cx="145" cy="472" r="68" fill="none" stroke="#00e8ff" stroke-width="1" opacity="0.055"/>
<circle cx="145" cy="472" r="44" fill="none" stroke="#00e8ff" stroke-width="0.6" opacity="0.04"/>
<circle cx="1058" cy="192" r="84" fill="none" stroke="#ff2d82" stroke-width="1" opacity="0.055"/>
<circle cx="1058" cy="192" r="55" fill="none" stroke="#ff2d82" stroke-width="0.6" opacity="0.04"/>
<circle cx="892" cy="516" r="40" fill="none" stroke="#00e8ff" stroke-width="0.7" opacity="0.04"/>
<circle cx="296" cy="148" r="52" fill="none" stroke="#cc44ff" stroke-width="0.7" opacity="0.05"/>
<circle cx="978" cy="548" r="25" fill="none" stroke="#00e8ff" stroke-width="0.5" opacity="0.036"/>
<circle cx="232" cy="502" r="18" fill="none" stroke="#ff2d82" stroke-width="0.5" opacity="0.04"/>
<circle cx="725" cy="80" r="30" fill="none" stroke="#cc44ff" stroke-width="0.5" opacity="0.038"/>

<!-- MAGIC CIRCLE (very subtle, behind title) -->
<circle cx="600" cy="268" r="248" fill="none" stroke="#ff2d82" stroke-width="0.5" opacity="0.09"/>
<circle cx="600" cy="268" r="224" fill="none" stroke="#cc44ff" stroke-width="0.4" opacity="0.07"/>
<circle cx="600" cy="268" r="200" fill="none" stroke="#ff2d82" stroke-width="0.3" opacity="0.055"/>
<line x1="600" y1="20" x2="600" y2="516" stroke="#ff2d82" stroke-width="0.4" opacity="0.07"/>
<line x1="352" y1="268" x2="848" y2="268" stroke="#ff2d82" stroke-width="0.4" opacity="0.07"/>
<line x1="425" y1="92" x2="775" y2="444" stroke="#cc44ff" stroke-width="0.3" opacity="0.055"/>
<line x1="775" y1="92" x2="425" y2="444" stroke="#cc44ff" stroke-width="0.3" opacity="0.055"/>

<!-- OUTER FRAME -->
<rect x="22" y="22" width="1156" height="586" fill="none" stroke="#ff2d82" stroke-width="1" opacity="0.28"/>

<!-- CORNER BRACKETS -->
<polyline points="22,118 22,22 118,22" fill="none" stroke="#ff2d82" stroke-width="3.5" stroke-linejoin="miter" filter="url(#glow)" opacity="0.92"/>
<polyline points="1082,22 1178,22 1178,118" fill="none" stroke="#00e8ff" stroke-width="3.5" stroke-linejoin="miter" filter="url(#glow)" opacity="0.92"/>
<polyline points="22,512 22,608 118,608" fill="none" stroke="#00e8ff" stroke-width="3.5" stroke-linejoin="miter" filter="url(#glow)" opacity="0.92"/>
<polyline points="1082,608 1178,608 1178,512" fill="none" stroke="#ff2d82" stroke-width="3.5" stroke-linejoin="miter" filter="url(#glow)" opacity="0.92"/>

<!-- SCATTERED SPARKLES -->
<text x="86" y="178" font-family="serif" font-size="22" fill="#ff2d82" filter="url(#glow)" opacity="0.72">✦</text>
<text x="1082" y="200" font-family="serif" font-size="18" fill="#00e8ff" filter="url(#glow)" opacity="0.68">✦</text>
<text x="133" y="428" font-family="serif" font-size="14" fill="#00e8ff" filter="url(#glow)" opacity="0.60">★</text>
<text x="1042" y="438" font-family="serif" font-size="16" fill="#ff2d82" filter="url(#glow)" opacity="0.60">★</text>
