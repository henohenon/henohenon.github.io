<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowPink" cx="18%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="82%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#5fe6ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5fe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a6df4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5fe6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hazeBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- background base -->
  <rect width="1200" height="630" fill="#eaf2fb"/>
  <rect width="1200" height="630" fill="url(#glowPink)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowCenter)"/>
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.55"/>

  <!-- vignette ring -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2a6df4" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#ff5fa2" stroke-opacity="0.12" stroke-width="1"/>

  <!-- chromatic decorative shapes (circles with chromatic aberration) -->
  <g opacity="0.55">
    <circle cx="985" cy="170" r="78" fill="none" stroke="#ff5fa2" stroke-opacity="0.5" stroke-width="1.2" transform="translate(-3,0)"/>
    <circle cx="985" cy="170" r="78" fill="none" stroke="#5fe6ff" stroke-opacity="0.5" stroke-width="1.2" transform="translate(3,0)"/>
    <circle cx="985" cy="170" r="78" fill="none" stroke="#2a6df4" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="985" cy="170" r="44" fill="none" stroke="#ff5fa2" stroke-opacity="0.4" stroke-width="1" transform="translate(-2,0)"/>
    <circle cx="985" cy="170" r="44" fill="none" stroke="#5fe6ff" stroke-opacity="0.4" stroke-width="1" transform="translate(2,0)"/>
  </g>

  <g opacity="0.5">
    <circle cx="170" cy="470" r="54" fill="none" stroke="#ff5fa2" stroke-opacity="0.45" stroke-width="1" transform="translate(-2.5,0)"/>
    <circle cx="170" cy="470" r="54" fill="none" stroke="#5fe6ff" stroke-opacity="0.45" stroke-width="1" transform="translate(2.5,0)"/>
    <circle cx="170" cy="470" r="28" fill="none" stroke="#2a6df4" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- thin scattered lines -->
  <g stroke-opacity="0.18" stroke="#2a6df4">
    <line x1="60" y1="120" x2="280" y2="120"/>
    <line x1="60" y1="128" x2="200" y2="128"/>
    <line x1="920" y1="510" x2="1140" y2="510"/>
    <line x1="980" y1="518" x2="1140" y2="518"/>
  </g>

  <!-- top tag -->
  <g transform="translate(80,108)">
    <rect x="0" y="0" width="14" height="14" fill="#ff5fa2" opacity="0.85" transform="translate(-2,0)"/>
    <rect x="0" y="0" width="14" height="14" fill="#5fe6ff" opacity="0.85" transform="translate(2,0)"/>
    <rect x="0" y="0" width="14" height="14" fill="#2a6df4"/>
    <text x="28" y="12" font-family="sans-serif" font-size="14" fill="#4a5575" letter-spacing="4">TODAY'S TRACK</text>
  </g>

  <!-- site name (top right) -->
  <g font-family="serif" font-size="22" letter-spacing="3">
    <text x="1120" y="120" text-anchor="end" fill="#ff5fa2" fill-opacity="0.55" transform="translate(-1.2,0)">へのへのんのの</text>
    <text x="1120" y="120" text-anchor="end" fill="#5fe6ff" fill-opacity="0.55" transform="translate(1.2,0)">へのへのんのの</text>
    <text x="1120" y="120" text-anchor="end" fill="#1f2740">へのへのんのの</text>
  </g>

  <!-- center accent line -->
  <rect x="80" y="248" width="1040" height="1" fill="url(#accentLine)"/>

  <!-- big title: numb numb -->
  <g font-family="serif" letter-spacing="6">
    <text x="600" y="380" text-anchor="middle" font-size="180" font-weight="400" fill="#ff5fa2" fill-opacity="0.75" transform="translate(-5,0)">numb numb</text>
    <text x="600" y="380" text-anchor="middle" font-size="180" font-weight="400" fill="#5fe6ff" fill-opacity="0.75" transform="translate(5,0)">numb numb</text>
    <text x="600" y="380" text-anchor="middle" font-size="180" font-weight="400" fill="#1f2740">numb numb</text>
  </g>

  <!-- subtitle / artist -->
  <g font-family="sans-serif">
    <text x="600" y="438" text-anchor="middle" font-size="20" fill="#4a5575" letter-spacing="6">TAK  feat.  初音ミク V4X (Original) ,  重音テト SV</text>
  </g>

  <!-- mood phrase box -->
  <g transform="translate(280,478)">
    <rect x="0" y="0" width="640" height="64" rx="14" ry="14" fill="url(#hazeBox)" stroke="#2a6df4" stroke-opacity="0.18"/>
    <rect x="0" y="0" width="3" height="64" rx="1" fill="#ff5fa2"/>
    <text x="24" y="40" font-family="serif" font-size="20" fill="#1f2740" font-style="italic" letter-spacing="2">色収差で滲む青と桃、まばゆさに痺れる百合の 0.1mm</text>
  </g>

  <!-- bottom bar -->
  <g font-family="sans-serif" font-size="14" letter-spacing="4">
    <text x="80" y="582" fill="#4a5575">2026 . 05 . 27</text>
    <text x="1120" y="582" text-anchor="end" fill="#2a6df4">#  N U M B</text>
  </g>

  <!-- subtle film grain dots -->
  <g fill="#1f2740" fill-opacity="0.05">
    <circle cx="120" cy="220" r="1.2"/>
    <circle cx="340" cy="180" r="1"/>
    <circle cx="780" cy="150" r="1.4"/>
    <circle cx="1050" cy="380" r="1.1"/>
    <circle cx="220" cy="540" r="1.3"/>
    <circle cx="900" cy="560" r="1"/>
    <circle cx="500" cy="80" r="1.2"/>
    <circle cx="660" cy="510" r="1"/>
  </g>
</svg>
