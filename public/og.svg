  <rect width="1200" height="630" fill="#0c0e1c"/>
  <rect width="1200" height="630" fill="url(#a1)"/>
  <rect width="1200" height="630" fill="url(#a2)"/>

  <!-- stars — top zone -->
  <circle cx="112"  cy="62"  r="1.1" fill="#8b96ff" fill-opacity="0.33"/>
  <circle cx="288"  cy="40"  r="0.7" fill="#cdd1e5" fill-opacity="0.21"/>
  <circle cx="413"  cy="85"  r="1.3" fill="#8b96ff" fill-opacity="0.36"/>
