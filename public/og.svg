<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="15%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#52b0ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b0ee" stop-opacity="0"/>
      <stop offset="30%" stop-color="#52b0ee" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#52b0ee" stop-opacity="0.78"/>
      <stop offset="70%" stop-color="#52b0ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-line-thin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b0ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#52b0ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0d1a2e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="1200" height="1" fill="#000000" fill-opacity="0.065"/>
    </pattern>
    <filter id="glow-title" x="-18%" y="-90%" width="136%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-accent" x="-14%" y="-90%" width="128%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Base background ── -->
  <rect width="1200" height="630" fill="#07090f"/>

  <!-- ── Top radial glow (site-header::before) ── -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- ── Scan line texture (body background-image) ── -->
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- ── Eye / iris background shape (eye-shimmer motif) ── -->
  <ellipse cx="600" cy="282" rx="430" ry="205" fill="url(#iris-grad)"/>
  <path d="M 185 282 Q 600 138 1015 282 Q 600 426 185 282 Z"
        fill="none" stroke="#52b0ee" stroke-opacity="0.055" stroke-width="1.5"/>
  <path d="M 272 282 Q 600 180 928 282 Q 600 384 272 282 Z"
        fill="none" stroke="#52b0ee" stroke-opacity="0.038" stroke-width="1"/>
  <circle cx="600" cy="282" r="90" fill="none" stroke="#52b0ee" stroke-opacity="0.042" stroke-width="1"/>
  <circle cx="600" cy="282" r="48" fill="none" stroke="#52b0ee" stroke-opacity="0.032" stroke-width="0.5"/>

  <!-- ── Outer card border ── -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#52b0ee" stroke-opacity="0.1" stroke-width="1"/>

  <!-- ── Corner brackets (tech accent) ── -->
  <path d="M 58 42 L 40 42 L 40 62" fill="none" stroke="#52b0ee" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 1142 42 L 1160 42 L 1160 62" fill="none" stroke="#52b0ee" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 58 588 L 40 588 L 40 568" fill="none" stroke="#52b0ee" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M 1142 588 L 1160 588 L 1160 568" fill="none" stroke="#52b0ee" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="square"/>

  <!-- ── Floating particles (揺らぐ記憶) ── -->
  <circle cx="122" cy="86"  r="1.5" fill="#52b0ee" fill-opacity="0.32"/>
  <circle cx="278" cy="152" r="1"   fill="#52b0ee" fill-opacity="0.2"/>
  <circle cx="68"  cy="295" r="1.5" fill="#52b0ee" fill-opacity="0.24"/>
  <circle cx="174" cy="460" r="1"   fill="#52b0ee" fill-opacity="0.17"/>
  <circle cx="1078" cy="102" r="1.5" fill="#52b0ee" fill-opacity="0.32"/>
  <circle cx="1136" cy="234" r="1"  fill="#52b0ee" fill-opacity="0.2"/>
  <circle cx="998"  cy="364" r="1.5" fill="#52b0ee" fill-opacity="0.24"/>
  <circle cx="1112" cy="496" r="1"  fill="#52b0ee" fill-opacity="0.17"/>
  <circle cx="448" cy="65"  r="1"   fill="#52b0ee" fill-opacity="0.14"/>
  <circle cx="766" cy="52"  r="1.5" fill="#52b0ee" fill-opacity="0.18"/>
  <circle cx="344" cy="548" r="1.5" fill="#c9d5ea" fill-opacity="0.09"/>
  <circle cx="912" cy="556" r="1"   fill="#c9d5ea" fill-opacity="0.09"/>
  <circle cx="600" cy="26"  r="1"   fill="#52b0ee" fill-opacity="0.1"/>
  <circle cx="508" cy="600" r="1"   fill="#52b0ee" fill-opacity="0.08"/>
  <circle cx="698" cy="602" r="1.5" fill="#52b0ee" fill-opacity="0.1"/>
  <circle cx="165" cy="195" r="1"   fill="#c9d5ea" fill-opacity="0.06"/>
  <circle cx="1036" cy="185" r="1"  fill="#c9d5ea" fill-opacity="0.06"/>
  <circle cx="385" cy="320" r="1"   fill="#52b0ee" fill-opacity="0.1"/>
  <circle cx="815" cy="325" r="1"   fill="#52b0ee" fill-opacity="0.1"/>

  <!-- ── Top thin accent line ── -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#52b0ee" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ══ MAIN: Site name ══ -->
  <text
    x="600" y="260"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif"
    font-size="114" font-weight="bold"
    letter-spacing="8"
    fill="#c9d5ea"
    filter="url(#glow-title)"
  >へのへのんのの</text>

  <!-- ── Separator line (drift-line) ── -->
  <line x1="155" y1="334" x2="1045" y2="334" stroke="url(#h-line)" stroke-width="1" opacity="0.72"/>
  <line x1="220" y1="342" x2="980"  y2="342" stroke="url(#h-line-thin)" stroke-width="0.5" opacity="0.5"/>

  <!-- ── Song title (副題) ── -->
  <text
    x="600" y="392"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif"
    font-size="38" letter-spacing="6"
    fill="#52b0ee"
    filter="url(#glow-accent)"
  >ミライオモイ</text>

  <!-- ── Artist info ── -->
  <text
    x="600" y="446"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif"
    font-size="19" letter-spacing="4"
    fill="#c9d5ea" fill-opacity="0.38"
  >よもうわべ feat. 唄音ウタ</text>

  <!-- ── Bottom accent line ── -->
  <line x1="120" y1="570" x2="1080" y2="570" stroke="#52b0ee" stroke-opacity="0.07" stroke-width="1"/>

  <!-- ── Date stamp (footer) ── -->
  <text
    x="600" y="597"
    text-anchor="middle" dominant-baseline="middle"
    font-family="sans-serif"
    font-size="13" letter-spacing="5"
    fill="#c9d5ea" fill-opacity="0.2"
  >2026 · 06 · 19</text>
</svg>
