<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

<radialGradient id="gTopWarm" cx="600" cy="0" r="660" gradientUnits="userSpaceOnUse">
  <stop offset="0%"   stop-color="#c4604a" stop-opacity="0.17"/>
  <stop offset="100%" stop-color="#c4604a" stop-opacity="0"/>
</radialGradient>

<linearGradient id="gDusk" x1="0" y1="370" x2="0" y2="630" gradientUnits="userSpaceOnUse">
  <stop offset="0%"   stop-color="#2a1030" stop-opacity="0"/>
  <stop offset="58%"  stop-color="#2a1030" stop-opacity="0.42"/>
  <stop offset="100%" stop-color="#3a1810" stop-opacity="0.80"/>
</linearGradient>

<radialGradient id="gSunset" cx="180" cy="518" r="500" gradientUnits="userSpaceOnUse">
  <stop offset="0%"   stop-color="#e8896e" stop-opacity="0.33"/>
  <stop offset="42%"  stop-color="#c4604a" stop-opacity="0.11"/>
  <stop offset="100%" stop-color="#e8896e" stop-opacity="0"/>
</radialGradient>

<linearGradient id="gHorizLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0%"   stop-color="#c4604a" stop-opacity="0"/>
  <stop offset="18%"  stop-color="#c4604a" stop-opacity="0.88"/>
  <stop offset="50%"  stop-color="#e8896e" stop-opacity="1"/>
  <stop offset="82%"  stop-color="#d4738a" stop-opacity="0.88"/>
  <stop offset="100%" stop-color="#d4738a" stop-opacity="0"/>
</linearGradient>

<linearGradient id="gUnderline" x1="260" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0%"   stop-color="#d4738a" stop-opacity="0"/>
  <stop offset="22%"  stop-color="#d4738a" stop-opacity="0.68"/>
  <stop offset="50%"  stop-color="#e8896e" stop-opacity="0.90"/>
  <stop offset="78%"  stop-color="#d4738a" stop-opacity="0.68"/>
  <stop offset="100%" stop-color="#d4738a" stop-opacity="0"/>
</linearGradient>

<filter id="fTitleGlow" x="-12%" y="-30%" width="124%" height="160%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="fSubGlow" x="-20%" y="-45%" width="140%" height="190%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<!-- ── BACKGROUND LAYERS ── -->
<rect width="1200" height="630" fill="#1e1528"/>
<rect width="1200" height="630" fill="url(#gTopWarm)"/>
<rect width="1200" height="630" fill="url(#gDusk)"/>
<rect width="1200" height="630" fill="url(#gSunset)"/>

