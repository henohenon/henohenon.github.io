<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowTL" cx="15%" cy="-5%" r="65%">
      <stop offset="0%" stop-color="#ffd6e1" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffd6e1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowTR" cx="100%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#ffe3ea" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffe3ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="90%" cy="105%" r="60%">
      <stop offset="0%" stop-color="#ffc2d4" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffc2d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headerBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d81b52"/>
      <stop offset="45%" stop-color="#ff5f86"/>
      <stop offset="100%" stop-color="#7a1030"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a1030"/>
      <stop offset="100%" stop-color="#3a1420"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#fff3f6"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlowTL)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlowTR)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlowBR)"/>

  <!-- soft scattered petal dots -->
  <g fill="#d81b52" opacity="0.16">
    <circle cx="90" cy="90" r="10"/>
    <circle cx="150" cy="150" r="5"/>
    <circle cx="1110" cy="80" r="9"/>
    <circle cx="1050" cy="150" r="5"/>
    <circle cx="70" cy="540" r="7"/>
    <circle cx="1130" cy="560" r="8"/>
    <circle cx="1080" cy="500" r="4"/>
    <circle cx="60" cy="470" r="4"/>
  </g>

  <!-- top accent band -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#headerBand)"/>
  <rect x="0" y="620" width="1200" height="10" fill="#7a1030"/>

  <!-- thin diagonal texture strip, echoes .site-header::after -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="-50" y1="0" x2="120" y2="630"/>
    <line x1="30" y1="0" x2="200" y2="630"/>
    <line x1="1080" y1="0" x2="1250" y2="630"/>
    <line x1="1160" y1="0" x2="1330" y2="630"/>
  </g>

  <!-- heart motif, faint, upper right -->
  <path d="M 980 60 C 960 30, 910 30, 900 70 C 890 30, 840 30, 820 60 C 800 100, 900 170, 900 170 C 900 170, 1000 100, 980 60 Z"
        fill="#d81b52" opacity="0.10"/>

  <!-- decorative border card -->
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#ffffff" opacity="0.55" stroke="#f3b9c9" stroke-width="2"/>

  <!-- small kicker label -->
  <g>
    <circle cx="330" cy="215" r="6" fill="#d81b52">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="352" y="223" font-family="'Hiragino Sans','sans-serif'" font-size="24" fill="#d81b52" letter-spacing="2">
      today's theme song
    </text>
  </g>

  <!-- MAIN: site name -->
  <text x="600" y="345" text-anchor="middle"
        font-family="'Hiragino Maru Gothic ProN','sans-serif'"
        font-size="128" font-weight="700" fill="url(#titleFade)" letter-spacing="4">
    へのへのんのの
  </text>

  <!-- divider -->
  <line x1="430" y1="400" x2="770" y2="400" stroke="#f3b9c9" stroke-width="2"/>
  <circle cx="600" cy="400" r="5" fill="#d81b52"/>

  <!-- subtitle: song title -->
  <text x="600" y="462" text-anchor="middle"
        font-family="'Hiragino Sans','sans-serif'" font-size="38" font-weight="600" fill="#d81b52">
    CONTINUING HEART
  </text>

  <!-- artist / small info -->
  <text x="600" y="504" text-anchor="middle"
        font-family="'Hiragino Sans','sans-serif'" font-size="24" fill="#7a1030" opacity="0.85">
    TONE feat. 初音ミク
  </text>

  <!-- footer mood tag -->
  <text x="600 " y="565" text-anchor="middle"
        font-family="'Hiragino Sans','sans-serif'" font-size="20" fill="#3a1420" opacity="0.55" letter-spacing="1">
    儚さを抱きしめる、ピンクと紅の切ない多幸感
  </text>
</svg>
