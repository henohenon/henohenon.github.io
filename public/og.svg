<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#e6002e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#e6002e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="110%" r="75%">
      <stop offset="0%" stop-color="#780014" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#780014" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <pattern id="march" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 24 L24 24 M24 0 L24 48" stroke="#e6002e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="hr" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#e6002e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6002e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6002e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="630"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1200" height="630" fill="#0d0608"/>
    <rect width="1200" height="630" fill="url(#march)"/>
    <rect width="1200" height="630" fill="url(#bgGlow1)"/>
    <rect width="1200" height="630" fill="url(#bgGlow2)"/>
    <rect width="1200" height="630" fill="url(#scanlines)"/>

    <!-- Border frame (article.post 上下の朱線をオマージュ) -->
    <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#e6002e" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="40" y1="70" x2="1160" y2="70" stroke="#e6002e" stroke-width="2"/>
    <line x1="40" y1="560" x2="1160" y2="560" stroke="#e6002e" stroke-width="2"/>

    <!-- Top tag label (article.post::before 風) -->
    <rect x="90" y="58" width="180" height="24" fill="#0d0608"/>
    <text x="180" y="76" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#e6002e" opacity="0.85">ヤ ラ ラ ラ</text>

    <!-- Bottom tag label (article.post::after 風) -->
    <rect x="930" y="548" width="180" height="24" fill="#0d0608"/>
    <text x="1020" y="566" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#e6002e" opacity="0.85">ヤ ラ ラ ラ</text>

    <!-- Left side march tally (一歩ずつのリズム) -->
    <g stroke="#e6002e" stroke-width="3" stroke-linecap="square">
      <line x1="80" y1="300" x2="80" y2="340"/>
      <line x1="92" y1="300" x2="92" y2="340"/>
      <line x1="104" y1="300" x2="104" y2="340"/>
      <line x1="116" y1="300" x2="116" y2="340"/>
      <line x1="74" y1="320" x2="122" y2="320" stroke-opacity="0.9"/>
    </g>
    <g stroke="#d8c9bf" stroke-width="2" stroke-linecap="square" opacity="0.6">
      <line x1="80" y1="360" x2="80" y2="392"/>
      <line x1="92" y1="360" x2="92" y2="392"/>
      <line x1="104" y1="360" x2="104" y2="392"/>
    </g>

    <!-- Right side step counter -->
    <g font-family="monospace" fill="#8a6b6f" font-size="14" letter-spacing="4">
      <text x="1120" y="295" text-anchor="end">STEP 01</text>
      <text x="1120" y="318" text-anchor="end" fill="#e6002e">STEP 02 ▸</text>
      <text x="1120" y="341" text-anchor="end">STEP 03</text>
      <text x="1120" y="364" text-anchor="end" opacity="0.5">STEP 04</text>
    </g>

    <!-- Accent left border (post-list 風) -->
    <rect x="40" y="220" width="6" height="220" fill="#e6002e"/>

    <!-- Site title (主役) -->
    <!-- Glitch shadow layers -->
    <text x="600" y="295" font-family="sans-serif" font-size="128" font-weight="900"
          letter-spacing="6" text-anchor="middle" fill="#e6002e" opacity="0.9">
      へのへのんのの
    </text>
    <text x="596" y="295" font-family="sans-serif" font-size="128" font-weight="900"
          letter-spacing="6" text-anchor="middle" fill="#00c8dc" opacity="0.25">
      へのへのんのの
    </text>
    <text x="598" y="295" font-family="sans-serif" font-size="128" font-weight="900"
          letter-spacing="6" text-anchor="middle" fill="#d8c9bf">
      へのへのんのの
    </text>

    <!-- Divider -->
    <rect x="380" y="335" width="440" height="2" fill="url(#hr)"/>

    <!-- Today label -->
    <text x="600" y="378" font-family="monospace" font-size="16" letter-spacing="8"
          text-anchor="middle" fill="#8a6b6f">— 今 日 の B G M —</text>

    <!-- Song title (副題) -->
    <text x="600" y="430" font-family="sans-serif" font-size="40" font-weight="700"
          letter-spacing="4" text-anchor="middle" fill="#e6002e">
      ヤラララ
    </text>

    <!-- Artist (さらに小) -->
    <text x="600" y="468" font-family="sans-serif" font-size="20" letter-spacing="2"
          text-anchor="middle" fill="#d8c9bf" opacity="0.8">
      뭐든지모에화  feat.  重음테토SV2
    </text>
    <text x="600" y="468" font-family="sans-serif" font-size="20" letter-spacing="2"
          text-anchor="middle" fill="#d8c9bf">
      뭐든지모에화  feat.  重音テトSV2
    </text>

    <!-- Mood tag -->
    <g transform="translate(600, 510)">
      <rect x="-180" y="-18" width="360" height="32" fill="none" stroke="#e6002e" stroke-opacity="0.5"/>
      <text x="0" y="4" font-family="sans-serif" font-size="14" letter-spacing="6"
            text-anchor="middle" fill="#d8c9bf">嘲笑をはねのけて 一歩ずつ 前へ</text>
    </g>

    <!-- Bottom-left signature -->
    <text x="60" y="600" font-family="monospace" font-size="12" letter-spacing="3" fill="#8a6b6f">
      henohenonnono.blog
    </text>
    <text x="1140" y="600" font-family="monospace" font-size="12" letter-spacing="3" text-anchor="end" fill="#8a6b6f">
      ▸ もう一歩先へ
    </text>
  </g>
</svg>
