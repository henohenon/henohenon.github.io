<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="rg-cr" gradientUnits="userSpaceOnUse" cx="200" cy="270" r="620">
    <stop offset="0%" stop-color="#b01c2a" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#b01c2a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg-au" gradientUnits="userSpaceOnUse" cx="1055" cy="82" r="490">
    <stop offset="0%" stop-color="#c4913a" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#c4913a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg-title-halo" gradientUnits="userSpaceOnUse" cx="600" cy="268" r="440">
    <stop offset="0%" stop-color="#b01c2a" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#b01c2a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lg-title" gradientUnits="userSpaceOnUse" x1="600" y1="203" x2="600" y2="320">
    <stop offset="0%" stop-color="#f2dc8e"/>
    <stop offset="36%" stop-color="#c4913a"/>
    <stop offset="100%" stop-color="#6e4510"/>
  </linearGradient>
  <linearGradient id="lg-blade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0c0a0f" stop-opacity="0"/>
    <stop offset="18%" stop-color="#b01c2a" stop-opacity="0.72"/>
    <stop offset="50%" stop-color="#c4913a" stop-opacity="1"/>
    <stop offset="82%" stop-color="#b01c2a" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#0c0a0f" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lg-blade2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0c0a0f" stop-opacity="0"/>
    <stop offset="28%" stop-color="#b01c2a" stop-opacity="0.32"/>
    <stop offset="50%" stop-color="#b01c2a" stop-opacity="0.45"/>
    <stop offset="72%" stop-color="#b01c2a" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#0c0a0f" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lg-top-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0c0a0f" stop-opacity="0"/>
    <stop offset="15%" stop-color="#c4913a" stop-opacity="0.35"/>
    <stop offset="50%" stop-color="#c4913a" stop-opacity="0.55"/>
    <stop offset="85%" stop-color="#c4913a" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0c0a0f" stop-opacity="0"/>
  </linearGradient>
  <filter id="f-glow-cr" x="-35%" y="-65%" width="170%" height="230%">
    <feGaussianBlur stdDeviation="15"/>
  </filter>
  <filter id="f-glow-au" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- ── BACKGROUND ── -->
<rect width="1200" height="630" fill="#0c0a0f"/>
<rect width="1200" height="630" fill="url(#rg-cr)"/>
<rect width="1200" height="630" fill="url(#rg-au)"/>
<rect width="1200" height="630" fill="url(#rg-title-halo)"/>

<!-- Faint 4-pointed star motif (matching CSS body pattern) -->
<g fill="#c4913a" fill-opacity="0.024">
  <path d="M10,0.5L10.5,9.5L19.5,10L10.5,10.5L10,19.5L9.5,10.5L0.5,10L9.5,9.5z" transform="translate(98,60)"/>
  <path d="M10,0.5L10.5,9.5L19.5,10L10.5,10.5L10,19.5L9.5,10.5L0.5,10L9.5,9.5z" transform="translate(1065,488)"/>
  <path d="M10,0.5L10.5,9.5L19.5,10L10.5,10.5L10,19.5L9.5,10.5L0.5,10L9.5,9.5z" transform="translate(58,455)"/>
  <path d="M10,0.5L10.5,9.5L19.5,10L10.5,10.5L10,19.5L9.5,10.5L0.5,10L9.5,9.5z" transform="translate(1082,90)"/>
  <path d="M7,0.35L7.35,6.65L13.65,7L7.35,7.35L7,13.65L6.65,7.35L0.35,7L6.65,6.65z" transform="translate(172,540)"/>
  <path d="M7,0.35L7.35,6.65L13.65,7L7.35,7.35L7,13.65L6.65,7.35L0.35,7L6.65,6.65z" transform="translate(1002,30)"/>
  <path d="M6,0.3L6.3,5.7L11.7,6L6.3,6.3L6,11.7L5.7,6.3L0.3,6L5.7,5.7z" transform="translate(552,572)"/>
  <path d="M6,0.3L6.3,5.7L11.7,6L6.3,6.3L6,11.7L5.7,6.3L0.3,6L5.7,5.7z" transform="translate(638,48)"/>
  <path d="M6,0.3L6.3,5.7L11.7,6L6.3,6.3L6,11.7L5.7,6.3L0.3,6L5.7,5.7z" transform="translate(318,30)"/>
  <path d="M6,0.3L6.3,5.7L11.7,6L6.3,6.3L6,11.7L5.7,6.3L0.3,6L5.7,5.7z" transform="translate(870,572)"/>
</g>

<!-- Subtle vertical grain lines (decayed kingdom texture) -->
<g stroke="#c4913a" stroke-opacity="0.012" stroke-width="0.5">
  <line x1="240" y1="0" x2="240" y2="630"/>
  <line x1="480" y1="0" x2="480" y2="630"/>
  <line x1="720" y1="0" x2="720" y2="630"/>
  <line x1="960" y1="0" x2="960" y2="630"/>
</g>

<!-- ── FRAME BORDERS ── -->
<rect x="28" y="28" width="1144" height="574" fill="none" stroke="#b01c2a" stroke-width="1" stroke-opacity="0.38"/>
<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#c4913a" stroke-width="0.5" stroke-opacity="0.2"/>

<!-- ── CORNER L-BRACKETS ── -->
<!-- TL outer -->
<path d="M28,118 L28,28 L118,28" fill="none" stroke="#c4913a" stroke-width="2" stroke-opacity="0.72" stroke-linecap="square"/>
<!-- TL inner -->
<path d="M40,106 L40,40 L106,40" fill="none" stroke="#c4913a" stroke-width="0.7" stroke-opacity="0.34"/>
<!-- TR outer -->
<path d="M1172,118 L1172,28 L1082,28" fill="none" stroke="#c4913a" stroke-width="2" stroke-opacity="0.72" stroke-linecap="square"/>
<!-- TR inner -->
<path d="M1160,106 L1160,40 L1094,40" fill="none" stroke="#c4913a" stroke-width="0.7" stroke-opacity="0.34"/>
<!-- BL outer -->
<path d="M28,512 L28,602 L118,602" fill="none" stroke="#c4913a" stroke-width="2" stroke-opacity="0.72" stroke-linecap="square"/>
<!-- BL inner -->
<path d="M40,524 L40,590 L106,590" fill="none" stroke="#c4913a" stroke-width="0.7" stroke-opacity="0.34"/>
<!-- BR outer -->
<path d="M1172,512 L1172,602 L1082,602" fill="none" stroke="#c4913a" stroke-width="2" stroke-opacity="0.72" stroke-linecap="square"/>
<!-- BR inner -->
<path d="M1160,524 L1160,590 L1094,590" fill="none" stroke="#c4913a" stroke-width="0.7" stroke-opacity="0.34"/>

<!-- Corner endpoint dots (crimson) -->
<circle cx="118" cy="28"   r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="1082" cy="28"  r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="28"   cy="118" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="1172" cy="118" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="118"  cy="602" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="1082" cy="602" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="28"   cy="512" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<circle cx="1172" cy="512" r="2" fill="#b01c2a" fill-opacity="0.55"/>
<!-- Corner vertex squares (gold) -->
<rect x="25.5" y="25.5" width="5" height="5" fill="none" stroke="#c4913a" stroke-width="0.75" stroke-opacity="0.5"/>
<rect x="1169.5" y="25.5" width="5" height="5" fill="none" stroke="#c4913a" stroke-width="0.75" stroke-opacity="0.5"/>
<rect x="25.5" y="599.5" width="5" height="5" fill="none" stroke="#c4913a" stroke-width="0.75" stroke-opacity="0.5"/>
<rect x="1169.5" y="599.5" width="5" height="5" fill="none" stroke="#c4913a" stroke-width="0.75" stroke-opacity="0.5"/>

<!-- ── TOP RULE ── -->
<rect x="130" y="160" width="940" height="0.75" fill="url(#lg-top-rule)" opacity="0.42"/>

<!-- ── SWORD CROSS ORNAMENTS (flanking, subtle) ── -->
<!-- Left flank -->
<g transform="translate(92,315) rotate(45)" fill="#b01c2a" fill-opacity="0.07">
  <rect x="-1.5" y="-28" width="3" height="56"/>
  <rect x="-14" y="-1.5" width="28" height="3"/>
  <rect x="-10" y="-1.5" width="20" height="3" transform="translate(0,18)"/>
</g>
<!-- Right flank -->
<g transform="translate(1108,315) rotate(45)" fill="#b01c2a" fill-opacity="0.07">
  <rect x="-1.5" y="-28" width="3" height="56"/>
  <rect x="-14" y="-1.5" width="28" height="3"/>
  <rect x="-10" y="-1.5" width="20" height="3" transform="translate(0,18)"/>
</g>

<!-- ── SITE NAME — GLOW LAYERS ── -->
<!-- Crimson glow (blurred behind) -->
<text x="600" y="312"
  text-anchor="middle"
  font-family="serif"
  font-size="120"
  fill="#b01c2a"
  fill-opacity="0.52"
  filter="url(#f-glow-cr)">へのへのんのの</text>
<!-- Gold bloom (softer) -->
<text x="600" y="312"
  text-anchor="middle"
  font-family="serif"
  font-size="120"
  fill="#c4913a"
  fill-opacity="0.2"
  filter="url(#f-glow-au)">へのへのんのの</text>

<!-- ── SITE NAME — MAIN TEXT ── -->
<text x="600" y="312"
  text-anchor="middle"
  font-family="serif"
  font-size="120"
  fill="url(#lg-title)"
  letter-spacing="0.015em">へのへのんのの</text>

<!-- ── BLADE DIVIDER ── -->
<rect x="155" y="360" width="890" height="1.5" fill="url(#lg-blade)" opacity="0.78"/>
<rect x="255" y="365" width="690" height="0.5" fill="url(#lg-blade2)" opacity="0.58"/>

<!-- Diamond ornament at divider midpoint -->
<polygon points="600,352 609,360 600,368 591,360" fill="#c4913a" fill-opacity="0.82"/>
<polygon points="600,355.5 605.5,360 600,364.5 594.5,360" fill="#16101e" fill-opacity="0.92"/>
<circle cx="600" cy="360" r="1.2" fill="#c4913a" fill-opacity="0.65"/>

<!-- ── SONG TITLE ── -->
<text x="600" y="420"
  text-anchor="middle"
  font-family="serif"
  font-size="36"
  fill="#b01c2a"
  fill-opacity="0.86"
  letter-spacing="0.1em">Sticky Situation</text>

<!-- ── ARTIST NAME ── -->
<text x="600" y="462"
  text-anchor="middle"
  font-family="sans-serif"
  font-size="17"
  fill="#574d68"
  letter-spacing="0.1em">Vane Lily, Monochrome Media, suzie feat. Kevin</text>

<!-- ── BOTTOM RULE ── -->
<rect x="385" y="520" width="430" height="0.5" fill="url(#lg-blade2)" opacity="0.45"/>

