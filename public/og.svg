<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ff2da8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2da8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="82%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#c6ff2e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c6ff2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg3" cx="50%" cy="110%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hr1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2da8"/>
      <stop offset="50%" stop-color="#c6ff2e"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="scan" x="0" y="0" width="6" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <pattern id="dopa" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#ff2da8" fill-opacity="0.22"/>
      <circle cx="26" cy="20" r="1.4" fill="#c6ff2e" fill-opacity="0.22"/>
      <circle cx="14" cy="32" r="1.2" fill="#00e5ff" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#0b0410"/>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect width="1200" height="630" fill="url(#dopa)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Outer brutal frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1a0a26" stroke-width="6"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#ff2da8" stroke-width="2" stroke-dasharray="14 8"/>

  <!-- Top tag chip "こちょこちょ" -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="260" height="44" fill="#ff2da8"/>
    <text x="130" y="30" font-family="sans-serif" font-weight="900" font-size="22" fill="#0b0410" text-anchor="middle" letter-spacing="6">こちょこちょ</text>
  </g>

  <!-- Top-right meta -->
  <g transform="translate(1130, 92)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#00e5ff" text-anchor="end" letter-spacing="4">"DOPAMINE"</text>
    <text x="0" y="22" font-family="monospace" font-size="13" fill="#f4b8d8" text-anchor="end" letter-spacing="3">2026 / 06 / 01</text>
  </g>

  <!-- Decorative blocks left -->
  <g opacity="0.85">
    <rect x="60" y="200" width="14" height="280" fill="#c6ff2e"/>
    <rect x="84" y="240" width="6" height="180" fill="#00e5ff"/>
    <rect x="98" y="280" width="3" height="100" fill="#ff2da8"/>
  </g>

  <!-- Decorative blocks right -->
  <g opacity="0.85">
    <rect x="1126" y="200" width="14" height="280" fill="#ff2da8"/>
    <rect x="1110" y="240" width="6" height="180" fill="#c6ff2e"/>
    <rect x="1099" y="280" width="3" height="100" fill="#00e5ff"/>
  </g>

  <!-- MAIN SITE TITLE — chromatic aberration in pink + cyan -->
  <g transform="translate(600, 310)">
    <!-- shadow chunks behind -->
    <text x="-7" y="0" font-family="sans-serif" font-weight="900" font-size="130" fill="#ff2da8" text-anchor="middle" letter-spacing="6">へのへのんのの</text>
    <text x="7" y="0" font-family="sans-serif" font-weight="900" font-size="130" fill="#00e5ff" text-anchor="middle" letter-spacing="6">へのへのんのの</text>
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="130" fill="#ffe8f4" text-anchor="middle" letter-spacing="6">へのへのんのの</text>
  </g>

  <!-- Underline accent under site title -->
  <rect x="320" y="345" width="560" height="8" fill="url(#hr1)"/>
  <g>
    <rect x="320" y="362" width="60" height="3" fill="#ff2da8"/>
    <rect x="395" y="362" width="40" height="3" fill="#c6ff2e"/>
    <rect x="450" y="362" width="80" height="3" fill="#00e5ff"/>
    <rect x="545" y="362" width="30" height="3" fill="#ff2da8"/>
    <rect x="590" y="362" width="120" height="3" fill="#c6ff2e"/>
    <rect x="725" y="362" width="50" height="3" fill="#00e5ff"/>
    <rect x="790" y="362" width="90" height="3" fill="#ff2da8"/>
  </g>

  <!-- Subtitle bracket: today's track -->
  <g transform="translate(600, 430)">
    <text x="0" y="0" font-family="monospace" font-size="18" fill="#00e5ff" text-anchor="middle" letter-spacing="8">— TODAY'S MOOD —</text>
  </g>

  <g transform="translate(600, 480)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="42" fill="#c6ff2e" text-anchor="middle" letter-spacing="4">Cocho Cocho</text>
  </g>

  <g transform="translate(600, 520)">
    <text x="0" y="0" font-family="sans-serif" font-size="22" fill="#f4b8d8" text-anchor="middle" letter-spacing="3">鬱P feat. 初音ミク</text>
  </g>

  <!-- Bottom dopadopa banner -->
  <g transform="translate(0, 565)">
    <rect x="0" y="0" width="1200" height="40" fill="#1a0a26"/>
    <text x="600" y="27" font-family="sans-serif" font-weight="900" font-size="18" fill="#c6ff2e" text-anchor="middle" letter-spacing="12">ドパドパ  ドパドパ  ドーパミン</text>
  </g>

  <!-- Tiny corner glyphs -->
  <g font-family="monospace" font-size="12" fill="#ff2da8" opacity="0.8">
    <text x="60" y="555" letter-spacing="2">// hennohennon-no-no</text>
    <text x="1140" y="555" text-anchor="end" letter-spacing="2">ch.01 ▶ tickle</text>
  </g>

  <!-- Scattered tick marks for "tickle" feel -->
  <g stroke="#ff2da8" stroke-width="2" opacity="0.7">
    <line x1="180" y1="160" x2="200" y2="180"/>
    <line x1="200" y1="160" x2="180" y2="180"/>
  </g>
  <g stroke="#c6ff2e" stroke-width="2" opacity="0.7">
    <line x1="1000" y1="170" x2="1020" y2="190"/>
    <line x1="1020" y1="170" x2="1000" y2="190"/>
  </g>
  <g stroke="#00e5ff" stroke-width="2" opacity="0.7">
    <line x1="150" y1="500" x2="170" y2="520"/>
    <line x1="170" y1="500" x2="150" y2="520"/>
  </g>
  <g stroke="#ff2da8" stroke-width="2" opacity="0.7">
    <line x1="1030" y1="495" x2="1050" y2="515"/>
    <line x1="1050" y1="495" x2="1030" y2="515"/>
  </g>
</svg>
