<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="glow" x="-50%" y="-150%" width="200%" height="400%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
    <feMerge>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="title-glow" x="-3%" y="-100%" width="106%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="26" result="b2"/>
    <feMerge>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="blur20" x="-5%" y="-100%" width="110%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
  </filter>
  <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="3" width="1200" height="1" fill="#000" fill-opacity="0.07"/>
  </pattern>
  <radialGradient id="rg-purple" cx="25%" cy="15%" r="55%">
    <stop offset="0%" stop-color="#5a0078" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#5a0078" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg-blue" cx="75%" cy="85%" r="55%">
    <stop offset="0%" stop-color="#001450" stop-opacity="0.52"/>
    <stop offset="100%" stop-color="#001450" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg-mid" cx="60%" cy="48%" r="30%">
    <stop offset="0%" stop-color="#3d0035" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#3d0035" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hp" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#ff2d82"/>
    <stop offset="50%"  stop-color="#00e8ff"/>
    <stop offset="100%" stop-color="#ff2d82"/>
  </linearGradient>
  <linearGradient id="vbar" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ff2d82" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#ff2d82" stop-opacity="0.7"/>
    <stop offset="75%"  stop-color="#00e8ff" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#00e8ff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#06071e"/>
<rect width="1200" height="630" fill="url(#rg-purple)"/>
<rect width="1200" height="630" fill="url(#rg-blue)"/>
<rect width="1200" height="630" fill="url(#rg-mid)"/>
<rect width="1200" height="630" fill="url(#scan)"/>

<!-- ── Outer frame borders ── -->
<rect x="16" y="16" width="1168" height="598" fill="none" stroke="#ff2d82" stroke-width="1" opacity="0.28"/>
<rect x="20" y="20" width="1160" height="590" fill="none" stroke="#00e8ff" stroke-width="0.5" opacity="0.18"/>

<!-- ── Corner L-brackets ── -->
<path d="M16,72 L16,16 L72,16"       fill="none" stroke="#ff2d82" stroke-width="3" stroke-linecap="square" filter="url(#glow)"/>
<path d="M1128,16 L1184,16 L1184,72" fill="none" stroke="#00e8ff" stroke-width="3" stroke-linecap="square" filter="url(#glow)"/>
<path d="M16,558 L16,614 L72,614"    fill="none" stroke="#00e8ff" stroke-width="3" stroke-linecap="square" filter="url(#glow)"/>
<path d="M1128,614 L1184,614 L1184,558" fill="none" stroke="#ff2d82" stroke-width="3" stroke-linecap="square" filter="url(#glow)"/>

<!-- ── Magical transformation circles (right side, very faint) ── -->
<circle cx="920" cy="315" r="230" fill="none" stroke="#ff2d82" stroke-width="0.8" opacity="0.06"/>
<circle cx="920" cy="315" r="185" fill="none" stroke="#00e8ff" stroke-width="0.8" opacity="0.06"/>
<circle cx="920" cy="315" r="140" fill="none" stroke="#ff2d82" stroke-width="0.7" opacity="0.05"/>
<circle cx="920" cy="315" r="100" fill="none" stroke="#00e8ff" stroke-width="0.7" opacity="0.05"/>
<circle cx="920" cy="315" r="60"  fill="none" stroke="#ff2d82" stroke-width="0.6" opacity="0.04"/>
<path d="M920,215 L960,315 L920,415 L880,315 Z" fill="none" stroke="#eedeff" stroke-width="0.5" opacity="0.04"/>

<!-- ── Water wave lines ── -->
<path d="M-50,242 C200,236, 450,248, 700,242 S1050,236, 1250,242" stroke="#00e8ff" stroke-width="0.7" fill="none" opacity="0.04"/>
<path d="M-50,322 C300,316, 550,328, 800,322 S1100,316, 1250,322" stroke="#00e8ff" stroke-width="0.7" fill="none" opacity="0.04"/>
<path d="M-50,402 C200,396, 500,408, 750,402 S1100,396, 1250,402" stroke="#ff2d82" stroke-width="0.7" fill="none" opacity="0.04"/>
<path d="M-50,482 C300,476, 600,488, 850,482 S1150,476, 1250,482" stroke="#00e8ff" stroke-width="0.6" fill="none" opacity="0.03"/>

<!-- ── Star field ── -->
<circle cx="148"  cy="158" r="1.4" fill="#eedeff" opacity="0.27"/>
<circle cx="380"  cy="132" r="1.1" fill="#00e8ff" opacity="0.36"/>
<circle cx="680"  cy="110" r="1.4" fill="#eedeff" opacity="0.2"/>
<circle cx="870"  cy="162" r="1.1" fill="#ff2d82" opacity="0.38"/>
<circle cx="1080" cy="140" r="1.4" fill="#eedeff" opacity="0.24"/>
<circle cx="210"  cy="468" r="1.2" fill="#00e8ff" opacity="0.28"/>
<circle cx="490"  cy="488" r="1.4" fill="#eedeff" opacity="0.19"/>
<circle cx="1020" cy="475" r="1.4" fill="#eedeff" opacity="0.21"/>
<circle cx="940"  cy="418" r="1.2" fill="#00e8ff" opacity="0.26"/>
<circle cx="58"   cy="418" r="1.1" fill="#eedeff" opacity="0.16"/>
<circle cx="600"  cy="172" r="1.0" fill="#00e8ff" opacity="0.22"/>
<circle cx="1140" cy="480" r="1.2" fill="#00e8ff" opacity="0.2"/>
<circle cx="320"  cy="200" r="1.0" fill="#ff2d82" opacity="0.18"/>
<circle cx="1150" cy="350" r="1.0" fill="#ff2d82" opacity="0.18"/>
<circle cx="430"  cy="455" r="0.9" fill="#ff2d82" opacity="0.22"/>
<circle cx="756"  cy="142" r="0.9" fill="#ff2d82" opacity="0.2"/>

<!-- Magic cross sparkles -->
<line x1="1118" y1="200" x2="1118" y2="212" stroke="#00e8ff" stroke-width="1.2" opacity="0.3"/>
<line x1="1112" y1="206" x2="1124" y2="206" stroke="#00e8ff" stroke-width="1.2" opacity="0.3"/>
<line x1="80"   y1="478" x2="80"   y2="490" stroke="#ff2d82" stroke-width="1.2" opacity="0.3"/>
<line x1="74"   y1="484" x2="86"   y2="484" stroke="#ff2d82" stroke-width="1.2" opacity="0.3"/>
<line x1="1148" y1="428" x2="1148" y2="438" stroke="#eedeff" stroke-width="0.9" opacity="0.22"/>
<line x1="1143" y1="433" x2="1153" y2="433" stroke="#eedeff" stroke-width="0.9" opacity="0.22"/>
<line x1="480"  y1="168" x2="480"  y2="178" stroke="#ff2d82" stroke-width="1.0" opacity="0.2"/>
<line x1="475"  y1="173" x2="485"  y2="173" stroke="#ff2d82" stroke-width="1.0" opacity="0.2"/>

<!-- ── Header: site name ── -->
<text x="52" y="76" font-family="monospace" font-size="22" fill="#eedeff" letter-spacing="0.1em" opacity="0.94">へのへのんのの</text>
<text x="336" y="74" font-family="monospace" font-size="14" fill="#ff2d82" filter="url(#glow)">✦</text>
<text x="356" y="72" font-family="monospace" font-size="10" fill="#00e8ff" filter="url(#glow)">✦</text>
<rect x="52" y="90" width="308" height="2.5" fill="url(#hp)" rx="1.5" opacity="0.82"/>

<!-- Pixel matrix decoration (top-right) -->
<rect x="1046" y="44" width="9" height="9" fill="#ff2d82" opacity="0.72" rx="1"/>
<rect x="1060" y="44" width="9" height="9" fill="#00e8ff" opacity="0.52" rx="1"/>
<rect x="1074" y="44" width="9" height="9" fill="#ff2d82" opacity="0.27" rx="1"/>
<rect x="1088" y="44" width="9" height="9" fill="#eedeff" opacity="0.12" rx="1"/>
<rect x="1046" y="58" width="9" height="9" fill="#00e8ff" opacity="0.29" rx="1"/>
<rect x="1060" y="58" width="9" height="9" fill="#ff2d82" opacity="0.56" rx="1"/>
