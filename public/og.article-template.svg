<rect x="1088" y="72" width="9" height="9" fill="#00e8ff" opacity="0.6"  rx="1"/>

<!-- ── Article label ── -->
<text x="52" y="148" font-family="monospace" font-size="11" fill="#ff2d82" letter-spacing="0.3em" opacity="0.85" filter="url(#glow)">ARTICLE</text>
<line x1="124" y1="141" x2="176" y2="141" stroke="#ff2d82" stroke-width="1" opacity="0.32"/>

<!-- ── Left vertical accent bar ── -->
<rect x="42" y="168" width="2.5" height="324" fill="url(#vbar)" rx="1.25" opacity="0.55"/>

<!-- ── Title ── -->
<!-- Ghost glow layer -->
<text x="64" y="340" font-family="sans-serif" font-size="68" fill="#ff2d82" opacity="0.18" filter="url(#blur20)">{{TITLE}}</text>
<!-- Main title text -->
<text x="64" y="340" font-family="sans-serif" font-size="68" fill="#eedeff" filter="url(#title-glow)">{{TITLE}}</text>

<!-- ── Bottom separator ── -->
<rect x="52" y="516" width="1096" height="2.5" fill="url(#hp)" rx="1.5" opacity="0.72"/>

<!-- ── Footer ── -->
<text x="600" y="564" font-family="monospace" font-size="13" fill="#00e8ff" letter-spacing="0.15em" text-anchor="middle" filter="url(#glow)" opacity="0.66">✦  CUTIE REVOLUTION  ✦  キューティ革命  ✦  She is saving the day  ✦</text>

<!-- Bottom pixel dots -->
<rect x="52"   y="580" width="6" height="6" fill="#ff2d82" opacity="0.50" rx="1"/>
<rect x="62"   y="580" width="6" height="6" fill="#00e8ff" opacity="0.36" rx="1"/>
<rect x="72"   y="580" width="6" height="6" fill="#ff2d82" opacity="0.20" rx="1"/>
<rect x="1130" y="580" width="6" height="6" fill="#00e8ff" opacity="0.50" rx="1"/>
<rect x="1120" y="580" width="6" height="6" fill="#ff2d82" opacity="0.36" rx="1"/>
<rect x="1110" y="580" width="6" height="6" fill="#00e8ff" opacity="0.20" rx="1"/>

</svg>
