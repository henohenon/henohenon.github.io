<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gradPink" cx="12%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#ff8fc7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff8fc7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradCyan" cx="88%" cy="92%" r="50%">
      <stop offset="0%" stop-color="#37c9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#37c9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe3f0"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9f9ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#fff3f8"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#gradPink)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#gradCyan)"/>

  <!-- bokeh dots -->
  <circle cx="1130" cy="55" r="34" fill="#ff4fa8" opacity="0.12"/>
  <circle cx="70" cy="585" r="46" fill="#37c9ff" opacity="0.12"/>
  <circle cx="1080" cy="560" r="16" fill="#b8005a" opacity="0.15"/>
  <circle cx="120" cy="90" r="12" fill="#37c9ff" opacity="0.18"/>

  <!-- faint decorative hearts -->
  <text x="1005" y="140" font-family="sans-serif" font-size="64" fill="#37c9ff" opacity="0.16">&#9825;</text>
  <text x="90" y="470" font-family="sans-serif" font-size="46" fill="#ff4fa8" opacity="0.18">&#9825;</text>
  <text x="1000" y="520" font-family="sans-serif" font-size="34" fill="#b8005a" opacity="0.14">&#9825;</text>
  <text x="150" y="150" font-family="sans-serif" font-size="30" fill="#ff8fc7" opacity="0.22">&#9825;</text>

  <!-- outer dashed frame -->
  <rect x="24" y="24" width="1152" height="582" rx="30" fill="none" stroke="#ff8fc7" stroke-width="3" stroke-dasharray="13 9"/>

  <!-- site name (double-shadow wobble style) -->
  <text x="66" y="92" font-family="sans-serif" font-weight="700" font-size="38" fill="#37c9ff">&#12408;&#12398;&#12408;&#12398;&#12435;&#12398;&#12398;</text>
  <text x="62" y="92" font-family="sans-serif" font-weight="700" font-size="38" fill="#ff4fa8">&#12408;&#12398;&#12408;&#12398;&#12435;&#12398;&#12398;</text>
  <text x="64" y="92" font-family="sans-serif" font-weight="700" font-size="38" fill="#3a1030">&#12408;&#12398;&#12408;&#12398;&#12435;&#12398;&#12398;</text>
  <text x="64" y="118" font-family="sans-serif" font-size="17" fill="#b8005a" opacity="0.75">&#9825; yumeshipping since forever &#9825;</text>

  <!-- header divider dashed line -->
  <line x1="64" y1="136" x2="1136" y2="136" stroke="#ff8fc7" stroke-width="2" stroke-dasharray="9 7" opacity="0.6"/>

  <!-- title card -->
  <rect x="90" y="185" width="1020" height="290" rx="34" fill="url(#cardEdge)" stroke="#ff8fc7" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- title (double + glow offset like h1 text-shadow) -->
  <text x="603" y="347" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="72" fill="#37c9ff">{{TITLE}}</text>
  <text x="597" y="347" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="72" fill="#ff4fa8">{{TITLE}}</text>
  <text x="600" y="345" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="72" fill="#3a1030">{{TITLE}}</text>

  <!-- footer tagline -->
  <text x="600" y="592" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#b8005a" opacity="0.85">I LOVE YOU &#8212; block the haters, keep the love &#9825;</text>
</svg>
