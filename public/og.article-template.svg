<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e6dcf2"/>
    <stop offset="100%" stop-color="#f5f1fb"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e1528"/>
    <stop offset="100%" stop-color="#3d2256"/>
  </linearGradient>
  <pattern id="scn" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="3" width="1200" height="1" fill="#9a648c" fill-opacity="0.05"/>
  </pattern>
</defs>

<!-- Base background -->
<rect width="1200" height="630" fill="#f0ecf8"/>
<!-- Lavender gradient wash -->
<rect width="1200" height="630" fill="url(#bg)" opacity="0.55"/>
<!-- Scanlines -->
<rect width="1200" height="630" fill="url(#scn)"/>

<!-- Decorative concentric rings — empty room, stage with nobody on it -->
<circle cx="1110" cy="595" r="340" stroke="#7b4060" stroke-width="1.5" fill="none" opacity="0.09"/>
<circle cx="1110" cy="595" r="272" stroke="#7b4060" stroke-width="1" fill="none" opacity="0.07"/>
<circle cx="1110" cy="595" r="204" stroke="#7b4060" stroke-width="0.8" fill="none" opacity="0.055"/>
<circle cx="1110" cy="595" r="136" stroke="#7b4060" stroke-width="0.5" fill="none" opacity="0.04"/>

<!-- Glitch blocks — right side, just below header -->
<rect x="1080" y="107" width="80" height="2.5" fill="#7b4060" fill-opacity="0.32"/>
<rect x="1120" y="113" width="40" height="1.5" fill="#7b4060" fill-opacity="0.18"/>
<rect x="1092" y="118" width="68" height="1" fill="#50b4dc" fill-opacity="0.14"/>

<!-- ── Header ── -->
<rect x="0" y="0" width="1200" height="96" fill="#140f1e"/>
<rect x="0" y="0" width="1200" height="96" fill="url(#scn)"/>
<rect x="0" y="96" width="1200" height="3" fill="#7b4060"/>

<!-- Site name -->
<text x="60" y="57" font-family="serif" font-size="30" fill="#ede0f8" letter-spacing="6">へのへのんのの</text>
<text x="62" y="80" font-family="sans-serif" font-size="11" fill="#9a7aaa" letter-spacing="5">b l o g</text>
<text x="1140" y="57" font-family="sans-serif" font-size="11" fill="#5c4870" letter-spacing="3" text-anchor="end">a r t i c l e</text>

<!-- ── Left accent bar ── -->
<rect x="46" y="108" width="2" height="462" fill="#7b4060" fill-opacity="0.2"/>

<!-- ── Dashed horizontal rules ── -->
<line x1="60" y1="140" x2="1140" y2="140" stroke="#7b4060" stroke-width="0.7" stroke-dasharray="3,11" opacity="0.15"/>
<line x1="60" y1="502" x2="1140" y2="502" stroke="#7b4060" stroke-width="0.7" stroke-dasharray="3,11" opacity="0.15"/>

<!-- ── Title ── -->
<!-- Accent glitch offset (+3, +3) -->
<text x="63" y="383" font-family="serif" font-size="76" fill="#7b4060" fill-opacity="0.2" letter-spacing="2">{{TITLE}}</text>
<!-- Cyan glitch offset (−1, −1) -->
<text x="59" y="379" font-family="serif" font-size="76" fill="#50b4dc" fill-opacity="0.08" letter-spacing="2">{{TITLE}}</text>
<!-- Main title -->
<text x="60" y="380" font-family="serif" font-size="76" fill="url(#tg)" letter-spacing="2">{{TITLE}}</text>

<!-- ── Bottom bar ── -->
<rect x="0" y="612" width="1200" height="18" fill="#7b4060"/>
</svg>
