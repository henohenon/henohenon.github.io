<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1f2b"/>
      <stop offset="55%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ff4d3d"/>
