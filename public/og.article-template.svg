<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect width="1" height="4" fill="#07090f"/>
    <rect y="3" width="1" height="1" fill="#000000" fill-opacity="0.07"/>
  </pattern>
  <linearGradient id="topAtmos" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0c1520" stop-opacity="0.90"/>
    <stop offset="25%" stop-color="#0c1520" stop-opacity="0.40"/>
    <stop offset="55%" stop-color="#07090f" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx="600" cy="330" r="400" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#52b0ee" stop-opacity="0.055"/>
    <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hFade" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#52b0ee" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#52b0ee" stop-opacity="0.45"/>
    <stop offset="50%"  stop-color="#52b0ee" stop-opacity="0.72"/>
    <stop offset="75%"  stop-color="#52b0ee" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hFadeDim" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#52b0ee" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#52b0ee" stop-opacity="0.20"/>
    <stop offset="50%"  stop-color="#52b0ee" stop-opacity="0.38"/>
    <stop offset="75%"  stop-color="#52b0ee" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vFade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#52b0ee" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#52b0ee" stop-opacity="0.28"/>
    <stop offset="50%"  stop-color="#52b0ee" stop-opacity="0.44"/>
    <stop offset="80%"  stop-color="#52b0ee" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#52b0ee" stop-opacity="0"/>
  </linearGradient>
  <filter id="titleGlow" x="-15%" y="-80%" width="130%" height="260%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
    <feFlood flood-color="#52b0ee" flood-opacity="0.50" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
    <feMerge>
      <feMergeNode in="colorBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Base background -->
<rect width="1200" height="630" fill="#07090f"/>
<!-- CRT scan lines -->
<rect width="1200" height="630" fill="url(#scan)"/>
<!-- Top atmospheric depth gradient -->
<rect width="1200" height="630" fill="url(#topAtmos)"/>
<!-- Center ambient glow around title -->
<rect width="1200" height="630" fill="url(#centerGlow)"/>

<!-- Outer border: top -->
<rect x="0" y="0" width="1200" height="1.5" fill="url(#hFade)"/>
<!-- Outer border: bottom -->
<rect x="0" y="628.5" width="1200" height="1.5" fill="url(#hFade)"/>
<!-- Outer border: left -->
<rect x="46" y="0" width="1.5" height="630" fill="url(#vFade)"/>
<!-- Outer border: right -->
<rect x="1152.5" y="0" width="1.5" height="630" fill="url(#vFade)"/>

<!-- Inner frame: upper drift line -->
<rect x="74" y="174" width="1052" height="1" fill="url(#hFadeDim)"/>
<!-- Inner frame: lower drift line -->
<rect x="74" y="456" width="1052" height="1" fill="url(#hFadeDim)"/>

<!-- Corner brackets — top-left -->
<rect x="46"    y="174" width="30"  height="1.5" fill="#52b0ee" fill-opacity="0.62"/>
<rect x="46"    y="174" width="1.5" height="30"  fill="#52b0ee" fill-opacity="0.62"/>
<!-- Corner brackets — top-right -->
<rect x="1124"  y="174" width="30"  height="1.5" fill="#52b0ee" fill-opacity="0.62"/>
<rect x="1152.5" y="174" width="1.5" height="30" fill="#52b0ee" fill-opacity="0.62"/>
<!-- Corner brackets — bottom-left -->
<rect x="46"    y="455" width="30"  height="1.5" fill="#52b0ee" fill-opacity="0.62"/>
<rect x="46"    y="427" width="1.5" height="30"  fill="#52b0ee" fill-opacity="0.62"/>
<!-- Corner brackets — bottom-right -->
<rect x="1124"  y="455" width="30"  height="1.5" fill="#52b0ee" fill-opacity="0.62"/>
<rect x="1152.5" y="427" width="1.5" height="30" fill="#52b0ee" fill-opacity="0.62"/>

<!-- Memory light dots — top area -->
<circle cx="146"  cy="108" r="2.0" fill="#52b0ee" fill-opacity="0.55" filter="url(#dotGlow)"/>
<circle cx="214"  cy="80"  r="1.2" fill="#52b0ee" fill-opacity="0.32"/>
<circle cx="290"  cy="126" r="1.5" fill="#52b0ee" fill-opacity="0.20"/>
<circle cx="360"  cy="92"  r="0.8" fill="#52b0ee" fill-opacity="0.18"/>
<circle cx="936"  cy="96"  r="2.2" fill="#52b0ee" fill-opacity="0.50" filter="url(#dotGlow)"/>
<circle cx="1008" cy="72"  r="1.5" fill="#52b0ee" fill-opacity="0.30"/>
<circle cx="1066" cy="118" r="1.0" fill="#52b0ee" fill-opacity="0.22"/>
<circle cx="1118" cy="94"  r="2.5" fill="#52b0ee" fill-opacity="0.42" filter="url(#dotGlow)"/>

<!-- Memory light dots — bottom area -->
<circle cx="122"  cy="516" r="1.0" fill="#52b0ee" fill-opacity="0.17"/>
<circle cx="174"  cy="544" r="1.5" fill="#52b0ee" fill-opacity="0.14"/>
<circle cx="1072" cy="528" r="1.5" fill="#52b0ee" fill-opacity="0.18"/>
<circle cx="1122" cy="552" r="1.0" fill="#52b0ee" fill-opacity="0.15"/>

<!-- Article title: glow layer -->
<text
  x="600" y="333"
  font-family="serif"
  font-size="66"
  text-anchor="middle"
  fill="#52b0ee"
  fill-opacity="0.18"
  filter="url(#titleGlow)"
>{{TITLE}}</text>

<!-- Article title: main layer -->
<text
  x="600" y="333"
  font-family="serif"
  font-size="66"
  text-anchor="middle"
  fill="#c9d5ea"
  letter-spacing="3"
>{{TITLE}}</text>

<!-- Site name flanking lines -->
<rect x="166" y="552" width="144" height="1" fill="#52b0ee" fill-opacity="0.20"/>
<rect x="890" y="552" width="144" height="1" fill="#52b0ee" fill-opacity="0.20"/>

<!-- Site name -->
<text
  x="600" y="576"
  font-family="sans-serif"
  font-size="21"
  text-anchor="middle"
  fill="#52b0ee"
  fill-opacity="0.68"
  letter-spacing="7"
>へのへのんのの</text>
</svg>
