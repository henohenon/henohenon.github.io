  <rect x="1176" y="0" width="24" height="630" fill="url(#hazard)" opacity="0.22"/>

  <circle cx="70" cy="56" r="7" fill="#ff4d3d"/>
  <circle cx="98" cy="56" r="7" fill="#ffb199" opacity="0.55"/>
  <circle cx="126" cy="56" r="7" fill="#ffb199" opacity="0.3"/>

  <text x="150" y="64" font-family="sans-serif" font-size="30" font-weight="800" fill="#f3efe7" letter-spacing="0.04em">へのへのんのの</text>
  <line x1="150" y1="78" x2="430" y2="78" stroke="#ff4d3d" stroke-width="3"/>

  <rect x="60" y="128" width="150" height="34" rx="4" fill="#ff4d3d"/>
  <text x="80" y="151" font-family="sans-serif" font-size="18" font-weight="700" fill="#12141c" letter-spacing="0.08em">NOW READING</text>

  <rect x="60" y="188" width="1080" height="330" rx="14" fill="#1c1f2b" opacity="0.92" stroke="#333750" stroke-width="2"/>
  <rect x="60" y="188" width="8" height="330" rx="4" fill="#ff4d3d"/>

  <text x="102" y="330" font-family="sans-serif" font-size="76" font-weight="800" fill="none" stroke="#0b0c12" stroke-width="2" opacity="0.5">{{TITLE}}</text>
  <text x="100" y="328" font-family="sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)">{{TITLE}}</text>

  <text x="102" y="470" font-family="sans-serif" font-size="22" font-weight="600" fill="#f3efe7" opacity="0.6" letter-spacing="0.06em">ARTICLE / 夜の駅ホーム日誌</text>

  <rect x="0" y="606" width="1200" height="4" fill="#ff4d3d"/>
