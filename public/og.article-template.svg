  <text x="65" y="77" font-family="sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="#ffcc33" opacity="0.45" filter="url(#glow)">へのへのんのの</text>
  <text x="64" y="76" font-family="sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="#fbeee0">へのへのんのの</text>

  <rect x="60" y="185" width="1080" height="235" rx="28" fill="url(#panelFill)" stroke="#ffcc33" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="60" y="205" width="8" height="195" rx="4" fill="#ffcc33"/>
  <rect x="92" y="163" width="16" height="16" fill="#ff4fa3" opacity="0.85" transform="rotate(45 100 171)"/>

  <g clip-path="url(#titleClip)">
