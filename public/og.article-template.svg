<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowTeal" cx="18%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#45e0c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#45e0c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="85%" cy="105%" r="75%">
      <stop offset="0%" stop-color="#ff4fa0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4fa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e0c4"/>
      <stop offset="55%" stop-color="#e7e2f4"/>
      <stop offset="100%" stop-color="#ff4fa0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45e0c4"/>
      <stop offset="100%" stop-color="#ff4fa0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#45e0c4" flood-opacity="0.2"/>
    </filter>
    <pattern id="flood" width="140" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="140" y2="6" stroke="#45e0c4" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="2 10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0c1a"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowPink)"/>
  <rect width="1200" height="240" fill="url(#flood)"/>

  <g fill="none" stroke="#45e0c4" stroke-opacity="0.22">
    <circle cx="1090" cy="555" r="36"/>
    <circle cx="1090" cy="555" r="72"/>
    <circle cx="1090" cy="555" r="110"/>
  </g>
  <g fill="none" stroke="#ff4fa0" stroke-opacity="0.16">
    <circle cx="86" cy="52" r="24"/>
    <circle cx="86" cy="52" r="50"/>
  </g>

  <text x="60" y="76" font-family="sans-serif" font-size="30" fill="#e7e2f4" fill-opacity="0.88" letter-spacing="0.06em">へのへのんのの</text>
  <rect x="60" y="94" width="150" height="3" fill="url(#barGrad)" opacity="0.85"/>

  <rect x="70" y="196" width="1060" height="300" rx="18" fill="#17152b" stroke="#322e52" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="70" y="196" width="6" height="300" rx="3" fill="url(#barGrad)" opacity="0.9"/>

  <text x="122" y="330" font-family="sans-serif" font-size="72" font-weight="700" fill="url(#titleGrad)">{{TITLE}}</text>

  <text x="122" y="446" font-family="sans-serif" font-size="22" fill="#b9b3d1" letter-spacing="0.08em">NUMB LIFE — 洪水に沈む夜の記録</text>

  <rect x="0" y="626" width="1200" height="4" fill="url(#barGrad)" opacity="0.75"/>
</svg>
