<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161314"/>
      <stop offset="100%" stop-color="#0d0b0c"/>
    </linearGradient>
    <radialGradient id="rustGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d7263d" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#d7263d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7e3df"/>
      <stop offset="70%" stop-color="#e7e3df"/>
      <stop offset="100%" stop-color="#ff5a4a"/>
    </linearGradient>
    <linearGradient id="plateLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7263d" stop-opacity="0"/>
      <stop offset="30%" stop-color="#d7263d"/>
      <stop offset="50%" stop-color="#ff5a4a"/>
      <stop offset="70%" stop-color="#d7263d"/>
      <stop offset="100%" stop-color="#d7263d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#e7e3df" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" x="0" y="0" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="4" height="1" fill="#000000" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#0d0b0c"/>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#rustGlow)"/>

  <!-- steel plate frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#2a2628" stroke-width="1"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#2a2628" stroke-width="1" stroke-opacity="0.6"/>

  <!-- corner bolts -->
  <g fill="#2a2628" stroke="#050405" stroke-width="1">
    <circle cx="64" cy="64" r="6"/>
    <circle cx="1136" cy="64" r="6"/>
    <circle cx="64" cy="566" r="6"/>
    <circle cx="1136" cy="566" r="6"/>
  </g>
  <g fill="#161314" stroke="#8a8480" stroke-width="0.5" stroke-opacity="0.4">
    <circle cx="64" cy="64" r="2"/>
    <circle cx="1136" cy="64" r="2"/>
    <circle cx="64" cy="566" r="2"/>
    <circle cx="1136" cy="566" r="2"/>
  </g>

  <!-- top header bar -->
  <rect x="40" y="40" width="1120" height="78" fill="#161314"/>
  <rect x="40" y="118" width="1120" height="3" fill="url(#plateLine)"/>

  <!-- header content -->
  <text x="80" y="90" font-family="monospace" font-size="22" fill="#d7263d" letter-spacing="6">// MACHINE ONLINE</text>
  <text x="1120" y="90" font-family="monospace" font-size="20" fill="#8a8480" text-anchor="end" letter-spacing="4">SYS://LOG.0xFE</text>

  <!-- site name -->
  <text x="80" y="200" font-family="monospace" font-size="28" fill="#e7e3df" letter-spacing="8">へのへのんのの</text>
  <line x1="80" y1="218" x2="280" y2="218" stroke="#d7263d" stroke-width="2"/>
  <line x1="290" y1="218" x2="320" y2="218" stroke="#d7263d" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- title accent bar (left) -->
  <rect x="60" y="270" width="6" height="180" fill="#d7263d"/>
  <rect x="60" y="270" width="6" height="40" fill="#ff5a4a"/>

  <!-- drip from accent bar -->
  <rect x="62" y="450" width="2" height="36" fill="#d7263d" opacity="0.7"/>
  <circle cx="63" cy="492" r="3" fill="#d7263d"/>

  <!-- TITLE -->
  <text x="100" y="360" font-family="serif" font-size="72" font-weight="700" fill="url(#titleGrad)" letter-spacing="2">{{TITLE}}</text>

  <!-- sparks / rivets row -->
  <g opacity="0.9">
    <circle cx="100" cy="500" r="2" fill="#ff5a4a"/>
    <circle cx="120" cy="500" r="1.5" fill="#d7263d"/>
    <circle cx="138" cy="500" r="1" fill="#6b1a22"/>
    <circle cx="154" cy="500" r="1.5" fill="#d7263d"/>
  </g>

  <!-- bottom plate -->
  <rect x="40" y="510" width="1120" height="80" fill="#050405"/>
  <rect x="40" y="510" width="1120" height="1" fill="#6b1a22"/>

  <!-- dashed hr in bottom plate -->
  <g transform="translate(80,540)">
    <rect x="0" y="0" width="12" height="2" fill="#d7263d"/>
    <rect x="20" y="0" width="12" height="2" fill="#d7263d"/>
    <rect x="40" y="0" width="12" height="2" fill="#d7263d"/>
    <rect x="60" y="0" width="12" height="2" fill="#d7263d"/>
    <rect x="80" y="0" width="12" height="2" fill="#d7263d"/>
    <rect x="100" y="0" width="12" height="2" fill="#d7263d"/>
  </g>

  <!-- bottom meta -->
  <text x="80" y="572" font-family="monospace" font-size="16" fill="#8a8480" letter-spacing="6">[ POST ] ⚙ STEEL &amp; RUST LOG</text>
  <text x="1120" y="572" font-family="monospace" font-size="16" fill="#d7263d" text-anchor="end" letter-spacing="4">⚙ ONLINE</text>

  <!-- right side gear ornament -->
  <g transform="translate(1020,300)" opacity="0.25" fill="none" stroke="#d7263d" stroke-width="2">
    <circle r="90"/>
    <circle r="60"/>
    <circle r="30"/>
    <g stroke="#d7263d" stroke-width="3">
      <line x1="-100" y1="0" x2="-80" y2="0"/>
      <line x1="100" y1="0" x2="80" y2="0"/>
      <line x1="0" y1="-100" x2="0" y2="-80"/>
      <line x1="0" y1="100" x2="0" y2="80"/>
      <line x1="-70" y1="-70" x2="-56" y2="-56"/>
      <line x1="70" y1="-70" x2="56" y2="-56"/>
      <line x1="-70" y1="70" x2="-56" y2="56"/>
      <line x1="70" y1="70" x2="56" y2="56"/>
    </g>
  </g>

  <!-- scanlines overlay -->
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.5"/>
</svg>
