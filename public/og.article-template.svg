<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main diagonal background (mirrors site-header gradient) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#0e0c24"/>
      <stop offset="38%"  stop-color="#1c1035"/>
      <stop offset="72%"  stop-color="#2c1400"/>
      <stop offset="100%" stop-color="#3e1800"/>
    </linearGradient>
    <!-- Fire radial glow from below -->
    <radialGradient id="rg-fire" cx="50%" cy="108%" r="72%">
      <stop offset="0%"  stop-color="#ff6018" stop-opacity="0.52"/>
      <stop offset="30%" stop-color="#e03820" stop-opacity="0.26"/>
      <stop offset="64%" stop-color="#0b091a" stop-opacity="0"/>
    </radialGradient>
    <!-- Dawn sky glow from above -->
    <radialGradient id="rg-sky" cx="50%" cy="-4%" r="62%">
      <stop offset="0%"  stop-color="#1e3a6e" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#0b091a" stop-opacity="0"/>
    </radialGradient>
    <!-- Luka-pink subtle accent (right side) -->
    <radialGradient id="rg-luka" cx="106%" cy="52%" r="54%">
      <stop offset="0%"  stop-color="#d94070" stop-opacity="0.18"/>
      <stop offset="52%" stop-color="#0b091a" stop-opacity="0"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="rg-vignette" cx="50%" cy="50%" r="76%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <!-- Title: gold → orange → ember -->
    <linearGradient id="lg-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5c040"/>
      <stop offset="50%"  stop-color="#ff6018"/>
      <stop offset="100%" stop-color="#e03820"/>
    </linearGradient>
    <!-- Site name: cream → gold -->
    <linearGradient id="lg-name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0e5cc"/>
      <stop offset="100%" stop-color="#f5a800"/>
    </linearGradient>
    <!-- Horizontal rule -->
    <linearGradient id="lg-hr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff6018" stop-opacity="0"/>
      <stop offset="6%"   stop-color="#ff6018"/>
      <stop offset="55%"  stop-color="#f5a800"/>
      <stop offset="90%"  stop-color="#ff6018" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6018" stop-opacity="0"/>
    </linearGradient>
    <!-- Vertical accent bar -->
    <linearGradient id="lg-vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5a800" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#f5a800"/>
      <stop offset="62%"  stop-color="#ff6018"/>
      <stop offset="88%"  stop-color="#e03820"/>
      <stop offset="100%" stop-color="#e03820" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Title glow filter -->
    <filter id="f-glow" x="-10%" y="-45%" width="120%" height="190%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#rg-sky)"/>
  <rect width="1200" height="630" fill="url(#rg-fire)"/>
  <rect width="1200" height="630" fill="url(#rg-luka)"/>
  <rect width="1200" height="630" fill="url(#rg-vignette)"/>

  <!-- ── Left vertical accent bar ── -->
  <rect x="66" y="46" width="5" height="538" rx="2.5" fill="url(#lg-vbar)"/>

  <!-- ── Abstract flame silhouettes — bottom-right corner ── -->
  <path d="M 1002,630 C 1002,562 1028,518 1008,455 C 988,392 1048,364 1034,296 C 1020,228 1074,262 1066,330 C 1104,258 1126,296 1108,361 C 1090,426 1114,448 1098,518 C 1082,578 1055,620 1002,630 Z"
        fill="#ff6018" opacity="0.07"/>
  <path d="M 1090,630 C 1090,574 1114,550 1100,504 C 1086,458 1125,440 1120,397 C 1116,354 1153,378 1147,424 C 1170,373 1190,402 1174,456 C 1158,510 1176,530 1162,580 C 1150,617 1128,628 1090,630 Z"
        fill="#f5a800" opacity="0.065"/>
  <path d="M 1156,630 C 1156,592 1170,574 1163,540 C 1156,506 1179,492 1177,460 C 1175,428 1198,442 1195,475 C 1200,454 1200,482 1200,520 L 1200,630 Z"
        fill="#ff6018" opacity="0.08"/>

  <!-- ── Site name ── -->
  <text x="102" y="106"
        font-family="serif"
        font-size="40"
        fill="url(#lg-name)"
        letter-spacing="0.07em">へのへのんのの</text>

  <!-- Horizontal divider below site name -->
  <rect x="66" y="126" width="1068" height="1.5" fill="url(#lg-hr)"/>

  <!-- Article label -->
  <text x="102" y="170"
        font-family="sans-serif"
        font-size="15"
        fill="#ff6018"
        letter-spacing="0.22em"
        opacity="0.82">A R T I C L E</text>

  <!-- ── Title — glow layer (rendered first, blurred) ── -->
  <text x="102" y="392"
        font-family="serif"
        font-size="72"
        fill="#ff6018"
        opacity="0.26"
        filter="url(#f-glow)">{{TITLE}}</text>

  <!-- ── Title — main fill with gold-fire gradient ── -->
  <text x="102" y="392"
        font-family="serif"
        font-size="72"
        fill="url(#lg-title)">{{TITLE}}</text>

  <!-- ── Bottom accent line ── -->
  <rect x="66" y="556" width="1068" height="2" rx="1" fill="url(#lg-hr)"/>

  <!-- ── Ember sparks (scattered, top-right quadrant) ── -->
  <circle cx="788" cy="208" r="2.2" fill="#f5a800"  opacity="0.58"/>
  <circle cx="836" cy="172" r="1.6" fill="#ff6018"  opacity="0.48"/>
  <circle cx="875" cy="220" r="1.2" fill="#f5c040"  opacity="0.40"/>
  <circle cx="810" cy="246" r="2.6" fill="#e03820"  opacity="0.32"/>
  <circle cx="918" cy="182" r="1.9" fill="#f5a800"  opacity="0.54"/>
  <circle cx="758" cy="190" r="1.3" fill="#ff6018"  opacity="0.42"/>
  <circle cx="948" cy="230" r="2.0" fill="#f5c040"  opacity="0.30"/>
  <circle cx="874" cy="150" r="1.1" fill="#f5a800"  opacity="0.46"/>
  <circle cx="932" cy="258" r="1.5" fill="#ff6018"  opacity="0.26"/>
  <circle cx="738" cy="224" r="1.8" fill="#f5a800"  opacity="0.36"/>
  <circle cx="862" cy="268" r="1.0" fill="#f5c040"  opacity="0.28"/>
  <circle cx="904" cy="142" r="1.4" fill="#ff6018"  opacity="0.38"/>
</svg>
