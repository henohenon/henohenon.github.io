<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- スキャンライン: 1×4 タイル、4px ごとに 1px の暗線 (変な色彩 TVショー) -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="3" fill="none"/>
      <rect y="3" width="1" height="1" fill="#000000" fill-opacity="0.04"/>
    </pattern>
    <!-- 上部ラジアルグロー (body の radial-gradient と同源) -->
    <radialGradient id="glowTop" cx="600" cy="-25" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0456a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0456a" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下コーナーグロー -->
    <radialGradient id="glowBR" cx="1185" cy="675" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0456a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e0456a" stop-opacity="0"/>
    </radialGradient>
    <!-- タイトル背後のソフトグロー -->
    <filter id="titleGlow" x="-3%" y="-80%" width="106%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <!-- ── 背景 ── -->
  <rect width="1200" height="630" fill="#0d0810"/>

  <!-- ── 雰囲気グロー ── -->
  <rect width="1200" height="630" fill="url(#glowTop)"/>
  <rect width="1200" height="630" fill="url(#glowBR)"/>

  <!-- ── スキャンライン ── -->
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- ── コーナーブラケット (画面ベゼル / TV 感) ── -->
  <polyline points="64,30 64,72 106,72"    fill="none" stroke="#e0456a" stroke-width="1.5" stroke-opacity="0.40"/>
  <polyline points="1136,30 1136,72 1094,72"  fill="none" stroke="#e0456a" stroke-width="1.5" stroke-opacity="0.40"/>
  <polyline points="64,600 64,558 106,558"   fill="none" stroke="#e0456a" stroke-width="1.5" stroke-opacity="0.40"/>
  <polyline points="1136,600 1136,558 1094,558" fill="none" stroke="#e0456a" stroke-width="1.5" stroke-opacity="0.40"/>

  <!-- ── ヘッダーエリア ── -->
  <!-- サイト名 -->
  <text x="90" y="96"
        font-family="serif"
        font-size="21"
        fill="#ece0e8"
        fill-opacity="0.48"
        letter-spacing="0.10em">へのへのんのの</text>
  <!-- ヘッダー下セパレーター -->
  <line x1="64" y1="118" x2="1136" y2="118"
        stroke="#e0456a" stroke-width="1" stroke-opacity="0.22"/>

  <!-- ── 左アクセントバー (post-list border-left と同じ役割) ── -->
  <rect x="64" y="164" width="3" height="244" fill="#e0456a" fill-opacity="0.62"/>
  <!-- バー上キャップ (錆びた蝶番の端) -->
  <rect x="62" y="162" width="7" height="2" fill="#e0456a" fill-opacity="0.85"/>
  <!-- バー下キャップ -->
  <rect x="62" y="408" width="7" height="2" fill="#e0456a" fill-opacity="0.55"/>

  <!-- ── 記事タイトル ── -->
  <!-- glow レイヤー (生肉色のピンクが滲む) -->
  <text x="96" y="338"
        font-family="serif"
        font-size="70"
        fill="#e0456a"
        fill-opacity="0.22"
        filter="url(#titleGlow)"
        letter-spacing="0.04em">{{TITLE}}</text>
  <!-- main レイヤー -->
  <text x="96" y="338"
        font-family="serif"
        font-size="70"
        fill="#ece0e8"
        letter-spacing="0.04em">{{TITLE}}</text>

  <!-- タイトル下アクセントライン (h1::after と同構造) -->
  <rect x="96" y="364" width="86" height="2" fill="#e0456a"/>

  <!-- ── フッターセパレーター ── -->
  <line x1="64" y1="528" x2="1136" y2="528"
        stroke="#e0456a" stroke-width="1" stroke-opacity="0.22"/>
</svg>
