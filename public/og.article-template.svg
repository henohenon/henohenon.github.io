<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f0ff"/>
      <stop offset="50%"  stop-color="#ff5599"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="bgDepth" cx="32%" cy="52%" r="68%">
      <stop offset="0%"   stop-color="#0e0e2e"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="28%"  stop-color="#dde4ff"/>
      <stop offset="72%"  stop-color="#b4d0ff"/>
      <stop offset="100%" stop-color="#7ab0ee"/>
    </linearGradient>
    <pattern id="scanPat" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="1200" height="1" fill="#00f0ff" fill-opacity="0.018"/>
    </pattern>
    <pattern id="dotPat" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLine" x="-10%" y="-120%" width="120%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="#07071a"/>
  <rect width="1200" height="630" fill="url(#bgDepth)" opacity="0.72"/>
  <rect width="1200" height="630" fill="url(#dotPat)"/>
  <rect width="1200" height="630" fill="url(#scanPat)"/>

  <!-- TOP BAR -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="3" width="1200" height="20" fill="url(#accentGrad)" opacity="0.09"/>

  <!-- BOTTOM BAR -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentGrad)"/>
  <rect x="0" y="607" width="1200" height="20" fill="url(#accentGrad)" opacity="0.07"/>

  <!-- LEFT VERTICAL BAR -->
  <rect x="62" y="6" width="1" height="551" fill="#00f0ff" opacity="0.2"/>

  <!-- Bar accent dots -->
  <circle cx="62" cy="148" r="3.5" fill="#00f0ff" opacity="0.65" filter="url(#glowLine)"/>
  <circle cx="62" cy="320" r="4.5" fill="#ff5599" opacity="0.60" filter="url(#glowLine)"/>
  <circle cx="62" cy="362" r="3"   fill="#00f0ff" opacity="0.42"/>
  <circle cx="62" cy="557" r="3"   fill="#00f0ff" opacity="0.42" filter="url(#glowLine)"/>

  <!-- CORNER BRACKETS -->
  <path d="M64,20 L64,72 L116,72"   stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.78" filter="url(#glowLine)"/>
  <path d="M1136,20 L1136,72 L1084,72" stroke="#ff5599" stroke-width="1.5" fill="none" opacity="0.65"/>
  <path d="M64,610 L64,558 L116,558" stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.78"/>
  <path d="M1136,610 L1136,558 L1084,558" stroke="#ff5599" stroke-width="1.5" fill="none" opacity="0.65"/>

  <!-- PIXEL CLUSTER — upper right -->
  <rect x="992"  y="112" width="9" height="9" fill="#00f0ff" opacity="0.44" rx="1"/>
  <rect x="1007" y="112" width="9" height="9" fill="#00f0ff" opacity="0.22" rx="1"/>
  <rect x="1022" y="112" width="9" height="9" fill="#ff5599" opacity="0.38" rx="1"/>
  <rect x="1037" y="112" width="9" height="9" fill="#00f0ff" opacity="0.18" rx="1"/>
  <rect x="999"  y="127" width="9" height="9" fill="#ff5599" opacity="0.28" rx="1"/>
  <rect x="1014" y="127" width="9" height="9" fill="#00f0ff" opacity="0.42" rx="1"/>
  <rect x="1029" y="127" width="9" height="9" fill="#7a96cc" opacity="0.36" rx="1"/>
  <rect x="1044" y="127" width="9" height="9" fill="#ff5599" opacity="0.20" rx="1"/>
  <rect x="992"  y="142" width="9" height="9" fill="#7a96cc" opacity="0.26" rx="1"/>
  <rect x="1007" y="142" width="9" height="9" fill="#ff5599" opacity="0.30" rx="1"/>
  <rect x="1022" y="142" width="9" height="9" fill="#00f0ff" opacity="0.28" rx="1"/>
  <rect x="1037" y="142" width="9" height="9" fill="#7a96cc" opacity="0.18" rx="1"/>

  <!-- CIRCUIT LINES — upper right -->
  <line x1="1060" y1="112" x2="1060" y2="200" stroke="#7a96cc" stroke-width="1" opacity="0.20"/>
  <line x1="1060" y1="200" x2="1110" y2="200" stroke="#7a96cc" stroke-width="1" opacity="0.20"/>
  <circle cx="1060" cy="112" r="2"   fill="#7a96cc" opacity="0.35"/>
  <circle cx="1110" cy="200" r="2.5" fill="#00f0ff" opacity="0.40" filter="url(#glowLine)"/>

  <!-- CIRCUIT LINES — lower right -->
  <line x1="930"  y1="442" x2="1060" y2="442" stroke="#7a96cc" stroke-width="1" opacity="0.13"/>
  <line x1="1060" y1="442" x2="1060" y2="502" stroke="#ff5599" stroke-width="1" opacity="0.17"/>
  <circle cx="930"  cy="442" r="2"   fill="#7a96cc" opacity="0.24"/>
  <circle cx="1060" cy="502" r="2.5" fill="#ff5599" opacity="0.28"/>

  <!-- GLITCH ACCENT BLOCKS — right margin -->
  <rect x="1094" y="376" width="34" height="2" fill="#00f0ff" opacity="0.28"/>
  <rect x="1083" y="384" width="48" height="1" fill="#00f0ff" opacity="0.14"/>
  <rect x="1098" y="392" width="28" height="2" fill="#ff5599" opacity="0.24"/>

  <!-- ARTICLE LABEL -->
  <text x="82" y="148" font-family="monospace" font-size="12"
        letter-spacing="0.24em" fill="#00f0ff" opacity="0.72">// POST</text>
  <line x1="82"  y1="158" x2="285" y2="158" stroke="#00f0ff" stroke-width="1"   opacity="0.20"/>
  <line x1="82"  y1="158" x2="165" y2="158" stroke="#00f0ff" stroke-width="1.5" opacity="0.38" filter="url(#glowLine)"/>

  <!-- TITLE — glitch shadow layer 1 (pink, +3/+3) -->
  <text x="83" y="323" font-family="monospace" font-size="68"
        fill="#ff5599" opacity="0.24" letter-spacing="0.02em">{{TITLE}}</text>

  <!-- TITLE — glitch shadow layer 2 (cyan, -3/-3) -->
  <text x="77" y="317" font-family="monospace" font-size="68"
        fill="#00f0ff" opacity="0.20" letter-spacing="0.02em">{{TITLE}}</text>

  <!-- TITLE — main layer -->
  <text x="80" y="320" font-family="monospace" font-size="68"
        fill="url(#titleGrad)" letter-spacing="0.02em">{{TITLE}}</text>

  <!-- SEPARATOR UNDER TITLE -->
  <line x1="82" y1="357" x2="880" y2="357" stroke="#00f0ff"  stroke-width="1"   opacity="0.17"/>
  <line x1="82" y1="357" x2="315" y2="357" stroke="#ff5599"  stroke-width="1.5" opacity="0.52" filter="url(#glowLine)"/>

  <!-- TEXTURE DATA LINES (subtle, decorative) -->
  <text x="82" y="406" font-family="monospace" font-size="10"
        fill="#00f0ff" opacity="0.10" letter-spacing="0.13em">0x48 45 4E 4F 48 45 4E 4F 4E 4E 4F 4E 4F ────</text>
  <text x="82" y="423" font-family="monospace" font-size="10"
        fill="#7a96cc" opacity="0.08" letter-spacing="0.13em">BOOT_SEQUENCE: LOADING ./ARTICLE.EXE ░░░ █</text>

  <!-- FOOTER RULE -->
  <line x1="62" y1="555" x2="1138" y2="555" stroke="#00f0ff" stroke-width="1" opacity="0.14"/>

  <!-- SITE NAME -->
  <text x="82" y="595" font-family="monospace" font-size="24"
        letter-spacing="0.10em" fill="#dde4ff">へのへのんのの</text>

  <!-- FOOTER RIGHT LABEL -->
  <text x="1128" y="595" font-family="monospace" font-size="11"
        letter-spacing="0.18em" fill="#00f0ff" opacity="0.38"
        text-anchor="end">MIDNIGHT · GLITCH · LOVE ░</text>
</svg>
