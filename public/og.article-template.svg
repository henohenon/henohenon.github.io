<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="1200" height="1" fill="#ff2b7e" fill-opacity="0.028"/>
    </pattern>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#07050d" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ff2b7e"/>
      <stop offset="70%"  stop-color="#00ffd0"/>
      <stop offset="100%" stop-color="#07050d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff2b7e"/>
      <stop offset="100%" stop-color="#00ffd0"/>
    </linearGradient>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#160828"/>
      <stop offset="70%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="tg" x1="88" y1="290" x2="1100" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f4f0ff"/>
      <stop offset="100%" stop-color="#c8b8e0"/>
    </linearGradient>
    <radialGradient id="titleGlow" cx="0.44" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff2b7e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ff2b7e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gc1">
      <rect x="0" y="290" width="1200" height="40"/>
    </clipPath>
    <clipPath id="gc2">
      <rect x="0" y="332" width="1200" height="38"/>
    </clipPath>
  </defs>

  <!-- ── Base background ── -->
  <rect width="1200" height="630" fill="#07050d"/>

  <!-- ── Header gradient (mirrors .site-header) ── -->
  <rect width="1200" height="280" fill="url(#hbg)"/>

  <!-- ── Scanlines (mirrors body background-image) ── -->
  <rect width="1200" height="630" fill="url(#sl)"/>

  <!-- ── Top accent line (mirrors .site-header::before) ── -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#hg)"/>

  <!-- ── Scattered glitch noise bars ── -->
  <rect x="0"   y="175" width="360" height="1" fill="#ff2b7e" fill-opacity="0.18"/>
  <rect x="400" y="175" width="140" height="1" fill="#ff2b7e" fill-opacity="0.09"/>
  <rect x="820" y="175" width="260" height="1" fill="#00ffd0" fill-opacity="0.12"/>
  <rect x="0"   y="466" width="500" height="1" fill="#ff2b7e" fill-opacity="0.09"/>
  <rect x="560" y="466" width="640" height="1" fill="#ff2b7e" fill-opacity="0.07"/>
  <rect x="220" y="482" width="90"  height="1" fill="#00ffd0" fill-opacity="0.14"/>

  <!-- ── Corner bracket — top left (HUD / cyberpunk UI) ── -->
  <rect x="60" y="50" width="4"  height="52" fill="#ff2b7e" fill-opacity="0.9"/>
  <rect x="60" y="50" width="52" height="4"  fill="#ff2b7e" fill-opacity="0.9"/>

  <!-- ── Corner bracket — top right ── -->
  <rect x="1136" y="50" width="4"  height="52" fill="#00ffd0" fill-opacity="0.65"/>
  <rect x="1088" y="50" width="52" height="4"  fill="#00ffd0" fill-opacity="0.65"/>

  <!-- ── Corner bracket — bottom right (partial) ── -->
  <rect x="1136" y="574" width="4"  height="4"  fill="#ff2b7e" fill-opacity="0.35"/>
  <rect x="1088" y="574" width="52" height="4"  fill="#ff2b7e" fill-opacity="0.35"/>

  <!-- ── Left vertical accent bar (mirrors article h2 border-left) ── -->
  <rect x="60" y="200" width="4" height="270" fill="url(#vg)"/>

  <!-- ── Title area glow bloom ── -->
  <ellipse cx="540" cy="328" rx="480" ry="112" fill="url(#titleGlow)"/>

  <!-- ── Electronic signal waveform ("乱れた電子の中で二人踊る") ── -->
  <path d="M 0,538 Q 75,522 150,538 Q 225,554 300,532 Q 375,510 450,538 Q 525,561 600,534 Q 675,507 750,538 Q 825,564 900,538 Q 975,511 1050,530 Q 1125,548 1200,532"
        fill="none" stroke="#ff2b7e" stroke-width="1.2" stroke-opacity="0.22"/>
  <path d="M 0,545 Q 75,529 150,545 Q 225,561 300,539 Q 375,517 450,545 Q 525,568 600,541 Q 675,514 750,545 Q 825,571 900,545 Q 975,518 1050,537 Q 1125,555 1200,539"
        fill="none" stroke="#00ffd0" stroke-width="0.7" stroke-opacity="0.15"/>

  <!-- ── Bottom accent line ── -->
  <rect x="0" y="580" width="1200" height="1" fill="url(#hg)" fill-opacity="0.38"/>

  <!-- ── Site name ── -->
  <text x="82" y="100"
        font-family="monospace" font-size="22"
        fill="#e8e1f6" letter-spacing="0.07em" opacity="0.88"
  >へのへのんのの</text>

  <!-- ── ARTICLE category label ── -->
  <text x="82" y="190"
        font-family="monospace" font-size="12"
        fill="#ff2b7e" letter-spacing="0.28em" opacity="0.78"
  >ARTICLE</text>

  <!-- ── Title: glitch ghost — pink, upper band ── -->
  <text x="84" y="354"
        font-family="monospace" font-size="72"
        fill="#ff2b7e" opacity="0.48"
        clip-path="url(#gc1)"
  >{{TITLE}}</text>

  <!-- ── Title: glitch ghost — cyan, lower band ── -->
  <text x="94" y="358"
        font-family="monospace" font-size="72"
        fill="#00ffd0" opacity="0.26"
        clip-path="url(#gc2)"
  >{{TITLE}}</text>

  <!-- ── Title: primary ── -->
  <text x="88" y="354"
        font-family="monospace" font-size="72"
        fill="url(#tg)"
  >{{TITLE}}</text>

  <!-- ── Footer: ghost site name ── -->
  <text x="88" y="608"
        font-family="monospace" font-size="14"
        fill="#e8e1f6" letter-spacing="0.18em" opacity="0.20"
  >へのへのんのの</text>

  <!-- ── Footer: pulse marker ▶ (mirrors .site-footer::before) ── -->
  <text x="1140" y="608"
        font-family="monospace" font-size="14"
        fill="#ff2b7e" opacity="0.58" text-anchor="middle"
  >▶</text>
</svg>
