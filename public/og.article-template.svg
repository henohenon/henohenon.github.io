    <radialGradient id="glow" cx="78%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#ff4d3d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff4d3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="trackDashes" width="40" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="6" fill="#ffb199"/>
