<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fd8ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2fa0"/>
      <stop offset="55%" stop-color="#ff6fc4"/>
      <stop offset="100%" stop-color="#2fd8ff"/>
    </linearGradient>
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fa0"/>
      <stop offset="50%" stop-color="#ffd6ef"/>
      <stop offset="100%" stop-color="#2fd8ff"/>
    </linearGradient>
    <pattern id="scan" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="30" height="30" fill="transparent"/>
      <rect width="3" height="30" fill="#2fd8ff" opacity="0.10"/>
    </pattern>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="2.2" fill="#ff2fa0" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#fff3fa"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>

  <circle cx="150" cy="120" r="260" fill="url(#blob1)"/>
  <circle cx="1030" cy="90" r="250" fill="url(#blob2)"/>
  <circle cx="860" cy="560" r="300" fill="url(#blob3)"/>

  <!-- top gradient bar -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#topbarGrad)"/>

  <!-- outer frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#ffd6ef" stroke-width="4"/>

  <!-- smartphone glow icon (top-right) -->
  <rect x="1040" y="46" width="80" height="150" rx="18" fill="#ffd6ef" fill-opacity="0.35" stroke="#2fd8ff" stroke-width="3"/>
  <rect x="1064" y="58" width="32" height="6" rx="3" fill="#2a1b3d" fill-opacity="0.35"/>
  <circle cx="1080" cy="178" r="7" fill="none" stroke="#ff2fa0" stroke-width="2.5"/>

  <!-- site logo -->
  <circle cx="70" cy="76" r="8" fill="#2fd8ff"/>
  <text x="94" y="87" font-family="sans-serif" font-size="34" font-weight="700" fill="#2a1b3d">へのへのんのの</text>
  <line x1="60" y1="106" x2="470" y2="106" stroke="#ff2fa0" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <line x1="60" y1="106" x2="470" y2="106" stroke="#2fd8ff" stroke-width="3" stroke-dasharray="10 8" stroke-dashoffset="10" stroke-linecap="round"/>

  <!-- title -->
  <text x="600" y="360" text-anchor="middle" font-family="sans-serif" font-size="76" font-weight="700" fill="none" stroke="#2a1b3d" stroke-width="11" stroke-linejoin="round" opacity="0.92">{{TITLE}}</text>
  <text x="600" y="360" text-anchor="middle" font-family="sans-serif" font-size="76" font-weight="700" fill="url(#titleGrad)">{{TITLE}}</text>

  <line x1="230" y1="420" x2="970" y2="420" stroke="#ff2fa0" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
  <line x1="230" y1="420" x2="970" y2="420" stroke="#2fd8ff" stroke-width="3" stroke-dasharray="14 10" stroke-dashoffset="14" stroke-linecap="round"/>

  <!-- heartbeat pulse (bottom-left) -->
  <polyline points="60,560 130,560 155,520 180,595 205,540 230,560 300,560" fill="none" stroke="#ff2fa0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- equalizer bars (bottom-right) -->
  <rect x="900" y="565" width="14" height="30" rx="4" fill="#ff2fa0" opacity="0.55"/>
  <rect x="924" y="540" width="14" height="55" rx="4" fill="#2fd8ff" opacity="0.55"/>
  <rect x="948" y="555" width="14" height="40" rx="4" fill="#ff2fa0" opacity="0.5"/>
  <rect x="972" y="525" width="14" height="70" rx="4" fill="#2fd8ff" opacity="0.6"/>
  <rect x="996" y="548" width="14" height="47" rx="4" fill="#ff2fa0" opacity="0.5"/>
  <rect x="1020" y="565" width="14" height="30" rx="4" fill="#2fd8ff" opacity="0.55"/>
</svg>
