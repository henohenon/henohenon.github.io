<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowTL" cx="20%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#e6002e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#e6002e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowBR" cx="80%" cy="110%" r="65%">
      <stop offset="0%" stop-color="#780014" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#780014" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hrLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6002e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6002e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6002e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <pattern id="marchStripes" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="36" fill="#e6002e" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#0d0608"/>
  <rect width="1200" height="630" fill="url(#bgGlowTL)"/>
  <rect width="1200" height="630" fill="url(#bgGlowBR)"/>

  <!-- 隅の警告ストライプ -->
  <rect x="0" y="0" width="180" height="80" fill="url(#marchStripes)"/>
  <rect x="1020" y="550" width="180" height="80" fill="url(#marchStripes)"/>

  <!-- スキャンライン -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- 上下の決意のライン -->
  <rect x="60" y="92" width="1080" height="2" fill="#e6002e"/>
  <rect x="60" y="98" width="380" height="1" fill="#e6002e" fill-opacity="0.5"/>
  <rect x="60" y="536" width="1080" height="2" fill="#e6002e"/>
  <rect x="760" y="530" width="380" height="1" fill="#e6002e" fill-opacity="0.5"/>

  <!-- 左サイドの太い縦アクセント (border-left: 4px solid の color-accent 引用) -->
  <rect x="60" y="160" width="6" height="320" fill="#e6002e"/>

  <!-- ステップ・マーカー (一歩ずつのリズム) -->
  <g fill="#e6002e">
    <rect x="90" y="556" width="14" height="6"/>
    <rect x="116" y="556" width="14" height="6" fill-opacity="0.75"/>
    <rect x="142" y="556" width="14" height="6" fill-opacity="0.55"/>
    <rect x="168" y="556" width="14" height="6" fill-opacity="0.35"/>
    <rect x="194" y="556" width="14" height="6" fill-opacity="0.2"/>
  </g>

  <!-- サイト名 -->
  <text x="80" y="64" font-family="sans-serif" font-size="26" font-weight="900" fill="#d8c9bf" letter-spacing="6">へのへのんのの</text>
  <text x="80" y="64" font-family="sans-serif" font-size="26" font-weight="900" fill="#e6002e" letter-spacing="6" opacity="0.5" transform="translate(2,0)">へのへのんのの</text>

  <!-- 右上のラベル -->
  <text x="1120" y="64" font-family="monospace" font-size="18" fill="#8a6b6f" letter-spacing="4" text-anchor="end">▸ ARTICLE</text>

  <!-- 装飾の小さな○ パルス位置 (h2::after 引用) -->
  <circle cx="92" cy="172" r="8" fill="#e6002e"/>

  <!-- 記事タイトル -->
  <text x="110" y="320" font-family="sans-serif" font-size="78" font-weight="900" fill="#d8c9bf" letter-spacing="2">{{TITLE}}</text>
  <text x="110" y="320" font-family="sans-serif" font-size="78" font-weight="900" fill="none" stroke="#e6002e" stroke-width="1" opacity="0.55" letter-spacing="2" transform="translate(3,0)">{{TITLE}}</text>

  <!-- グラデの水平線 (hr 引用) -->
  <rect x="110" y="380" width="980" height="1" fill="url(#hrLine)"/>

  <!-- 下部の引用記号風 装飾 -->
  <text x="110" y="500" font-family="serif" font-size="48" fill="#e6002e" opacity="0.7">「</text>
  <text x="110" y="500" font-family="monospace" font-size="20" fill="#8a6b6f" letter-spacing="6" dx="48">— もう一歩先へ —</text>
  <text x="1090" y="500" font-family="serif" font-size="48" fill="#e6002e" opacity="0.7" text-anchor="end">」</text>

  <!-- 右下の小さなマーカー -->
  <g transform="translate(1040,160)">
    <rect x="0" y="0" width="60" height="2" fill="#e6002e"/>
    <rect x="0" y="6" width="40" height="2" fill="#e6002e" fill-opacity="0.6"/>
    <rect x="0" y="12" width="20" height="2" fill="#e6002e" fill-opacity="0.35"/>
  </g>
</svg>
