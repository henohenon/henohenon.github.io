<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="18%" cy="12%" r="50%">
      <stop offset="0%" stop-color="#ff2da8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff2da8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#c6ff2e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c6ff2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8f4"/>
