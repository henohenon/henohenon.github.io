<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="diagStripes" patternUnits="userSpaceOnUse" width="36" height="36" patternTransform="rotate(45)">
      <rect x="0" y="0" width="36" height="36" fill="#0a0d1a"/>
      <rect x="0" y="0" width="18" height="36" fill="#f2c230" opacity="0.04"/>
    </pattern>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#f2c230" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#f2c230" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#f2c230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f2e6"/>
      <stop offset="75%" stop-color="#e9e6da"/>
      <stop offset="100%" stop-color="#c9c4b0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1200" height="630" fill="#0a0d1a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#diagStripes)"/>
  <rect x="0" y="0" width="1200" height="460" fill="url(#spotlight)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#vignette)"/>

  <!-- top double border (site-header motif) -->
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#a68a2a" stroke-width="2" opacity="0.55"/>
  <line x1="0" y1="59" x2="1200" y2="59" stroke="#a68a2a" stroke-width="2" opacity="0.35"/>

  <!-- bottom double border -->
  <line x1="0" y1="570" x2="1200" y2="570" stroke="#a68a2a" stroke-width="2" opacity="0.35"/>
  <line x1="0" y1="577" x2="1200" y2="577" stroke="#a68a2a" stroke-width="2" opacity="0.55"/>

  <!-- corner dossier brackets -->
  <path d="M 48 90 L 48 60 L 78 60" fill="none" stroke="#a68a2a" stroke-width="2" opacity="0.5"/>
  <path d="M 1152 90 L 1152 60 L 1122 60" fill="none" stroke="#a68a2a" stroke-width="2" opacity="0.5"/>
  <path d="M 48 540 L 48 570 L 78 570" fill="none" stroke="#a68a2a" stroke-width="2" opacity="0.35"/>
  <path d="M 1152 540 L 1152 570 L 1122 570" fill="none" stroke="#a68a2a" stroke-width="2" opacity="0.35"/>

  <!-- site name -->
  <text x="60" y="112" font-family="serif" font-size="30" letter-spacing="6" fill="#f2c230">へのへのんのの</text>
  <line x1="60" y1="128" x2="230" y2="128" stroke="#a68a2a" stroke-width="1" opacity="0.6"/>

  <!-- scales of justice watermark -->
  <g opacity="0.32" stroke="#a68a2a" stroke-width="3" fill="none">
    <line x1="1080" y1="430" x2="1080" y2="522"/>
    <line x1="1000" y1="440" x2="1160" y2="440"/>
    <line x1="1000" y1="440" x2="978" y2="482"/>
    <line x1="1160" y1="440" x2="1182" y2="482"/>
    <circle cx="978" cy="490" r="16"/>
    <circle cx="1182" cy="490" r="16"/>
    <ellipse cx="1080" cy="526" rx="42" ry="7"/>
  </g>

  <!-- accusatory mark -->
  <circle cx="66" cy="298" r="9" fill="#c23a3a" opacity="0.9"/>
  <circle cx="66" cy="298" r="16" fill="none" stroke="#c23a3a" opacity="0.3" stroke-width="2"/>

  <!-- title -->
  <text x="98" y="332" font-family="serif" font-size="72" fill="#c23a3a" opacity="0.5" filter="url(#glow)">{{TITLE}}</text>
  <text x="98" y="332" font-family="serif" font-size="72" fill="url(#titleFade)">{{TITLE}}</text>

  <line x1="98" y1="366" x2="520" y2="366" stroke="#a68a2a" stroke-width="2" opacity="0.5"/>

  <text x="98" y="410" font-family="sans-serif" font-size="20" letter-spacing="3" fill="#b9b6a8" opacity="0.75">深夜0時、鏡の中の被告席</text>
</svg>
