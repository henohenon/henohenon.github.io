<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6fb"/>
      <stop offset="35%" stop-color="#ffe9f5"/>
      <stop offset="70%" stop-color="#e8f9ff"/>
      <stop offset="100%" stop-color="#fff6fb"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#c2007a"/>
      <stop offset="45%" stop-color="#ff6fc0"/>
      <stop offset="100%" stop-color="#00b6c9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2007a"/>
      <stop offset="100%" stop-color="#00b6c9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- soft confetti circles scattered across the canvas -->
  <circle cx="70" cy="150" r="10" fill="#ffd6ec" opacity="0.9"/>
  <circle cx="1140" cy="170" r="14" fill="#c2007a" opacity="0.18"/>
  <circle cx="1080" cy="500" r="22" fill="#00b6c9" opacity="0.15"/>
  <circle cx="60" cy="520" r="16" fill="#ffd6ec" opacity="0.8"/>
  <circle cx="150" cy="470" r="7" fill="#c2007a" opacity="0.35"/>
  <circle cx="1050" cy="130" r="8" fill="#ffd6ec" opacity="0.9"/>

  <!-- sparkle stars for idol-pop sparkle -->
  <path d="M100,470 L104,479 L113,483 L104,487 L100,496 L96,487 L87,483 L96,479 Z" fill="#00b6c9" opacity="0.55"/>
  <path d="M1120,540 L1125,552 L1137,557 L1125,562 L1120,574 L1115,562 L1103,557 L1115,552 Z" fill="#c2007a" opacity="0.4"/>
  <path d="M1150,420 L1153,427 L1160,430 L1153,433 L1150,440 L1147,433 L1140,430 L1147,427 Z" fill="#ffd6ec"/>
  <path d="M55,300 L58,307 L65,310 L58,313 L55,320 L52,313 L45,310 L52,307 Z" fill="#c2007a" opacity="0.5"/>

  <!-- top gradient band -->
  <rect x="0" y="0" width="1200" height="112" fill="url(#headerGrad)"/>
  <rect x="0" y="106" width="1200" height="6" fill="#ffd6ec"/>

  <!-- bubbles inside the band -->
  <circle cx="1060" cy="40" r="22" fill="#ffffff" opacity="0.28"/>
  <circle cx="1110" cy="72" r="13" fill="#ffffff" opacity="0.3"/>
  <circle cx="150" cy="80" r="10" fill="#ffffff" opacity="0.35"/>

  <!-- site name -->
  <text x="60" y="70" font-family="sans-serif" font-size="34" font-weight="bold" fill="#c2007a" opacity="0.45">へのへのんのの</text>
  <text x="58" y="68" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff">へのへのんのの</text>

  <!-- title card shadow (pop box-shadow style) -->
  <rect x="90" y="198" width="1020" height="290" rx="30" fill="#ffd6ec"/>
  <!-- title card -->
  <rect x="90" y="190" width="1020" height="290" rx="30" fill="#fffdfe" stroke="#ffd6ec" stroke-width="5"/>

  <!-- small decorative stars flanking the title card -->
  <path d="M140,230 L145,242 L157,247 L145,252 L140,264 L135,252 L123,247 L135,242 Z" fill="#00b6c9" opacity="0.6"/>
  <path d="M1060,430 L1064,439 L1073,443 L1064,447 L1060,456 L1056,447 L1047,443 L1056,439 Z" fill="#c2007a" opacity="0.5"/>

  <!-- title -->
  <text x="600" y="342" font-family="sans-serif" font-size="68" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#c2007a" opacity="0.3">{{TITLE}}</text>
  <text x="596" y="338" font-family="sans-serif" font-size="68" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- bottom dashed accent line -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#00b6c9" stroke-width="4" stroke-dasharray="14 10" opacity="0.7"/>
</svg>
