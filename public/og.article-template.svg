  <text x="60" y="592" font-family="monospace" font-size="15" letter-spacing="6" fill="#ff2e88" fill-opacity="0.4">GOSSIP GOSSIP GOSSIP GOSSIP GOSSIP GOSSIP</text>

  <text x="60" y="90" font-family="serif" font-size="34" fill="#f4ecf7" letter-spacing="2">へのへのんのの</text>
  <line x1="60" y1="106" x2="380" y2="106" stroke="#ff2e88" stroke-width="2" stroke-dasharray="10 8" stroke-opacity="0.75"/>

