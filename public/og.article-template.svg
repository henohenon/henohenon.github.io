<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rg1" cx="18%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#7a1626" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7a1626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7a1626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="92%" cy="104%" r="65%">
      <stop offset="0%" stop-color="#7a1626" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#7a1626" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7a1626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="45%" stop-color="#7a1626"/>
      <stop offset="100%" stop-color="#0a0708" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3355" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3355" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff3355" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleBarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#7a1626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dripGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="100%" stop-color="#7a1626"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 1
                0 0 0 0 0.2
                0 0 0 0 0.33
                0 0 0 0.6 0" result="tint"/>
      <feMerge>
        <feMergeNode in="tint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#0a0708"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#rg1)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#rg2)"/>

  <rect x="0" y="0" width="10" height="630" fill="url(#barGrad)"/>

  <g stroke="#3a1218" stroke-width="1" opacity="0.55">
    <path d="M 980 0 L 1060 140 L 1010 260" fill="none"/>
    <path d="M 1060 140 L 1180 190" fill="none"/>
    <path d="M 1010 260 L 1120 330" fill="none"/>
  </g>
  <circle cx="1030" cy="120" r="150" fill="none" stroke="#7a1626" stroke-width="1" opacity="0.35"/>
  <circle cx="1030" cy="120" r="200" fill="none" stroke="#7a1626" stroke-width="1" opacity="0.2"/>

  <g fill="url(#dripGrad)" opacity="0.75">
    <path d="M 1120 0 L 1132 46 Q 1120 60 1108 46 Z"/>
    <path d="M 1155 0 L 1163 30 Q 1155 40 1147 30 Z"/>
  </g>

  <text x="80" y="92" font-family="sans-serif" font-size="30" letter-spacing="0.12em" fill="#a98a8f">へのへのんのの</text>
  <rect x="80" y="108" width="260" height="2" fill="url(#underlineGrad)"/>

  <text x="80" y="360" font-family="serif" font-size="76" fill="#ece3e1" filter="url(#glow)">{{TITLE}}</text>

  <rect x="80" y="410" width="360" height="4" fill="url(#titleBarGrad)"/>

  <g stroke="#3a1218" stroke-width="1" stroke-dasharray="6 8" opacity="0.6">
    <line x1="80" y1="560" x2="1120" y2="560"/>
  </g>

  <text x="1120" y="600" font-family="sans-serif" font-size="20" fill="#a98a8f" text-anchor="end" letter-spacing="0.08em" opacity="0.8">diary</text>
</svg>
