<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#2c1f3d"/>
      <stop offset="60%" stop-color="#221830"/>
      <stop offset="100%" stop-color="#221830"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e9f5"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- decorative loop rings (夢の中で回り続けるアラームのイメージ) -->
  <circle cx="1090" cy="110" r="150" fill="none" stroke="#ffd39a" stroke-width="2" opacity="0.22"/>
  <circle cx="1090" cy="110" r="108" fill="none" stroke="#ff8fa3" stroke-width="2" stroke-dasharray="4 12" stroke-linecap="round" opacity="0.35"/>
  <circle cx="1090" cy="110" r="70" fill="none" stroke="#f2e9f5" stroke-width="2" stroke-dasharray="20 10" opacity="0.15"/>

  <circle cx="80" cy="565" r="130" fill="none" stroke="#4a3760" stroke-width="2" stroke-dasharray="3 9" opacity="0.55"/>
  <circle cx="80" cy="565" r="86" fill="none" stroke="#ffd39a" stroke-width="3" stroke-dasharray="1 16" stroke-linecap="round" opacity="0.45"/>

  <!-- 目覚まし越しの点線 -->
  <line x1="60" y1="524" x2="1140" y2="524" stroke="#4a3760" stroke-width="2" stroke-dasharray="6 10" opacity="0.6"/>

  <!-- サイトヘッダー -->
  <circle cx="78" cy="84" r="11" fill="none" stroke="#ffd39a" stroke-width="3" stroke-dasharray="20 11" opacity="0.95"/>
  <text x="104" y="94" font-family="sans-serif" font-size="30" fill="#f2e9f5" letter-spacing="3">へのへのんのの</text>

  <!-- タイトルカード (article.post のトーン) -->
  <rect x="60" y="160" width="1080" height="330" rx="28" fill="#2c1f3d" stroke="#4a3760" stroke-width="2"/>
  <rect x="60" y="160" width="6" height="330" rx="3" fill="#ff8fa3" opacity="0.55"/>

  <!-- 記事タイトル -->
  <text x="112" y="345" font-family="serif" font-size="60" fill="url(#titleGrad)">{{TITLE}}</text>
  <text x="112" y="345" font-family="serif" font-size="60" fill="none" stroke="#ff8fa3" stroke-width="0.8" opacity="0.4">{{TITLE}}</text>

  <!-- 小さな灯り (alarm-flicker のイメージ) -->
  <circle cx="1108" cy="562" r="6" fill="#ffd39a" opacity="0.9"/>
  <circle cx="1108" cy="562" r="16" fill="none" stroke="#ffd39a" stroke-width="1.5" opacity="0.35"/>
</svg>
