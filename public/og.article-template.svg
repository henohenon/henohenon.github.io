  <rect x="55" y="205" width="1090" height="310" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#7a4dbb" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="100" y="360" font-family="serif" font-size="72" fill="#39ff14" fill-opacity="0.55" filter="url(#neonBlur)">{{TITLE}}</text>
  <text x="100" y="360" font-family="serif" font-size="72" fill="#f4ecf7">{{TITLE}}</text>

  <line x1="100" y1="400" x2="720" y2="400" stroke="#39ff14" stroke-width="3" stroke-dasharray="12 10" stroke-opacity="0.6"/>

