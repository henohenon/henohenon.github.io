<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#b30033" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7a0018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0410"/>
      <stop offset="50%" stop-color="#240618"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffd1e8"/>
      <stop offset="45%" stop-color="#ff2d87"/>
      <stop offset="100%" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff2d87"/>
      <stop offset="50%" stop-color="#ffe27a"/>
      <stop offset="60%" stop-color="#ff2d87"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </linearGradient>
    <pattern id="diag" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="34" height="34" fill="none"/>
      <rect x="0" y="0" width="17" height="34" fill="#ff2d87" fill-opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a0410"/>
  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#diag)"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>

  <!-- Inner frame (article.post風コーナー) -->
  <rect x="40" y="40" width="1120" height="550" rx="28" ry="28"
        fill="rgba(42,8,32,0.35)" stroke="rgba(255,45,135,0.22)" stroke-width="1"/>

  <!-- Tiara corner (top-left) -->
  <path d="M 40 100 L 40 68 Q 40 40 68 40 L 140 40"
        fill="none" stroke="#ffe27a" stroke-width="2.5" opacity="0.75"/>
  <!-- Accent corner (bottom-right) -->
  <path d="M 1060 590 L 1132 590 Q 1160 590 1160 562 L 1160 490"
        fill="none" stroke="#ff2d87" stroke-width="2.5" opacity="0.75"/>

  <!-- Top ribbon line -->
  <rect x="0" y="118" width="1200" height="2" fill="url(#ribbon)"/>

  <!-- Crown / Tiara mark -->
  <g transform="translate(80, 88)" filter="url(#softGlow)">
    <text x="0" y="0" font-family="serif" font-size="34" fill="#ffe27a" font-style="italic">♛</text>
  </g>

  <!-- Site name -->
  <text x="124" y="92" font-family="serif" font-size="24" font-style="italic"
        fill="#ffe6f2" letter-spacing="4">へのへのんのの</text>

  <!-- Decorative hearts scattered -->
  <g opacity="0.35" font-family="serif" fill="#ff2d87">
    <text x="1080" y="98" font-size="28">♡</text>
    <text x="1120" y="76" font-size="18">♡</text>
  </g>

  <!-- Side rose / blood drip silhouette (left) -->
  <g opacity="0.5">
    <circle cx="90" cy="500" r="46" fill="#7a0018"/>
    <circle cx="90" cy="500" r="28" fill="#b30033"/>
    <circle cx="90" cy="500" r="14" fill="#ff2d87"/>
    <path d="M 90 546 Q 86 580 92 600 Q 96 612 88 622 Q 80 612 84 600 Q 92 582 88 546 Z"
          fill="#7a0018"/>
  </g>

  <!-- Side rose silhouette (right) -->
  <g opacity="0.45">
    <circle cx="1110" cy="180" r="38" fill="#7a0018"/>
    <circle cx="1110" cy="180" r="22" fill="#b30033"/>
    <circle cx="1110" cy="180" r="10" fill="#ff2d87"/>
  </g>

  <!-- Tiny dashed underline accent above title -->
  <line x1="100" y1="200" x2="260" y2="200" stroke="#ff2d87" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <text x="280" y="206" font-family="serif" font-size="20" font-style="italic" fill="#f7b8d4" opacity="0.85">♡ www あげる ♡</text>

  <!-- Title -->
  <text x="100" y="340" font-family="serif" font-size="78" font-style="italic" font-weight="700"
        fill="url(#titleGrad)" filter="url(#softGlow)">{{TITLE}}</text>

  <!-- Bottom divider -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#ff2d87" stroke-width="1" opacity="0.5" stroke-dasharray="2 8"/>

  <!-- Bottom label -->
  <text x="100" y="560" font-family="serif" font-size="22" font-style="italic" fill="#f7b8d4" letter-spacing="6">♛ blood &amp; roses ♛</text>
  <text x="1100" y="560" font-family="serif" font-size="22" font-style="italic" fill="#ffe27a" text-anchor="end" letter-spacing="3" opacity="0.85">— henohenonnono —</text>
</svg>
