<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf9e"/>
      <stop offset="55%" stop-color="#f2ead9"/>
      <stop offset="100%" stop-color="#ffcf9e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#ff8c5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sandGlow" cx="85%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#c9a876" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#c9a876" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c5a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8c5a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="glasspane" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#f2ead9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <g id="petalFlower">
      <ellipse cx="0" cy="-14" rx="7" ry="14" fill="currentColor"/>
      <ellipse cx="0" cy="-14" rx="7" ry="14" fill="currentColor" transform="rotate(72)"/>
      <ellipse cx="0" cy="-14" rx="7" ry="14" fill="currentColor" transform="rotate(144)"/>
      <ellipse cx="0" cy="-14" rx="7" ry="14" fill="currentColor" transform="rotate(216)"/>
      <ellipse cx="0" cy="-14" rx="7" ry="14" fill="currentColor" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="6" fill="currentColor"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="630" fill="#14201f"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#sunGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#sandGlow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glasspane)" opacity="0.55"/>

  <!-- 温室越しの陽だまり (ボケ) -->
  <circle cx="170" cy="110" r="60" fill="#ff8c5a" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="980" cy="130" r="80" fill="#ffcf9e" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="520" r="70" fill="#c9a876" opacity="0.12" filter="url(#softGlow)"/>

  <!-- 割れたガラスの罅 -->
  <path d="M1200 0 L1082 96 L1132 150 L1006 232 L1058 300" stroke="#c9a876" stroke-width="1.2" fill="none" opacity="0.20"/>
  <path d="M1200 40 L1120 40 L1160 110" stroke="#f2ead9" stroke-width="1" fill="none" opacity="0.12"/>
  <path d="M0 630 L100 520 L60 470 L150 400" stroke="#c9a876" stroke-width="1.2" fill="none" opacity="0.18"/>

  <!-- 咲く花のシルエット -->
  <use href="#petalFlower" transform="translate(1122,86) scale(1.2)" color="#ffcf9e" opacity="0.32"/>
  <use href="#petalFlower" transform="translate(78,566) scale(1.7)" color="#ff8c5a" opacity="0.22"/>
  <use href="#petalFlower" transform="translate(1132,586) scale(1.0)" color="#c9a876" opacity="0.28"/>
  <use href="#petalFlower" transform="translate(1010,540) scale(0.65) rotate(20)" color="#ff8c5a" opacity="0.18"/>
  <use href="#petalFlower" transform="translate(140,90) scale(0.5) rotate(-15)" color="#ffcf9e" opacity="0.16"/>

  <!-- 外枠 (ガラスの器) -->
  <rect x="24" y="24" width="1152" height="582" rx="14" ry="14" fill="none" stroke="#ffcf9e" stroke-opacity="0.16" stroke-width="2"/>

  <!-- サイト名 -->
  <use href="#petalFlower" transform="translate(46,72) scale(0.55)" color="#ff8c5a" opacity="0.6"/>
  <text x="66" y="82" font-family="serif" font-size="30" fill="#f2ead9" letter-spacing="0.04em">へのへのんのの</text>
  <line x1="60" y1="102" x2="420" y2="102" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- タイトルを包む温室ガラスの器 -->
  <rect x="50" y="190" width="1100" height="290" rx="18" ry="18" fill="#f2ead9" fill-opacity="0.06" stroke="#ffcf9e" stroke-opacity="0.14" stroke-width="1"/>

  <!-- 記事タイトル -->
  <text x="90" y="358" font-family="serif" font-size="76" fill="none" stroke="#14201f" stroke-width="14" stroke-linejoin="round" opacity="0.55">{{TITLE}}</text>
  <text x="90" y="358" font-family="serif" font-size="76" fill="url(#titleGrad)">{{TITLE}}</text>

  <line x1="90" y1="428" x2="640" y2="428" stroke="#ff8c5a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- 下部装飾線 -->
  <line x1="24" y1="596" x2="1176" y2="596" stroke="#c9a876" stroke-opacity="0.25" stroke-width="1"/>
</svg>
