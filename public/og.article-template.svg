<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hl" patternUnits="userSpaceOnUse" x="0" y="0" width="1200" height="4">
      <rect width="1200" height="3" fill="transparent"/>
      <rect y="3" width="1200" height="1" fill="rgba(255,60,90,0.018)"/>
    </pattern>
    <pattern id="vl" patternUnits="userSpaceOnUse" x="0" y="0" width="7" height="88">
      <rect width="6" height="88" fill="transparent"/>
      <rect x="6" width="1" height="88" fill="rgba(255,60,90,0.025)"/>
    </pattern>
    <radialGradient id="dawn" cx="50%" cy="110%" r="65%">
      <stop offset="0%" stop-color="#ff5a28" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#ff3c5a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8eaf2"/>
      <stop offset="55%" stop-color="#e8eaf2"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090f"/>
  <!-- Dawn glow -->
  <rect width="1200" height="630" fill="url(#dawn)"/>
  <!-- Horizontal scan lines -->
  <rect width="1200" height="630" fill="url(#hl)"/>

  <!-- ── Header ── -->
  <rect width="1200" height="88" fill="#0c0c18"/>
  <rect width="1200" height="88" fill="url(#vl)"/>
  <rect y="88" width="1200" height="2" fill="#ff3c5a"/>

  <!-- Site name: glitch cyan layer -->
  <text x="78" y="58" font-family="sans-serif" font-size="28" letter-spacing="0.08em"
        fill="rgba(0,210,255,0.5)">へのへのんのの</text>
  <!-- Site name: glitch red layer -->
  <text x="82" y="58" font-family="sans-serif" font-size="28" letter-spacing="0.08em"
        fill="rgba(255,60,90,0.65)">へのへのんのの</text>
  <!-- Site name: main -->
  <text x="80" y="58" font-family="sans-serif" font-size="28" letter-spacing="0.08em"
        fill="#e8eaf2">へのへのんのの</text>

  <!-- BLOG label (top-right) -->
  <text x="1140" y="58" text-anchor="end" font-family="sans-serif" font-size="11"
        letter-spacing="0.28em" fill="#3d3e58">BLOG</text>

  <!-- ── Main area ── -->
  <!-- Left vertical accent bar -->
  <rect x="60" y="116" width="3" height="437" fill="#ff3c5a" opacity="0.5"/>
  <!-- Soft horizontal rule -->
  <line x1="78" y1="148" x2="1140" y2="148" stroke="rgba(255,60,90,0.1)" stroke-width="1"/>

  <!-- Glitch interference strips — left edge -->
  <rect x="0" y="193" width="55" height="2" fill="rgba(255,60,90,0.4)"/>
  <rect x="0" y="196" width="32" height="1" fill="rgba(0,210,255,0.3)"/>
  <rect x="0" y="462" width="42" height="2" fill="rgba(255,60,90,0.25)"/>
  <rect x="0" y="465" width="26" height="1" fill="rgba(0,210,255,0.2)"/>

  <!-- Glitch interference strips — right edge -->
  <rect x="1145" y="278" width="55" height="2" fill="rgba(255,60,90,0.3)"/>
  <rect x="1155" y="281" width="45" height="1" fill="rgba(0,210,255,0.22)"/>
  <rect x="1150" y="398" width="50" height="1" fill="rgba(255,60,90,0.2)"/>

  <!-- ── Title: {{TITLE}} ── -->
  <!-- Cyan glitch layer -->
  <text x="88" y="368" font-family="sans-serif" font-size="68" letter-spacing="0.03em"
        fill="rgba(0,210,255,0.45)">{{TITLE}}</text>
  <!-- Red glitch layer -->
  <text x="93" y="368" font-family="sans-serif" font-size="68" letter-spacing="0.03em"
        fill="rgba(255,60,90,0.6)">{{TITLE}}</text>
  <!-- Main title layer -->
  <text x="90" y="368" font-family="sans-serif" font-size="68" letter-spacing="0.03em"
        fill="url(#tg)">{{TITLE}}</text>

  <!-- Title accent underline (like h2::after in CSS) -->
  <rect x="90" y="390" width="72" height="3" fill="#ff3c5a"/>

  <!-- ── Footer zone ── -->
  <line x1="60" y1="553" x2="1140" y2="553" stroke="rgba(255,60,90,0.2)" stroke-width="1"/>
  <text x="90" y="592" font-family="sans-serif" font-size="11" letter-spacing="0.3em"
        fill="#3d3e58">ARTICLE</text>

  <!-- Bottom-right decorative glitch bars -->
  <rect x="1090" y="563" width="50" height="2" fill="rgba(255,60,90,0.35)"/>
  <rect x="1100" y="567" width="40" height="1" fill="rgba(0,210,255,0.25)"/>
  <rect x="1112" y="571" width="28" height="2" fill="rgba(255,60,90,0.2)"/>
</svg>
