<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="-10%" r="80%">
      <stop offset="0%" stop-color="#1c1530"/>
      <stop offset="55%" stop-color="#1c1530" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="100%" stop-color="#0c0913"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e2f2"/>
      <stop offset="75%" stop-color="#ff6fae"/>
    </linearGradient>
    <linearGradient id="siteGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9e2f2"/>
      <stop offset="70%" stop-color="#ff6fae"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6fae" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6fae" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6fae" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glowText" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgBase)"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- 黄昏の街の灯り (ボケ) -->
  <circle cx="990" cy="110" r="170" fill="#8d6fd1" opacity="0.25" filter="url(#softBlur)"/>
  <circle cx="1130" cy="330" r="130" fill="#ff6fae" opacity="0.16" filter="url(#softBlur)"/>
  <circle cx="140" cy="70" r="110" fill="#ff6fae" opacity="0.10" filter="url(#softBlur)"/>

  <!-- 溶けていくスカイライン -->
  <path d="M0 630 L0 500 L60 500 L60 460 L120 460 L120 510 L190 510 L190 440 L250 440 L250 490 L320 490 L320 430 L390 430 L390 480 L460 480 L460 420 L530 420 L530 470 L600 470 L600 410 L670 410 L670 460 L740 460 L740 400 L810 400 L810 450 L880 450 L880 390 L950 390 L950 440 L1020 440 L1020 400 L1090 400 L1090 450 L1160 450 L1160 410 L1200 410 L1200 630 Z"
        fill="#1c1530" opacity="0.55"/>
  <path d="M0 630 L0 560 L80 560 L80 530 L150 530 L150 570 L230 570 L230 520 L300 520 L300 560 L380 560 L380 510 L450 510 L450 550 L530 550 L530 500 L600 500 L600 540 L680 540 L680 490 L750 490 L750 530 L830 530 L830 480 L900 480 L900 520 L980 520 L980 470 L1050 470 L1050 510 L1120 510 L1120 470 L1200 470 L1200 630 Z"
        fill="#8d6fd1" opacity="0.16"/>

  <!-- 現実がにじむスキャンライン -->
  <g opacity="0.06" stroke="#e9e2f2" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- サイト名 -->
  <text x="70" y="90" font-family="sans-serif" font-size="34" font-weight="bold" fill="url(#siteGrad)" letter-spacing="2">へのへのんのの</text>
  <rect x="70" y="112" width="360" height="2" fill="url(#lineGrad)"/>

  <!-- タイトルカード -->
  <rect x="60" y="245" width="1080" height="180" rx="10" fill="#1c1530" fill-opacity="0.45" stroke="#e9e2f2" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="60" y="245" width="4" height="180" fill="#8d6fd1"/>

  <text x="105" y="355" font-family="serif" font-size="76" fill="url(#titleGrad)" filter="url(#glowText)">{{TITLE}}</text>
  <text x="105" y="355" font-family="serif" font-size="76" fill="none" stroke="#ff6fae" stroke-opacity="0.35" stroke-width="1.5">{{TITLE}}</text>

  <!-- 下部アクセント -->
  <rect x="70" y="565" width="220" height="4" fill="#ff6fae" opacity="0.7"/>
  <circle cx="310" cy="567" r="4" fill="#e9e2f2" opacity="0.6"/>
</svg>
