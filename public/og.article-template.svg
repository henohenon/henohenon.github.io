<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2f92"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff2f92"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#180f16"/>

  <!-- ambient glows (radial-gradient body mood) -->
  <circle cx="140" cy="10" r="360" fill="#ff2f92" opacity="0.20" filter="url(#glowBlur)"/>
  <circle cx="1150" cy="60" r="300" fill="#ffd166" opacity="0.14" filter="url(#glowBlur)"/>
  <circle cx="1080" cy="560" r="260" fill="#ff2f92" opacity="0.10" filter="url(#glowBlur)"/>

  <!-- giant faint yen watermark (article.post::before) -->
  <text x="1010" y="330" font-family="serif" font-size="320" fill="#ffd166" opacity="0.06" text-anchor="middle">¥</text>

  <!-- outer dashed frame -->
  <rect x="30" y="30" width="1140" height="570" rx="22" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="11 9" opacity="0.45"/>

  <!-- scattered sparkle dots -->
  <circle cx="90" cy="150" r="4" fill="#ffb3d9" opacity="0.7"/>
  <circle cx="120" cy="185" r="2.5" fill="#ffd166" opacity="0.6"/>
  <circle cx="1105" cy="470" r="4" fill="#ffb3d9" opacity="0.6"/>
  <circle cx="1070" cy="510" r="2.5" fill="#ffd166" opacity="0.55"/>
  <circle cx="1130" cy="150" r="3" fill="#ff2f92" opacity="0.5"/>
  <circle cx="70" cy="520" r="3" fill="#ffd166" opacity="0.5"/>

  <!-- site name -->
  <text x="64" y="98" font-family="sans-serif" font-size="34" font-weight="700" fill="url(#nameGrad)" letter-spacing="1">へのへのんのの</text>
  <line x1="64" y1="114" x2="330" y2="114" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- title card -->
  <rect x="64" y="230" width="1072" height="300" rx="26" fill="#ffffff" opacity="0.03"/>
  <rect x="64" y="230" width="1072" height="300" rx="26" fill="none" stroke="#ff2f92" stroke-width="2" opacity="0.28"/>
  <line x1="100" y1="266" x2="220" y2="266" stroke="#ff2f92" stroke-width="3" opacity="0.6"/>

  <!-- article title (glow underlay + gradient fill) -->
  <text x="100" y="400" font-family="sans-serif" font-size="72" font-weight="700" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.35">{{TITLE}}</text>
  <text x="100" y="400" font-family="sans-serif" font-size="72" font-weight="700" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- bottom dashed footer line -->
  <line x1="64" y1="566" x2="1136" y2="566" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
</svg>
