<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowA" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8be9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#ffb6e6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb6e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#5a4fcf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5a4fcf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef0ff"/>
      <stop offset="45%" stop-color="#8be9ff"/>
      <stop offset="75%" stop-color="#ffb6e6"/>
      <stop offset="100%" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffb6e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8be9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frag1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a4fcf" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="frag2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6e6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a4fcf" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#0e1430"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- 散らばる断片 (破片の多角形) -->
  <g opacity="0.85">
    <polygon points="80,90 140,70 165,130 110,150" fill="url(#frag1)" stroke="#8be9ff" stroke-opacity="0.35" stroke-width="0.8"/>
    <polygon points="1050,80 1110,100 1095,160 1035,140" fill="url(#frag2)" stroke="#ffb6e6" stroke-opacity="0.3" stroke-width="0.8"/>
    <polygon points="60,500 130,490 150,560 75,560" fill="url(#frag2)" stroke="#ffb6e6" stroke-opacity="0.25" stroke-width="0.7"/>
    <polygon points="1080,470 1150,460 1140,540 1070,545" fill="url(#frag1)" stroke="#8be9ff" stroke-opacity="0.3" stroke-width="0.7"/>
    <polygon points="930,30 985,25 980,75 925,80" fill="url(#frag1)" stroke="#8be9ff" stroke-opacity="0.25" stroke-width="0.6"/>
    <polygon points="160,580 220,575 225,620 165,615" fill="url(#frag2)" stroke="#ffb6e6" stroke-opacity="0.2" stroke-width="0.6"/>
  </g>

  <!-- 星屑 -->
  <g fill="#ffffff">
    <circle cx="156" cy="138" r="1.4" opacity="0.9"/>
    <circle cx="804" cy="258" r="1.1" opacity="0.75"/>
    <circle cx="396" cy="491" r="1.5" opacity="0.85"/>
    <circle cx="1056" cy="94" r="1.2" opacity="0.7"/>
    <circle cx="600" cy="561" r="1.3" opacity="0.85"/>
    <circle cx="96" cy="378" r="1.4" opacity="0.65"/>
    <circle cx="900" cy="410" r="1.2" opacity="0.7"/>
    <circle cx="260" cy="220" r="1" opacity="0.6"/>
    <circle cx="720" cy="120" r="1.3" opacity="0.8"/>
    <circle cx="1140" cy="320" r="1.1" opacity="0.7"/>
    <circle cx="450" cy="80" r="1.2" opacity="0.75"/>
    <circle cx="980" cy="540" r="1.3" opacity="0.8"/>
    <circle cx="330" cy="380" r="1" opacity="0.55"/>
    <circle cx="560" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="1020" cy="220" r="1" opacity="0.6"/>
  </g>
  <g fill="#8be9ff">
    <circle cx="240" cy="450" r="1.4" opacity="0.85"/>
    <circle cx="860" cy="80" r="1.2" opacity="0.7"/>
    <circle cx="500" cy="540" r="1.1" opacity="0.65"/>
    <circle cx="1100" cy="380" r="1.3" opacity="0.75"/>
  </g>
  <g fill="#ffb6e6">
    <circle cx="420" cy="220" r="1.3" opacity="0.75"/>
    <circle cx="780" cy="500" r="1.2" opacity="0.7"/>
    <circle cx="120" cy="280" r="1" opacity="0.6"/>
  </g>

  <!-- 上下の細い罫線 (グラデ) -->
  <rect x="60" y="92" width="1080" height="1" fill="url(#hrGrad)" opacity="0.55"/>
  <rect x="60" y="538" width="1080" height="1" fill="url(#hrGrad)" opacity="0.55"/>

  <!-- サイト名 -->
  <text x="60" y="75" font-family="serif" font-size="22" font-style="italic" fill="#eef0ff" letter-spacing="6">へのへのんのの</text>
  <text x="1140" y="75" font-family="sans-serif" font-size="14" fill="#b8bfe2" letter-spacing="4" text-anchor="end">— fragments of the night —</text>

  <!-- アクセントの小さなマーク -->
  <g transform="translate(60, 250)">
    <rect x="0" y="0" width="2" height="60" fill="#8be9ff" opacity="0.9"/>
    <rect x="8" y="20" width="2" height="40" fill="#ffb6e6" opacity="0.7"/>
  </g>

  <!-- 記事タイトル (画面の主役) -->
  <text x="100" y="345" font-family="serif" font-size="76" font-style="italic" font-weight="500" fill="url(#titleGrad)" letter-spacing="2">{{TITLE}}</text>

  <!-- フッター情報 -->
  <text x="60" y="580" font-family="sans-serif" font-size="16" fill="#b8bfe2" letter-spacing="4">A R T I C L E</text>
  <text x="1140" y="580" font-family="serif" font-size="16" font-style="italic" fill="#8be9ff" text-anchor="end" letter-spacing="2">henohenonnono.log</text>
</svg>
