<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg-top" gradientUnits="userSpaceOnUse" cx="600" cy="0" r="750">
    <stop offset="0%" stop-color="#3a0034" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#3a0034" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bg-bot" gradientUnits="userSpaceOnUse" cx="600" cy="630" r="560">
    <stop offset="0%" stop-color="#6b1a38" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#6b1a38" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sweet-corner" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="620">
    <stop offset="0%" stop-color="#ff6fa8" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#ff6fa8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bitter-corner" gradientUnits="userSpaceOnUse" cx="1200" cy="630" r="520">
    <stop offset="0%" stop-color="#6b1a38" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#6b1a38" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="title-halo" gradientUnits="userSpaceOnUse" cx="600" cy="335" r="370">
    <stop offset="0%" stop-color="#e8184e" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#e8184e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc-strip" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff6fa8"/>
    <stop offset="100%" stop-color="#e8184e"/>
  </linearGradient>
  <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ff6fa8"/>
    <stop offset="28%"  stop-color="#f2e8f9"/>
    <stop offset="72%"  stop-color="#e8184e"/>
    <stop offset="100%" stop-color="#a00030"/>
  </linearGradient>
  <linearGradient id="site-fill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ff6fa8"/>
    <stop offset="55%"  stop-color="#f0a0c0"/>
    <stop offset="100%" stop-color="#e8184e"/>
  </linearGradient>
  <linearGradient id="header-tint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#ff6fa8" stop-opacity="0.1"/>
    <stop offset="50%"  stop-color="#ff6fa8" stop-opacity="0"/>
    <stop offset="100%" stop-color="#e8184e" stop-opacity="0.07"/>
  </linearGradient>
  <filter id="blur-glow" x="-10%" y="-60%" width="120%" height="220%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#0c0014"/>
<rect width="1200" height="630" fill="url(#bg-top)"/>
<rect width="1200" height="630" fill="url(#bg-bot)"/>
<rect width="1200" height="630" fill="url(#sweet-corner)"/>
<rect width="1200" height="630" fill="url(#bitter-corner)"/>

<!-- ── はんぶんこ diagonal split ── -->
<line x1="0" y1="0" x2="1200" y2="630" stroke="#e8184e" stroke-width="0.8" stroke-opacity="0.11"/>
<line x1="6" y1="0" x2="1200" y2="624" stroke="#ff6fa8" stroke-width="0.4" stroke-opacity="0.07"/>

<!-- ── Surface card ── -->
<rect x="48" y="48" width="1104" height="534" rx="3" fill="#160020" fill-opacity="0.74"/>
<rect x="48" y="48" width="1104" height="534" rx="3" fill="none" stroke="#6b1a38" stroke-width="1"/>

<!-- ── Left accent strip (sweet→bitter) ── -->
<rect x="48" y="48" width="4" height="534" fill="url(#acc-strip)"/>

<!-- ── Right accent strip (bitter) ── -->
<rect x="1148" y="48" width="4" height="534" fill="#6b1a38" fill-opacity="0.65"/>

<!-- ── Header area tint ── -->
<rect x="52" y="48" width="1096" height="70" fill="url(#header-tint)"/>

<!-- ── Top separator lines (sweet | bitter) ── -->
<line x1="64"  y1="118" x2="530"  y2="118" stroke="#ff6fa8" stroke-width="1" stroke-opacity="0.6"/>
<line x1="670" y1="118" x2="1136" y2="118" stroke="#e8184e" stroke-width="1" stroke-opacity="0.6"/>

<!-- ── Center ornament: はんぶんこ half-circle ── -->
<path d="M 576 118 a 24 24 0 0 1 48 0" fill="rgba(255,111,168,0.14)" stroke="#ff6fa8" stroke-width="0.8" stroke-opacity="0.5"/>
<path d="M 576 118 a 24 24 0 0 0 48 0" fill="rgba(232,24,78,0.09)"   stroke="#e8184e"  stroke-width="0.8" stroke-opacity="0.4"/>
<circle cx="600" cy="118" r="2.5" fill="#f2e8f9" fill-opacity="0.38"/>

<!-- ── Title ambient halo ── -->
<rect width="1200" height="630" fill="url(#title-halo)"/>

<!-- ── Dreamlike scattered dots ── -->
<circle cx="88"   cy="155" r="2.2" fill="#ff6fa8" fill-opacity="0.3"/>
<circle cx="72"   cy="455" r="1.6" fill="#ff6fa8" fill-opacity="0.16"/>
<circle cx="1115" cy="162" r="2.2" fill="#e8184e" fill-opacity="0.3"/>
<circle cx="1130" cy="445" r="1.6" fill="#e8184e" fill-opacity="0.16"/>
<circle cx="210"  cy="518" r="1.4" fill="#ff6fa8" fill-opacity="0.12"/>
<circle cx="945"  cy="524" r="1.4" fill="#e8184e" fill-opacity="0.12"/>
<circle cx="600"  cy="64"  r="1.4" fill="#f2e8f9" fill-opacity="0.1"/>

<!-- ── Title glow (blurred layer) ── -->
<text x="80" y="352" font-family="serif" font-size="72" fill="#e8184e" fill-opacity="0.26" filter="url(#blur-glow)">{{TITLE}}</text>

<!-- ── {{TITLE}} (main) ── -->
<text x="80" y="352" font-family="serif" font-size="72" fill="url(#title-fill)" letter-spacing="0.04em">{{TITLE}}</text>

<!-- ── Bottom separator ── -->
<line x1="64" y1="524" x2="1136" y2="524" stroke="#6b1a38" stroke-width="1"/>

<!-- ── Site name ── -->
<text x="80" y="568" font-family="serif" font-size="26" fill="url(#site-fill)" letter-spacing="0.12em">へのへのんのの</text>

<!-- ── Blog label ── -->
<text x="1136" y="568" font-family="sans-serif" font-size="12" fill="#f2e8f9" fill-opacity="0.26" text-anchor="end" letter-spacing="0.2em">blog</text>

</svg>
