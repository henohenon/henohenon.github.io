<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="azaleaGlow" cx="18%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ff7aa2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7aa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doomGlow" cx="82%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#5a1326" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a1326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="baseFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a14"/>
      <stop offset="100%" stop-color="#0c0408"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdeef0"/>
      <stop offset="55%" stop-color="#ff7aa2"/>
      <stop offset="100%" stop-color="#ff3d6e"/>
    </linearGradient>
    <linearGradient id="ringtone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3d6e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff3d6e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3d6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a1326" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5a1326"/>
      <stop offset="50%" stop-color="#ff3d6e"/>
      <stop offset="75%" stop-color="#5a1326"/>
      <stop offset="100%" stop-color="#5a1326" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="titleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ベース背景 -->
  <rect width="1200" height="630" fill="#14080f"/>
  <rect width="1200" height="630" fill="url(#baseFade)" opacity="0.85"/>

  <!-- キリシマツツジの蕾 (右上の紅い滲み) -->
  <ellipse cx="1080" cy="40" rx="420" ry="380" fill="url(#azaleaGlow)" filter="url(#softBlur)"/>
  <!-- 終末の沼 (右下の鈍い紅) -->
  <ellipse cx="980" cy="600" rx="520" ry="320" fill="url(#doomGlow)" filter="url(#softBlur)"/>
  <!-- 黒猫の影 (左下に沈む黒) -->
  <ellipse cx="120" cy="610" rx="380" ry="180" fill="#0a0508" opacity="0.7" filter="url(#softBlur)"/>

  <!-- 走査線ノイズ -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- 受話器のコード ─ 左から伸びるらせん -->
  <g stroke="#f0c674" stroke-opacity="0.35" stroke-width="1.4" fill="none">
    <path d="M 0 80 Q 30 95 60 80 T 120 80 T 180 80 T 240 80 T 300 80"/>
    <path d="M 0 80 Q 30 65 60 80 T 120 80 T 180 80 T 240 80 T 300 80" stroke-opacity="0.18"/>
  </g>

  <!-- 上端のリング (rough scan / 着信中) -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="url(#ringtone)" stroke-width="1.2"/>
  <line x1="60" y1="510" x2="1140" y2="510" stroke="url(#hr)" stroke-width="1"/>

  <!-- 上端メタ ─ 公衆電話の残り度数 -->
  <text x="60" y="78" font-family="monospace" font-size="16" fill="#f0c674" opacity="0.75" letter-spacing="6">
    ☎  10¥ LEFT  ⋯  都窪郡早島
  </text>
  <text x="1140" y="78" font-family="monospace" font-size="16" fill="#ff3d6e" opacity="0.85" letter-spacing="4" text-anchor="end">
    NOW DIALING ⋯
  </text>

  <!-- 装飾: 受話器型シルエット (右端) -->
  <g transform="translate(1050 470) rotate(-22)" opacity="0.18" fill="none" stroke="#ff7aa2" stroke-width="2">
    <path d="M -80 -10 Q -80 -50 -40 -50 L -10 -50 Q 10 -50 10 -30 L 10 -10 Q 10 0 0 0 L -20 0 L -20 30
             L 80 30 L 80 0 L 60 0 Q 50 0 50 -10 L 50 -30 Q 50 -50 70 -50 L 100 -50 Q 140 -50 140 -10"/>
  </g>

  <!-- タイトル下飾り罫線 -->
  <line x1="80" y1="430" x2="640" y2="430" stroke="#ff3d6e" stroke-width="1" opacity="0.7"/>
  <line x1="80" y1="436" x2="320" y2="436" stroke="#ff7aa2" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 4"/>

  <!-- ラベル ─ ARTICLE -->
  <text x="80" y="200" font-family="monospace" font-size="18" fill="#c9a9b3" letter-spacing="10" opacity="0.85">
    ARTICLE  ・  No.███
  </text>

  <!-- タイトル背後のうっすらした和の縦線 (ツツジの茎) -->
  <g stroke="#ff3d6e" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="240" x2="80" y2="470"/>
    <line x1="86" y1="240" x2="86" y2="470"/>
  </g>

  <!-- 記事タイトル (グラデ塗り + 微光) -->
  <text x="100" y="340" font-family="serif" font-size="76" font-style="italic" font-weight="500"
        fill="url(#titleFill)" filter="url(#titleGlow)" letter-spacing="2">{{TITLE}}</text>

  <!-- サイト名 (フッター左) -->
  <text x="60" y="585" font-family="serif" font-size="26" font-style="italic" fill="#fdeef0" letter-spacing="3">
    へのへのんのの
  </text>

  <!-- 黒猫 emoji 風シルエット (右下) -->
  <g transform="translate(1110 565)" opacity="0.85">
    <circle cx="0" cy="0" r="14" fill="#0a0508" stroke="#ff3d6e" stroke-opacity="0.4" stroke-width="0.6"/>
    <polygon points="-10,-10 -5,-18 -2,-10" fill="#0a0508"/>
    <polygon points="10,-10 5,-18 2,-10" fill="#0a0508"/>
    <circle cx="-4" cy="-1" r="1.4" fill="#ff7aa2"/>
    <circle cx="4" cy="-1" r="1.4" fill="#ff7aa2"/>
  </g>

  <!-- 右側メタ -->
  <text x="1140" y="585" font-family="monospace" font-size="14" fill="#c9a9b3" letter-spacing="4" text-anchor="end" opacity="0.75">
    end of the world . log
  </text>

  <!-- 額縁的な内側ボーダー -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#ff7aa2" stroke-opacity="0.15" stroke-width="1"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#ff3d6e" stroke-opacity="0.08" stroke-width="0.5" stroke-dasharray="1 5"/>
</svg>
