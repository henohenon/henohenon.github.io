<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Scanline pattern: GameBoy LCD effect -->
    <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="3" fill="none"/>
      <rect y="3" width="1200" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>

    <!-- Vignette: radial edge darkening -->
    <radialGradient id="vgn" cx="600" cy="315" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="40%" stop-color="#07070e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.74"/>
    </radialGradient>

    <!-- Header zone: dark purple → bg -->
    <linearGradient id="hdrg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#110020"/>
      <stop offset="62%" stop-color="#0b000f"/>
      <stop offset="100%" stop-color="#07070e"/>
    </linearGradient>

    <!-- Footer zone -->
    <linearGradient id="ftrg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070e"/>
      <stop offset="100%" stop-color="#050509"/>
    </linearGradient>

    <!-- Accent divider: magenta → cyan → magenta -->
    <linearGradient id="ahr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff1f6e" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ff1f6e"/>
      <stop offset="44%"  stop-color="#00e5ff"/>
      <stop offset="56%"  stop-color="#00e5ff"/>
      <stop offset="80%"  stop-color="#ff1f6e"/>
      <stop offset="100%" stop-color="#ff1f6e" stop-opacity="0"/>
    </linearGradient>

    <!-- Glitch wash band -->
    <linearGradient id="glb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff1f6e" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ff1f6e" stop-opacity="0.07"/>
      <stop offset="66%"  stop-color="#00e5ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for site name -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════
       BACKGROUND
       ══════════════════════════════════════ -->
  <rect width="1200" height="630" fill="#07070e"/>
  <rect y="0" width="1200" height="150" fill="url(#hdrg)"/>
  <rect y="480" width="1200" height="150" fill="url(#ftrg)"/>

  <!-- ══════════════════════════════════════
       NEON FRAME
       ══════════════════════════════════════ -->
  <rect width="1200" height="3" fill="#ff1f6e"/>
  <rect y="627" width="1200" height="3" fill="#ff1f6e" fill-opacity="0.78"/>
  <rect width="2" height="630" fill="#ff1f6e" fill-opacity="0.52"/>
  <rect x="1198" width="2" height="630" fill="#ff1f6e" fill-opacity="0.52"/>

  <!-- Corner brackets: top-left -->
  <path d="M30 22 L30 66 M30 22 L74 22" stroke="#ff1f6e" stroke-width="2.5" fill="none"/>
  <!-- top-right -->
  <path d="M1170 22 L1170 66 M1170 22 L1126 22" stroke="#ff1f6e" stroke-width="2.5" fill="none"/>
  <!-- bottom-left -->
  <path d="M30 608 L30 564 M30 608 L74 608" stroke="#ff1f6e" stroke-width="2.5" fill="none"/>
  <!-- bottom-right -->
  <path d="M1170 608 L1170 564 M1170 608 L1126 608" stroke="#ff1f6e" stroke-width="2.5" fill="none"/>

  <!-- ══════════════════════════════════════
       SCANLINES
       ══════════════════════════════════════ -->
  <rect width="1200" height="630" fill="url(#scan)" opacity="0.38"/>

  <!-- ══════════════════════════════════════
       DECORATIVE ELEMENTS
       ══════════════════════════════════════ -->

  <!-- Glitch wash at divider lines -->
  <rect y="148" width="1200" height="8" fill="url(#glb)"/>
  <rect y="456" width="1200" height="7" fill="url(#glb)"/>

  <!-- Accent divider lines -->
  <rect x="60" y="156" width="1080" height="1.5" fill="url(#ahr)"/>
  <rect x="60" y="463" width="1080" height="1.5" fill="url(#ahr)"/>

  <!-- Article tag -->
  <text x="80" y="128"
        font-family="monospace" font-size="15"
        fill="#ff1f6e" fill-opacity="0.85"
        letter-spacing="0.22em">// ARTICLE</text>

  <!-- Circuit trace: top-right area -->
  <line x1="845" y1="128" x2="1140" y2="128"
        stroke="#ff1f6e" stroke-width="0.6" stroke-opacity="0.2"/>
  <line x1="1140" y1="128" x2="1140" y2="156"
        stroke="#ff1f6e" stroke-width="0.6" stroke-opacity="0.2"/>
  <circle cx="1140" cy="128" r="3.5"
          fill="none" stroke="#ff1f6e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="845"  cy="128" r="3.5"
          fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="992" y1="124" x2="992" y2="132"
        stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.22"/>

  <!-- Pixel noise: top-right -->
  <rect x="1064" y="36" width="4" height="4" fill="#00e5ff" fill-opacity="0.48"/>
  <rect x="1078" y="47" width="3" height="3" fill="#ff1f6e" fill-opacity="0.38"/>
  <rect x="1092" y="30" width="4" height="4" fill="#00e5ff" fill-opacity="0.28"/>
  <rect x="1052" y="54" width="2" height="2" fill="#ff1f6e" fill-opacity="0.24"/>
  <rect x="1106" y="43" width="3" height="3" fill="#00e5ff" fill-opacity="0.42"/>

  <!-- Pixel noise: bottom-left -->
  <rect x="94"  y="558" width="3" height="3" fill="#00e5ff" fill-opacity="0.28"/>
  <rect x="107" y="568" width="2" height="2" fill="#ff1f6e" fill-opacity="0.22"/>
  <rect x="86"  y="576" width="3" height="3" fill="#00e5ff" fill-opacity="0.35"/>

  <!-- Left accent bar: mirrors .post-list hover border -->
  <rect x="52" y="272" width="2" height="78" fill="#ff1f6e" fill-opacity="0.72"/>

  <!-- ══════════════════════════════════════
       ARTICLE TITLE  {{TITLE}}
       Three layers for chromatic aberration
       ══════════════════════════════════════ -->
  <!-- Cyan shift right -->
  <text x="63" y="346"
        font-family="monospace" font-size="72"
        fill="#00e5ff" fill-opacity="0.28">{{TITLE}}</text>
  <!-- Magenta shift left -->
  <text x="57" y="342"
        font-family="monospace" font-size="72"
        fill="#ff1f6e" fill-opacity="0.28">{{TITLE}}</text>
  <!-- Main title -->
  <text x="60" y="344"
        font-family="monospace" font-size="72"
        fill="#e0daff"
        letter-spacing="0.025em">{{TITLE}}</text>

  <!-- ══════════════════════════════════════
       SITE NAME
       ══════════════════════════════════════ -->
  <text x="80" y="494"
        font-family="monospace" font-size="26"
        fill="#e0daff" fill-opacity="0.82"
        letter-spacing="0.08em"
        filter="url(#glow)">へのへのんのの</text>

  <!-- Subtle ぽい watermark -->
  <text x="60" y="595"
        font-family="monospace" font-size="11"
        fill="#ff1f6e" fill-opacity="0.12"
        letter-spacing="0.62em">ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい ぽい</text>

  <!-- ══════════════════════════════════════
       VIGNETTE
       ══════════════════════════════════════ -->
  <rect width="1200" height="630" fill="url(#vgn)"/>
</svg>
