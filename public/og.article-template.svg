<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <radialGradient id="rg-top" cx="600" cy="0" r="660" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#280410"/>
    <stop offset="100%" stop-color="#280410" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="rg-bot" cx="600" cy="630" r="756" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#1c0209"/>
    <stop offset="100%" stop-color="#1c0209" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="hr-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
    <stop offset="0%"   stop-color="#9b1422" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#9b1422" stop-opacity="0.55"/>
    <stop offset="50%"  stop-color="#e02535" stop-opacity="0.85"/>
    <stop offset="80%"  stop-color="#9b1422" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#9b1422" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="drip-grad" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="1000" y2="0">
    <stop offset="0%"   stop-color="#0e0508" stop-opacity="0"/>
    <stop offset="15%"  stop-color="#640812" stop-opacity="0.6"/>
    <stop offset="45%"  stop-color="#c01828"/>
    <stop offset="55%"  stop-color="#e02535"/>
    <stop offset="68%"  stop-color="#c01828"/>
    <stop offset="85%"  stop-color="#640812" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0e0508" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="blade-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e02535" stop-opacity="0.9"/>
    <stop offset="55%"  stop-color="#9b1422" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#9b1422" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="hdr-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1c030a"/>
    <stop offset="100%" stop-color="#0e0508"/>
  </linearGradient>

  <linearGradient id="title-grad" gradientUnits="userSpaceOnUse" x1="0" y1="283" x2="0" y2="363">
    <stop offset="0%"   stop-color="#ede2d8"/>
    <stop offset="100%" stop-color="#c4a8a0"/>
  </linearGradient>

  <linearGradient id="title-shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="283" x2="0" y2="363">
    <stop offset="0%"   stop-color="#fff5f6" stop-opacity="0.18"/>
    <stop offset="45%"  stop-color="#ede2d8" stop-opacity="0"/>
    <stop offset="100%" stop-color="#9b1422" stop-opacity="0.12"/>
  </linearGradient>

  <pattern id="dot-pat" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <circle cx="30" cy="30" r="0.75" fill="#9b1422" fill-opacity="0.09"/>
  </pattern>

  <filter id="t-blur" x="-5%" y="-60%" width="110%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
  </filter>

  <filter id="s-glow" x="-18%" y="-90%" width="136%" height="280%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
    <feFlood flood-color="#9b1422" flood-opacity="0.78" result="col"/>
    <feComposite in="col" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#0e0508"/>
<rect width="1200" height="630" fill="url(#rg-top)"/>
<rect width="1200" height="630" fill="url(#rg-bot)"/>
<rect width="1200" height="630" fill="url(#dot-pat)"/>

<!-- ── Gothic corner brackets ── -->
<polyline points="38,110 38,36 134,36"
          fill="none" stroke="#9b1422" stroke-width="1" stroke-opacity="0.58"/>
<polyline points="1066,36 1162,36 1162,110"
          fill="none" stroke="#9b1422" stroke-width="1" stroke-opacity="0.58"/>
<polyline points="38,520 38,594 134,594"
          fill="none" stroke="#9b1422" stroke-width="1" stroke-opacity="0.58"/>
<polyline points="1066,594 1162,594 1162,520"
          fill="none" stroke="#9b1422" stroke-width="1" stroke-opacity="0.58"/>

<!-- Corner accent dots -->
<circle cx="38"   cy="36"  r="2.2" fill="#9b1422" fill-opacity="0.55"/>
<circle cx="1162" cy="36"  r="2.2" fill="#9b1422" fill-opacity="0.55"/>
<circle cx="38"   cy="594" r="2.2" fill="#9b1422" fill-opacity="0.55"/>
<circle cx="1162" cy="594" r="2.2" fill="#9b1422" fill-opacity="0.55"/>

<!-- ── Site Header ── -->
<rect x="0" y="0" width="1200" height="112" fill="url(#hdr-bg)"/>

<text
  x="600" y="68"
  font-family="serif"
  font-size="30"
  fill="#ede2d8"
  text-anchor="middle"
  letter-spacing="10"
  filter="url(#s-glow)">へのへのんのの</text>

<!-- Header border (thin HR) -->
<rect x="0" y="108" width="1200" height="1" fill="url(#hr-grad)"/>
<!-- Drip accent (like .site-header::after) -->
<rect x="200" y="109" width="800" height="2.5" fill="url(#drip-grad)" opacity="0.88"/>
<!-- Diamond on header border -->
<polygon points="600,103 606,109 600,115 594,109"
         fill="#e02535" fill-opacity="0.58"/>

<!-- ── Left blade bar (like article.post border-left + blade-drip) ── -->
<rect x="60" y="128" width="2" height="385" fill="url(#blade-grad)"/>

<!-- ── Right decorative gothic diamond ── -->
<polygon points="965,168 1108,315 965,462 822,315"
         fill="none" stroke="#9b1422" stroke-width="0.9" stroke-opacity="0.15"/>
<polygon points="965,212 1062,315 965,418 868,315"
         fill="none" stroke="#9b1422" stroke-width="0.8" stroke-opacity="0.10"/>
<polygon points="965,248 1022,315 965,382 908,315"
         fill="none" stroke="#9b1422" stroke-width="0.7" stroke-opacity="0.07"/>
<circle cx="965" cy="315" r="4" fill="#9b1422" fill-opacity="0.20"/>
<circle cx="965" cy="315" r="1.5" fill="#e02535" fill-opacity="0.35"/>

<!-- ── Article label ── -->
<text
  x="82" y="158"
  font-family="serif"
  font-size="12"
  fill="#9b1422"
  letter-spacing="5"
  fill-opacity="0.88">A R T I C L E</text>

<line x1="82" y1="167" x2="318" y2="167"
      stroke="#9b1422" stroke-width="0.5" stroke-opacity="0.38"/>

<!-- ── Title: crimson glow layer ── -->
<text
  x="82" y="355"
  font-family="serif"
  font-size="72"
  fill="#9b1422"
  fill-opacity="0.55"
  letter-spacing="2"
  filter="url(#t-blur)">{{TITLE}}</text>

<!-- ── Title: main layer ── -->
<text
  x="82" y="355"
  font-family="serif"
  font-size="72"
  fill="url(#title-grad)"
  letter-spacing="2">{{TITLE}}</text>

<!-- ── Title: shimmer overlay ── -->
<text
  x="82" y="355"
  font-family="serif"
  font-size="72"
  fill="url(#title-shimmer)"
  letter-spacing="2">{{TITLE}}</text>

<!-- ── Bottom separator ── -->
<rect x="0" y="516" width="1200" height="1" fill="url(#hr-grad)"/>

<!-- Diamond ornaments on separator -->
<polygon points="600,509 607,516 600,523 593,516"
         fill="#9b1422" fill-opacity="0.72"/>
<polygon points="568,513 573,516 568,519 563,516"
         fill="#9b1422" fill-opacity="0.36"/>
<polygon points="632,513 637,516 632,519 627,516"
         fill="#9b1422" fill-opacity="0.36"/>
<polygon points="536,514.5 540,516 536,517.5 532,516"
         fill="#9b1422" fill-opacity="0.18"/>
<polygon points="664,514.5 668,516 664,517.5 660,516"
         fill="#9b1422" fill-opacity="0.18"/>

<!-- ── Footer site name ── -->
<text
  x="600" y="571"
  font-family="serif"
  font-size="14"
  fill="#9a7278"
  text-anchor="middle"
  letter-spacing="7">へのへのんのの</text>

</svg>
