<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <pattern id="scan" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="4" fill="none"/>
      <rect y="3" width="2" height="1" fill="#000000" fill-opacity="0.08"/>
    </pattern>

    <linearGradient id="bgOverlay" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a1030" stop-opacity="0.62"/>
      <stop offset="50%"  stop-color="#09071a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0f00" stop-opacity="0.52"/>
    </linearGradient>

    <linearGradient id="goldH" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7a5800" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#d49a0c"/>
      <stop offset="50%"  stop-color="#f5c842"/>
      <stop offset="80%"  stop-color="#d49a0c"/>
      <stop offset="100%" stop-color="#7a5800" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7a5800" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#d49a0c"/>
      <stop offset="70%"  stop-color="#d49a0c"/>
      <stop offset="100%" stop-color="#7a5800" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="268" x2="0" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f5c842"/>
      <stop offset="48%"  stop-color="#d49a0c"/>
      <stop offset="100%" stop-color="#9a6e00"/>
    </linearGradient>

    <radialGradient id="titleGlow" cx="590" cy="308" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#d49a0c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d49a0c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="crimsonCo" cx="1200" cy="630" r="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6b1515" stop-opacity="0.58"/>
      <stop offset="50%"  stop-color="#6b1515" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6b1515" stop-opacity="0"/>
    </radialGradient>

    <filter id="titleGlowF" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <filter id="softGlow" x="-8%" y="-40%" width="116%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#09071a"/>
  <!-- 135° panel overlay: dark-purple → ink-black → dark-amber -->
  <rect width="1200" height="630" fill="url(#bgOverlay)"/>
  <!-- Crimson ink stain – bottom-right corner -->
  <rect width="1200" height="630" fill="url(#crimsonCo)"/>
  <!-- Ambient title glow -->
  <rect width="1200" height="630" fill="url(#titleGlow)"/>
  <!-- Horizontal scan lines -->
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- Outer gold frame bars -->
  <rect x="0"    y="0"   width="1200" height="4"  fill="url(#goldH)"/>
  <rect x="0"    y="626" width="1200" height="4"  fill="url(#goldH)"/>
  <rect x="0"    y="0"   width="4"   height="630" fill="url(#goldV)"/>
  <rect x="1196" y="0"   width="4"   height="630" fill="url(#goldV)"/>

  <!-- Inner thin border -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#d49a0c" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Corner L-brackets -->
  <path d="M 16,80 L 16,16 L 80,16"       fill="none" stroke="#d49a0c" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 1184,80 L 1184,16 L 1120,16" fill="none" stroke="#d49a0c" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 16,550 L 16,614 L 80,614"    fill="none" stroke="#d49a0c" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 1184,550 L 1184,614 L 1120,614" fill="none" stroke="#d49a0c" stroke-width="2.5" stroke-linecap="square"/>

  <!-- ── Header ── -->
  <rect x="16" y="150" width="1168" height="1" fill="url(#goldH)" fill-opacity="0.65"/>

  <!-- Site name -->
  <text x="72" y="108"
        font-family="serif" font-size="30"
        fill="#f0e2b6" fill-opacity="0.88"
        letter-spacing="3"
        filter="url(#softGlow)">へのへのんのの</text>

  <!-- "ARTICLE" label -->
  <text x="74" y="136"
        font-family="sans-serif" font-size="11"
        fill="#d49a0c" fill-opacity="0.55"
        letter-spacing="4">ARTICLE</text>

  <!-- Star ornament -->
  <text x="1128" y="108"
        font-family="serif" font-size="26"
        fill="#f5c842" fill-opacity="0.44"
        text-anchor="end"
        filter="url(#softGlow)">★</text>

  <!-- ── Content area left accent bar ── -->
  <line x1="58" y1="166" x2="58" y2="485" stroke="#d49a0c" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- ── Title ── -->
  <!-- Glow / halo layer -->
  <text x="72" y="340"
        font-family="serif" font-size="70"
        fill="#f5c842"
        filter="url(#titleGlowF)">{{TITLE}}</text>

  <!-- Main crisp layer -->
  <text x="72" y="340"
        font-family="serif" font-size="70"
        fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- Faint ruled lines – gold-foil paper texture -->
  <line x1="72"  y1="368" x2="1068" y2="368" stroke="#d49a0c" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="72"  y1="396" x2="1028" y2="396" stroke="#d49a0c" stroke-opacity="0.065" stroke-width="1"/>
  <line x1="72"  y1="424" x2="975"  y2="424" stroke="#d49a0c" stroke-opacity="0.038" stroke-width="1"/>

  <!-- ── Footer ── -->
  <rect x="16" y="492" width="1168" height="1" fill="url(#goldH)" fill-opacity="0.48"/>

  <!-- Footer site name (subtle repeat) -->
  <text x="72" y="552"
        font-family="serif" font-size="18"
        fill="#f0e2b6" fill-opacity="0.34"
        letter-spacing="2">へのへのんのの</text>

  <!-- Fading dot ornament -->
  <circle cx="377" cy="546" r="2.5" fill="#d49a0c" fill-opacity="0.40"/>
  <circle cx="394" cy="546" r="2.5" fill="#d49a0c" fill-opacity="0.23"/>
  <circle cx="411" cy="546" r="2.5" fill="#d49a0c" fill-opacity="0.12"/>

</svg>
