<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 空の雰囲気: 上-左の青灰 → 下-右の淡白 -->
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#ccd6eb"/>
      <stop offset="28%"  stop-color="#d8e2f2"/>
      <stop offset="58%"  stop-color="#e5e8f5"/>
      <stop offset="80%"  stop-color="#eeecf7"/>
      <stop offset="100%" stop-color="#f2f1f9"/>
    </linearGradient>

    <!-- 曇り空の切れ間から差す光 (header::before に対応) -->
    <radialGradient id="cloudlight" cx="780" cy="0" r="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#d2e1ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#d2e1ff" stop-opacity="0"/>
    </radialGradient>

    <!-- アクセント線: solid → transparent (h1::after に対応) -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d5f8f"/>
      <stop offset="100%" stop-color="#3d5f8f" stop-opacity="0"/>
    </linearGradient>

    <!-- 上端アクセントバー -->
    <linearGradient id="topedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3d5f8f" stop-opacity="0.65"/>
      <stop offset="52%"  stop-color="#3d5f8f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3d5f8f" stop-opacity="0"/>
    </linearGradient>

    <!-- カード影 (article.post の box-shadow に対応) -->
    <filter id="cardshadow" x="-4%" y="-5%" width="108%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="14"
                    flood-color="#233764" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ── 空グラデーション背景 ── -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- ── 雲間の光 ── -->
  <rect width="1200" height="630" fill="url(#cloudlight)"/>

  <!-- ── 雲: 柔らかい楕円の重なり ── -->
  <!-- 右上クラスター -->
  <ellipse cx="1045" cy="84"  rx="338" ry="92"  fill="#d4dff0" opacity="0.42"/>
  <ellipse cx="1152" cy="150" rx="192" ry="56"  fill="#dce8f5" opacity="0.28"/>
  <ellipse cx="868"  cy="49"  rx="242" ry="59"  fill="#dde5f2" opacity="0.33"/>
  <!-- 左のうす雲 -->
  <ellipse cx="158"  cy="68"  rx="214" ry="60"  fill="#d8e2f2" opacity="0.28"/>
  <ellipse cx="40"   cy="142" rx="136" ry="45"  fill="#dce4ee" opacity="0.22"/>

  <!-- ── 上端アクセントライン ── -->
  <rect x="0" y="0" width="560" height="3" fill="url(#topedge)"/>

  <!-- ── メインカード (article.post スタイル) ── -->
  <rect x="60" y="124" width="1080" height="392"
        rx="6" ry="6"
        fill="white" fill-opacity="0.60"
        stroke="#cdd3e5" stroke-width="1"
        filter="url(#cardshadow)"/>

  <!-- 左アクセントバー (blockquote border-left に対応) -->
  <rect x="60" y="124" width="4" height="392" rx="2" fill="#3d5f8f"/>

  <!-- ── 記事タイトル ── -->
  <text x="108" y="354"
        font-family="serif"
        font-size="68"
        fill="#1a2338"
        letter-spacing="3">{{TITLE}}</text>

  <!-- タイトル下のビーム線 (article h1::after に対応) -->
  <rect x="108" y="386" width="224" height="2" rx="1" fill="url(#beam)"/>

  <!-- ── 点線セパレーター (post-list border-bottom に対応) ── -->
  <line x1="60" y1="546" x2="1140" y2="546"
        stroke="#bcc3d9" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- ── サイト名 ── -->
  <text x="108" y="596"
        font-family="serif"
        font-size="26"
        fill="#3d5f8f"
        letter-spacing="4">へのへのんのの</text>

  <!-- 右下: 装飾ドット -->
  <circle cx="1076" cy="589" r="3.5" fill="#c8cee2"/>
  <circle cx="1094" cy="589" r="3.5" fill="#c8cee2"/>
  <circle cx="1112" cy="589" r="3.5" fill="#c8cee2"/>
  <circle cx="1130" cy="589" r="3.5" fill="#c8cee2"/>
</svg>
