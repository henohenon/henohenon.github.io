<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-8%" r="75%">
      <stop offset="0%" stop-color="#8f1f2e" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#8f1f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="siteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0576a"/>
      <stop offset="45%" stop-color="#ece5dc"/>
      <stop offset="100%" stop-color="#8fa3c9"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0576a"/>
      <stop offset="50%" stop-color="#ece5dc"/>
      <stop offset="100%" stop-color="#8fa3c9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#120f10"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- coffin-slat fence, faint, left/right margins only -->
  <g stroke="#2a2422" stroke-width="1" opacity="0.45">
    <line x1="24" y1="0" x2="24" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="56" y1="0" x2="56" y2="630"/>
    <line x1="1144" y1="0" x2="1144" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1176" y1="0" x2="1176" y2="630"/>
  </g>

  <!-- outer frame, like article.post border -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#2a2422" stroke-width="2"/>

  <!-- site name -->
  <text x="60" y="86" font-family="sans-serif" font-weight="700" font-size="32" letter-spacing="10" fill="url(#siteGrad)">へのへのんのの</text>
  <line x1="60" y1="104" x2="270" y2="104" stroke="#8f1f2e" stroke-width="2"/>

  <!-- title marker bar -->
  <rect x="60" y="220" width="6" height="220" fill="#e0576a" opacity="0.9"/>

  <!-- article title, doubled for echo/flicker effect -->
  <text x="94" y="356" font-family="sans-serif" font-weight="700" font-size="72" fill="none" stroke="#8fa3c9" stroke-width="2" opacity="0.4">{{TITLE}}</text>
  <text x="90" y="352" font-family="sans-serif" font-weight="700" font-size="72" letter-spacing="1" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- dashed separator, echoing hr styling -->
  <line x1="60" y1="512" x2="1140" y2="512" stroke="#2a2422" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- procession lights -->
  <g opacity="0.7">
    <circle cx="90" cy="560" r="4" fill="#e0576a"/>
    <circle cx="230" cy="560" r="4" fill="#8fa3c9"/>
    <circle cx="370" cy="560" r="4" fill="#e0576a"/>
    <circle cx="510" cy="560" r="4" fill="#8fa3c9"/>
    <circle cx="650" cy="560" r="4" fill="#e0576a"/>
    <circle cx="790" cy="560" r="4" fill="#8fa3c9"/>
    <circle cx="930" cy="560" r="4" fill="#e0576a"/>
    <circle cx="1070" cy="560" r="4" fill="#8fa3c9"/>
  </g>

  <!-- corner tag -->
  <text x="1140" y="596" font-family="sans-serif" font-size="18" letter-spacing="4" fill="#8fa3c9" text-anchor="end" opacity="0.85">ARTICLE</text>
</svg>
