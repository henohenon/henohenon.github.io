<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Monsoon rain grid — vertical lines every 73 px -->
    <pattern id="rain" x="0" y="0" width="73" height="630" patternUnits="userSpaceOnUse">
      <rect x="72" y="0" width="1" height="630" fill="#00c0d8" fill-opacity="0.025"/>
    </pattern>

    <!-- Deep-sea radial glow from canvas bottom -->
    <radialGradient id="seaDepth" cx="50%" cy="100%" r="75%">
      <stop offset="0%"   stop-color="#006e9b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark tonal depth — upper-left corner -->
    <radialGradient id="cornerDepth" cx="12%" cy="12%" r="55%">
      <stop offset="0%"   stop-color="#003755" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Tide sweep — horizontal luminance gradient -->
    <linearGradient id="tideGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#090d1a" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00c0d8" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#00c0d8" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#00c0d8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
    </linearGradient>

    <!-- Title text gradient: pale seafoam → electric teal -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#c8dde8"/>
      <stop offset="65%" stop-color="#00c0d8"/>
    </linearGradient>

    <!-- Site name gradient -->
    <linearGradient id="siteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="20%"  stop-color="#c8dde8"/>
      <stop offset="100%" stop-color="#00c0d8"/>
    </linearGradient>

    <!-- Title glow — blurred teal halo beneath main text -->
    <filter id="titleGlow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ════ Background layers ════ -->
  <rect width="1200" height="630" fill="#090d1a"/>
  <rect width="1200" height="630" fill="url(#seaDepth)"/>
  <rect width="1200" height="630" fill="url(#cornerDepth)"/>

  <!-- Monsoon rain grid -->
  <rect width="1200" height="630" fill="url(#rain)"/>

  <!-- ════ Top accent — reiß'nde Flut tide bar ════ -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#tideGrad)"/>

  <!-- ════ Left vertical accent bar ════ -->
  <rect x="68" y="72" width="2" height="487" fill="#00c0d8" fill-opacity="0.27"/>

  <!-- ════ Site name header ════ -->
  <text
    x="88" y="108"
    font-family="serif"
    font-size="30"
    letter-spacing="4"
    fill="url(#siteGrad)"
  >へのへのんのの</text>

  <!-- Separator line under site name -->
  <line x1="82" y1="132" x2="540" y2="132" stroke="#00c0d8" stroke-opacity="0.1" stroke-width="1"/>

  <!-- ════ Article label ════ -->
  <text
    x="90" y="170"
    font-family="sans-serif"
    font-size="12"
    letter-spacing="5"
    fill="#7faab8"
    fill-opacity="0.65"
  >ARTICLE</text>

  <!-- ════ Title area ════ -->

  <!-- Lichtblick: brightened left-bar segment behind title -->
  <rect x="68" y="276" width="2" height="88" fill="#00c0d8" fill-opacity="0.78"/>

  <!-- Glow halo layer (blurred, semi-transparent) -->
  <text
    x="88" y="342"
    font-family="serif"
    font-size="72"
    letter-spacing="1"
    fill="#00c0d8"
    fill-opacity="0.18"
    filter="url(#titleGlow)"
  >{{TITLE}}</text>

  <!-- Main title text -->
  <text
    x="88" y="342"
    font-family="serif"
    font-size="72"
    letter-spacing="1"
    fill="url(#titleGrad)"
  >{{TITLE}}</text>

  <!-- Title underline — Lichtblick sweep -->
  <rect x="68" y="360" width="980" height="1" fill="url(#tideGrad)" fill-opacity="0.45"/>

  <!-- ════ Lower area — 濁流 / the flood ════ -->

  <!-- Wave line 1 -->
  <path
    d="M -10 510 Q 200 494 400 507 Q 600 520 800 507 Q 1000 494 1210 505"
    fill="none"
    stroke="#00c0d8"
    stroke-opacity="0.07"
    stroke-width="1.5"/>

  <!-- Wave line 2 -->
  <path
    d="M -10 524 Q 210 513 420 523 Q 630 533 840 523 Q 1050 513 1210 521"
    fill="none"
    stroke="#00c0d8"
    stroke-opacity="0.044"
    stroke-width="1"/>

  <!-- Ripple rings — Kreislauf meiner Sehnsucht -->
  <ellipse cx="600" cy="650" rx="370" ry="44"
    fill="none" stroke="#00c0d8" stroke-opacity="0.09" stroke-width="1"/>
  <ellipse cx="600" cy="655" rx="530" ry="62"
    fill="none" stroke="#00c0d8" stroke-opacity="0.055" stroke-width="1"/>

  <!-- ════ Bottom accent ════ -->
  <line x1="0" y1="598" x2="1200" y2="598" stroke="#00c0d8" stroke-opacity="0.09" stroke-width="1"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#tideGrad)"/>
</svg>
