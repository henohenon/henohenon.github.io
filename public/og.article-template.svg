<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Scanline: 3px gap + 1px dark, repeating every 4px -->
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="1200" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <!-- Horizontal ember gradient -->
    <linearGradient id="hEmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a0f28"/>
      <stop offset="35%"  stop-color="#e05275"/>
      <stop offset="60%"  stop-color="#f07090"/>
      <stop offset="100%" stop-color="#7a0f28"/>
    </linearGradient>
    <!-- Vertical ember gradient -->
    <linearGradient id="vEmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e05275"/>
      <stop offset="50%"  stop-color="#f07090"/>
      <stop offset="100%" stop-color="#7a0f28"/>
    </linearGradient>
    <!-- Radial glow behind title -->
    <radialGradient id="rGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e05275" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#e05275" stop-opacity="0"/>
    </radialGradient>
    <!-- Title fill: top-bright to bottom-dim -->
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f4f0f2"/>
      <stop offset="100%" stop-color="#bab6b8"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="#0c0a0d"/>

  <!-- ── Surface card ── -->
  <rect x="50" y="50" width="1100" height="530" fill="#141118"/>

  <!-- ── Scanlines ── -->
  <rect width="1200" height="630" fill="url(#sl)"/>

  <!-- ── Ritual rings (faint cult ambiance) ── -->
  <circle cx="600" cy="295" r="270" fill="none" stroke="#2c2830" stroke-width="1" opacity="0.4"/>
  <circle cx="600" cy="295" r="200" fill="none" stroke="#7a0f28"  stroke-width="1" opacity="0.22"/>

  <!-- ── Radial ember glow behind title ── -->
  <ellipse cx="600" cy="295" rx="550" ry="210" fill="url(#rGlow)"/>

  <!-- ── Crosshair at ritual center ── -->
  <line x1="564" y1="295" x2="636" y2="295" stroke="#2c2830" stroke-width="0.5" opacity="0.55"/>
  <line x1="600" y1="259" x2="600" y2="331" stroke="#2c2830" stroke-width="0.5" opacity="0.55"/>

  <!-- ── Top ember line ── -->
  <rect x="50" y="50" width="1100" height="3" fill="url(#hEmber)"/>

  <!-- ── Left accent bar ── -->
  <rect x="50" y="50" width="4" height="530" fill="url(#vEmber)"/>

  <!-- ── Right subtle accent ── -->
  <rect x="1146" y="50" width="1" height="530" fill="url(#vEmber)" opacity="0.28"/>

  <!-- ── Corner bracket ornaments ── -->
  <path d="M88 88 L88 74 L124 74"     fill="none" stroke="#e05275" stroke-width="1.5" stroke-linecap="square" opacity="0.52"/>
  <path d="M1076 74 L1112 74 L1112 88" fill="none" stroke="#e05275" stroke-width="1.5" stroke-linecap="square" opacity="0.52"/>
  <path d="M88 542 L88 556 L124 556"   fill="none" stroke="#7a0f28" stroke-width="1.5" stroke-linecap="square" opacity="0.52"/>
  <path d="M1076 556 L1112 556 L1112 542" fill="none" stroke="#7a0f28" stroke-width="1.5" stroke-linecap="square" opacity="0.52"/>

  <!-- ── ARTICLE section label ── -->
  <text x="104" y="150" font-family="sans-serif" font-size="12" fill="#7a7278" letter-spacing="0.14em">ARTICLE</text>
  <rect x="104" y="157" width="52" height="1" fill="#7a0f28" opacity="0.7"/>

  <!-- ── Separator 1 (above title) ── -->
  <line x1="104" y1="183" x2="1096" y2="183" stroke="#2c2830" stroke-width="1"/>
  <rect x="104" y="180.5" width="44" height="3" fill="#e05275" opacity="0.82"/>
  <circle cx="1096" cy="183" r="2" fill="#2c2830" opacity="0.7"/>

  <!-- ── {{TITLE}} — glitch ghost cyan (left-up 3px) ── -->
  <text x="597" y="316"
        font-family="sans-serif" font-size="68"
        fill="#50c8dc" fill-opacity="0.13"
        text-anchor="middle" letter-spacing="0.03em">{{TITLE}}</text>

  <!-- ── {{TITLE}} — glitch ghost rose (right-down 3px) ── -->
  <text x="603" y="322"
        font-family="sans-serif" font-size="68"
        fill="#e05275" fill-opacity="0.19"
        text-anchor="middle" letter-spacing="0.03em">{{TITLE}}</text>

  <!-- ── {{TITLE}} — main title ── -->
  <text x="600" y="319"
        font-family="sans-serif" font-size="68"
        fill="url(#titleFill)"
        text-anchor="middle" letter-spacing="0.03em">{{TITLE}}</text>

  <!-- ── Separator 2 (below title) ── -->
  <line x1="104" y1="416" x2="1096" y2="416" stroke="#2c2830" stroke-width="1"/>
  <rect x="104" y="413.5" width="28" height="3" fill="#7a0f28" opacity="0.82"/>
  <circle cx="104" cy="416" r="2" fill="#2c2830" opacity="0.7"/>

  <!-- ── Site name ── -->
  <text x="104" y="522"
        font-family="sans-serif" font-size="22"
        fill="#7a7278" letter-spacing="0.08em">へのへのんのの</text>

  <!-- ── Bottom-right ember dots ── -->
  <circle cx="1096" cy="522" r="3.5" fill="#e05275" opacity="0.62"/>
  <circle cx="1081" cy="522" r="3.5" fill="#7a0f28" opacity="0.62"/>
  <circle cx="1066" cy="522" r="2.5" fill="#2c2830" opacity="0.88"/>

</svg>
