<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g-sky" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c4604a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1e1528" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-sun" cx="87%" cy="74%" r="46%">
      <stop offset="0%"   stop-color="#e8896e" stop-opacity="0.30"/>
      <stop offset="45%"  stop-color="#d4738a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1528" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e1528" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#c4604a" stop-opacity="0.80"/>
      <stop offset="48%"  stop-color="#e8896e" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#d4738a" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#1e1528" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8896e" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#e8896e"/>
      <stop offset="68%"  stop-color="#d4738a"/>
      <stop offset="100%" stop-color="#d4738a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4738a"/>
      <stop offset="50%"  stop-color="#e8896e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e8896e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e1528" stop-opacity="0"/>
      <stop offset="100%" stop-color="#160e22"/>
    </linearGradient>
    <linearGradient id="g-topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4738a" stop-opacity="0"/>
      <stop offset="8%"   stop-color="#d4738a" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#e8896e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4738a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Background layers ── -->
  <rect width="1200" height="630" fill="#1e1528"/>
  <rect width="1200" height="630" fill="url(#g-sky)"/>
  <rect width="1200" height="630" fill="url(#g-sun)"/>
  <rect x="0" y="450" width="1200" height="180" fill="url(#g-floor)"/>

  <!-- ── Top border shimmer ── -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#g-topbar)"/>

  <!-- ── Dusk sun rings — right side, centered on horizon ── -->
  <circle cx="1050" cy="462" r="242" fill="none" stroke="#c4604a" stroke-width="0.6" opacity="0.08"/>
  <circle cx="1050" cy="462" r="200" fill="none" stroke="#c4604a" stroke-width="0.7" opacity="0.11"/>
  <circle cx="1050" cy="462" r="160" fill="none" stroke="#d4738a" stroke-width="0.8" opacity="0.15"/>
  <circle cx="1050" cy="462" r="122" fill="none" stroke="#d4738a" stroke-width="0.9" opacity="0.20"/>
  <circle cx="1050" cy="462" r="86"  fill="none" stroke="#e8896e" stroke-width="1.1" opacity="0.28"/>
  <circle cx="1050" cy="462" r="52"  fill="none" stroke="#e8896e" stroke-width="1.4" opacity="0.42"/>
  <circle cx="1050" cy="462" r="26"  fill="#e8896e" opacity="0.15"/>
  <circle cx="1050" cy="462" r="11"  fill="#e8896e" opacity="0.35"/>

  <!-- ── Rail lines converging toward sunset (遠ざかる汽笛) ── -->
  <line x1="0"   y1="630" x2="1050" y2="462" stroke="#d4738a" stroke-width="0.7" opacity="0.11"/>
  <line x1="210" y1="630" x2="1050" y2="462" stroke="#d4738a" stroke-width="0.6" opacity="0.09"/>
  <line x1="420" y1="630" x2="1050" y2="462" stroke="#c4604a" stroke-width="0.5" opacity="0.07"/>
  <line x1="600" y1="630" x2="1050" y2="462" stroke="#c4604a" stroke-width="0.5" opacity="0.06"/>

  <!-- ── Horizon glow band ── -->
  <rect x="0" y="460" width="1200" height="3" fill="url(#g-horizon)"/>

  <!-- ── Left editorial accent bar ── -->
  <rect x="60" y="88" width="3" height="344" fill="url(#g-bar)"/>

  <!-- ── Scattered star/light dots (upper right) ── -->
  <circle cx="796"  cy="122" r="1.5" fill="#f2ddd0" opacity="0.20"/>
  <circle cx="860"  cy="158" r="2.0" fill="#d4738a" opacity="0.36"/>
  <circle cx="918"  cy="100" r="1.2" fill="#e8896e" opacity="0.26"/>
  <circle cx="972"  cy="140" r="1.5" fill="#f2ddd0" opacity="0.18"/>
  <circle cx="1022" cy="90"  r="1.0" fill="#d4738a" opacity="0.30"/>
  <circle cx="1084" cy="124" r="2.0" fill="#e8896e" opacity="0.20"/>
  <circle cx="1134" cy="154" r="1.5" fill="#f2ddd0" opacity="0.17"/>
  <circle cx="1164" cy="104" r="1.0" fill="#d4738a" opacity="0.26"/>
  <circle cx="838"  cy="83"  r="1.0" fill="#e8896e" opacity="0.18"/>
  <circle cx="1007" cy="170" r="1.2" fill="#f2ddd0" opacity="0.14"/>
  <circle cx="744"  cy="148" r="1.0" fill="#d4738a" opacity="0.22"/>
  <circle cx="924"  cy="62"  r="1.2" fill="#e8896e" opacity="0.16"/>
  <circle cx="1056" cy="56"  r="1.0" fill="#f2ddd0" opacity="0.12"/>

  <!-- ── Site name ── -->
  <text
    x="82" y="67"
    font-family="serif"
    font-size="26"
    fill="#e8896e"
    opacity="0.90"
  >へのへのんのの</text>

  <!-- ── Article title — shadow depth layer ── -->
  <text
    x="85" y="333"
    font-family="serif"
    font-size="74"
    fill="#e8896e"
    opacity="0.08"
  >{{TITLE}}</text>

  <!-- ── Article title — main layer ── -->
  <text
    x="82" y="330"
    font-family="serif"
    font-size="74"
    fill="#f2ddd0"
  >{{TITLE}}</text>

  <!-- ── Title underline (like h1::after in theme.css) ── -->
  <rect x="82" y="350" width="500" height="2" fill="url(#g-rule)" rx="1"/>

  <!-- ── Whistle motif (〜 echoes footer animation) ── -->
  <text
    x="82" y="412"
    font-family="serif"
    font-size="18"
    letter-spacing="12"
    fill="#d4738a"
    opacity="0.38"
  >〜〜〜</text>

</svg>
