    <rect x="-60" y="122" width="220" height="16" fill="#33f0ff" opacity="0.10" transform="skewX(-20)"/>
    <rect x="-40" y="472" width="260" height="12" fill="#ff2f6d" opacity="0.12" transform="skewX(-20)"/>
    <rect x="1020" y="150" width="240" height="10" fill="#ff2f6d" opacity="0.10" transform="skewX(20)"/>
    <rect x="1000" y="440" width="260" height="14" fill="#33f0ff" opacity="0.09" transform="skewX(20)"/>

    <rect x="0" y="0" width="1200" height="92" fill="url(#headerGrad)"/>
    <rect x="0" y="90" width="1200" height="2" fill="#ff2f6d"/>
    <text x="60" y="58" font-family="monospace" font-size="30" font-weight="700" letter-spacing="2" fill="#d6f5df">へのへのんのの<tspan fill="#ff2f6d">_</tspan></text>
    <text x="1140" y="58" text-anchor="end" font-family="monospace" font-size="14" letter-spacing="1" fill="#33f0ff" opacity="0.6">DECODING...</text>

    <rect x="56" y="230" width="1088" height="190" fill="#0a0a0f" opacity="0.4" stroke="#ff2f6d" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1122" y="220" text-anchor="end" font-family="monospace" font-size="13" letter-spacing="1" fill="#ff2f6d" opacity="0.65">0x00 SEGMENTATION FAULT</text>
    <text x="80" y="270" font-family="monospace" font-size="16" letter-spacing="2" fill="#33f0ff" opacity="0.7">&gt; LOG_ENTRY</text>

    <text x="83" y="360" font-family="monospace" font-size="74" font-weight="700" fill="#33f0ff" opacity="0.55">{{TITLE}}</text>
    <text x="77" y="360" font-family="monospace" font-size="74" font-weight="700" fill="#ff2f6d" opacity="0.55">{{TITLE}}</text>
    <text x="80" y="360" font-family="monospace" font-size="74" font-weight="700" fill="#d6f5df">{{TITLE}}</text>

    <rect x="0" y="600" width="1200" height="30" fill="url(#footerGrad)"/>
    <rect x="0" y="600" width="1200" height="1" fill="#ff2f6d" opacity="0.4"/>
    <text x="60" y="622" font-family="monospace" font-size="16" fill="#d6f5df" opacity="0.6"><tspan fill="#ff2f6d">root@brain</tspan>:~$ へのへのんのの</text>
