<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>

  <radialGradient id="g-top" cx="600" cy="-50" r="700" gradientUnits="userSpaceOnUse">
    <stop offset="0%"  stop-color="#c89030" stop-opacity="0.09"/>
    <stop offset="68%" stop-color="#c89030" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="g-br" cx="936" cy="580" r="360" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#0c1230" stop-opacity="0.60"/>
    <stop offset="100%" stop-color="#0c1230" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="g-title-bg" cx="600" cy="330" r="440" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#c89030" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="g-vline" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#c89030" stop-opacity="0"/>
    <stop offset="28%"  stop-color="#c89030" stop-opacity="0.55"/>
    <stop offset="72%"  stop-color="#c89030" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="g-hline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#c89030" stop-opacity="0"/>
    <stop offset="12%"  stop-color="#c89030" stop-opacity="0.22"/>
    <stop offset="88%"  stop-color="#c89030" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="g-ornament" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#c89030" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#c89030" stop-opacity="0.44"/>
    <stop offset="100%" stop-color="#c89030" stop-opacity="0"/>
  </linearGradient>

  <filter id="f-bloom" x="-40%" y="-120%" width="180%" height="340%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>

  <filter id="f-glow-sm" x="-40%" y="-120%" width="180%" height="340%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>

</defs>

<!-- ── Base background ── -->
<rect width="1200" height="630" fill="#0c0f1e"/>
<rect width="1200" height="630" fill="url(#g-top)"/>
<rect width="1200" height="630" fill="url(#g-br)"/>
<rect width="1200" height="630" fill="url(#g-title-bg)"/>

<!-- ── Shining Wings: subtle light rays from top centre ── -->
<line x1="600" y1="-10" x2="60"   y2="530" stroke="#c89030" stroke-opacity="0.040" stroke-width="2"/>
<line x1="600" y1="-10" x2="220"  y2="540" stroke="#c89030" stroke-opacity="0.055" stroke-width="1.5"/>
<line x1="600" y1="-10" x2="410"  y2="515" stroke="#c89030" stroke-opacity="0.038" stroke-width="1"/>
<line x1="600" y1="-10" x2="790"  y2="515" stroke="#c89030" stroke-opacity="0.038" stroke-width="1"/>
<line x1="600" y1="-10" x2="980"  y2="540" stroke="#c89030" stroke-opacity="0.055" stroke-width="1.5"/>
<line x1="600" y1="-10" x2="1140" y2="530" stroke="#c89030" stroke-opacity="0.040" stroke-width="2"/>

<!-- ── Left vertical accent line (article.post::before motif) ── -->
<rect x="48" y="72" width="2" height="486" fill="url(#g-vline)"/>

<!-- ── Horizontal rules ── -->
<rect x="0" y="128" width="1200" height="1" fill="url(#g-hline)"/>
<rect x="0" y="498" width="1200" height="1" fill="url(#g-hline)"/>

<!-- ── Golden sparks / stars ── -->
<!-- vline cap glints -->
<circle cx="49" cy="70"  r="10"  fill="#c89030" opacity="0.10"/>
<circle cx="49" cy="70"  r="3.5" fill="#c89030" opacity="0.72"/>
<circle cx="49" cy="558" r="7"   fill="#c89030" opacity="0.08"/>
<circle cx="49" cy="558" r="2.5" fill="#c89030" opacity="0.60"/>
<!-- top scatter -->
<circle cx="148" cy="44"  r="1.5" fill="#c89030" opacity="0.48"/>
<circle cx="298" cy="70"  r="1"   fill="#c89030" opacity="0.36"/>
<circle cx="452" cy="32"  r="2"   fill="#c89030" opacity="0.30"/>
<circle cx="600" cy="18"  r="1.5" fill="#c89030" opacity="0.28"/>
<circle cx="752" cy="55"  r="1"   fill="#c89030" opacity="0.34"/>
<circle cx="905" cy="36"  r="2"   fill="#c89030" opacity="0.28"/>
<circle cx="1048" cy="62" r="1.5" fill="#c89030" opacity="0.42"/>
<circle cx="1148" cy="40" r="1"   fill="#c89030" opacity="0.30"/>
<!-- upper-right accent cluster -->
<circle cx="1098" cy="86"  r="9"   fill="#c89030" opacity="0.10"/>
<circle cx="1098" cy="86"  r="2.5" fill="#c89030" opacity="0.58"/>
<circle cx="1116" cy="68"  r="1.5" fill="#c89030" opacity="0.40"/>
<circle cx="1082" cy="102" r="1"   fill="#c89030" opacity="0.32"/>
<!-- mid-side whispers -->
<circle cx="86"   cy="205" r="1"   fill="#c89030" opacity="0.18"/>
<circle cx="98"   cy="335" r="1.5" fill="#c89030" opacity="0.14"/>
<circle cx="88"   cy="435" r="1"   fill="#c89030" opacity="0.18"/>
<circle cx="1112" cy="215" r="1"   fill="#c89030" opacity="0.18"/>
<circle cx="1122" cy="345" r="1.5" fill="#c89030" opacity="0.14"/>
<circle cx="1110" cy="445" r="1"   fill="#c89030" opacity="0.18"/>
<!-- bottom scatter -->
<circle cx="198"  cy="548" r="1.5" fill="#c89030" opacity="0.36"/>
<circle cx="372"  cy="580" r="1"   fill="#c89030" opacity="0.26"/>
<circle cx="558"  cy="560" r="2"   fill="#c89030" opacity="0.22"/>
<circle cx="732"  cy="588" r="1.5" fill="#c89030" opacity="0.28"/>
<circle cx="912"  cy="554" r="1"   fill="#c89030" opacity="0.24"/>
<circle cx="1068" cy="575" r="2"   fill="#c89030" opacity="0.30"/>

<!-- ── Site name – glow layer ── -->
<text
  x="80" y="92"
  font-family="serif"
  font-size="26"
  fill="#c89030"
  letter-spacing="0.08em"
  opacity="0.75"
  filter="url(#f-glow-sm)"
>へのへのんのの</text>
<!-- Site name – main layer -->
<text
  x="80" y="92"
  font-family="serif"
  font-size="26"
  fill="#c89030"
  letter-spacing="0.08em"
>へのへのんのの</text>

<!-- ── Article title – golden bloom layer ── -->
<text
  x="600" y="335"
  text-anchor="middle"
  font-family="serif"
  font-size="68"
  fill="#c89030"
  letter-spacing="0.05em"
  opacity="0.32"
  filter="url(#f-bloom)"
>{{TITLE}}</text>
<!-- Article title – main layer -->
<text
  x="600" y="335"
  text-anchor="middle"
  font-family="serif"
  font-size="68"
  fill="#e0d9cc"
  letter-spacing="0.05em"
>{{TITLE}}</text>

<!-- ── Bottom ornament ── -->
<rect x="552" y="522" width="96" height="1" fill="url(#g-ornament)"/>
<circle cx="576" cy="544" r="2"   fill="#c89030" opacity="0.38"/>
<circle cx="600" cy="544" r="2"   fill="#c89030" opacity="0.38"/>
<circle cx="624" cy="544" r="2"   fill="#c89030" opacity="0.38"/>

</svg>
