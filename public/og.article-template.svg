<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#c6cbd6" opacity="0.07"/>
    </pattern>

    <pattern id="hlines" x="0" y="0" width="10" height="22" patternUnits="userSpaceOnUse">
      <line x1="0" y1="21.5" x2="10" y2="21.5" stroke="#c6cbd6" stroke-width="0.5" opacity="0.022"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="30%" stop-color="#07090f" stop-opacity="0"/>
      <stop offset="72%" stop-color="#d95570" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity="0.84"/>
    </radialGradient>

    <linearGradient id="eL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07090f" stop-opacity="0.72"/>
      <stop offset="8%" stop-color="#07090f" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="eR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#07090f" stop-opacity="0.72"/>
      <stop offset="8%" stop-color="#07090f" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="eT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07090f" stop-opacity="0.54"/>
      <stop offset="14%" stop-color="#07090f" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d95570" stop-opacity="1"/>
      <stop offset="28%"  stop-color="#d95570" stop-opacity="0.50"/>
      <stop offset="55%"  stop-color="#d95570" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d95570" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d95570" stop-opacity="0.04"/>
      <stop offset="22%"  stop-color="#d95570" stop-opacity="0.60"/>
      <stop offset="78%"  stop-color="#d95570" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#d95570" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="tG" x1="84" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#eaecf3"/>
      <stop offset="52%"  stop-color="#c6cbd6"/>
      <stop offset="100%" stop-color="#68707e"/>
    </linearGradient>

    <filter id="tGlow" filterUnits="userSpaceOnUse" x="0" y="252" width="1200" height="200">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="b"/>
      <feFlood flood-color="#d95570" flood-opacity="0.16" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- base background -->
  <rect width="1200" height="630" fill="#07090f"/>

  <!-- dot grid texture -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- horizontal log-line scanlines -->
  <rect width="1200" height="630" fill="url(#hlines)"/>

  <!-- radial presence vignette -->
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- edge darkening -->
  <rect width="1200" height="630" fill="url(#eL)"/>
  <rect width="1200" height="630" fill="url(#eR)"/>
  <rect width="1200" height="630" fill="url(#eT)"/>

  <!-- left crimson accent bar -->
  <rect x="60" y="0" width="2" height="630" fill="url(#vbar)"/>

  <!-- scar lines under header -->
  <rect x="0" y="110" width="840" height="1" fill="url(#scar)"/>
  <rect x="0" y="113" width="300" height="1" fill="url(#scar)" opacity="0.34"/>

  <!-- site name -->
  <text
    x="84" y="68"
    font-family="monospace"
    font-size="13"
    fill="#c6cbd6"
    opacity="0.38"
    letter-spacing="6"
  >へのへのんのの</text>

  <!-- ARTICLE label -->
  <text
    x="84" y="95"
    font-family="monospace"
    font-size="10"
    fill="#d95570"
    opacity="0.62"
    letter-spacing="5"
  >ARTICLE</text>

  <!-- decorative log separator above title -->
  <text
    x="84" y="204"
    font-family="monospace"
    font-size="10"
    fill="#d95570"
    opacity="0.20"
    letter-spacing="1"
  >// ──────────────────────────────────────────────</text>

  <!-- title left-border accent (post-list border-left motif) -->
  <rect x="72" y="290" width="2" height="92" fill="#d95570" opacity="0.56"/>

  <!-- {{TITLE}}: crimson ghost depth layer -->
  <text
    x="84" y="367"
    font-family="monospace"
    font-size="72"
    fill="#d95570"
    opacity="0.07"
    letter-spacing="2"
  >{{TITLE}}</text>

  <!-- {{TITLE}}: primary layer with gradient fill and glow -->
  <text
    x="84" y="367"
    font-family="monospace"
    font-size="72"
    fill="url(#tG)"
    filter="url(#tGlow)"
    letter-spacing="2"
  >{{TITLE}}</text>

  <!-- scar underlines after title -->
  <rect x="84" y="387" width="560" height="1" fill="url(#scar)" opacity="0.72"/>
  <rect x="84" y="390" width="200" height="1" fill="url(#scar)" opacity="0.28"/>

  <!-- bottom scar -->
  <rect x="0" y="556" width="480" height="1" fill="url(#scar)" opacity="0.48"/>

  <!-- bottom site name ghost -->
  <text
    x="84" y="600"
    font-family="monospace"
    font-size="11"
    fill="#c6cbd6"
    opacity="0.13"
    letter-spacing="5"
  >へのへのんのの</text>

</svg>
