<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lampGlow" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ffc94a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ffc94a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffc94a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="86%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#6be2d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6be2d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c2"/>
      <stop offset="50%" stop-color="#ffc94a"/>
      <stop offset="100%" stop-color="#e0a420"/>
    </linearGradient>
    <linearGradient id="headerCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#271854" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#271854" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="diag" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#ffc94a" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#1a1033"/>
  <rect width="1200" height="630" fill="url(#diag)"/>
  <rect width="1200" height="630" fill="url(#lampGlow)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>

  <!-- Decorative stars / sparkles -->
  <g fill="#f6ead0" opacity="0.55">
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="220" cy="55" r="1.1"/>
    <circle cx="980" cy="80" r="1.4"/>
    <circle cx="1080" cy="140" r="1.8"/>
    <circle cx="160" cy="540" r="1.2"/>
    <circle cx="1050" cy="520" r="1.5"/>
    <circle cx="900" cy="580" r="1.1"/>
    <circle cx="60" cy="320" r="1"/>
    <circle cx="1140" cy="380" r="1.3"/>
  </g>
  <g fill="#ffc94a" opacity="0.85">
    <path d="M 1060 90 l 4 -12 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 z"/>
    <path d="M 90 470 l 3 -9 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 z"/>
  </g>

  <!-- Lamp smoke arc top-left -->
  <g stroke="#ffc94a" stroke-opacity="0.18" fill="none" stroke-width="1.5">
    <path d="M -20 180 Q 200 80 420 180 T 820 180"/>
    <path d="M -20 220 Q 240 130 460 220 T 880 220" stroke-opacity="0.1"/>
  </g>

  <!-- Site name (top left) -->
  <g transform="translate(60, 70)">
    <text x="0" y="0" font-family="serif" font-size="26" fill="#ffc94a" letter-spacing="4" font-weight="700">へのへのんのの</text>
    <line x1="0" y1="14" x2="64" y2="14" stroke="#ffc94a" stroke-width="2" opacity="0.8"/>
    <text x="0" y="38" font-family="monospace" font-size="12" fill="#c9b8e6" letter-spacing="6">A WISH GRANTED · BLOG</text>
  </g>

  <!-- APPROVED stamp top right -->
  <g transform="translate(1060, 90) rotate(14)" opacity="0.7">
    <rect x="-78" y="-22" width="156" height="44" fill="none" stroke="#4ade80" stroke-width="3" rx="3"/>
    <text x="0" y="7" font-family="monospace" font-size="20" font-weight="800" fill="#4ade80" text-anchor="middle" letter-spacing="6">APPROVED</text>
  </g>

  <!-- REVOKE stamp bottom right -->
  <g transform="translate(1080, 540) rotate(-9)" opacity="0.55">
    <rect x="-62" y="-18" width="124" height="36" fill="none" stroke="#ef4f6b" stroke-width="2.5" rx="3"/>
    <text x="0" y="6" font-family="monospace" font-size="16" font-weight="800" fill="#ef4f6b" text-anchor="middle" letter-spacing="5">REVOKE</text>
  </g>

  <!-- Lamp emblem left -->
  <g transform="translate(80, 305)" opacity="0.9">
    <circle cx="0" cy="0" r="34" fill="#271854" stroke="#ffc94a" stroke-width="2"/>
    <path d="M -18 4 Q -18 -8 -6 -10 L 6 -10 Q 18 -8 18 4 Q 18 14 0 16 Q -18 14 -18 4 Z" fill="#ffc94a" opacity="0.85"/>
    <path d="M 0 -10 L 0 -20 Q 4 -22 6 -18" fill="none" stroke="#ffc94a" stroke-width="2"/>
    <circle cx="0" cy="-26" r="3" fill="#fff3c2" filter="url(#softGlow)"/>
  </g>

  <!-- Title card backdrop -->
  <g>
    <rect x="50" y="220" width="1100" height="240" fill="url(#headerCard)" stroke="#ffc94a" stroke-opacity="0.3" stroke-width="1.5" rx="14"/>
    <line x1="78" y1="252" x2="142" y2="252" stroke="#6be2d4" stroke-width="2"/>
    <text x="156" y="258" font-family="monospace" font-size="14" fill="#6be2d4" letter-spacing="6">✦ JOURNAL ENTRY</text>
  </g>

  <!-- Title (single placeholder, drawn twice at the same position is OK but we use one) -->
  <text x="600" y="370" font-family="serif" font-size="76" font-weight="700" fill="url(#titleGold)" text-anchor="middle" letter-spacing="2" style="text-shadow: 0 0 12px rgba(255,201,74,0.4)">{{TITLE}}</text>

  <!-- Bottom decorative bar -->
  <g transform="translate(0, 560)">
    <line x1="60" y1="0" x2="1140" y2="0" stroke="#ffc94a" stroke-opacity="0.4" stroke-dasharray="2 8" stroke-width="1"/>
    <text x="60" y="32" font-family="monospace" font-size="14" fill="#c9b8e6" letter-spacing="4">◈  ARTICLE</text>
    <text x="1140" y="32" font-family="serif" font-size="16" fill="#6be2d4" text-anchor="end" letter-spacing="3" font-style="italic">✧ 海を越えて、どこまでも広く ✧</text>
  </g>
</svg>
