<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="18%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#c93656" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c93656" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="110%" cy="8%" r="65%">
      <stop offset="0%" stop-color="#6b1430" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6b1430" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="120%" r="75%">
      <stop offset="0%" stop-color="#d97a8c" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#d97a8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="20%" stop-color="#ede1d6"/>
      <stop offset="70%" stop-color="#d97a8c"/>
      <stop offset="100%" stop-color="#c93656"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b1430" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6b1430"/>
      <stop offset="50%" stop-color="#c93656"/>
      <stop offset="60%" stop-color="#6b1430"/>
      <stop offset="100%" stop-color="#6b1430" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
    <symbol id="rose" viewBox="-50 -50 100 100">
      <g fill="none" stroke="#c93656" stroke-width="0.8" stroke-opacity="0.55">
        <circle cx="0" cy="0" r="6"/>
        <path d="M0,-6 C8,-4 8,4 0,6 C-8,4 -8,-4 0,-6 Z"/>
        <path d="M-12,-3 C-6,-12 6,-12 12,-3 C12,9 -12,9 -12,-3 Z"/>
        <path d="M-22,2 C-10,-22 10,-22 22,2 C20,18 -20,18 -22,2 Z"/>
        <path d="M-34,8 C-14,-30 14,-30 34,8 C28,28 -28,28 -34,8 Z"/>
      </g>
      <g stroke="#d97a8c" stroke-opacity="0.35" stroke-width="0.6" fill="none">
        <path d="M-44,14 C-18,-38 18,-38 44,14"/>
      </g>
    </symbol>
  </defs>

  <rect width="1200" height="630" fill="#0d0710"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow3)"/>
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <g opacity="0.55">
    <use href="#rose" x="1040" y="120" width="260" height="260"/>
    <use href="#rose" x="-40" y="470" width="220" height="220" opacity="0.7"/>
  </g>

  <g stroke="#2a1a24" stroke-width="1" fill="none" opacity="0.9">
    <path d="M40,100 C120,180 80,280 160,360 C220,420 200,500 140,560"/>
    <path d="M1160,80 C1080,140 1100,240 1040,300 C980,360 1020,440 960,520"/>
  </g>
  <g fill="#c93656" opacity="0.7">
    <circle cx="80" cy="140" r="2"/>
    <circle cx="140" cy="320" r="1.6"/>
    <circle cx="180" cy="500" r="2.2"/>
    <circle cx="1100" cy="110" r="1.8"/>
    <circle cx="1040" cy="290" r="2"/>
    <circle cx="990" cy="480" r="1.6"/>
  </g>

  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#2a1a24" stroke-width="1"/>
  <rect x="68" y="68" width="1064" height="494" fill="none" stroke="#6b1430" stroke-width="0.5" stroke-opacity="0.6" stroke-dasharray="2 6"/>

  <g font-family="serif" font-style="italic" fill="#a89baa">
    <text x="90" y="118" font-size="20" letter-spacing="6">✦ へのへのんのの</text>
    <text x="1110" y="118" font-size="16" letter-spacing="4" text-anchor="end" fill="#c93656" opacity="0.85">— we're both already dead —</text>
  </g>

  <line x1="90" y1="148" x2="1110" y2="148" stroke="url(#ruleGrad)" stroke-width="1"/>

  <text x="90" y="340" font-family="serif" font-style="italic" font-weight="600" font-size="78" fill="url(#titleGrad)">{{TITLE}}</text>
  <text x="90" y="340" font-family="serif" font-style="italic" font-weight="600" font-size="78" fill="none" stroke="#c93656" stroke-width="0.4" stroke-opacity="0.35">{{TITLE}}</text>

  <line x1="90" y1="482" x2="1110" y2="482" stroke="url(#ruleGrad)" stroke-width="1"/>

  <g font-family="serif" fill="#a89baa">
    <text x="90" y="530" font-size="22" font-style="italic" letter-spacing="3">a withered rose, still dancing</text>
    <text x="1110" y="530" font-size="18" letter-spacing="4" text-anchor="end" fill="#ede1d6">henohenonnono.jp</text>
  </g>

  <g fill="#c93656" opacity="0.9">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="1140" cy="60" r="3"/>
    <circle cx="60" cy="570" r="3"/>
    <circle cx="1140" cy="570" r="3"/>
  </g>
</svg>
