<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#171b24"/>
      <stop offset="70%" stop-color="#11141b"/>
    </radialGradient>
    <filter id="titleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景: 誰もいなくなった部屋の夜 -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 外枠: 静まり返った部屋の輪郭 -->
  <rect x="40" y="40" width="1120" height="550" rx="6" fill="none" stroke="#2a2f3a" stroke-width="1"/>

  <!-- 反響のリング: 空気に溶けていく声 (右上) -->
  <g fill="none" stroke="#7fa8c9">
    <circle cx="1140" cy="90" r="60" stroke-opacity="0.30"/>
    <circle cx="1140" cy="90" r="115" stroke-opacity="0.20"/>
    <circle cx="1140" cy="90" r="170" stroke-opacity="0.12"/>
    <circle cx="1140" cy="90" r="225" stroke-opacity="0.06"/>
  </g>

  <!-- 反響のリング: 小さな残響 (右下、控えめ) -->
  <g fill="none" stroke="#4c6478">
    <circle cx="1080" cy="560" r="40" stroke-opacity="0.35"/>
    <circle cx="1080" cy="560" r="80" stroke-opacity="0.20"/>
  </g>

  <!-- サイト名: 誰もいない部屋の入口 -->
  <text x="60" y="78" font-family="serif" font-size="26" fill="#8d97ab" letter-spacing="5">へのへのんのの</text>
  <rect x="60" y="92" width="46" height="3" fill="#7fa8c9" fill-opacity="0.85"/>

  <!-- ヘッダー境界線 -->
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#2a2f3a" stroke-width="1"/>

  <!-- 記事タイトル: 冷たい静寂の中で揺れる声 (グロー + 本体) -->
  <text x="64" y="356" font-family="serif" font-size="74" fill="#7fa8c9" fill-opacity="0.30" filter="url(#titleGlow)">{{TITLE}}</text>
  <text x="60" y="352" font-family="serif" font-size="74" fill="#e2e6ee">{{TITLE}}</text>

  <!-- タイトル下の反響バー -->
  <rect x="60" y="392" width="96" height="4" fill="#7fa8c9" fill-opacity="0.75"/>
  <rect x="164" y="392" width="28" height="4" fill="#4c6478" fill-opacity="0.5"/>

  <!-- 波形: 声の残響 -->
  <path d="M60,548 Q100,528 140,548 T220,548 T300,548 T380,548 T460,548 T540,548 T620,548"
        fill="none" stroke="#4c6478" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 時計の針の明滅を想起させる小さな点 -->
  <circle cx="1140" cy="548" r="4" fill="#7fa8c9" fill-opacity="0.7"/>
  <text x="1120" y="553" font-family="serif" font-size="20" fill="#8d97ab" text-anchor="end" letter-spacing="2">ECHO</text>
</svg>
