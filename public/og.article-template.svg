<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#150a0a"/>
      <stop offset="70%" stop-color="#0a0505"/>
    </radialGradient>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1" fill="#ff3355" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0a0505"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>

  <!-- top accent bar + blood drips -->
  <rect x="0" y="0" width="1200" height="6" fill="#ff3355"/>
  <path d="M140,6 q6,20 0,34 q-6,-14 0,-34 Z" fill="#ff3355" opacity="0.85"/>
  <path d="M300,6 q5,14 0,24 q-5,-10 0,-24 Z" fill="#7a1524" opacity="0.9"/>
  <path d="M470,6 q7,26 0,44 q-7,-18 0,-44 Z" fill="#ff3355" opacity="0.75"/>
  <path d="M660,6 q5,12 0,20 q-5,-8 0,-20 Z" fill="#7a1524" opacity="0.85"/>
  <path d="M860,6 q6,18 0,30 q-6,-12 0,-30 Z" fill="#ff3355" opacity="0.8"/>
  <path d="M1040,6 q5,10 0,18 q-5,-8 0,-18 Z" fill="#7a1524" opacity="0.9"/>

  <!-- site name -->
  <text x="60" y="98" font-family="sans-serif" font-size="34" font-weight="bold" letter-spacing="3" fill="#e9e2df">へのへのんのの<tspan fill="#33ffb0">_</tspan></text>
  <rect x="60" y="116" width="250" height="4" fill="#ff3355"/>

  <!-- live indicator -->
  <circle cx="1136" cy="86" r="7" fill="#ff3355"/>
  <text x="1000" y="94" font-family="monospace" font-size="20" fill="#33ffb0" opacity="0.85" text-anchor="end">LIVE_CHAT</text>

  <!-- decorative chat bubbles -->
  <g fill="none" stroke="#33ffb0" stroke-width="1.5" opacity="0.28">
    <rect x="1005" y="150" width="140" height="28" rx="14"/>
    <rect x="1035" y="196" width="110" height="28" rx="14"/>
    <rect x="985" y="242" width="160" height="28" rx="14"/>
    <rect x="1020" y="288" width="120" height="28" rx="14"/>
    <rect x="1055" y="334" width="90" height="28" rx="14"/>
  </g>

  <!-- diagonal glitch slashes -->
  <g stroke-width="4" opacity="0.35">
    <line x1="900" y1="630" x2="1050" y2="470" stroke="#ff3355"/>
    <line x1="960" y1="630" x2="1110" y2="470" stroke="#33ffb0"/>
    <line x1="1020" y1="630" x2="1170" y2="470" stroke="#7a1524"/>
  </g>

  <!-- title panel -->
  <rect x="60" y="230" width="1080" height="220" fill="#150a0a" opacity="0.92" stroke="#7a1524" stroke-width="1"/>
  <rect x="60" y="230" width="6" height="220" fill="#ff3355"/>

  <!-- title (glitch layers, same string) -->
  <text x="106" y="357" font-family="sans-serif" font-size="60" font-weight="bold" fill="#33ffb0" opacity="0.5">{{TITLE}}</text>
  <text x="114" y="363" font-family="sans-serif" font-size="60" font-weight="bold" fill="#7a1524" opacity="0.6">{{TITLE}}</text>
  <text x="110" y="360" font-family="sans-serif" font-size="60" font-weight="bold" fill="#e9e2df">{{TITLE}}</text>

  <!-- footer -->
  <rect x="0" y="624" width="1200" height="6" fill="#7a1524" opacity="0.7"/>
</svg>
