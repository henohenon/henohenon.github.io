  <text x="700" y="46" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#fbeee0" opacity="0.6" text-anchor="end">MIDNIGHT GODDESS STAGE</text>

  <polygon points="60,486 258,486 226,566 28,566" fill="#ff4fa3" fill-opacity="0.10" stroke="#ff4fa3" stroke-opacity="0.35" stroke-width="2"/>
  <use href="#spark" x="122" y="504" width="42" height="42" fill="#ffcc33" opacity="0.85"/>

  <use href="#spark" x="1090" y="140" width="34" height="34" fill="#ff4fa3" opacity="0.8"/>
