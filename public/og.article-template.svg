<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowA" cx="15%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ff4d6a" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ff4d6a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#7a8cff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#7a8cff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7a8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6a"/>
      <stop offset="55%" stop-color="#ece4e1"/>
      <stop offset="100%" stop-color="#7a8cff"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d6a" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="edgeFade2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7a8cff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0c0a0d"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowA)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowB)"/>

  <!-- duet ring motif: two interlocking circles, top right, echoing the 指切り / heartbeat rings -->
  <circle cx="1000" cy="150" r="118" fill="none" stroke="#ff4d6a" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 7"/>
  <circle cx="1090" cy="210" r="118" fill="none" stroke="#7a8cff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 7"/>
  <circle cx="1045" cy="180" r="4" fill="#ece4e1" fill-opacity="0.5"/>

  <!-- side stripes, duet border echoing article.post left/right accent borders -->
  <rect x="0" y="0" width="6" height="630" fill="url(#edgeFade)"/>
  <rect x="1194" y="0" width="6" height="630" fill="url(#edgeFade2)"/>

  <!-- top rule -->
  <line x1="60" y1="130" x2="1140" y2="130" stroke="#2a2226" stroke-width="1"/>

  <!-- site name -->
  <circle cx="66" cy="78" r="12" fill="none" stroke="#ff4d6a" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="92" y="86" font-family="serif" font-size="34" fill="#ece4e1" letter-spacing="0.04em">へのへのんのの</text>

  <!-- title area -->
  <text x="60" y="300" font-family="serif" font-size="76" fill="url(#titleGrad)" letter-spacing="0.02em">{{TITLE}}</text>
  <text x="60" y="300" font-family="serif" font-size="76" fill="none" stroke="#ece4e1" stroke-opacity="0.08" stroke-width="1" letter-spacing="0.02em">{{TITLE}}</text>

  <!-- underline accent, split two-tone like the duet -->
  <line x1="60" y1="336" x2="620" y2="336" stroke="#ff4d6a" stroke-width="3"/>
  <line x1="620" y1="336" x2="1140" y2="336" stroke="#7a8cff" stroke-width="3" stroke-opacity="0.55"/>

  <!-- bottom rule -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#2a2226" stroke-width="1"/>
  <circle cx="1140" cy="560" r="4" fill="#7a8cff" fill-opacity="0.7"/>
  <circle cx="60" cy="560" r="4" fill="#ff4d6a" fill-opacity="0.7"/>
</svg>
