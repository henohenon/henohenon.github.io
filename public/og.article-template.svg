<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobA" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#e0114a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e0114a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="88%" cy="82%" r="50%">
      <stop offset="0%" stop-color="#e0114a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e0114a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd1dd"/>
      <stop offset="100%" stop-color="#ffe3ec"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0114a"/>
      <stop offset="100%" stop-color="#7a0f1f"/>
    </linearGradient>
    <radialGradient id="candyGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8fab"/>
      <stop offset="100%" stop-color="#e0114a"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffe3ec"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#blobA)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#blobB)"/>

  <!-- ヘッダー帯（下端は牙/歯型のギザギザ） -->
  <path d="M0,0 L1200,0 L1200,130 L1162.5,160 L1125,130 L1087.5,160 L1050,130 L1012.5,160 L975,130 L937.5,160 L900,130 L862.5,160 L825,130 L787.5,160 L750,130 L712.5,160 L675,130 L637.5,160 L600,130 L562.5,160 L525,130 L487.5,160 L450,130 L412.5,160 L375,130 L337.5,160 L300,130 L262.5,160 L225,130 L187.5,160 L150,130 L112.5,160 L75,130 L37.5,160 L0,130 Z"
        fill="url(#headerGrad)" stroke="#e0114a" stroke-width="2"/>
  <!-- 牙の先端からの一滴 -->
  <circle cx="150" cy="164" r="4" fill="#e0114a"/>
  <circle cx="300" cy="164" r="3.5" fill="#e0114a"/>
  <circle cx="450" cy="165" r="4" fill="#7a0f1f"/>
  <circle cx="600" cy="164" r="3.5" fill="#e0114a"/>
  <circle cx="750" cy="165" r="4" fill="#7a0f1f"/>
  <circle cx="900" cy="164" r="3.5" fill="#e0114a"/>
  <circle cx="1050" cy="165" r="4" fill="#7a0f1f"/>

  <!-- サイト名 -->
  <text x="60" y="80" font-family="sans-serif" font-size="46" font-weight="bold" fill="#e0114a">へのへのんのの ♥</text>
  <text x="62" y="112" font-family="sans-serif" font-size="20" fill="#7a0f1f">あまくて、するどい。</text>

  <!-- 小さな牙アイコン -->
  <path d="M1090,42 L1104,42 L1097,64 Z" fill="#7a0f1f"/>
  <path d="M1110,42 L1124,42 L1117,64 Z" fill="#7a0f1f"/>

  <!-- 見つめる目（左右） -->
  <g>
    <circle cx="35" cy="290" r="9" fill="#ffffff" stroke="#e0114a" stroke-width="2"/>
    <circle cx="35" cy="290" r="3.5" fill="#7a0f1f"/>
    <circle cx="1165" cy="290" r="9" fill="#ffffff" stroke="#e0114a" stroke-width="2"/>
    <circle cx="1165" cy="290" r="3.5" fill="#7a0f1f"/>
    <circle cx="35" cy="430" r="9" fill="#ffffff" stroke="#e0114a" stroke-width="2"/>
    <circle cx="35" cy="430" r="3.5" fill="#7a0f1f"/>
    <circle cx="1165" cy="430" r="9" fill="#ffffff" stroke="#e0114a" stroke-width="2"/>
    <circle cx="1165" cy="430" r="3.5" fill="#7a0f1f"/>
  </g>

  <!-- キャンディの飛沫 -->
  <circle cx="100" cy="565" r="3.5" fill="#ff8fab" opacity="0.6"/>
  <circle cx="300" cy="575" r="4" fill="#ff8fab" opacity="0.5"/>
  <circle cx="480" cy="568" r="3" fill="#e0114a" opacity="0.5"/>
  <circle cx="700" cy="575" r="4" fill="#ff8fab" opacity="0.5"/>
  <circle cx="880" cy="568" r="3" fill="#e0114a" opacity="0.5"/>

  <!-- タイトルカード -->
  <rect x="70" y="198" width="1060" height="345" rx="28" fill="#e0114a" opacity="0.15"/>
  <rect x="70" y="190" width="1060" height="345" rx="28" fill="#fff5f8" stroke="#ff8fab" stroke-width="3"/>
  <line x1="100" y1="248" x2="1100" y2="248" stroke="#e0114a" stroke-width="2" stroke-dasharray="4,7"/>

  <!-- タイトル（影＋本体の二層） -->
  <text x="605" y="410" font-family="serif" font-size="76" text-anchor="middle" fill="#7a0f1f" opacity="0.25">{{TITLE}}</text>
  <text x="600" y="404" font-family="serif" font-size="76" text-anchor="middle" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- 一口かじられたキャンディハート -->
  <g transform="translate(1090,530) scale(0.95)">
    <path d="M0,-20 C-25,-55 -70,-35 -70,0 C-70,35 -35,55 0,85 C35,55 70,35 70,0 C70,-35 25,-55 0,-20 Z" fill="url(#candyGrad)"/>
    <circle cx="58" cy="-18" r="24" fill="#ffe3ec"/>
    <path d="M40,-8 L52,-14 L46,-2 Z" fill="#ffe3ec"/>
    <path d="M46,10 L58,6 L54,18 Z" fill="#ffe3ec"/>
  </g>

  <!-- 下端の破線 -->
  <line x1="60" y1="605" x2="1140" y2="605" stroke="#ff8fab" stroke-width="3" stroke-dasharray="10,8"/>
</svg>
