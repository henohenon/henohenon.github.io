<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120e1a"/>
      <stop offset="100%" stop-color="#1c1630"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="100%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#7fe8ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="4%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#ff7fb0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff7fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd1e6"/>
      <stop offset="100%" stop-color="#ece6f7"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="1" fill="#ff7fb0" fill-opacity="0.05"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7fe8ff" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- base background -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowCyan)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowPink)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>

  <!-- scattered glitch marks -->
  <rect x="1040" y="52" width="10" height="10" fill="#7fe8ff" fill-opacity="0.35" transform="rotate(45 1045 57)"/>
  <rect x="980" y="96" width="6" height="6" fill="#ff7fb0" fill-opacity="0.4" transform="rotate(45 983 99)"/>
  <rect x="96" y="560" width="8" height="8" fill="#ff7fb0" fill-opacity="0.3" transform="rotate(45 100 564)"/>
  <circle cx="1120" cy="560" r="3" fill="#ffd1e6" fill-opacity="0.5"/>
  <circle cx="1150" cy="150" r="2.5" fill="#7fe8ff" fill-opacity="0.5"/>

  <!-- header: site name -->
  <text x="60" y="88" font-family="monospace" font-size="34" letter-spacing="0.05em" fill="#ece6f7">へのへのんのの<tspan fill="#ff7fb0">_</tspan></text>
  <text x="60" y="118" font-family="monospace" font-size="16" letter-spacing="0.1em" fill="#7fe8ff" fill-opacity="0.75">// secret diary at midnight</text>

  <line x1="60" y1="140" x2="1140" y2="140" stroke="#33284a" stroke-width="1.5"/>

  <!-- article label -->
  <text x="60" y="182" font-family="monospace" font-size="20" letter-spacing="0.08em" fill="#ff7fb0" fill-opacity="0.85">ARTICLE</text>

  <!-- title card -->
  <rect x="60" y="206" width="1080" height="340" rx="14" fill="#1c1630" fill-opacity="0.55" stroke="#33284a" stroke-width="1.5"/>
  <rect x="60" y="206" width="5" height="340" rx="2.5" fill="#ff7fb0"/>

  <!-- title -->
  <text x="112" y="390" font-family="sans-serif" font-size="68" font-weight="700" fill="url(#titleGrad)">{{TITLE}}</text>
  <text x="112" y="390" font-family="sans-serif" font-size="68" font-weight="700" fill="none" stroke="#ff7fb0" stroke-opacity="0.25" stroke-width="1">{{TITLE}}</text>

  <!-- footer -->
  <text x="600" y="594" text-anchor="middle" font-family="monospace" font-size="20" letter-spacing="0.06em" fill="#ff7fb0" fill-opacity="0.8">— thank you for reading —</text>
</svg>
