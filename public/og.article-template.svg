    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0a0a0f"/>
      <rect width="6" height="1" fill="#ff2f6d" opacity="0.06"/>
    </pattern>
    <clipPath id="canvas">
