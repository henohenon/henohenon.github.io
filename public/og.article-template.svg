<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0e33"/>
      <stop offset="65%" stop-color="#1b0a20"/>
      <stop offset="100%" stop-color="#1b0a20"/>
    </linearGradient>
    <radialGradient id="spot1" cx="15%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#ffcc33" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffcc33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="88%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="55%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4fa3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffcc33" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="stripes" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="70" height="70" fill="none"/>
      <rect x="0" y="0" width="8" height="70" fill="#ffcc33" opacity="0.10"/>
      <rect x="36" y="0" width="5" height="70" fill="#ff4fa3" opacity="0.10"/>
    </pattern>
    <clipPath id="titleClip">
      <rect x="90" y="185" width="1000" height="235"/>
    </clipPath>
    <symbol id="spark" viewBox="-12 -12 24 24">
      <path d="M0,-12 C2,-3 3,-2 12,0 C3,2 2,3 0,12 C-2,3 -3,2 -12,0 C-3,-2 -2,-3 0,-12 Z"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#1b0a20"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgWash)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#spot1)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#spot2)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#stripes)"/>

