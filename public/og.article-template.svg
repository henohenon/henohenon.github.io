<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowPink" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ff3d8f" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ff3d8f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff3d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYellow" cx="88%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#ffcc4d" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffcc4d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffcc4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#ffcc4d"/>
      <stop offset="55%" stop-color="#ff3d8f"/>
      <stop offset="100%" stop-color="#ff3d8f"/>
    </linearGradient>
    <pattern id="diagStripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="16" height="16" fill="none"/>
      <rect width="3" height="16" fill="#ffcc4d" opacity="0.07"/>
    </pattern>
    <line id="tick" x1="1070" y1="30" x2="1070" y2="50" stroke="#ffcc4d" stroke-width="3" opacity="0.32"/>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#150a1c"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowPink)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glowYellow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#diagStripes)"/>

  <!-- spinning camera lens motif (回り続けるカメラ) -->
  <g transform="translate(1070,140)">
    <use href="#tick" transform="rotate(0 0 0)"/>
    <use href="#tick" transform="rotate(30 0 0)"/>
    <use href="#tick" transform="rotate(60 0 0)"/>
    <use href="#tick" transform="rotate(90 0 0)"/>
    <use href="#tick" transform="rotate(120 0 0)"/>
    <use href="#tick" transform="rotate(150 0 0)"/>
    <use href="#tick" transform="rotate(180 0 0)"/>
    <use href="#tick" transform="rotate(210 0 0)"/>
    <use href="#tick" transform="rotate(240 0 0)"/>
    <use href="#tick" transform="rotate(270 0 0)"/>
    <use href="#tick" transform="rotate(300 0 0)"/>
    <use href="#tick" transform="rotate(330 0 0)"/>
    <circle r="88" fill="none" stroke="#ffcc4d" stroke-width="2" opacity="0.22"/>
    <circle r="66" fill="none" stroke="#ff3d8f" stroke-width="2" opacity="0.32"/>
    <circle r="46" fill="none" stroke="#f4ecf3" stroke-width="1.5" opacity="0.16"/>
    <circle r="28" fill="#ff3d8f" opacity="0.16"/>
    <circle r="9" fill="#ffcc4d" opacity="0.55"/>
  </g>

  <!-- outer frame -->
  <rect x="16" y="16" width="1168" height="598" rx="22" fill="none" stroke="#ff3d8f" stroke-width="5" opacity="0.85"/>
  <rect x="27" y="27" width="1146" height="576" rx="16" fill="none" stroke="#ffcc4d" stroke-width="1.5" opacity="0.35"/>

  <!-- site name -->
  <text x="66" y="76" font-family="serif" font-size="30" letter-spacing="5" fill="#ff3d8f" opacity="0.5">へのへのんのの</text>
  <text x="64" y="74" font-family="serif" font-size="30" letter-spacing="5" fill="#f4ecf3">へのへのんのの</text>

  <!-- on air badge -->
  <rect x="64" y="102" width="122" height="36" rx="18" fill="#ff3d8f"/>
  <circle cx="84" cy="120" r="6" fill="#ffcc4d"/>
  <text x="98" y="125" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#2a0f1c">ON AIR</text>

  <!-- title (glitch layered) -->
  <text x="60" y="322" font-family="sans-serif" font-size="72" font-weight="bold" fill="#4ddcff" opacity="0.35">{{TITLE}}</text>
  <text x="68" y="322" font-family="sans-serif" font-size="72" font-weight="bold" fill="#ff3d8f" opacity="0.45">{{TITLE}}</text>
  <text x="64" y="322" font-family="sans-serif" font-size="72" font-weight="bold" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- separator -->
  <line x1="64" y1="440" x2="1136" y2="440" stroke="#ffcc4d" stroke-width="2" stroke-dasharray="10 12" opacity="0.45"/>

  <!-- marquee bulb row -->
  <g>
    <circle cx="70" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
    <circle cx="110" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="150" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
    <circle cx="190" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="230" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
    <circle cx="270" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="930" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="970" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
    <circle cx="1010" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="1050" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
    <circle cx="1090" cy="592" r="6" fill="#ff3d8f" opacity="0.7"/>
    <circle cx="1130" cy="592" r="6" fill="#ffcc4d" opacity="0.7"/>
  </g>
</svg>
