<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0806"/>
      <stop offset="55%" stop-color="#14100d"/>
      <stop offset="100%" stop-color="#1f1712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="6%" r="65%">
      <stop offset="0%" stop-color="#e8b64a" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#e8b64a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="1200" height="27" patternUnits="userSpaceOnUse">
      <line x1="0" y1="26.5" x2="1200" y2="26.5" stroke="#3a2f24" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e9d8"/>
      <stop offset="100%" stop-color="#e8b64a"/>
    </linearGradient>
    <radialGradient id="petalGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f6e9d8"/>
      <stop offset="100%" stop-color="#e8b64a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#lines)"/>

  <!-- soil band at bottom -->
  <rect x="0" y="520" width="1200" height="110" fill="#0b0806" opacity="0.7"/>
  <rect x="0" y="520" width="1200" height="4" fill="#1f1712"/>

  <!-- small soil creatures / bugs crawling near the ground -->
  <g fill="#3a2f24" opacity="0.85">
    <ellipse cx="120" cy="545" rx="10" ry="5"/>
    <line x1="112" y1="540" x2="104" y2="533" stroke="#3a2f24" stroke-width="2"/>
    <line x1="112" y1="550" x2="104" y2="557" stroke="#3a2f24" stroke-width="2"/>
    <line x1="128" y1="540" x2="136" y2="533" stroke="#3a2f24" stroke-width="2"/>
    <line x1="128" y1="550" x2="136" y2="557" stroke="#3a2f24" stroke-width="2"/>

    <ellipse cx="980" cy="560" rx="7" ry="3.5"/>
    <line x1="975" y1="557" x2="968" y2="551" stroke="#3a2f24" stroke-width="1.5"/>
    <line x1="985" y1="557" x2="992" y2="551" stroke="#3a2f24" stroke-width="1.5"/>
  </g>

  <!-- roots reaching up from the soil, curling toward the flower -->
  <g fill="none" stroke="#3a2f24" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <path d="M 860 630 C 850 560, 900 520, 880 460 C 862 410, 910 390, 920 340"/>
    <path d="M 1000 630 C 1010 570, 960 540, 980 480 C 998 430, 950 400, 960 350"/>
    <path d="M 60 630 C 90 590, 70 560, 100 530"/>
  </g>

  <!-- flower motif, right side: wound-colored torn outer petals with a golden bloom inside -->
  <g transform="translate(960,300)">
    <path d="M0,0 C -30,-70 -110,-70 -120,-10 C -128,40 -70,60 -20,40 Z" fill="#8a4a5c" opacity="0.55"/>
    <path d="M0,0 C 50,-60 130,-40 120,20 C 112,72 40,70 10,35 Z" fill="#8a4a5c" opacity="0.45"/>
    <g transform="rotate(0)">
      <path d="M0,0 C -18,-46 18,-46 0,-92 C -18,-46 18,-46 0,0" fill="url(#petalGrad)" opacity="0.95"/>
    </g>
    <g transform="rotate(72)">
      <path d="M0,0 C -18,-46 18,-46 0,-92 C -18,-46 18,-46 0,0" fill="url(#petalGrad)" opacity="0.9"/>
    </g>
    <g transform="rotate(144)">
      <path d="M0,0 C -18,-46 18,-46 0,-92 C -18,-46 18,-46 0,0" fill="url(#petalGrad)" opacity="0.85"/>
    </g>
    <g transform="rotate(216)">
      <path d="M0,0 C -18,-40 18,-40 0,-80" fill="none" stroke="#e8b64a" stroke-width="4" opacity="0.7"/>
    </g>
    <g transform="rotate(288)">
      <path d="M0,0 C -18,-46 18,-46 0,-92 C -18,-46 18,-46 0,0" fill="url(#petalGrad)" opacity="0.9"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="#1f1712"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#8a4a5c" stroke-width="2"/>
  </g>

  <!-- drifting pollen / spores -->
  <g fill="#e8b64a">
    <circle cx="1080" cy="150" r="3" opacity="0.7"/>
    <circle cx="1120" cy="230" r="2" opacity="0.5"/>
    <circle cx="1040" cy="90" r="2.5" opacity="0.6"/>
    <circle cx="870" cy="120" r="2" opacity="0.5"/>
    <circle cx="1150" cy="400" r="2.5" opacity="0.55"/>
  </g>

  <!-- site name -->
  <text x="64" y="76" font-family="serif" font-size="30" fill="#efe3cd" opacity="0.9">✿ へのへのんのの</text>
  <line x1="64" y1="96" x2="320" y2="96" stroke="#3a2f24" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- article title -->
  <text x="64" y="360" font-family="serif" font-size="74" fill="none" stroke="#8a4a5c" stroke-width="6" opacity="0.35">{{TITLE}}</text>
  <text x="64" y="360" font-family="serif" font-size="74" fill="url(#titleGrad)">{{TITLE}}</text>

  <!-- scar-like underline beneath title -->
  <path d="M 64 400 C 220 412, 420 388, 640 404" fill="none" stroke="#8a4a5c" stroke-width="2" opacity="0.6"/>
  <path d="M 64 412 C 220 400, 420 424, 560 410" fill="none" stroke="#e8b64a" stroke-width="1.5" stroke-dasharray="1 7" opacity="0.6"/>

  <!-- footer hairline -->
  <line x1="64" y1="566" x2="1136" y2="566" stroke="#3a2f24" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="1136" y="600" font-family="serif" font-size="20" fill="#efe3cd" opacity="0.55" text-anchor="end">へのへのんのの</text>

  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
