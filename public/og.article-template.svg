<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Atmospheric ember glow — upper-left (mirrors body::after 25% 15%) -->
    <radialGradient id="g-ember" gradientUnits="userSpaceOnUse" cx="280" cy="100" r="600">
      <stop offset="0%" stop-color="#5a0f14" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Void glow — lower-right (mirrors body::after 75% 85%) -->
    <radialGradient id="g-void" gradientUnits="userSpaceOnUse" cx="950" cy="550" r="580">
      <stop offset="0%" stop-color="#1e0c37" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0d0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent gradient for horizontal rules / borders -->
    <linearGradient id="g-hr" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%"   stop-color="#cf5050" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#cf5050" stop-opacity="0.52"/>
      <stop offset="75%"  stop-color="#cf5050" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#cf5050" stop-opacity="0"/>
    </linearGradient>

    <!-- Crimson halo behind title -->
    <filter id="f-glow" x="-8%" y="-60%" width="116%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.81  0 0 0 0 0.31  0 0 0 0 0.31  0 0 0 0.28 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep blur for ghost / shadow layer -->
    <filter id="f-blur" x="-5%" y="-150%" width="110%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>

  </defs>

  <!-- ── Base background ── -->
  <rect width="1200" height="630" fill="#0d0c14"/>
  <rect width="1200" height="630" fill="url(#g-ember)"/>
  <rect width="1200" height="630" fill="url(#g-void)"/>

  <!-- ── Diagonal shadow trails (chasing / motion) ── -->
  <g stroke="#ddd5c8" stroke-width="0.6" opacity="0.032">
    <line x1="-130" y1="630" x2="700"  y2="-200"/>
    <line x1="-30"  y1="630" x2="800"  y2="-200"/>
    <line x1="70"   y1="630" x2="900"  y2="-200"/>
    <line x1="170"  y1="630" x2="1000" y2="-200"/>
    <line x1="270"  y1="630" x2="1100" y2="-200"/>
    <line x1="370"  y1="630" x2="1200" y2="-200"/>
    <line x1="470"  y1="630" x2="1300" y2="-200"/>
    <line x1="570"  y1="630" x2="1400" y2="-200"/>
    <line x1="670"  y1="630" x2="1500" y2="-200"/>
  </g>

  <!-- ── Shadow moon — the thing being chased (upper-right) ── -->
  <circle cx="1012" cy="148" r="268" fill="#12082a" opacity="0.44"/>
  <circle cx="1012" cy="148" r="266" fill="none" stroke="#cf5050" stroke-width="1"   opacity="0.11"/>
  <circle cx="1012" cy="148" r="218" fill="none" stroke="#cf5050" stroke-width="0.7" opacity="0.07"/>
  <circle cx="1012" cy="148" r="168" fill="none" stroke="#9a3030" stroke-width="0.6" opacity="0.13"/>
  <circle cx="1012" cy="148" r="118" fill="none" stroke="#6a1a1a" stroke-width="0.5" opacity="0.10"/>

  <!-- ── Top border line ── -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#g-hr)"/>

  <!-- ── Left accent bar (mirrors post-list li::before) ── -->
  <rect x="56" y="74" width="3" height="484" rx="1" fill="#cf5050" opacity="0.72"/>
  <!-- Cap top -->
  <rect x="50" y="68" width="15" height="4" rx="1" fill="#cf5050" opacity="0.50"/>
  <!-- Cap bottom -->
  <rect x="50" y="558" width="15" height="4" rx="1" fill="#cf5050" opacity="0.40"/>

  <!-- ── Pixel clusters — bitbreaker / digital aesthetic ── -->
  <g fill="#cf5050">
    <!-- Upper-left near bar cap -->
    <rect x="78"  y="68" width="5" height="5" opacity="0.55"/>
    <rect x="85"  y="68" width="5" height="5" opacity="0.32"/>
    <rect x="92"  y="68" width="5" height="5" opacity="0.16"/>
    <rect x="78"  y="75" width="5" height="5" opacity="0.13"/>
    <rect x="85"  y="75" width="5" height="5" opacity="0.08"/>
    <!-- Lower-right cluster -->
    <rect x="1097" y="498" width="5" height="5" opacity="0.45"/>
    <rect x="1104" y="498" width="5" height="5" opacity="0.28"/>
    <rect x="1111" y="498" width="5" height="5" opacity="0.14"/>
    <rect x="1097" y="505" width="5" height="5" opacity="0.22"/>
    <rect x="1104" y="505" width="5" height="5" opacity="0.14"/>
    <rect x="1097" y="512" width="5" height="5" opacity="0.10"/>
  </g>

  <!-- Cross / × marks near shadow moon edge -->
  <g stroke="#cf5050" stroke-width="1.2" opacity="0.21" stroke-linecap="round">
    <line x1="1108" y1="85"  x2="1118" y2="95"/>
    <line x1="1118" y1="85"  x2="1108" y2="95"/>
    <line x1="1130" y1="106" x2="1140" y2="116"/>
    <line x1="1140" y1="106" x2="1130" y2="116"/>
  </g>

  <!-- ── Divider above footer band (mirrors article hr) ── -->
  <rect x="80" y="494" width="1040" height="1" fill="url(#g-hr)"/>

  <!-- ── Bottom border ── -->
  <rect x="0" y="629" width="1200" height="1" fill="url(#g-hr)"/>

  <!-- ── Title — ghost / ember shadow layer ── -->
  <text x="88" y="338"
        font-family="serif" font-size="68"
        fill="#cf5050" opacity="0.17"
        filter="url(#f-blur)">{{TITLE}}</text>

  <!-- ── Title — main text ── -->
  <text x="88" y="338"
        font-family="serif" font-size="68"
        fill="#ddd5c8"
        letter-spacing="2"
        filter="url(#f-glow)">{{TITLE}}</text>

  <!-- ── Site name ── -->
  <text x="88" y="548"
        font-family="serif" font-size="20"
        fill="#7a7068"
        letter-spacing="6">へのへのんのの</text>

  <!-- Underline beneath site name (like site-header::after) -->
  <line x1="88" y1="560" x2="290" y2="560" stroke="#2a1a28" stroke-width="1"/>

  <!-- Article label — right side -->
  <text x="1120" y="548"
        font-family="serif" font-size="13"
        fill="#3a2828"
        text-anchor="end"
        letter-spacing="4">ARTICLE</text>

</svg>
