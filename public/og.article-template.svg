<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2f6d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff2f6d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff2f6d" stop-opacity="0.09"/>
