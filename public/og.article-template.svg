<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pinkGlow" cx="12%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#ff2e88" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff2e88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="88%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
