<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%">
      <stop offset="28%" stop-color="#1a1206" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1206" stop-opacity="0.32"/>
    </radialGradient>
    <radialGradient id="echo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9e19c" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#e9e19c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="298" x2="0" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1206"/>
      <stop offset="100%" stop-color="#3d2a0a"/>
    </linearGradient>
  </defs>

  <!-- ── Base background ── -->
  <rect width="1200" height="630" fill="#e9e19c"/>

  <!-- ── Header strip ── -->
  <rect x="0" y="0" width="1200" height="90" fill="#c8b42e"/>

  <!-- Fluorescent banding (header::before) -->
  <rect x="0" y="0"  width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="6"  width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="12" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="18" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="24" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="30" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="36" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="42" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="48" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="54" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="60" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="66" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="72" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="78" width="1200" height="2" fill="white" opacity="0.05"/>
  <rect x="0" y="84" width="1200" height="2" fill="white" opacity="0.05"/>

  <!-- "Watching" glow (header::after) -->
  <ellipse cx="1090" cy="45" rx="78" ry="38" fill="#8c1e1e" opacity="0.21"/>

  <!-- Site name in header -->
  <text x="36" y="59" font-family="serif" font-size="30" fill="#1a1206" letter-spacing="-0.02em">へのへのんのの</text>

  <!-- Header bottom border -->
  <rect x="0" y="87" width="1200" height="3" fill="#8c1e1e"/>

  <!-- ── Left accent border ── -->
  <rect x="0" y="0" width="6" height="630" fill="#8c1e1e"/>

  <!-- ── Content surface ── -->
  <rect x="6" y="90" width="1194" height="540" fill="#f3edb5"/>

  <!-- ── Labyrinth pattern – top-right corner ── -->
  <g fill="none" stroke="#b8a828" stroke-width="1.5" opacity="0.28">
    <!-- Outer frame -->
    <rect x="860" y="105" width="325" height="155"/>
    <!-- Vertical walls -->
    <line x1="900" y1="105" x2="900" y2="145"/>
    <line x1="900" y1="165" x2="900" y2="220"/>
    <line x1="940" y1="105" x2="940" y2="125"/>
    <line x1="940" y1="145" x2="940" y2="185"/>
    <line x1="940" y1="205" x2="940" y2="260"/>
    <line x1="980" y1="105" x2="980" y2="125"/>
    <line x1="980" y1="145" x2="980" y2="185"/>
    <line x1="980" y1="205" x2="980" y2="260"/>
    <line x1="1020" y1="105" x2="1020" y2="165"/>
    <line x1="1020" y1="185" x2="1020" y2="240"/>
    <line x1="1060" y1="105" x2="1060" y2="130"/>
    <line x1="1060" y1="150" x2="1060" y2="200"/>
    <line x1="1060" y1="220" x2="1060" y2="260"/>
    <line x1="1100" y1="105" x2="1100" y2="145"/>
    <line x1="1100" y1="165" x2="1100" y2="215"/>
    <line x1="1100" y1="235" x2="1100" y2="260"/>
    <line x1="1140" y1="105" x2="1140" y2="125"/>
    <line x1="1140" y1="145" x2="1140" y2="195"/>
    <line x1="1140" y1="215" x2="1140" y2="260"/>
    <!-- Horizontal walls -->
    <line x1="860"  y1="145" x2="900"  y2="145"/>
    <line x1="920"  y1="145" x2="960"  y2="145"/>
    <line x1="1000" y1="145" x2="1040" y2="145"/>
    <line x1="1060" y1="145" x2="1100" y2="145"/>
    <line x1="1120" y1="145" x2="1160" y2="145"/>
    <line x1="860"  y1="185" x2="920"  y2="185"/>
    <line x1="940"  y1="185" x2="980"  y2="185"/>
    <line x1="1000" y1="185" x2="1040" y2="185"/>
    <line x1="1060" y1="185" x2="1100" y2="185"/>
    <line x1="1120" y1="185" x2="1185" y2="185"/>
    <line x1="860"  y1="225" x2="900"  y2="225"/>
    <line x1="920"  y1="225" x2="980"  y2="225"/>
    <line x1="1000" y1="225" x2="1060" y2="225"/>
    <line x1="1080" y1="225" x2="1140" y2="225"/>
  </g>

  <!-- ── Labyrinth pattern – bottom-left corner ── -->
  <g fill="none" stroke="#b8a828" stroke-width="1.5" opacity="0.22">
    <rect x="6" y="460" width="200" height="130"/>
    <line x1="46"  y1="460" x2="46"  y2="510"/>
    <line x1="46"  y1="530" x2="46"  y2="590"/>
    <line x1="86"  y1="460" x2="86"  y2="480"/>
    <line x1="86"  y1="500" x2="86"  y2="550"/>
    <line x1="86"  y1="570" x2="86"  y2="590"/>
    <line x1="126" y1="460" x2="126" y2="490"/>
    <line x1="126" y1="510" x2="126" y2="555"/>
    <line x1="126" y1="575" x2="126" y2="590"/>
    <line x1="166" y1="460" x2="166" y2="500"/>
    <line x1="166" y1="520" x2="166" y2="590"/>
    <line x1="6"   y1="500" x2="46"  y2="500"/>
    <line x1="66"  y1="500" x2="106" y2="500"/>
    <line x1="126" y1="500" x2="166" y2="500"/>
    <line x1="6"   y1="540" x2="46"  y2="540"/>
    <line x1="66"  y1="540" x2="106" y2="540"/>
    <line x1="106" y1="540" x2="126" y2="540"/>
    <line x1="146" y1="540" x2="206" y2="540"/>
    <line x1="6"   y1="570" x2="46"  y2="570"/>
    <line x1="66"  y1="570" x2="86"  y2="570"/>
    <line x1="106" y1="570" x2="146" y2="570"/>
    <line x1="166" y1="570" x2="206" y2="570"/>
  </g>

  <!-- Scan line at top of article (article.post::before) -->
  <line x1="6" y1="95" x2="420" y2="95" stroke="#8c1e1e" stroke-width="2" opacity="0.52"/>

  <!-- Echo glow – top-right of content (article.post::after) -->
  <circle cx="1148" cy="165" r="118" fill="url(#echo)"/>

  <!-- ── Article label ── -->
  <text x="36" y="138" font-family="sans-serif" font-size="15" fill="#5c4e18" letter-spacing="0.10em">A R T I C L E</text>
  <rect x="36" y="146" width="92" height="1" fill="#8c1e1e" opacity="0.50"/>

  <!-- ── Article title ──
       Shadow layer (offset +3,+3 in deep gold for embossed depth) -->
  <text x="63" y="368" font-family="serif" font-size="68" fill="#c8b42e" letter-spacing="-0.015em">{{TITLE}}</text>
  <!-- Main fill layer -->
  <text x="60" y="365" font-family="serif" font-size="68" fill="url(#titleGrad)" letter-spacing="-0.015em">{{TITLE}}</text>

  <!-- Title underline accent -->
  <rect x="60" y="384" width="580" height="2" fill="#8c1e1e" opacity="0.55"/>
  <rect x="60" y="389" width="200" height="1" fill="#8c1e1e" opacity="0.28"/>

  <!-- ── Footer rule + site label ── -->
  <rect x="60" y="556" width="1080" height="1" fill="#8c1e1e" opacity="0.28"/>
  <text x="60" y="585" font-family="serif" font-size="18" fill="#5c4e18" letter-spacing="0.06em">へのへのんのの</text>

  <!-- ── Vignette overlay (body::before) ── -->
  <rect width="1200" height="630" fill="url(#vign)"/>
</svg>
