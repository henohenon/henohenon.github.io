<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#2a0f2e"/>
      <stop offset="55%" stop-color="#150a17"/>
      <stop offset="100%" stop-color="#150a17"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d78"/>
      <stop offset="55%" stop-color="#f3e9f4"/>
      <stop offset="100%" stop-color="#b26bff"/>
    </linearGradient>
    <linearGradient id="eyeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3d78"/>
      <stop offset="100%" stop-color="#b26bff"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <pattern id="clawStripe" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect x="0" y="0" width="30" height="30" fill="transparent"/>
      <rect x="0" y="0" width="8" height="30" fill="#ff3d78"/>
      <rect x="14" y="0" width="2" height="30" fill="#ffce3d"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#150a17"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- faint claw scratches, lower-left, behind title -->
  <g opacity="0.16" filter="url(#softGlow)">
    <line x1="-40" y1="560" x2="260" y2="380" stroke="#ff3d78" stroke-width="6" stroke-linecap="round"/>
    <line x1="-10" y1="600" x2="290" y2="420" stroke="#b26bff" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="640" x2="320" y2="460" stroke="#ffce3d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- frame -->
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#3a1f3f" stroke-width="2" opacity="0.7"/>

  <!-- site name -->
  <text x="60" y="86" font-family="sans-serif" font-weight="700" font-size="34" letter-spacing="2" fill="#f3e9f4" opacity="0.5" filter="url(#titleGlow)">へのへのんのの</text>
  <text x="60" y="86" font-family="sans-serif" font-weight="700" font-size="34" letter-spacing="2" fill="#f3e9f4">へのへのんのの</text>
  <rect x="60" y="104" width="230" height="5" fill="url(#clawStripe)" opacity="0.9"/>

  <!-- cat-eye headlights, upper right -->
  <g filter="url(#softGlow)" opacity="0.9">
    <ellipse cx="1082" cy="98" rx="20" ry="27" fill="url(#eyeFade)"/>
    <ellipse cx="1140" cy="90" rx="20" ry="27" fill="url(#eyeFade)"/>
  </g>
  <ellipse cx="1082" cy="98" rx="11" ry="22" fill="#ffce3d" opacity="0.95"/>
  <ellipse cx="1140" cy="90" rx="11" ry="22" fill="#ffce3d" opacity="0.95"/>
  <rect x="1079" y="80" width="6" height="36" rx="3" fill="#150a17"/>
  <rect x="1137" y="72" width="6" height="36" rx="3" fill="#150a17"/>

  <!-- title -->
  <text x="64" y="340" font-family="sans-serif" font-weight="700" font-size="76" fill="#ff3d78" opacity="0.55" filter="url(#titleGlow)">{{TITLE}}</text>
  <text x="60" y="336" font-family="sans-serif" font-weight="700" font-size="76" fill="url(#titleGrad)" stroke="#150a17" stroke-width="1.5">{{TITLE}}</text>

  <!-- lower decorative claw bar spanning full width -->
  <rect x="0" y="606" width="1200" height="7" fill="url(#clawStripe)" opacity="0.85"/>
  <rect x="0" y="624" width="1200" height="1" fill="#3a1f3f" opacity="0.8"/>
</svg>
