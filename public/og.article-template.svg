<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGr" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F8F5FF"/>
      <stop offset="100%" stop-color="#EDE8FF"/>
    </linearGradient>
    <linearGradient id="hdrGr" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#160E38"/>
      <stop offset="40%"  stop-color="#3A1A6E"/>
      <stop offset="75%"  stop-color="#7D2470"/>
      <stop offset="100%" stop-color="#B83070"/>
    </linearGradient>
    <linearGradient id="aclGr" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C53680"/>
      <stop offset="55%"  stop-color="#7D2470"/>
      <stop offset="100%" stop-color="#7D2470" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ttlGr" x1="0" y1="340" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2A1558"/>
      <stop offset="100%" stop-color="#1B1730"/>
    </linearGradient>
    <pattern id="scanB" x="0" y="0" width="32" height="630" patternUnits="userSpaceOnUse">
      <line x1="31" y1="0" x2="31" y2="630" stroke="#1B1730" stroke-width="0.8"/>
    </pattern>
    <pattern id="scanH" x="0" y="0" width="32" height="150" patternUnits="userSpaceOnUse">
      <line x1="31" y1="0" x2="31" y2="150" stroke="white" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="rPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C53680" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C53680" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lPurp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3A1A6E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3A1A6E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bgGr)"/>
  <rect width="1200" height="630" fill="url(#scanB)" opacity="0.035"/>

  <!-- AMBIENT GLOWS -->
  <ellipse cx="1090" cy="400" rx="280" ry="240" fill="url(#rPink)"/>
  <ellipse cx="200"  cy="270" rx="250" ry="180" fill="url(#lPurp)"/>

  <!-- CONCENTRIC CIRCLES — ドリーマーズビート 心拍 -->
  <g transform="translate(1090,400)">
    <circle r="55"  fill="none" stroke="#C53680" stroke-width="1.5" opacity="0.22"/>
    <circle r="105" fill="none" stroke="#C53680" stroke-width="1.5" opacity="0.17"/>
    <circle r="162" fill="none" stroke="#C53680" stroke-width="1"   opacity="0.13"/>
    <circle r="220" fill="none" stroke="#7D2470" stroke-width="1"   opacity="0.09"/>
    <circle r="280" fill="none" stroke="#7D2470" stroke-width="0.8" opacity="0.06"/>
    <circle r="344" fill="none" stroke="#3A1A6E" stroke-width="0.8" opacity="0.04"/>
    <circle r="5"   fill="#C53680" opacity="0.55"/>
  </g>

  <!-- SCATTERED MUSIC NOTES -->
  <text x="1036" y="248" font-family="serif" font-size="46" fill="#C53680" opacity="0.18">♩</text>
  <text x="935"  y="563" font-family="serif" font-size="34" fill="#7D2470" opacity="0.14">♪</text>
  <text x="1148" y="544" font-family="serif" font-size="28" fill="#C53680" opacity="0.16">♫</text>
  <text x="1006" y="180" font-family="serif" font-size="22" fill="#7D2470" opacity="0.12">♩</text>
  <text x="116"  y="556" font-family="serif" font-size="16" fill="#C53680" opacity="0.09">♩</text>

  <!-- HEADER BAND -->
  <rect width="1200" height="150" fill="url(#hdrGr)"/>
  <rect width="1200" height="150" fill="url(#scanH)" opacity="0.055"/>

  <!-- Site name -->
  <text x="70" y="97" font-family="serif" font-size="40" fill="#EDE8FF" letter-spacing="0.03em">へのへのんのの</text>
  <!-- Beat-pulse ♩ -->
  <text x="462" y="97" font-family="serif" font-size="28" fill="#C53680" opacity="0.9">♩</text>

  <!-- ACCENT SEPARATOR -->
  <rect x="0" y="150" width="1200" height="4" fill="url(#aclGr)"/>

  <!-- Left accent bar -->
  <rect x="0" y="154" width="6" height="450" fill="#C53680"/>

  <!-- CONTENT DECORATION — layered horizontal rules (article h2 motif) -->
  <rect x="90" y="193" width="200" height="2"   fill="#C53680" opacity="0.35"/>
  <rect x="90" y="199" width="110" height="1.5" fill="#C53680" opacity="0.18"/>

  <!-- ARTICLE TITLE -->
  <!-- Drop-shadow layer -->
  <text x="92" y="402" font-family="serif" font-size="68" fill="#C53680" opacity="0.07" letter-spacing="0.02em">{{TITLE}}</text>
  <!-- Main title text -->
  <text x="90" y="400" font-family="serif" font-size="68" fill="url(#ttlGr)" letter-spacing="0.02em">{{TITLE}}</text>

  <!-- BOTTOM STRIP (matches site-footer) -->
  <rect x="0" y="604" width="1200" height="26" fill="#12092A"/>
  <text x="1128" y="622" font-family="serif" font-size="14" fill="#9980BB" letter-spacing="0.05em">♩</text>
</svg>
