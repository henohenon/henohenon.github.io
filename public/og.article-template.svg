<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-tl" cx="180" cy="50" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff4e6" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#fff4e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br" cx="1020" cy="585" r="530" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fce8f0" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#fce8f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="1" x2="1" y2="0">
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c97b8d" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#c97b8d" stop-opacity="0.52"/>
      <stop offset="88%"  stop-color="#c97b8d" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#c97b8d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hrule-faint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c97b8d" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#c97b8d" stop-opacity="0.28"/>
      <stop offset="88%"  stop-color="#c97b8d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c97b8d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vbar-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c97b8d" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#c97b8d" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- ── Base background ─────────────────────────────────── -->
  <rect width="1200" height="630" fill="#fdf6ed"/>
  <rect width="1200" height="630" fill="url(#glow-tl)"/>
  <rect width="1200" height="630" fill="url(#glow-br)"/>
  <rect width="1200" height="630" fill="url(#shimmer)"/>

  <!-- ── Top accent bar ─────────────────────────────────── -->
  <rect x="0" y="0" width="1200" height="5" fill="#c97b8d" opacity="0.88"/>

  <!-- ── Soft bloom circles (background depth) ─────────── -->
  <circle cx="1118" cy="88"  r="100" fill="#fce8f0" opacity="0.26"/>
  <circle cx="82"   cy="568" r="72"  fill="#fff4e6" opacity="0.48"/>
  <circle cx="1062" cy="518" r="50"  fill="#fce8f0" opacity="0.25"/>
  <circle cx="580"  cy="40"  r="38"  fill="#fce8f0" opacity="0.14"/>

  <!-- ── Pill / capsule shapes — medicine motif ─────────── -->
  <!-- large outline pill, top-right -->
  <rect x="910" y="46"  width="174" height="54" rx="27" ry="27"
        fill="none" stroke="#c97b8d" stroke-width="1.6" opacity="0.22"/>
  <!-- filled small pill, top-right offset -->
  <rect x="956" y="34"  width="118" height="38" rx="19" ry="19"
        fill="#e8a0b4" opacity="0.09"/>
  <!-- outline pill, bottom-right -->
  <rect x="972" y="540" width="145" height="46" rx="23" ry="23"
        fill="none" stroke="#c97b8d" stroke-width="1.3" opacity="0.19"/>
  <!-- filled small pill, bottom-right -->
  <rect x="876" y="559" width="90"  height="32" rx="16" ry="16"
        fill="#c97b8d" opacity="0.08"/>
  <!-- tiny accent pill near left edge bottom -->
  <rect x="84"  y="558" width="52"  height="20" rx="10" ry="10"
        fill="#e8a0b4" opacity="0.13"/>

  <!-- ── Dot / tablet decorations, right edge ───────────── -->
  <circle cx="1150" cy="296" r="7.5" fill="#c97b8d" opacity="0.14"/>
  <circle cx="1169" cy="323" r="4.5" fill="#e8a0b4" opacity="0.22"/>
  <circle cx="1155" cy="350" r="6"   fill="#c97b8d" opacity="0.11"/>
  <circle cx="1172" cy="374" r="3.5" fill="#e8a0b4" opacity="0.17"/>
  <circle cx="1157" cy="396" r="5"   fill="#c97b8d" opacity="0.09"/>

  <!-- ── Left vertical accent bar (post-list border-left) ── -->
  <rect x="72" y="168" width="4" height="368" rx="2" fill="url(#vbar-glow)"/>
  <!-- top nub -->
  <rect x="72" y="158" width="4" height="12" rx="2" fill="#e8a0b4" opacity="0.95"/>

  <!-- ── Horizontal rules ───────────────────────────────── -->
  <rect x="0" y="141" width="1200" height="1.5" fill="url(#hrule)"/>
  <rect x="0" y="534" width="1200" height="1"   fill="url(#hrule-faint)"/>

  <!-- ── Site name ─────────────────────────────────────── -->
  <text
    x="100"
    y="104"
    font-family="serif"
    font-size="30"
    fill="#c97b8d"
    letter-spacing="4"
    opacity="0.93"
  >へのへのんのの</text>

  <!-- ── Article title — pink stroke glow layer ─────────── -->
  <text
    x="96"
    y="368"
    font-family="serif"
    font-size="74"
    fill="none"
    stroke="#e8a0b4"
    stroke-width="3.5"
    stroke-opacity="0.34"
    letter-spacing="3"
  >{{TITLE}}</text>

  <!-- ── Article title — main fill layer ───────────────── -->
  <text
    x="96"
    y="368"
    font-family="serif"
    font-size="74"
    fill="#281a15"
    letter-spacing="3"
  >{{TITLE}}</text>

  <!-- ── Bottom accent bar ─────────────────────────────── -->
  <rect x="0" y="624" width="1200" height="6" fill="#c97b8d" opacity="0.28"/>
</svg>
