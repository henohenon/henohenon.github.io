<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>へのへのん・ポートフォリオ</title>
    %sveltekit.head%
    <script>
      // `?about` を直開き/リロード/共有した時、プリレンダHTML（挨拶）が1フレーム
      // 見えてしまうのを防ぐ。ペイント前にキャプションを隠し、ハイドレーションで
      // 本文がタイトルに確定してから IndexView 側で表示を戻す。
      if (new URLSearchParams(location.search).has('about')) {
        document.documentElement.classList.add('boot-about')
      }
    </script>
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
